name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate recipes
        run: python3 tools/build_recipes.py --validate

      - name: Build recipes.json
        run: python3 tools/build_recipes.py -o web/public/data/recipes.json

      - name: Check recipes.json is up to date
        run: |
          git diff --exit-code web/public/data/recipes.json || {
            echo "::error::recipes.json is out of date. Run 'python3 tools/build_recipes.py -o web/public/data/recipes.json' and commit the result."
            exit 1
          }

      - name: Generate languages.json
        run: |
          python3 -c "
          import json, glob, os
          langs = []
          for f in sorted(glob.glob('web/public/translations/*.json')):
              if os.path.basename(f) == 'languages.json':
                  continue
              code = os.path.basename(f).replace('.json', '')
              with open(f) as fh:
                  meta = json.load(fh).get('_meta', {})
              langs.append({'code': code, 'name': meta.get('name', code), 'flag': meta.get('flag', '')})
          with open('web/public/translations/languages.json', 'w') as fh:
              json.dump(langs, fh)
          print(f'Generated languages.json with {len(langs)} languages')
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Create .nojekyll
        run: touch ./web/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
