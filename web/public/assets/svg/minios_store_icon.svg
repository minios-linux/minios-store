      <stop offset="0%" stop-color="#38AEEB"/>
      <stop offset="100%" stop-color="#279AD1"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
