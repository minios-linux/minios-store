      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: n/nv/nvim-qt.desktop/e5d2a7185f674d1348c880dd878f9801/icons/128x128/neovim-qt_nvim-qt.png
    width: 128
