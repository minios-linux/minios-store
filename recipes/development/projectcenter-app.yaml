id: projectcenter-app
name: ProjectCenter
description: The Official GNUstep IDE
longDescription: |
  <p>ProjectCenter is an integrated development environment (IDE) for GNUstep systems.  It is a clone of the ProjectBuilder application for NextStep, which became popular for its ease of use and speed of development.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
