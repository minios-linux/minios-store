  - projectcenter.app
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ide
  - development
  - programming
iconSources:
  - cached: projectcenter.app_app-icon.png
    width: 64
    height: 64
enabled: true
order: 99
