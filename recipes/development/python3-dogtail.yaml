id: "python3-dogtail"
name: AT-SPI Browser
description: Browse your Assistive Technology-enabled desktop
longDescription: |
  <p>dogtail is a GUI test tool and automation framework written in Python. It uses Accessibility (a11y) technologies to communicate with desktop applications. dogtail scripts are written in Python.</p>
  
categoryId: development
icon: Code
