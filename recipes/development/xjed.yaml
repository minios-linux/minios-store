id: xjed
name: XJed
description: X version of Jed Editor
longDescription: |
  <p>Jed is a small, fast (faster startup than xterm with bash), and powerful text editor.</p>
  <p>Completely customizable with prepared emulation modes for Emacs, CUA (similar to KDE/Gnome/Openoffice), Borland-IDE, Brief, and EDT. Extensible in the S-Lang scripting language (with a syntax resembling C).</p>
  <p>Editing functions: folding support; rectangular cut/paste; regular expression search/replace; incremental searches; search/replace across multiple files; multiple windows; multiple buffers; ...</p>
  <p>Special modes (syntax highlight, indention, compile, ...) for Basic, C, C++, DCL, FORTRAN, IDL, Java, NROFF, Pascal, Perl, PHP, PostScript, Python, SH. Modes for markup languages include HTML and (La)TeX (with AUC-TeX style editing and BibTeX)</p>
  <p>Tools: directory editor (dired); info (browse GNU info files); mail; rmail; ispell; shell mode; ...</p>
  <p>The native X11 version provides improved mouse support, key configuration and X selection interaction. If no display is available, xjed falls back to text mode, thus there is no need to install both jed and xjed packages.</p>
  <p>Additional tools and modes can be found in the jed-extra package.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - xjed
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
