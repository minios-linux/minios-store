id: "featherpad"
name: FeatherPad
description: Lightweight Qt5 text editor
longDescription: |
  <p>FeatherPad is a lightweight Qt5 plain-text editor for Linux. It is independent of any desktop environment and comes with all features one would expect in a modern editor.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - featherpad
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - text
  - editor
  - plaintext
screenshotSources:
