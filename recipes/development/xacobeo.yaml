id: xacobeo
name: Xacobeo
description: Build and execute XPath queries
longDescription: |
  <p>Xacobeo provides a simple graphical user interface (GUI) for executing XPath queries and seeing their results.</p>
  <p>The GUI tries to provide all the elements that are needed in order to write, test and execute XPath queries without too many troubles. It displays the Document Object Model (DOM) and the namespaces used. The program registers the namespaces automatically and each element is displayed with its associated namespaces. All is performed with the idea of being able of running an XPath query as soon as possible without having to fight with the document&apos;s namespaces and by seeing automatically under which namespace each element is.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - xacobeo
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
tags:
  - xpath
  - visualization
  - gui
