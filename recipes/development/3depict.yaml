id: 3depict
name: 3depict
description: Valued point cloud visualisation and analysis
longDescription: |
  <p>This program provides a graphical interface for the scientific analysis of real valued point data (x,y,z,value). This is primarily targeted towards Atom probe tomography applications, but may prove useful to other applications as well.</p>
  
