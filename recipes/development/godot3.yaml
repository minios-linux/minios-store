id: "godot3"
name: Godot Engine
description: Multi-platform 2D and 3D game engine with a feature-rich editor
longDescription: |
  <p>Godot is an advanced, feature packed, multi-platform 2D and 3D game engine. It provides a huge set of common tools, so you can just focus on making your game without reinventing the wheel.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - godot3
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: org/godotengine/Godot3/f01163912e3c81c8c8f7514bd255ec3a/icons/128x128/godot3_godot3.png
    width: 128
    height: 128
homepage: "https://godotengine.org"
enabled: true
order: 99
