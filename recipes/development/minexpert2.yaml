id: "minexpert2"
name: Mass spectrometry software
description: Visualize analyze and mine MS^n mass spectrometry data
longDescription: |
  <p>
  
  				minexpert is a program used to visualize and mine MS^n mass spectral data, like mass spectra.
  
  			</p>
  <p>The program has the following features::</p>
  <ul>
    <li>Open any number of mzML-formatted mass spec data files;</li>
    <li>The program computes the TIC chromatogram and the mz=ft(dt) color map if data are for an ion mobility mass spectrometry experiment;</li>
    <li>Any number of integrations (combinations) can be performed in any direction;</li>
    <li>Navigation through the data is intuitive, flexible yet powerful;</li>
    <li>Isotopic cluster calculations that can be configured to the finest detail.</li>
    <li>The vast majority of the features of mineXpert2 can be driven by JavaScript'ing.</li>
  </ul>
  
categoryId: development
icon: Code
