id: "ghex"
name: GNOME Hex Editor
description: Inspect and edit binary files
longDescription: |
  <p>GHex is a hex editor for the GNOME desktop.</p>
  <p>GHex can load raw data from binary files and display them for editing in the
        traditional hex editor view. The display is split in two columns, with
        hexadecimal values in one column and the ASCII representation in the other.
        A useful tool for working with raw data.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - ghex
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - binary
  - debug
