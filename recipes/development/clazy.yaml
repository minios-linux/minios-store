id: "clazy"
name: Clazy
description: A Clang compiler plugin which emits warnings related to Qt best practices
longDescription: |
  <p>Clazy is a clang compiler plugin which emits warnings related to Qt best practices.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - clazy
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
