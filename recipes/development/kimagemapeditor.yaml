id: "kimagemapeditor"
name: KImageMapEditor
description: HTML Image Map Editor
longDescription: |
  <p>KImageMapEditor is an editor of image maps embedded inside HTML files,
      based on the &lt;map&gt; tag.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kimagemapeditor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
