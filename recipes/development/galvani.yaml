id: galvani
name: Galvani
description: Reads data from a device with graphical plots and evaluation
longDescription: |
  <p>Galvani reads data from a digital multimeter or other measurement device
        through a serial interface.
        Data are plotted graphically and can be evaluated in different forms
        (Peak-Integration of Chromatogramms, Differential Analysis and other).
        Additionally data can be produced by a simulation.
      </p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - galvani
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
