id: "poedit"
name: Poedit
description: Translations editor for gettext
longDescription: |
  <p>Translations editor for gettext (PO files). It helps with translating
              applications or WordPress themes and plugins into other languages, as
              well as with developing localizable applications.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - poedit
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - translate
  - translation
  - po
  - gettext
  - xliff
