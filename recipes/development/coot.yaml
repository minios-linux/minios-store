id: coot
name: Coot
description: Macromolecular Model Builder
longDescription: |
  <p>This is a program for constructing atomic models of macromolecules from x-ray diffraction data. Coot displays electron density maps and molecular models and allows model manipulations such as idealization, refinement, manual rotation/translation, rigid-body fitting, ligand search, solvation, mutations, rotamers. Validation tools such as Ramachandran and geometry plots are available to the user. This package provides a Coot build with embedded Python support.</p>
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - coot
distributions:
