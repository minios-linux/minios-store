id: bossa
name: BOSSA
description: Program Atmel's SAM ARM microcontrollers
longDescription: |
  <p>BOSSA is a flash programming utility for Atmel&apos;s SAM family of flash-based ARM microcontrollers.  The motivation behind BOSSA is to create a simple, easy-to- use, open source utility to replace Atmel&apos;s SAM-BA software.</p>
  <p>This package contains the wxWidgets GUI interface to bossa.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - bossa
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - embedded electronics
  - electronics
  - arm
  - microcontroller
