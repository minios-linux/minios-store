id: sioyek
name: Sioyek
description: PDF viewer for reading research papers and technical books
longDescription: |
  <p>Sioyek is a PDF viewer with a focus on textbooks and research papers. It is a power user&apos;s PDF viewer, featuring smart open, table of contents generation, and jumping to references and figures, even if not linked.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
