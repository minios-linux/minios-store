id: "gtranslator"
name: Gtranslator
description: Translate and localize applications and libraries
longDescription: |
  <p>Gtranslator is an enhanced gettext po file editor for the GNOME desktop
        environment.
        It handles all forms of gettext po files and includes very useful features
        like find/replace, translation memory, different translator profiles,
        messages table (for having an overview of the translations/messages in the
        po file), easy navigation and editing of translation messages and comments
        of the translation where accurate.</p>
  <p>Gtranslator includes also a plugin system with many interesting plugins like alternate language, insert tags, integration with subversion and a source code viewer.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - gtranslator
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
