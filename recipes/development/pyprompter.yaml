id: pyprompter
name: pyprompter
description: Predictive text editor powered by presage
longDescription: |
  <p>This package contains the wxPython predictive text editor pyprompter.</p>
  <p>pyprompter is a cross-platform predictive text editor.</p>
  <p>pyprompter displays predictions in a contextual pop-up box as each letter is typed. Predictions can be easily selected and inserted in the document.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - pyprompter
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
tags:
  - presage
  - text prediction
  - predictive text
iconSources:
  - cached: pyprompter_pyprompter.png
    width: 128
    height: 128
enabled: true
order: 99
