id: gwyddion
name: Gwyddion
description: SPM data visualization and analysis
longDescription: |
  <p>Gwyddion is a modular program for Scanning Probe Microscopy (SPM) data visualization and analysis. It is primarily intended for analysis of height field data obtained by microscopy techniques like  * Atomic Force Microscopy (AFM),  * Magnetic Force Microscopy (MFM),  * Scanning Tunneling Microscopy (STM),  * Near-field Scanning Optical Microscopy (SNOM or NSOM) and others. However, it can be used for arbitrary height field and image analysis.</p>
  <p>This package contains the main application and its modules. It also contains a GNOME (and Xfce) thumbnailer which creates previews for all file types known to Gwyddion.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - gwyddion
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - spm
  - analysis
  - visualization
  - microscopy
