id: igv
name: igv
description: desktop genome vizualisation tool
longDescription: |
  <p>
        The Integrative Genomics Viewer (IGV) is a high-performance, easy-to-use, interactive tool for the visual exploration
  of genomic data. It supports flexible integration of all the common types of genomic data and metadata, investigator-generated or publicly available, loaded from local or cloud sources.
      </p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - igv
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - genomics
