id: "veusz"
name: Veusz
description: Scientific plotting and graphing package
longDescription: |
  <p>Veusz is a 2D and 3D scientific plotting and graphing package, designed to produce publication-ready PDF, SVG, Postscript and bitmap output. Veusz provides a GUI, command line and scripting interface (based on Python) to its plotting facilities. The plots are built using an object-based system to provide a consistent interface.</p>
  <p>This package includes the main executable, documentation and examples.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - veusz
distributions:
