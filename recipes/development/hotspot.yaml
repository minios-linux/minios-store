id: "hotspot"
name: Hotspot
description: Linux perf GUI for performance analysis
longDescription: |
  <p>hotspot project is a KDAB R&amp;D effort to create a standalone GUI tool for performance data. This tool now only support perf output data. But is intended to support various other performance data formats in the future.</p>
  
