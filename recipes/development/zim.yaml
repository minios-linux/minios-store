id: "zim"
name: Zim Desktop Wiki
description: 'Edit text files "wiki style"'
longDescription: |
  <p>Zim is a graphical text editor used to maintain a collection of wiki pages.</p>
  <p>Each page can contain links to other pages, simple formatting and inline images. Pages are stored in a folder structure, like in an outliner, and can have attachments. Creating a new page is as easy as linking to a nonexistent page.</p>
  <p>All data is stored in plain text files with wiki formatting. Various plugins provide additional functionality, like a task list manager, an equation editor, a tray icon, and support for version control.</p>
  <p>Zim can be used to:  * Keep an archive of notes  * Take notes during meetings or lectures  * Organize task lists  * Draft blog entries and emails  * Do brainstorming</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - zim
