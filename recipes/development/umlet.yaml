id: umlet
name: UMLet
description: UML Tools for fast UML diagrams
longDescription: |
  <p>UMLet is a UML tool aimed at providing a fast way of drawing UML diagrams. UML elements are modified using text input instead of pop-up dialogs. Elements can be modified and used as templates; this way, users can easily tailor UMLet to their modeling needs. UMLet supports a variety of UML diagram types: class diagrams, use case diagrams, sequence diagrams, state diagrams, deployment diagrams, activity diagrams, etc.</p>
  <p>UMLet can only be used for drawing UML diagrams, it does not support code export or the XMI format. UMLet allows one to export diagrams as images or PDF.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - umlet
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
