id: "gameconqueror"
name: Game Conqueror
description: Game hacking tool. GUI front-end for scanmem.
longDescription: |
  <p>scanmem is a simple interactive debugging utility, used to locate the address of a variable in an executing process. This can be used for the analysis or modification of a hostile process on a compromised machine, reverse engineering, or as a &quot;pokefinder&quot; to cheat at video games. GameConqueror aims to provide a CheatEngine-alike interface for scanmem, it&apos;s user-friendly and easy to use.</p>
  <p>Features:</p>
  <ul>
    <li>Locking on multiple variables</li>
    <li>Memory Viewer/Editor</li>
    <li>... many to be done</li>
  </ul>
  
categoryId: development
icon: Code
