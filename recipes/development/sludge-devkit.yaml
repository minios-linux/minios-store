id: sludge-devkit
name: SLUDGE Floor Maker
description: Edit SLUDGE floor plans
longDescription: |
  <p>SLUDGE is an open source adventure game engine. It combines a scripting language with IDE tools.</p>
  <p>This package contains the development kit needed to create SLUDGE games.</p>
  
categoryId: development
icon: Code
