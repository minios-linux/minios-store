  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
iconSources:
  - url: s/sl/sludge-floormaker.desktop/96D99B77999A95267C32D6CA9DA11715/icons/128x128/sludge-devkit_sludge-floormaker.png
