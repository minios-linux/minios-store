id: "icecc-monitor"
name: Icemon
description: A monitor for an Icecream compilation network
longDescription: |
  <p>icecc-monitor is a monitoring application for icecc (a distributed compiler). It provides a view on the distributed compile network, which jobs run where and details about jobs and nodes (statistics and overview information).</p>
  <p>See the &apos;icecc&apos; package for more information.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - icecc-monitor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - icecc
  - icecream
  - monitor
  - network
iconSources:
  - url: i/ic/icemon.desktop/f7b3131acc6640d75e8d00975090423e/icons/128x128/icecc-monitor_icemon.png
    width: 128
    height: 128
enabled: true
order: 99
