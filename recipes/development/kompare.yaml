id: "kompare"
name: Kompare
description: Diff/Patch Frontend
longDescription: |
  <p>Kompare is a GUI front-end program that enables differences between source files to be viewed and merged. It can be used to compare differences on files or the contents of folders, and it supports a variety of diff formats and provide many options to customize the information level displayed.</p>
  <p>Features:</p>
  <ul>
    <li>Comparing differences on files or the contents of folders recursively.</li>
    <li>Supports a variety of diff formats and provides many options to customize the information level displayed.</li>
    <li>Creating and applying patches.</li>
  </ul>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kompare
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
