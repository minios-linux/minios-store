id: wxhexeditor
name: wxHexEditor
description: A hex editor for huge files and devices
longDescription: |
  <p>wxHexEditor is a hexadecimal file editor suitable for editing very big files. Supported file size is up to 2^64 bytes.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - wxhexeditor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: wxhexeditor_wxHexEditor.png
    width: 64
    height: 64
enabled: true
order: 99
