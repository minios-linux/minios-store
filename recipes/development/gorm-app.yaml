id: gorm-app
name: Gorm Interface Builder
description: "[GNUstep | Graphical] Object Relationship Modeller"
longDescription: |
  <p>Gorm, the GNUstep Object Relationship Modeler, is a tool to build GUI interfaces for the GNUstep system.  It is a clone of the NeXTStep &quot;Interface Builder&quot; app. It works well with ProjectCenter to create GUI applications for GNUstep.</p>
  <p>You can create .nib files that also work on macOS and vice versa.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - gorm.app
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gui designer
  - user interface
  - ui builder
iconSources:
  - cached: gorm.app_Gorm.png
    width: 64
    height: 64
enabled: true
order: 99
