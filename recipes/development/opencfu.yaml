id: "opencfu"
name: OpenCFU
description: A modern program to count circular objects from pictures or webcams
longDescription: |
  <p>OpenCFU is a completely open source lightweight application designed to enumerate clustered circular objects such as bacterial colonies. It can handle digital pictures as well as live stream from a video device/webcam. OpenCFU is cross-platform, fast, reliable and allows the user to implement intuitive filters.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - opencfu
