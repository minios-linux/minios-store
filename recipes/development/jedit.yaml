id: jedit
name: jEdit
description: Edit text files
longDescription: |
  <p>As one of the most feature rich editors available, jEdit boasts support for syntax highlighting in more than 140 languages. jEdit combines the power of Emacs, the user-friendliness of Kate, and the advanced editing features (such as vertical paste) of Ultraedit, to bring you an open-source plugin-based programmer&apos;s editor of professional quality.</p>
  <p>It is possible to define complex macros in BeanShell or Jython, or other languages that fit into the BSF. jEdit offers a powerful and user-friendly keyboard mapping system (including 2-keystroke shortcuts), making it possible to give jEdit a very Emacs-like feel, if you so desire.</p>
  <p>Its functionality is easily extended by the use of &apos;plugins&apos; which can be downloaded, updated, and installed, all without exiting the editor. These include a built-in Console shell integration, which lets you execute interactive external commands inside your editor, as well as bind them to keyboard shortcuts. The FTP plugin lets you browse and edit files on remote systems over FTP or SFTP. Other plugins provide shells, object oriented structure/code browsers, or completion popups for Java, XML, HTML, Ant, LaTeX, Python, Ruby, Perl, C, C++, bash, Scheme, Prolog, and many other languages.</p>
  
