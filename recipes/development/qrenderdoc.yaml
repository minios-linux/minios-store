id: "qrenderdoc"
name: RenderDoc
description: A stand-alone graphics API debugger
longDescription: |
  <p>RenderDoc is a free MIT licensed stand-alone graphics debugger that allows quick and easy single-frame capture and detailed introspection of any application using Vulkan, D3D11, OpenGL &amp; OpenGL ES or D3D12 across Windows 7 - 10, Linux, or Android.</p>
  <p>This package provides the renderdoc graphical application.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - qrenderdoc
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - url: r/re/renderdoc.desktop/cf88f8dd33d203325a4f0e21c5788d42/icons/128x128/qrenderdoc_application-x-renderdoc-capture.png
    width: 128
    height: 128
enabled: true
order: 99
