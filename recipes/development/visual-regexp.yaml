id: visual-regexp
name: visual-regexp
description: graphical front-end to write/debug regular expressions in Perl
longDescription: |
  <p>
        visual-regexp helps to design, debug or more generally work with the perl regular expressions. Since it is often
  difficult to write the right regexp on the first attempt, this tool will show the effect of regexp on a sample that can be selected.
      </p>
  <p>
        This software will allow one to design regexps while leaving the type of expression and visualize its effect on
  a sample of your choice to interactively debug regular expressions.
      </p>
  <p>
        Makes it possible to use visual-regexp to modify a text. Just use the menu and can now design a regexp to match
  what you're looking for. After substitution, is able to save the new text. May allow the program to select the end-of-line format or force it for a specific environment.
      </p>
  <p>
        This program is a Tcl script and shows the result of running a regular expression, and making debugging relatively
  easy. It also assists in the construction of regular expressions.
      </p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - visual-regexp
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - construction
  - debug
  - expression
  - regex
  - regexp
  - regular
  - perl
  - tcl
  - visual
