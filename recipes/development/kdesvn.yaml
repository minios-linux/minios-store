id: "kdesvn"
name: kdesvn
description: A Subversion client for KDE
longDescription: |
  <p>KDESvn is a graphical client for the Subversion revision control system (svn).</p>
  <p>Besides offering common and advanced svn operations, it features a tight integration into KDE and can be embedded into other KDE applications like Konqueror via the KDE component technology KParts.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kdesvn
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
