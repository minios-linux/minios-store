id: scite
name: SciTE Text Editor
description: Edit your source files
longDescription: |
  <p>GTK-based programming editor with syntax highlighting support for many languages. Also supports folding sections, exporting highlighted text into colored HTML and RTF.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - scite
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - texteditor
iconSources:
  - cached: scite_Sci48M.png
    width: 64
    height: 64
enabled: true
order: 99
