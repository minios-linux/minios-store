id: "kapptemplate"
name: KAppTemplate
description: KDE Template Generator
longDescription: |
  <p>KAppTemplate is an application to start development quickly using existing templates providing basic
        repeatedly written code and a proper structure.</p>
  <p>Features:</p>
  <ul>
    <li>Templates for C++, Ruby, Python and PHP</li>
    <li>Categories</li>
    <li>Templates for different build-systems and frameworks</li>
    <li>Templates especially for KDE-development (plugins for Plasma, KOffice, KTextEditor, KRunner, Akonadi)</li>
    <li>It is easy to create new templates using space holders and a simple CMake-command</li>
    <li>Integrated into KDevelop</li>
  </ul>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kapptemplate
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
