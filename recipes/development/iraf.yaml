id: iraf
name: IRAF
description: Image Reduction and Analysis Facility
longDescription: |
  <p>IRAF is the &quot;Image Reduction and Analysis Facility&quot;. The main IRAF distribution includes a good selection of programs for general image processing and graphics.</p>
  <p>Other external or layered packages are available for applications such as data acquisition or handling data from other observatories and wavelength regimes such as the Hubble Space Telescope (optical), EUVE (extreme ultra-violet), or ROSAT and AXAF (X-ray). These external packages are distributed separately from the main IRAF distribution but can be easily installed. The IRAF system also the programmable Command Language scripting facility.</p>
  
