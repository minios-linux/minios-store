id: "yad"
name: Icon Browser
description: Inspect GTK Icon Theme
longDescription: |
  <p>Yad allows you to display GTK+ dialog boxes from command line or shell scripts. It is similar to Zenity but with more dialog types and options.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - yad
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: y/ya/yad-icon-browser.desktop/365a74c9f7aea1629fb6e60c2562a481/icons/128x128/yad_yad.png
    width: 128
    height: 128
enabled: true
order: 99
