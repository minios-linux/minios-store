id: "jmeter"
name: Apache JMeter
description: Load testing application
longDescription: |
  <p>Apache JMeter is a 100% pure Java desktop application designed to load test functional behavior and measure performance. It was originally designed for testing Web Applications but has since expanded to other test functions.</p>
  <p>This package contains the main application.</p>
  
