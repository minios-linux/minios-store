id: "umbrello"
name: Umbrello
description: UML Modeller
longDescription: |
  <p>
        Umbrello is a Unified Modelling Language (UML) modelling tool and code generator.
        It can create diagrams of software and other systems in the industry-standard UML format, and can also generate
  code from UML diagrams
        in a variety of programming languages.
      </p>
  <p>Features:</p>
  <ul>
    <li>Supported formats: XMI</li>
    <li>Several type of diagrams supported: use case, class, sequence, communication, state, activity, component, deployment,
  entity relationship</li> </ul>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - umbrello
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
