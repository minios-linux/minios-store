id: "gitg"
name: gitg
description: Git repository browser
longDescription: |
  <p>gitg is a graphical user interface for git. It aims at being a small,
        fast and convenient tool to visualize the history of git repositories.
        Besides visualization, gitg also provides several utilities to manage your
        repository and commit your work.</p>
  <p>Goals</p>
  <ul>
    <li>Browse local git repositories</li>
    <li>Clone local and remote git repositories</li>
    <li>Commit files</li>
    <li>Retrieve patch from a commit</li>
  </ul>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - gitg
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
