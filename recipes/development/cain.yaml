id: cain
name: Cain
description: simulations of chemical reactions
longDescription: |
  <p>Cain performs stochastic and deterministic simulations of chemical reactions. It can spawn multiple simulation processes to utilize multi-core computers. It stores models, methods, and simulation output (populations and reaction counts) in an XML format. In addition, SBML models can be imported and exported. The models and methods can be read from input files or edited within the program.</p>
  <p>The GUI (Graphical User Interface) is written in Python and uses the wxPython toolkit. Most of the solvers are implemented as command line executables, written in C++, which are driven by Cain. This makes it easy to launch batch jobs. It also simplifies the process of adding new solvers. Cain offers a variety of solvers:  * Gillespie&apos;s direct method.  * Gillespie&apos;s first reaction method.  * Gibson and Bruck&apos;s next reaction method.  * Tau-leaping.  * Hybrid direct/tau-leaping.  * ODE integration.</p>
  <p>This package provides the architecture independent files for cain</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - cain
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
