id: textedit-app
name: TextEdit
description: an OpenStep text editor
longDescription: |
  <p>TextEdit is a relatively basic text editor. It handles plain text, RTF, and RTFD  has a nice &quot;Wrap to Page&quot; mode, has search/replace functionality, and can display any file as text.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - textedit.app
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - editor
  - text
  - plaintext
  - rtf
  - txt
iconSources:
  - cached: textedit.app_accessories-text-editor_128x128x32.png
    width: 64
    height: 64
enabled: true
order: 99
