id: "kuiviewer"
name: KUIViewer
description: A quick viewer for Qt Designer UI File
longDescription: |
  <p>KUIViewer is a utility to display and check user interface (.ui) files created in Qt Designer.  The interfaces can be shown in a variety of different widget styles to ensure that they display correctly in any environment.</p>
  <p>The Qt Designer itself is in the package qttools5-dev-tools.</p>
  <p>This package is part of the KDE Software Development Kit module.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kuiviewer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
