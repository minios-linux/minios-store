id: sleepyhead
name: SleepyHead
description: "SleepyHead has been designed for reviewing and exploring data produced by CPAP and related machines, which are devices used in the treatment of sleep apnea."
longDescription: |
  <p>SleepyHead is a Free Software, cross platform research tool for exploring data produced by CPAP (Continuous Positive Airway Pressure) machines, and related equipment, which are used in the treatment of sleep apnea and other sleep disorders.</p>
  <p>SleepyHead supports data capable CPAP machine models from the following series:  - ResMed S9  - AirSense 10  - AirCurve 10  - Philips Respironics System One  - Fisher &amp; Paykel ICON &amp; ICON+  - DeVilbiss IntelliPAP</p>
  <p>The software supports the full range of Contec CMS50 series of Oximeters, either standalone or synced with CPAP data (although you will need to install a separate driver for Contact equipments).  It also supports ResMed and PR System One oximeter attachments and file imports from ChoiceMMed MD300W1 oximeters.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - sleepyhead
distributions:
