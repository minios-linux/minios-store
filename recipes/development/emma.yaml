id: emma
name: emma
description: MySQL managing assistant
longDescription: |
  <p>emma is a graphical toolkit for MySQL database developers and administrators, it is the successor of yamysqlfront.</p>
  <p>Its main features are:   * Dialogs to create/modify MySQL databases, tables and associated indexes   * Result sets grouped in tabs   * SQL editor:     + Tabs     + Built-in syntax highlighting     + Table and field name tab-completion     + Automatic SQL statement formatting   * Export to CSV files   * Multiple simultaneously opened MySQL connections</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - emma
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: emma_emma.png
    width: 64
    height: 64
enabled: true
order: 99
