id: "d-feet"
name: D-Feet
description: Debug D-Bus applications
longDescription: |
  <p>A simple application for debugging the message bus system D-Bus. D-Feet can be used to inspect D-Bus interfaces of running programs and invoke methods on those interfaces.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - d-feet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - debug
  - d-bus
  - dbus
  - dfeet
screenshotSources:
