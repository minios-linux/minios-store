id: "siril"
name: Siril
description: Astronomical image (pre-)processing program
longDescription: |
  <p>Siril is an image processing tool specially tailored for noise reduction and improving the signal/noise ratio of an image from multiple captures, as required in astronomy.</p>
  <p>Siril can align automatically or manually, stack and enhance pictures from various file formats, even images sequences (movies and SER files).</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - siril
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - astronomy
  - stacking
  - registration
