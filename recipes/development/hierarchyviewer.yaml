id: hierarchyviewer
name: Hierarchy Viewer
description: View the UI hierarchy of an Android application
longDescription: |
  <p>The Hierarchy Viewer allows you to debug and optimize your user interface. It provides a visual representation of the layout&apos;s View hierarchy (the Layout View) and a magnified inspector of the display (the Pixel Perfect View).</p>
  <p>See also: &lt;https://developer.android.com/studio/profile/hierarchy-viewer.html&gt;</p>
  <p>This package provides the standalone launcher of Hierarchy Viewer. However it is deprecated, please use Android Device Monitor instead.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - hierarchyviewer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
tags:
  - android
  - ui
  - sdk
  - debug
iconSources:
  - cached: hierarchyviewer_hierarchyviewer.png
    width: 128
    height: 128
enabled: true
order: 99
