id: stimfit
name: Stimfit
description: View and analyze electrophysiology files
longDescription: |
  <p>Stimfit is a free, fast and simple program for viewing and analyzing electrophysiological data. It features an embedded Python shell that allows you to extend the program functionality by using numerical libraries such as NumPy and SciPy.</p>
  
