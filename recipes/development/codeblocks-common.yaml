id: codeblocks-common
name: "Code::Blocks IDE"
description: Configurable and extensible IDE
longDescription: |
  <p>
       Code::Blocks is a highly extensible Integrated Development Environment (IDE) for the C, C++ and Fortran programming
  languages. It features support for a wide range of compilers, parallel builds, multi-target projects, and also provides an interface with GNU GDB.
      </p>
  <p>
      The code editor in Code::Blocks features: syntax highlighting, code folding, a tabbed interface, code completion,
  a class browser and smart indenting.
      </p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - codeblocks-common
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
