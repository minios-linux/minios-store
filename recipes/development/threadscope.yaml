id: threadscope
name: threadscope
description: Haskell GHC thread profiler
longDescription: |
  <p>Threadscope is a graphical thread profiler for Haskell programs. It parses and displays the content of .eventlog files emitted by the GHC 6.12.1 and later runtimes, showing a timeline of spark creation, spark-to-thread promotions and garbage collections.</p>
  <p>This helps debugging the parallel performance of Haskell programs, making easier to check that work is well balanced across the available processors and spot performance issues relating to garbage collection or poor load balancing.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - threadscope
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: threadscope_threadscope.png
    width: 64
    height: 64
enabled: true
order: 99
