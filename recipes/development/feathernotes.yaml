id: "feathernotes"
name: FeatherNotes
description: Lightweight notes manager
longDescription: |
  <p>FeatherNotes is a lightweight Qt5 hierarchical notes-manager for Linux. It is independent of any desktop environment.</p>
  <p>This package contain the application files.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - feathernotes
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
  - url: com/github/FeatherNotes/a29212e78c93f93aa5ff5f3c2b503221/screenshots/image-1_orig.png
    thumbnailUrl: com/github/FeatherNotes/a29212e78c93f93aa5ff5f3c2b503221/screenshots/image-1_624x392@1.png
    width: 730
    height: 459
iconSources:
  - url: com/github/FeatherNotes/a29212e78c93f93aa5ff5f3c2b503221/icons/128x128/feathernotes_feathernotes.png
    width: 128
    height: 128
developer: "Pedram Pourang, a.k.a. Tsu Jan"
homepage: "https://github.com/tsujan/FeatherNotes"
enabled: true
order: 99
