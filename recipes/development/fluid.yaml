id: "fluid"
name: FLUID
description: FLTK GUI Designer
longDescription: |
  <p>This package provides Fluid, an interactive GUI designer for FLTK, allowing graphical development of FLTK-based user interfaces. It natively works with (textual) .fl files, but also includes rough support for reading .fd files produced by fdesign (in libforms-bin).</p>
  <p>The Fast Light Toolkit (FLTK) is a cross-platform graphical user interface toolkit originally based on libForms.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - fluid
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
