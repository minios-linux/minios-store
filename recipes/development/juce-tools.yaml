id: juce-tools
name: Projucer
description: IDE for working with JUCE based projects
longDescription: |
  <p>JUCE (Jules&apos; Utility Class Extensions) is an all-encompassing C++ framework for developing cross-platform software. The Projucer (formerly Introjucer) is JUCE&apos;s project-management tool and secret weapon.</p>
  <p>The Projucer&apos;s Duties:  - Central management of cross-platform builds  - JUCE Module Management  - New Project Creation  - User-Interface Design Tool  - Plug-in Projects  - Miscellaneous Utilities</p>
  
