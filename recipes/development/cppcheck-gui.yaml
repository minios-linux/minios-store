id: "cppcheck-gui"
name: Cppcheck
description: A tool for static C/C++ code analysis
longDescription: |
  <p>Cppcheck is a command-line tool that tries to detect bugs that your C/C++ compiler doesn&apos;t see. It is versatile, and can check non-standard code including various compiler extensions, inline assembly code, etc. Its internal preprocessor can handle includes, macros, and several preprocessor commands. While Cppcheck is highly configurable, you can start using it just by giving it a path to the source code.</p>
  <p>It includes checks for:  * pointers to out-of-scope auto variables;  * assignment of auto variables to an effective parameter of a function;  * out-of-bounds errors in arrays and STL;  * missing class constructors;  * variables not initialized by a constructor;  * use of memset, memcpy, etcetera on a class;  * non-virtual destructors for base classes;  * operator= not returning a constant reference to itself;  * use of deprecated functions (mktemp, gets, scanf);  * exceptions thrown in destructors;  * memory leaks in class or function variables;  * C-style pointer cast in C++ code;  * redundant if;  * misuse of the strtol or sprintf functions;  * unsigned division or division by zero;  * unused functions and struct members;  * passing parameters by value;  * misuse of signed char variables;  * unusual pointer arithmetic (such as &quot;abc&quot; + &apos;d&apos;);  * dereferenced null pointers;  * incomplete statements;  * misuse of iterators when iterating through a container;  * dereferencing of erased iterators;  * use of invalidated vector iterators/pointers</p>
  <p>This package contains the graphical user interface for cppcheck.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
