id: "joe-jupp"
name: "jupp, programmer’s editor — jpico (pico, GNU nano) flavour"
description: "Edit text files, programs, …"
longDescription: |
  <p>This package contains symbolic links to replace the Debian joe package using the jupp package and implementation (both binaries and manpages). It also contains the appropriate conffiles and, in contrast to Debian&apos;s joe flavour, supports SELinux context copying (on Debian systems with the Linux kernel), and has many bugs fixed and makes some of jupps new features available to the joe, jstar, jmacs, jpico and rjoe flavours.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - joe-jupp
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - jupp
  - joe
  - jmacs
  - jpico
  - jstar
  - rjoe
  - editor
  - visual
  - texteditor
iconSources:
