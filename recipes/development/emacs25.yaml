id: emacs25
name: GNU Emacs 25 (Terminal)
description: "GNU Emacs is an extensible, customizable text editor - and more"
longDescription: |
  <p>GNU Emacs is the extensible self-documenting text editor.  This package contains a version of Emacs with a graphical user interface based on GTK+ (instead of the Lucid toolkit provided by the emacs25-lucid package).</p>
  
