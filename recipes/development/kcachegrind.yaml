id: "kcachegrind"
name: KCachegrind
description: Visualization of Performance Profiling Data
longDescription: |
  <p>KCachegrind is a visualisation tool for the profiling data generated by calltree, a memory profiling tool for valgrind.  Any executable can be profiled using calltree without being recompiled, including multi-threaded applications, shared libraries, and plugins.</p>
  <p>For visualising the output from profiling tools other than Valgrind, several converters can be found in the kcachegrind-converters package.</p>
  <p>This package is part of the KDE Software Development Kit module.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - kcachegrind
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
