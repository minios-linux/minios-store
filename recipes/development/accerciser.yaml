id: "accerciser"
name: Accerciser
description: Give your application an accessibility workout
longDescription: |
  <p>It uses AT-SPI to inspect and control widgets, allowing you to check if an application is providing correct information to assistive technologies and automated test frameworks. Accerciser has a simple plugin framework which you can use to create custom views of accessibility information.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
