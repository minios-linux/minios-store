id: "cervisia"
name: Cervisia
description: A graphical CVS version control system front-end
longDescription: |
  <p>Cervisia is a user friendly version control system front-end. The aim is to support CVS and other version control system
        programs in a unified interface, featuring conflict resolution, difference and history viewers, status for the working
        copy files, and support for most version control functions.</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - cervisia
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
