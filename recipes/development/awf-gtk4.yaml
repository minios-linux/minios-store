id: "awf-gtk4"
name: awf-gtk4
description: Theme preview application for GTK 4
longDescription: |
  <p>
  			A widget factory is a theme preview application for GTK.
  			It displays the various widget types provided by GTK in a single
  			window allowing to see the visual effect of the applied theme.
  		</p>
  
categoryId: development
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - awf-gtk4
distributions:
  include:
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gtk
iconSources:
  - url: fr/luigifab/awfgtk4/abe1e20e240d731015ad9c80b99c585e/icons/128x128/awf-gtk4_awf-gtk4.png
    width: 128
    height: 128
homepage: "https://github.com/luigifab/awf-extended"
enabled: true
order: 99
