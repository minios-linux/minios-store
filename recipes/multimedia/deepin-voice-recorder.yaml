id: deepin-voice-recorder
name: Deepin Voice Recorder
description: Record voice
longDescription: |
  <p>Deepin-voice-recorder is the default voice recorder for DDE (Deepin Desktop Environment). It has a beautiful and easy-to-use voice recording user interface with simple design. It supports voice recording, record playback, record list management and other functions.</p>
  <p>This package is part of DDE (Deepin Desktop Environment).</p>
  
