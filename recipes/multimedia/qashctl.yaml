id: "qashctl"
name: QasHctl
description: ALSA HCTL mixer
longDescription: |
  <p>QasTools is a collection of desktop applications for the Linux sound system ALSA.</p>
  <p>The applications included are:  - QasConfig - browser for the ALSA configuration tree  - QasHctl - mixer for ALSA&apos;s High level Control Interface  - QasMixer - desktop mixer with features similar to alsamixer</p>
  <p>QasHctl is a mixer application for ALSA&apos;s &quot;High level Control Interface&quot;. This interface allows more complex interaction than the &quot;Simple Mixer Interface&quot; which is used by alsamixer and QasMixer.</p>
  
categoryId: multimedia
icon: Video
