id: streamtuner2
name: streamtuner2
description: Listen to shoutcast/xiph/live365 music stations
longDescription: |
  <p>streamtuner2 is a browser for radio station directories. It can fetch lists from SHOUTcast, Xiph.org, Live365, Jamendo, DMOZ, basic.ch, Punkcast. And it lists stream entries by category or genre. It reuses existing audio players, and recording is delegated to streamripper.</p>
  <p>It mimics the original streamtuner 0.99.99, but is easier to extend because it&apos;s written entirely in Python. It&apos;s already in a stable and useable form.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - streamtuner2
