id: "ser-player"
name: ser-player
description: Video player and processing utility for SER files
longDescription: |
  <p>SER Player is a video player for playing SER files. SER files are used for planetary, lunar and solar captures and this player allows these captures to be viewed in the same way AVI files are viewed with a standard video player.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - ser-player
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - science
  - astronomy
  - video
