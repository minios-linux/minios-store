id: poe-app
name: Poe
description: Vorbis comment editor
longDescription: |
  <p>Poe is a vorbis comment editor for GNUstep. It tries to follow the vorbis comment header specification closely, while being convenient and flexible to use.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
