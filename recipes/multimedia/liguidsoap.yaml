id: liguidsoap
name: Liguidsoap
description: Simple GTK gui to liquidsoap to interactively configure your streams.
longDescription: |
  <p>Liguidsoap is a GUI for controlling liquidsoap, using pyGTK.</p>
  <p>It allows one to interact in various ways with:  * outputs  * playlists  * queues  * mixing table</p>
  <p>It can control a running instance of liquidsoap or launch its own instance.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - liguidsoap
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: liguidsoap_liguidsoap.png
    width: 64
    height: 64
enabled: true
order: 99
