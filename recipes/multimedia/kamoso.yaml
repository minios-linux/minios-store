id: "kamoso"
name: Kamoso
description: Use your webcam to take pictures and make videos
longDescription: |
  <p>Kamoso is a simple and friendly program to use your camera. Use it to take pictures and make videos to share.</p>
  
categoryId: multimedia
icon: Video
method: apt
