id: "vlc"
name: VLC
description: "VLC media player, the open-source multimedia player"
longDescription: |
  <p>VLC is a free and open source cross-platform multimedia player and
              framework that plays most multimedia files as well as DVDs, Audio CDs,
              VCDs, and various streaming protocols.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - vlc
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - player
  - capture
  - dvd
  - audio
  - video
  - server
  - broadcast
