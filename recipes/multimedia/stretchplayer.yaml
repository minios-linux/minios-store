id: stretchplayer
name: StretchPlayer
description: Audio file player with time stretch
longDescription: |
  <p>StretchPlayer will play back an audio file and allow you to time stretch (without affecting pitch) and/or pitch shift (without affecting the time) the audio, even while you are listening to it.</p>
  <p>Warning: this package contains the development version (potentially unstable) released for testing purpose only.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - stretchplayer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: stretchplayer_stretchplayer-icon-48x48.png
    width: 64
    height: 64
enabled: true
order: 99
