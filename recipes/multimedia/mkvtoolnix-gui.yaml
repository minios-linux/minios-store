id: "mkvtoolnix-gui"
name: MKVToolNix
description: Matroska files creator and tools
longDescription: |
  <p>MKVToolNix is a set of tools to create, alter and inspect Matroska files
        under Linux, other Unices and Windows.</p>
  
categoryId: multimedia
icon: Video
method: apt
