id: acetoneiso
name: AcetoneISO
description: Toolbox for CDs/DVDs and images of it
longDescription: |
  <p>AcetoneISO makes it possible to easily use various kinds of CD and DVD images on your computer as if they were burned to real CDs. You can use the application to mount and manage CD and DVD images. Supported disc-image formats are ISO, BIN, NRG, MDF and IMG.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - acetoneiso
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - mount,iso,mdf,ngr,bin,cue,burn,convert,acetoneiso,cd,dvd,image
iconSources:
  - cached: acetoneiso_Acetino2.png
    width: 64
    height: 64
enabled: true
order: 99
