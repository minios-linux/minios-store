id: "goobox"
name: Goobox CD Player
description: Play and extract CDs
longDescription: |
  <p>Goobox allows you to play CDs and save the tracks to disk as MP3, Ogg,
        FLAC or WAV files.</p>
  <p>Track titles and CD covers are set automatically using the
        MusicBrainz web service.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - goobox
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - cd
  - play
  - extract
  - compact
  - disc
screenshotSources:
  - url: org/gnome/Goobox.desktop/225adeb23988833269052defb5770042/screenshots/image-1_orig.png
    thumbnailUrl: org/gnome/Goobox.desktop/225adeb23988833269052defb5770042/screenshots/image-1_624x547.png
    width: 624
