    width: 523
    height: 376
iconSources:
  - url: org/gnome/Goobox.desktop/225adeb23988833269052defb5770042/icons/128x128/goobox_goobox.png
    width: 128
    height: 128
homepage: "https://people.gnome.org/~paobac/goobox/index.html"
