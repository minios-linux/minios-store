id: "muse"
name: MusE
description: The open source sequencer
longDescription: |
  <p>MusE is a MIDI/Audio sequencer with recording and editing capabilities. It can
        perform audio effects like chorus/flanger in real-time via LASH and it supports
        Jack and ALSA interfaces. MusE aims to be a complete multitrack virtual studio
        for Linux.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - muse
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
