id: "dragonplayer"
name: Dragon Player
description: Video player with focus on simplicity
longDescription: |
  <p>Dragon Player is a multimedia player where the focus is on simplicity, instead of features. Dragon Player does one thing,
        and only one thing, which is playing multimedia files. Its simple interface is designed not to get in your way and
  instead
        empower you to simply play multimedia files.</p>
  <p>Features:</p>
  <ul>
    <li>Simple Interface</li>
    <li>Resuming videos: Starts playing a video where you were watching it last time</li>
    <li>Support for subtitles: Automatically loads subtitles with the matching name</li>
    <li>Video display settings (brightness, contrast)</li>
    <li>Due to using Solid and Phonon DragonPlayer is independent of any multimedia framework or hardware abstraction layer</li>
    <li>Supports playing CDs and DVDs</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - dragonplayer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
