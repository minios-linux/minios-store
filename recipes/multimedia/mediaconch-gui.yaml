    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - implementation
  - policy
  - checker
  - reporter
  - trace
  - mkv
  - matroska
  - ffv1
  - pcm
iconSources:
  - url: m/me/mediaconch-gui.desktop/749daed9c37beb8faf0a366270899fd3/icons/128x128/mediaconch-gui_mediaconch.png
