id: "gerbera"
name: Gerbera
description: Gerbera UPnP MediaServer web user interface.
longDescription: |
  <p>Gerbera is an UPnP MediaServer with a nice web user interface based on MediaTomb. It allows you to stream your digital media through your home network and listen to/watch it on a variety of UPnP compatible devices.</p>
  <p>Gerbera implements the UPnP MediaServer V 1.0 specification that can be found on http://www.upnp.org/. The current implementation focuses on parts that are required by the specification, however Gerbera&apos;s functionality is extended to cover the optional parts of the spec as well.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gerbera
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
