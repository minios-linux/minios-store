id: mhwaveedit
name: mhWaveEdit
description: "Record, play, edit and convert sound files"
longDescription: |
  <p>mhWaveEdit is a graphical program for editing sound files. It is intended to be user-friendly and robust. It does not require a fast computer.</p>
  <p>Supports JACK, ALSA, OSS and PulseAudio.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - mhwaveedit
distributions:
  include:
