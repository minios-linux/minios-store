id: kluppe
name: Kluppe
description: audio loop-player and recorder
longDescription: |
  <p>kluppe is written in c and uses jack, gtk and sndfile. Features include:</p>
  <p> - multiple files buffers, multiple &apos;loopers&apos; tracks  - direct (gui) access to all loopers  - combined and per loop output ports for jack  - different playmodes including &quot;granular&quot;</p>
  <p>kluppe is the austrian word for clip and sounds even crazier if you loop it.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - kluppe
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
