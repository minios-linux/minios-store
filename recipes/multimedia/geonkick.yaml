id: geonkick
name: Geonkick
description: Synthesizes elements of percussion
longDescription: |
  <p>Geonkick is a synthesizer that can synthesize elements of percussion. The most basic examples are: kick drums, snares, hit-hats, shakers, claps, steaks.</p>
  <p>Available as an LV2 plugin and JACK standalone version.</p>
  
