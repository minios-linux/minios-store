id: kino
name: Kino
description: Edit DV video
longDescription: |
  <p>Kino allows you to record, create, edit, and play movies recorded with DV camcorders. This program uses many keyboard commands for fast navigating and editing inside the movie.</p>
  <p>The kino-timfx, kino-dvtitler and kinoplus sets of plugins, formerly distributed as separate packages, are now provided with Kino.</p>
  
categoryId: multimedia
