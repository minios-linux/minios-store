id: "easytag"
name: EasyTAG
description: Edit audio file metadata
longDescription: |
  <p>View and edit tags for MP3, MP2, MP4/AAC, FLAC, Ogg Opus, Ogg Speex, Ogg Vorbis, MusePack, Monkey&apos;s Audio and WavPack files.</p>
  <p>Look up albums in online databases, bulk edit tags, create playlists and rename a collection of files.</p>
  <p>A simple and nice GTK+ interface makes tagging easier under GNU/Linux and Windows.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - easytag
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
