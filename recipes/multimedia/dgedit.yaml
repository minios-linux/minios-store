id: "dgedit"
name: DGEdit
description: the DrumGizmo drum kit editor
longDescription: |
  <p>DGEdit allows one to create drum kits for use in DrumGizmo from recordings of individual instruments (snare, kickdrum, toms, crashes, and so on). It supports the entire process of taking a group of WAV files and converting them into working instruments with hit energy levels.</p>
  
categoryId: multimedia
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - dgedit
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
