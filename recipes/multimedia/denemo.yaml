id: "denemo"
name: GNU Denemo
description: Edit musical scores
longDescription: |
  <p>GNU Denemo is a GUI musical score editor written in C/GTK+. It is intended primarily as a front end to GNU Lilypond, but is adaptable to other computer-music-related purposes as well.</p>
  
categoryId: multimedia
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - denemo
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
