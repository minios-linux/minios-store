id: iem-plugin-suite-standalone
name: IEM BinauralDecoder
description: Ambisonics standalone effect
longDescription: |
  <p>The IEM Plug-in Suite is an audio plugin suite created at the Institute of Electronic Music and Acoustics (Graz, Austria). It features Higher-Order Ambisonic plug-ins (up to 7th order), among them a number of state of the art encoders, directional compressors, directivity shapers, delay and reverb effects and analysis tools.</p>
  <p>This package provides the plugins as standalone applications.</p>
  
