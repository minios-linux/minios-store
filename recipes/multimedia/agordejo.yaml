id: "agordejo"
name: Agordejo
description: Music and audio production session manager based on NSM.
longDescription: |
  <p>Agordejo (Esperanto: ‘place to set things up’) is a music production session manager. It is used to start your programs, remember their (JACK) interconnections and make your life easier in general.</p>
  
