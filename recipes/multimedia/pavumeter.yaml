id: "pavumeter"
name: PulseAudio Volume Meter (Playback)
description: Monitor the output volume
longDescription: |
  <p>PulseAudio, previously known as Polypaudio, is a sound server for POSIX and WIN32 systems. It is a drop in replacement for the ESD sound server with much better latency, mixing/re-sampling quality and overall architecture.</p>
  <p>A simple volume meter for the PulseAudio sound server.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - pavumeter
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: pavumeter_audio-input-microphone.png
    width: 128
    height: 128
enabled: true
order: 99
