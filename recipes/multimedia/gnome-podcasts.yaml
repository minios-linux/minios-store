id: gnome-podcasts
name: Podcasts
description: Listen to your favorite shows
longDescription: |
  <p>
        Play, update, and manage your podcasts from a lightweight interface that seamlessly integrates with GNOME.
        Podcasts can play various audio formats and remember where you stopped listening.
        You can subscribe to shows via RSS/Atom, iTunes, and Soundcloud links. Subscriptions from other apps can be imported
  via OPML files.
      </p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-podcasts
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - podcast
  - rss
