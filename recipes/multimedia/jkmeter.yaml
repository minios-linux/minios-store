id: "jkmeter"
name: Jkmeter
description: Audio level meter for JACK
longDescription: |
  <p>A jkmeter displays both the true RMS level and the digital peak level. But can display stereo correlation too.</p>
  <p>Jkmeter is based on the ideas of mastering guru Bob Katz. See &lt;https://www.digido.com/bob-katz/index.php&gt; and follow the links on &apos;level practices&apos;. This is the type of meter you want for live recording, mixing and mastering</p>
  
