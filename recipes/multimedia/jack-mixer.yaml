id: jack-mixer
name: Jack Mixer
description: A multi-channel audio mixer application for the JACK Audio Connection Kit
longDescription: |
  <p>Jack Audio Mixer provides a GTK+ GUI to mix JACK audio streams. It maintains the appearance of a hardware audio mixing desk. It can set levels, balance, mute, etc through the interface or via MIDI.</p>
  <p>This package installs the application for Python 3.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - jack-mixer
