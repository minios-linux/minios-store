id: "vmpk"
name: VMPK
description: Virtual MIDI Piano Keyboard
longDescription: |
  <p>Virtual MIDI Piano Keyboard is a MIDI events generator and receiver. It doesn&apos;t produce any sound by itself, but can be used to drive a MIDI synthesizer (either hardware or software, internal or external). You can use the computer&apos;s keyboard to play MIDI notes, and also the mouse. You can use the Virtual MIDI Piano Keyboard to display the played MIDI notes from another instrument or MIDI file player.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - vmpk
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
