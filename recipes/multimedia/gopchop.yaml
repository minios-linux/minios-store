id: gopchop
name: GOPchop
description: MPEG2 GOP-accurate editor
longDescription: |
  <p>gopchop cuts and merges MPEG2 video streams. gopchop uses a method to cut streams that does not require re-encoding, and therefore is fast and not prone to the artifacts and degradation of quality inherent in re-encoding. However, cuts are limited to I-frames or group-of-picture (GOP) boundaries. These frames occur frequently enough, and often times at scene transitions, so that gopchop&apos;s method is adequate for many applications.</p>
  <p>The typical use is manually editing commercials out of recorded television programs.</p>
  <p>Another application is splitting .VOB files from dual-layer DVD rips so that the content can be re-authored such that each half will fit on one single-layer DVD recordable.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gopchop
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
