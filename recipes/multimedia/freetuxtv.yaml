id: "freetuxtv"
name: FreetuxTV
description: Watch television channels from internet
longDescription: |
  <p>FreetuxTV is a media player for watching and recording TV on a PC. It gives access to a large and growing database of free WebTV, WebRadio, and WebCam channels in more than 20 languages, along with television services provided by ISPs to their subscribers.</p>
  <p>It relies on VLC for its multimedia codecs.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - freetuxtv
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
