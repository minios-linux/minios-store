id: "handbrake"
name: HandBrake
description: Video Transcoder
longDescription: |
  <p>HandBrake is a tool for converting video from nearly any format to a selection of modern, widely supported codecs.</p>
  <p>Reasons you&apos;ll love Handbrake:</p>
  <ul>
    <li>Convert video from nearly any format</li>
    <li>Free and Open Source</li>
    <li>Multi-Platform (Windows, Mac and Linux)</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - handbrake
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
