id: "showq"
name: ShowQ
description: MIDI controllable audio player
longDescription: |
  <p>Application that can play audio cues and trigger MIDI events primarily developed for theatre productions.</p>
  <p>Features:  * 8 channels per_cue routing.  * Playback through ALSA or JACK.  * Load/Save cue list.  * Hot key for any cue.  * Application controllable by MIDI.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - showq
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
