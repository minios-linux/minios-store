id: "pencil2d"
name: Pencil2D
description: Create traditional hand-drawn animation using both bitmap and vector graphics
longDescription: |
  <p>Pencil2D is an animation/drawing software for Mac OS X, Windows, and Linux. It lets you create traditional hand-drawn animation (cartoon) using both bitmap and vector graphics.</p>
  <p>The basic features of Pencil2D are:  + layers support (separated layer for bitmap, vector and soud part)  + bitmap drawing  + vector drawing  + sound support</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
