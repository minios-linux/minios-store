id: "kylin-burner"
name: Burner
description: Create and copy CDs and DVDs
longDescription: |
  <p>Burner is a simple application to burn, copy and erase CD and DVD media: audio, video or data. It features among other things:  * On-the-fly burning  * Multisession support  * On-the-fly conversion of music playlists in all formats supported by    GStreamer</p>
  <p>This package contains the standalone app.</p>
  <p>The following packages, if installed, will provide Burner with added functionality:  * cdrdao to burn combined data/audio CDs and for byte-to-byte copy  * GStreamer backends to support more audio formats  * vcdimager to create VCDs or SVCDs  * libdvdcss2 to copy encrypted DVDs  * tracker to search for video, audio, image and document files</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - kylin-burner
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
