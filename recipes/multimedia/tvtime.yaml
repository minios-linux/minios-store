id: tvtime
name: TVtime Television Viewer
description: High quality video deinterlacer
longDescription: |
  <p>TVtime is a high quality television application for use with analog
        video capture cards on Linux systems. TVtime processes the input from a
        capture card and displays it on a computer monitor or projector.</p>
  <p>Features:</p>
  <ul>
    <li>Smooth motion: Experience the full framerate of the video signal. Every field is deinterlaced to a unique frame
  for television quality and beyond.</li>
    <li>Quality picture: Highest quality picture of any Linux TV viewer. Uses the best deinterlacers from DScaler for the
  ultimate experience.</li>
    <li>Slick On-Screen-Display: Gorgeously rendered text composited in realtime on the live video signal.</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
