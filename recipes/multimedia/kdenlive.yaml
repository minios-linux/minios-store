id: "kdenlive"
name: Kdenlive
description: Nonlinear video editor by KDE
longDescription: |
  <p>Kdenlive is a non-linear video editing suite, which supports DV, HDV and many more formats. Its main features are:  * Guides and marker for organizing timelines  * Copy and paste support for clips, effects and transitions  * Real time changes  * FireWire and Video4Linux capture  * Screen grabbing  * Exporting to any by FFMPEG supported format</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - kdenlive
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - editing
  - video
  - audio
  - mlt
  - kde
