id: wsjtx
name: wsjtx
description: Amateur Radio Weak Signal Operating
longDescription: |
  <p>WSJT-X implements communication protocols or &quot;modes&quot; called FT8, JT4, JT9, JT65, QRA64, ISCAT, MSK144, and WSPR, as well as one called Echo for detecting and measuring your own radio signals reflected from the Moon. These modes were all designed for making reliable, confirmed QSOs under extreme weak-signal conditions.</p>
  
