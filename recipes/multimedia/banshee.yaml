id: banshee
name: Banshee
description: Play and organize your media collection
longDescription: |
  <p>Banshee is a media management and playback application for the GNOME desktop, allowing users to import audio from CDs, search their library, create playlists of selections of their library, sync music to/from iPods and other media devices, play and manage video files and burn selections to a CD.</p>
  
