id: plattenalbum
name: Plattenalbum
description: Connect to your music
longDescription: |
  <p>A client for the Music Player Daemon (MPD).</p>
  <p>Browse your collection while viewing large album covers. Play your music without managing playlists.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - plattenalbum
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - music
  - player
