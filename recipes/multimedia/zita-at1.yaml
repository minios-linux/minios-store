id: "zita-at1"
name: AT1
description: Correct the pitch of a voice singing out of tune
longDescription: |
  <p>AT1 is an &apos;autotuner&apos;, normally used to correct the pitch of a voice singing (slightly) out of tune. Compared to &apos;Autotalent&apos; it provides an improved pitch estimation algorithm, and much cleaner resampling.</p>
  <p>AT1 does not include formant correction, so it should be used to correct small errors only and not to really transpose a song. The &apos;expected&apos; pitch can be controlled by Midi (via Jack only), or be a fixed set of notes. AT1 can probably be used on some instruments as well, but is primarily designed to cover the vocal range. It&apos;s also usable as a quick and dirty guitar tuner.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
