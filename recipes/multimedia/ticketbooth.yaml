id: ticketbooth
name: Ticket Booth
description: Keep track of your favorite shows
longDescription: |
  <p>Ticket Booth allows you to build your watchlist of movies and TV Shows, keep track of
  			watched titles, and find information about the latest releases.</p>
  <p> Ticket Booth does not allow you to watch or download content. This app uses the TMDB API
  			but is not endorsed or certified by TMDB.</p>
  
categoryId: multimedia
icon: Video
