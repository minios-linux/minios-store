id: vkeybd
name: Virtual MIDI Keyboard
description: A virtual MIDI keyboard
longDescription: |
  <p>This program allows you to use the Linux AWE32 driver, OSS MIDI sequencer, or ALSA MIDI sequencer and provides &quot;virtual&quot; keyboard (the musical type), which can be &quot;played&quot; using the keyboard or mouse under X11.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - vkeybd
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - sound
  - alsa
  - midi
