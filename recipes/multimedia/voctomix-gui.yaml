id: "voctomix-gui"
name: VoctoGUI
description: Voctomix graphical user interface
longDescription: |
  <p>The Voctomix Project by the C3Voc (the Chaos Communication Congress&apos; Video Operation Crew) is their software implementation of a Live-Video-Mixer.</p>
  <p>This package contains the GUI component, Voctogui, a GUI implementation in GTK+ controlling the core&apos;s functionality.</p>
  
