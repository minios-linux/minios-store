id: jtdx
name: jtdx
description: Amateur Radio Weak Signal Operating
longDescription: |
  <p>JTDX means &quot;JT modes for DXing&quot;, it is being developed with main focus on the sensitivity and decoding efficiency, both in overcrowded and half empty HF band conditions. JTDX is forked from WSJT-X, a computer program dedicated to amateur radio communication using very weak signals.</p>
  
