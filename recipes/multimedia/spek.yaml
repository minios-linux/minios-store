id: "spek"
name: Spek
description: View spectrograms of your audio files
longDescription: |
  <p>Spek helps to analyse your audio files by showing their spectrogram. It supports all popular lossy and lossless audio file formats.</p>
  <p>Features:</p>
  <p> * Ultra-fast signal processing, uses multiple threads to further    speed up the analysis  * Shows the codec name and the audio signal parameters  * Can save the spectrogram as an image file  * Drag-and-drop support; associates with common audio file formats  * Auto-fitting time, frequency and spectral density rulers  * Adjustable spectral density range</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - spek
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
