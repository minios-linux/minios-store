id: "calf-plugins"
name: Calf Plugin Pack for JACK
description: Process and produce sounds using a set of plugins with JACK interface
longDescription: |
  <p>The Calf plugins include all todays frequently used studio effects along with some feature-rich sound processors.</p>
  <p>Calf Studiogear is designed to run under the most flexible plugin standard in Linux, namely LV2. So you&apos;re able to insert them in lots of plugin-capable audio software like Ardour, Rosegarden and others.</p>
  <p>The Calf Rack offers you all Calf effects and synthesizers in an easy-to-use studio rack. Wire the effects through Jack to build your own studio environment and trigger the sound processors live or through a MIDI sequencer or tracker.</p>
  <p>Calf Rack supports LADISH level 1.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - calf-plugins
