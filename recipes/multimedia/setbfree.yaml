id: setbfree
name: setBfree
description: "MIDI-controlled, software synthesizer using JACK"
longDescription: |
  <p>setBfree is a MIDI-controlled, software synthesizer designed to imitate the sound and properties of the electromechanical organs and sound modification devices that brought world-wide fame to the names and products of Laurens Hammond and Don Leslie.</p>
  
