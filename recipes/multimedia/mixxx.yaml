id: "mixxx"
name: Mixxx
description: A digital DJ interface
longDescription: |
  <p>Mixxx is a digital DJ system, where Wave, Ogg, FLAC and MP3 files can be mixed on a computer for use in live performances. Filters, crossfader, and speed control are provided. Mixxx can sync the 2 streams automatically, using an algorithm to detect the beat.</p>
  <p>Mixxx works with Jack or OSS, can be controlled from the GUI or from external controllers, including MIDI devices and joysticks, and supports skins.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - mixxx
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
