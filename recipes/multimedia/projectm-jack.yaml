id: projectm-jack
name: projectM Jack Audio Visualization
description: A milkdrop based music visualizer visualizing JackAudio streams on a Qt4 GUI
longDescription: |
  <p>projectM is an iterative music visualization library which uses OpenGL for hardware acceleration. It is compatible with Milkdrop presets.</p>
  <p>This package contains an application to visualize JackAudio streams.</p>
  
