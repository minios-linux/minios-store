id: "openshot-qt"
name: OpenShot Video Editor
description: "An easy to use, quick to learn, and surprisingly powerful video editor"
longDescription: |
  <p>OpenShot Video Editor is a free, open-source, non-linear video editor. It
        can create and edit videos and movies using many popular video, audio,
        image formats. Create videos for YouTube, Flickr, Vimeo, Metacafe, iPod,
        Xbox, and more!</p>
  <p>Features include:
        Multiple tracks (layers)Compositing, image overlays, and watermarksAudio mixing and editingSupport for image sequences
  (rotoscoping)Key-frame animationVideo effects (chroma-key)Transitions (lumas and masks)Titles with integrated editor and templates3D animation (titles and effects)</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - openshot-qt
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
