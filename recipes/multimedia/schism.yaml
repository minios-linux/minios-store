id: schism
name: Schism Tracker
description: Impulse Tracker clone
longDescription: |
  <p>This is an editor for &quot;tracked&quot; music, i.e. audio samples of instruments pitch shifted according to the note data.</p>
  <p>The Impulse Tracker is one of the most popular &quot;tracker&quot; programs at present, and Schism Tracker attempts to follow their UI layout wherever possible in order to make it easy for existing users to switch.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - schism
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - impulse
  - module
  - midi
  - music
