id: "hydrogen"
name: Hydrogen
description: Create drum sequences
longDescription: |
  <p>Hydrogen is an advanced drum machine which provides a professional, yet simple and intuitive, pattern-based drum programming interface.</p>
  <p>General features:  * Very user-friendly, modular, fast and intuitive graphical interface    based on Qt 5.  * Sample-based stereo audio engine, with import of sound samples in    .wav, .au and .aiff formats.  * Support of samples in compressed FLAC file.</p>
  <p>Sequencer and mixer features:  * Pattern-based sequencer, with unlimited number of patterns and    ability to chain patterns into a song.  * Up to 64 ticks per pattern with individual level per event and    variable pattern length.  * 32 instrument tracks with volume, mute, solo, pan capabilities.  * Multi layer support for instruments (up to 16 samples for each    instrument).  * Ability to import/export song files.  * Unique human velocity, human time, pitch and swing functions.  * Multiple patterns playing at once.</p>
  <p>Other features:  * JACK, ALSA, PortAudio, OSS and PulseAudio audio drivers.  * ALSA MIDI and PortMidi input with assignable midi-in channel (1..16,    ALL).  * Import/export of drumkits.  * Export song to wav file.  * Export song to midi file.</p>
  
categoryId: multimedia
icon: Video
