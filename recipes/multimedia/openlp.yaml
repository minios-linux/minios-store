id: "openlp"
name: OpenLP
description: "Project lyrics, bible verses, media and more."
longDescription: |
  <p>OpenLP is free church presentation software, or lyrics projection software, used to display slides of songs, Bible verses, videos, images, and even presentations for church worship using a computer and a data projector.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
