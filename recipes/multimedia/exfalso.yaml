id: "exfalso"
name: Ex Falso
description: Edit tags in your audio files
longDescription: |
  <p>Ex Falso is a tag editor with the same tag editing interface as
          Quod Libet. It lets you display and edit any tags you want in the
          file, for all the file formats it supports.</p>
  <p>Supported file formats include Ogg Vorbis/Opus/Speex/FLAC, MP3,
          FLAC, MOD/XM/IT, Musepack, Wavpack, MPEG-4 AAC, Monkeys Audio, WMA,
          SPC, MIDI.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - exfalso
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
