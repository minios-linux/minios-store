id: solfege
name: GNU Solfege
description: Ear training software
longDescription: |
  <p>GNU Solfege is an ear training program for X Windows written in Python, using the GTK+ 3.0 libraries. You can practice harmonic and melodic intervals, chords, scales and rhythms, and you can add new exercises using a simple plain text file format.</p>
  <p>Ear training is a big subject with many connections to music theory and performance of music.</p>
  <p>To use this software, you need some basic knowledge about music theory.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - solfege
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
