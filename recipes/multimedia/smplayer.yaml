id: "smplayer"
name: SMPlayer
description: A great MPlayer front-end
longDescription: |
  <p>Qt5 front-end for mplayer and forks, with basic features like playing videos, DVDs, and VCDs to more advanced features like support for MPlayer filters and more. One of the most interesting features of SMPlayer: it remembers the settings of all files you play. So you start to watch a movie but you have to leave... don&apos;t worry, when you open that movie again it will resume at the same point you left it, and with the same settings: audio track, subtitles, volume...</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - smplayer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
