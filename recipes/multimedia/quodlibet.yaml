id: "quodlibet"
name: Quod Libet
description: "Listen to, browse, or edit your audio collection"
longDescription: |
  <p>Quod Libet is a music management program. It provides several
          different ways to view your audio library, as well as support for
          Internet radio and audio feeds. It has extremely flexible metadata
          tag editing and searching capabilities.</p>
  <p>Supported file formats include Ogg Vorbis/Opus/Speex/FLAC, MP3,
          FLAC, MOD/XM/IT, Musepack, Wavpack, MPEG-4 AAC, Monkeys Audio, WMA,
          SPC, MIDI.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - quodlibet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
