id: patchance
name: Patchance
description: Jack Patchbay
longDescription: |
  <p>Patchance is one more JACK patchbay GUI for GNU/Linux systems, but it could be adapted to Mac and Windows with little effort. It is a direct alternative to Catia or Patchage.</p>
  <p>Features: - Stereo detection for port grouping with their name, for faster   connections and readability - Wrap/Unwrap boxes to can hide things you don&apos;t need - Prevent the boxes from overlapping - Search a box with a pattern - Connection with double click for easier touchpad use - Connection from context menu - Editable themes (9 Themes embedded) - show only Audio, only MIDI, or only CV ports - Transport controls - Customizable tool bar - many others...</p>
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - patchance
distributions:
  include:
    - name: noble
      architectures: [amd64]
