id: "sayonara"
name: Sayonara
description: A lightweight Qt Audio player
longDescription: |
  <p> Sayonara is a small, clear, not yet platform-independent music player. Low CPU usage, low memory consumption and no long loading times are only three
        benefits of this player.
      </p>
  <p> Sayonara should be easy and intuitive to use and
        therefore it should be able to compete with the most popular music players.
      </p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - sayonara
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - music
  - player
  - tag
  - library
