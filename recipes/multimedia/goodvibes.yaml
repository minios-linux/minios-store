id: "goodvibes"
name: Goodvibes
description: Play web radios
longDescription: |
  <p>Goodvibes is a simple internet radio player for GNU/Linux.</p>
  <p>It comes with every basic features you can expect from an audio player,
        such as multimedia keys, notifications, system sleep inhibition, and
        MPRIS2 support.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - goodvibes
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - radio
  - player
