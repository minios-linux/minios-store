id: "deepin-movie"
name: Deepin Movie
description: Play your video collection
longDescription: |
  <p>Deepin Movie provides an intuitive easy to use operation interface and rich complete shortcuts. You can complete all play operations by keyboard, which will make you thoroughly get rid of the constraint of mouse click. Video files in various formats can be played through Deepin Movie, and you can use the streaming function to easily enjoy online video resources.</p>
  <p>This package is part of DDE (Deepin Desktop Environment).</p>
  
