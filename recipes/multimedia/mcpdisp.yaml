id: mcpdisp
name: mcpdisp-ext
description: Mackie Control Surface Emulator extender
longDescription: |
  <p>mcpdisp presents a jack midi port that will accept mackie control protocol display messages that would normally appear on the surface &quot;scribble strip&quot; and displays them on the screen. The strip LEDs and meters are displayed as well.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - mcpdisp
distributions:
  include:
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
