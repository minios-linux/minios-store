id: "qsynth"
name: Qsynth
description: A fluidsynth Qt GUI Interface
longDescription: |
  <p>Qsynth is a fluidsynth GUI front-end application, written in C++ around the
    Qt framework, using Qt Designer. Eventually it may evolve into a softsynth
    management application allowing the user to control and manage a variety of
    command line softsynths.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - qsynth
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
