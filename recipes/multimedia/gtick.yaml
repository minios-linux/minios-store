id: "gtick"
name: GTick
description: Metronome application
longDescription: |
  <p>GTick is an acoustical and graphical metronome application (usually used to
     support musicians at practising an instrument). It features a scale from 30 to
     250 beats per minute and 2/4, 3/4, 4/4 and other meters. You need a sound
     device for using it.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
