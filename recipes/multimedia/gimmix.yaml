id: gimmix
name: Gimmix
description: Gimmix is a graphical music player daemon (MPD) client written in C.
longDescription: |
  <p>Gimmix is a graphical music player daemon (MPD) client using GTK+2. It&apos;s very simple and easy to use, yet offers many features to make your audio experience a pleasant one.</p>
  <p>Features :  * Simple and Clean Interface.  * Library Browser.  * Library search. (search by artist, album, filename, etc)  * Playlist management (manage mpd playlists)  * ID3v2 tag editing support.  * System tray icon support.  * Support for controlling gimmix through Keyboard.  * Notification support (Displays the currently playing song in systray).  * Small memory footprint.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gimmix
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: gimmix_gimmix.png
    width: 128
    height: 128
enabled: true
order: 99
