id: subdownloader
name: SubDownloader
description: Download/upload subtitles for your videos
longDescription: |
  <p>SubDownloader is a tool to automatically download/upload subtitles for video files (DIVX, MPEG, AVI, etc.) and DVDs using fast hashing.</p>
  <p>Features:   * Fast hashing algorithm (27 GB movies/7 seconds)   * Recursively folders search   * Autodetect language of the subtitles   * Upload entire series seasons subtitles in less than 1 minute</p>
  <p>This package contains the GUI front-end, common files and a cli interface.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - subdownloader
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: subdownloader_subdownloader.png
    width: 64
    height: 64
enabled: true
order: 99
