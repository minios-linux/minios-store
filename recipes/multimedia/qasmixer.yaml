id: "qasmixer"
name: QasMixer
description: Graphical mixer application for the ALSA
longDescription: |
  <p>QasTools is a collection of desktop applications for the Linux sound system ALSA.</p>
  <p>The applications included are:  - QasConfig - browser for the ALSA configuration tree  - QasHctl - mixer for ALSA&apos;s High level Control Interface  - QasMixer - desktop mixer with features similar to alsamixer</p>
  <p>QasMixer is a desktop mixer application for ALSA&apos;s &quot;Simple Mixer Interface&quot; and offers features similar to alsamixer. It also features a system tray icon with basic mixer functionality.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - qasmixer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - alsa
  - audio
  - mixer
  - qt
