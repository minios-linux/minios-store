id: intone
name: Intone
description: Simple music player for mobile devices
longDescription: |
  <p>Intone is an elementary based front end for mplayer written in C.</p>
  <p>It has been written for Openmoko Freerunner, but will run on other systems, too. Apart from common things supported by most audio players intone supports A2DP headsets (audio via bluetooth) and interacts with FSO for call detection (pause music on call).</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - intone
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: intone_intone.png
    width: 128
    height: 128
enabled: true
order: 99
