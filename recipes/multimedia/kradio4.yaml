id: kradio4
name: kradio4
description: V4L/V4L2-Radio Application for KDE4
longDescription: |
  <p>KRadio is a comfortable radio application for KDE 4.x with support for V4L and V4L2 radio cards drivers.</p>
  <p>KRadio currently provides:</p>
  <p>  * V4L/V4L2 radio support   * Remote control support (LIRC)   * Alarms, sleep Countdown   * Several GUI Controls (Docking Menu, Station Quickbar, Radio Display)   * Recording capabilities, including MP3, Ogg/Vorbis, and WAV encoding   * Timeshifter functionality   * Extendable plugin architecture</p>
  <p>This package also includes a growing collection of station preset files for many cities around the world contributed by KRadio users.</p>
  <p>As KRadio is based on an extendable plugin architecture, contributions of new plugins (e.g. Internet Radio Streams, new cool GUIs) are welcome.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - kradio4
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
