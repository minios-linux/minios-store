id: "audacious"
name: Audacious
description: Listen to music
longDescription: |
  <p>Audacious is a fork of beep-media-player which supports Winamp skins and many codecs.</p>
  <p>In the default install, the following codecs are supported:</p>
  <p> * MP3  * Ogg Vorbis / Theora  * AAC and AAC+  * FLAC  * ALAC  * Windows Media (WMA)  * WAVE</p>
  <p>Additionally, Audacious is extendable through plugins, and contains other useful features like LIRC support. Support for many more codecs can also be added through plugins.</p>
  <p>This package contains the core player and its localization.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - audacious
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
