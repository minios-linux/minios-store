id: livi
name: Light Video
description: A simple GTK4 based video player for mobile phones
longDescription: |
  <p>
        A minimalistic GTK4 and gstreamer based video player for mobile phones like the Librem 5 aiming for minimal battery
  usage.
      </p>
  <p>
        It supports:
      </p>
  <ul>
    <li>Inhibiting suspend/idle when playing video</li>
    <li>Stopping video playback on (i.e. power button toggled) blank</li>
    <li>Registering as default video player in GNOME control center</li>
    <li>An indicator whether hardware accleration is in use</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - livi
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - video
  - movie
