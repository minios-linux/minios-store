id: "gnome-network-displays"
name: GNOME Network Displays
description: Stream the desktop to Wi-Fi Display capable devices
longDescription: |
  <p>
  		GNOME Network Displays allows you to cast your desktop to a remote display. Currently
  		implemented is support for casting to Wi-Fi Display capable devices (a.k.a. Miracast).
  		</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-network-displays
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
