id: snd-nox
name: Snd (CLI+JACK)
description: "Sound editor (with ALSA support, but without a GUI) that has been modeled after Emacs"
longDescription: |
  <p>Snd is a powerful sound file editor that can be customized and extended using the Scheme programming language.</p>
  <p>This package contains a version of snd compiled with both JACK and ALSA support, but without support for X.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - snd-nox
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - sound
  - editor
iconSources:
  - cached: snd-nox_snd.png
    width: 64
    height: 64
enabled: true
order: 99
