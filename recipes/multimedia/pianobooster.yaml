id: pianobooster
name: Piano Booster
description: Learn the piano just by playing a game
longDescription: |
  <p>Piano Booster is a new way to learn the piano just by playing a game. It takes elements of the game Guitar Hero but now it uses a real piano keyboard and the game has been turned sideways so the notes scroll along a musical stave. So instead of pressing buttons on a fake guitar you end up learning to play a real musical instrument: the piano.</p>
  <p>To run Piano Booster you need a MIDI Piano Keyboard and a MIDI interface for the PC. If you don&apos;t have a MIDI keyboard you can still try out PianoBooster, using the PC keyboard (&apos;x&apos; is middle C), but a MIDI piano is really recommended).</p>
  
