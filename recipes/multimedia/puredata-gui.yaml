id: "puredata-gui"
name: Pure Data (Pd)
description: A real-time graphical programming environment for live interactive computer music
longDescription: |
  <p>
        Pure Data (or just "Pd") is an open source visual programming language for multimedia. Pure Data is developed by
  Miller Puckette since 1996 and you can find it on his official website along with the official documentation and other related resources. This is the official "Pd" or "main distribution" and it is also known as "Pd Vanilla".
      </p>
  <p>
        Think of Pd as a <em>Modular Synthesizer</em> that is also a programming language.
      </p>
  <p>
        Pd's audio and MIDI functions are built-in as well as networking (e.g. using Open Sound Control), but there are
  a number of external libraries that allow you to do graphics, interface hardware and much more...
      </p>
  
