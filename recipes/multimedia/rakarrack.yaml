id: rakarrack
name: Rakarrack
description: Guitar Effects Processor
longDescription: |
  <p>Rakarrack is a guitar effects processor for GNU / Linux simple and easy to use but it contains features that make it unique in this field of applications.</p>
  <p>Currently it contains 17 effects:  * Linear Equalizer  * Parametric Equalizer  * Compressor  * Distorsion  * Overdrive  * Echo  * Chorus  * Phaser  * Flanger  * Reverb  * WahWah  * Alienwah  * Harmonizer  * NoiseGate  * Musical Delay  * Cabinet  * AutoPan/Extra Stereo</p>
  <p>Rakarrack integrates a tuner and a MIDI converter. It can also be handled by an external MIDI controller. The settings designed by the user can be stored in presets and these presets can be used to create banks of effects.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
