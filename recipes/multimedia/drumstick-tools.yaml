id: "drumstick-tools"
name: Drumstick Virtual Piano
description: Drumstick Virtual Piano
longDescription: |
  <p>This library is a C++ wrapper around the ALSA library sequencer interface, using Qt4 objects, idioms and style. ALSA sequencer provides software support for MIDI technology on Linux. Complementary classes for SMF and WRK file processing are also included.</p>
  <p>This package provides utilities shipped with the library:  - drumstick-buildsmf: Standard MIDI File creation from scratch.  - drumstick-dumpgrid: Simple Qt drum sequencer.  - drumstick-dumpmid: Write ALSA MIDI events to STDOUT.  - drumstick-dumpsmf: Write MIDI events from a MIDI file to STDOUT.  - drumstick-dumpwrk: Write MIDI events from a Cakewalk WRK file to STDOUT.  - drumstick-guiplayer: Simple Qt MIDI file player.  - drumstick-metronome: Headless MIDI metronome.  - drumstick-playsmf: Headless MIDI file player.  - drumstick-sysinfo: Display information about ALSA MIDI.  - drumstick-timertest: Test performance of the ALSA timer.  - drumstick-vpiano: Virtual Piano Keyboard GUI application.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - drumstick-tools
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
