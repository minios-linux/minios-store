id: tunapie
name: Tunapie
description: Lists audio and video streams from shoutcast and icecast
longDescription: |
  <p>A GUI based program for displaying Shoutcast or Icecast video and radio streams. It gives information about streams including bitrate, IP and current number of listeners. Streams can then be played using an appropriate media player, defined in preferences. Tunapie also allows streams to be recorded using streamripper. Recordings can be set to start and stop at specified times.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - tunapie
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
tags:
  - video
  - audio
iconSources:
