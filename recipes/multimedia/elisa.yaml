id: "elisa"
name: Elisa
description: Beautiful no-nonsense music player with online radio support
longDescription: |
  <p> A simple music player that should be easy to use. It does not require any configuration before one can use it. </p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - elisa
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
