id: "kmplayer"
name: KMPlayer
description: KDE interface for MPlayer
longDescription: |
  <p>KMPlayer is a simple frontend for MPlayer/FFMpeg/Phonon.</p>
  <p>Some features:  * play DVD/VCD movies (from file or url and from a video device)  * embed inside konqueror (movie is played inside konqueror)  * embed inside khtml (movie playback inside a html page)  * Movie recording using mencoder (part of the mplayer package)  * No video during recording, but you can always open a new window and play it  * Broadcasting, http streaming, using ffserver/ffmpeg  * For TV sources, you need v4lctl (part of the xawtv package)</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - kmplayer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
