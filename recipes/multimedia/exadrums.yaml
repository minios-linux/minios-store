id: "exadrums"
name: eXaDrums
description: Drum module for Linux.
longDescription: |
  <p>ExaDrums is a virtual drum module that allows drummers play with custom-made drum kits.</p>
  <p>It is user-friendly and combines high quality stereo sound with low latency.</p>
  <p>Each drum kit provides individual sliders in order to control the volume of its drum pads.</p>
  <p>A built-in metronome can be combined with a rhythm coach to make practice sessions easier and efficient.</p>
  <p>The drum triggers can be adjusted so that their response feels as natural as possible, and different sensor interfaces include a virtual (on-screen) multi pad and external sensors.</p>
  <p>Although eXaDrums is usable as a drum module, it is still an experimental project. As such, some features are not yet implemented, and the error management is not complete.</p>
  <p>This package provides the graphical user interface.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - exadrums
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
