id: "imagination"
name: Imagination
description: A lightweight slideshow maker using GTK+2
longDescription: |
  <p>Imagination is a lightweight and user-friendly DVD slide show maker with a clean interface and few dependencies. It only requires the ffmpeg encoder to produce a movie to be burned with another application.</p>
  <p>Imagination has the following features:   - Easy to operate.   - It can make a slideshow from photos selected by user.   - Support to VOB (DVD Video), OGV (Theora Vorbis), FLV (Flash Video) and     3GP (Mobile Phones) when exporting videos.   - Support screen resolutions from 128x96 pixels up to 1920x1080 pixels,     when exporting videos.   - Background audio (music, as MP3 files, or other audio files).   - Auto resize (optional) for images.   - Allow the users to select a background color.   - Over 50 transition effects.   - Zoom effect with duration time.   - Allow users to add explanatory texts (e.g. subtitles).</p>
  <p>Imagination can be used to make presentations to be shown by a projector or by a smart TV.</p>
  
