id: "syncplay"
name: Syncplay
description: Synchronize video playback over network
longDescription: |
  <p>Allows you to watch movies with friends or family at different places synchronized via the internet.</p>
  <p>When a viewer pauses/continues playback or seeks within their media player this will be replicated across all media players connected to the same server in the same viewing session. A chat function is included so viewers can discuss the movie while watching it. To improve the communication experience for viewers, the Syncplay developers and the syncplay-client package suggest to use additional VoIP (package mumble) or video phone (package jami) software.</p>
  <p>Technically, it synchronizes the position and play states of multiple mpv, VLC, MPC-HC and MPC-BEmedia player instances so viewers&apos; players present the same movie at the same time.</p>
  <p>In case your friends and family do not use Debian, Syncplay is available for other operating systems on the upstream website. To learn what Syncplay is read the description of package &apos;syncplay&apos;.</p>
  <p>This package installs the graphical desktop client program that does the actual synchronization of your video player. Therefore it must connect to a Syncplay server.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - syncplay
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
