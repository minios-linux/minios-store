id: guvcview
name: guvcview
description: A video viewer and capturer for the linux uvc driver
longDescription: |
  <p>guvcview is a simple GTK+ interface for capturing and viewing video from devices supported by the Linux UVC driver.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - guvcview
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
