id: "zita-mu1"
name: Zita-mu1
description: App used to organise stereo monitoring for JACK
longDescription: |
  <p>zita-mu1 is a simple Jack application used to organise stereo monitoring.</p>
  <p>Main features:  - Four stereo inputs.  - K20 RMS/peak meters and stereo correlation meter.  - Two monitoring outputs with individual volume controls.  - Left / Right / Mono and Dim swithes.  - Output of unmodified selected input, e.g. for metering.  - Talkback level controls and buttons with automatic dimming of speakers.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
