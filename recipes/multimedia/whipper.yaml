packages:
  - whipper
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
developer: The Whipper Team
homepage: "https://github.com/whipper-team/whipper"
enabled: true
order: 99
