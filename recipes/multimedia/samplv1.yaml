id: "samplv1"
name: samplv1
description: samplv1 is an old school polyphonic sampler
longDescription: |
  <p>samplv1 is an old-school all-digital polyphonic sampler synthesizer with stereo effects.</p>
  <p>Although other samplers like specimen provide more features, one could find samplv1 much easier and accessible. Plus, it is provided in both forms of a JACK stand-alone client and a LV2 plugin.</p>
  <p>This package provides the standalone app.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - samplv1
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
