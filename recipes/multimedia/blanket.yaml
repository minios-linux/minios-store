id: blanket
name: Blanket
description: Listen to ambient sounds
longDescription: |
  <p>Improve focus and increase your productivity by listening to different ambient sounds</p>
  <p>Also can help you to fall asleep in a noisy environment.</p>
  <p>Features:</p>
  <ul>
    <li>Save presets</li>
    <li>Add custom sounds</li>
    <li>Auto start in background</li>
    <li>MPRIS integration</li>
  </ul>
  <p>Included Sounds in the App:</p>
  <ul>
    <li>Birds</li>
    <li>Boat</li>
    <li>City</li>
    <li>Coffee Shop</li>
    <li>Fireplace</li>
    <li>Pink Noise</li>
    <li>Rain</li>
    <li>Summer Night</li>
    <li>Storm</li>
    <li>Stream</li>
    <li>Train</li>
    <li>Waves</li>
    <li>White Noise</li>
    <li>Wind</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - blanket
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - concentrate
  - focus
  - noise
  - productivity
  - sleep
