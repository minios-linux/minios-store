id: jamin
name: JAMin
description: JACK Audio Mastering interface
longDescription: |
  <p>JAM is a tool for producing audio masters from a mixed down multitrack source. It runs in the JACK Audio Connection Kit, and uses LADSPA for its backend DSP work, specifically the swh plugins created by Steve Harris, JAM&apos;s main author.</p>
  <p>Features:  * Linear filters  * JACK I/O  * 30 band graphic EQ  * 1023 band hand drawn EQ with parametric controls  * Spectrum analyser  * 3 band peak compressor  * Lookahead brickwall limiter  * Multiband stereo processing  * Presets and scenes  * Loudness maximiser</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - jamin
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
