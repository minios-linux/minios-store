id: gbemol
name: gbemol
description: MPD client
longDescription: |
  <p>gbemol allows you to use MPD with a userfriendly interface. Features include an easy-to-use, tag-oriented library browser, a two mode playlist, cover art support (APIC tag only, for now), system tray icon docking, song, album and artist information.</p>
  <p>Music Player Daemon is a server that allows remote access for playing audio files, streams and managing playlists. The daemon is controlled through a client which need not run on the same computer mpd runs on.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gbemol
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
