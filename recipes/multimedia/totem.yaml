id: "totem"
name: Videos
description: Play movies
longDescription: |
  <p>Videos, also known as Totem, is the official movie player of the GNOME
        desktop environment.
        It features a searchable list of local videos, and DVDs, as well as local
        network video shares (using UPnP/DLNA) and video highlights from a number
        of web sites.</p>
  <p>Totem comes with added functionality such as: subtitle downloader,
        and support for recording DVDs.</p>
  <ul>
    <li>Video thumbnailer for the file manager</li>
    <li>Files properties tab</li>
  </ul>
  
categoryId: multimedia
icon: Video
