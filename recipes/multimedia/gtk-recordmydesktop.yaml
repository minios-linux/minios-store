id: gtk-recordmydesktop
name: RecordMyDesktop
description: Record a video of your desktop
longDescription: |
  <p>Adds an easy to use graphical icon on the GNOME toolbar to make screencasts with the video and audio capture application recordMyDesktop</p>
  
