id: "obs-studio"
name: OBS
description: Free and Open Source Streaming/Recording Software
longDescription: |
  <p>OBS Studio is designed for efficiently recording and streaming live video content. It supports live RTP streaming to various streaming sites.</p>
  <p>Other features include:  * Encoding using H264 (x264) and AAC  * Unlimited number of scenes and sources  * File output to MP4 or FLV  * GPU-based game capture for high performance game streaming  * Bilinear or lanczos3 resampling</p>
  <p>Note that OBS Studio requires an OpenGL 3.2 compatible video card.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - obs-studio
distributions:
