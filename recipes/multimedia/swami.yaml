id: "swami"
name: Swami Instrument Editor
description: "Create, play and organize MIDI instruments and sounds"
longDescription: |
  <p>Swami (Sampled Waveforms And Musical Instruments) is an application for editing and managing MIDI instruments, such as SoundFont files. A programming API is also provided for integration with other applications.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
