id: "padthv1"
name: padthv1
description: padthv1 is an old school polyphonic additive synthesizer
longDescription: |
  <p>padthv1 is an old-school polyphonic additive synthesizer with stereo effects. It is provided in both forms of a LV2 plugin and a pure stand-alone JACK client with JACK-session and both JACK MIDI and ALSA MIDI input support.</p>
  <p>This package provides the standalone app.</p>
  
