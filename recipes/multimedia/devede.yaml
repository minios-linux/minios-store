id: "devede"
name: DevedeNG
description: "Allows to create video CDs and DVDs, suitable to be reproduced in home DVD players"
longDescription: |
  <p>DeVeDe is a program to create video DVDs, suitables for home players, from any number of video files, in any of the formats supported by Mplayer.</p>
  <p>It allows user to create subtitles and even menus.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - devede
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
