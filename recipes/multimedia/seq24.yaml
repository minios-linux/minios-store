id: seq24
name: Seq24
description: MIDI Sequencer
longDescription: |
  <p>Seq24 was created to provide a very simple interface for editing and playing midi &apos;loops&apos;. It is a very minimal sequencer that excludes the bloated features of the large software sequencers and includes a small subset that proved to be useful for live performances.</p>
  
