id: "audacity"
name: Audacity
description: Record and edit audio files
longDescription: |
  <p>Audacity is a multi-track audio editor for Linux/Unix, MacOS and Windows.  It is designed for easy recording, playing and editing of digital audio.  Audacity features digital effects and spectrum analysis tools.  Editing is very fast and provides unlimited undo/redo.</p>
  <p>Supported file formats include Ogg Vorbis, MP2, MP3, WAV, AIFF, and AU.</p>
  
categoryId: multimedia
icon: Music
method: apt
level: "auto"
compression: zstd
packages:
  - audacity
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
