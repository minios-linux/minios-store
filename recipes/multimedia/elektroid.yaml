id: "elektroid"
name: elektroid
description: Sample transfer application
longDescription: |
  <p>Elektroid is an sample transfer application for Elektron devices.</p>
  <p>With elektroid you can easily load audio files like flac or wav into your
    elektron sampler. You can also transfer audio samples from your elektroid
    device to your local hard disk.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - elektroid
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - music
  - alsa
  - realtime
  - standalone
