id: "guitarix"
name: guitarix
description: Simple mono amplifier simulation
longDescription: |
  <p>Guitarix is a rock guitar amplifier for the Jack Audio Connection Kit with one input and two outputs. It provides one JACK input port and two JACK output ports. It is designed to produce nice trash/metal/rock/blues guitar sounds. Controls for bass, treble, gain, compressor, tube selector, distortion, flanger, freeverb, crybaby (wah), etc are available.</p>
  <p>Guitarix comes with a GTK+ interface and as Ladspa and LV2 plugins.</p>
  
