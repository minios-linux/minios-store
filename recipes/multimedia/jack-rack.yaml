id: jack-rack
name: JACK Rack
description: Stereo LADSPA effects rack
longDescription: |
  <p>JACK Rack is an effects &quot;rack&quot; for the JACK low latency audio API. The rack can be filled with LADSPA effects plugins and can be controlled using the ALSA sequencer. It&apos;s phat; it turns your computer into an effects box.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - jack-rack
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
