id: "gaupol"
name: Gaupol
description: Editor for text-based subtitles
longDescription: |
  <p>Gaupol is an editor for text-based subtitle files. It supports
      multiple subtitle file formats and provides means of creating
      subtitles, editing texts and timing subtitles to match video.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gaupol
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
