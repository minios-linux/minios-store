id: "gnome-metronome"
name: Metronome
description: A simple Metronome application for the GNOME desktop
longDescription: |
  <p>
        Metronome is a GNOME application to help you to keep the tempo
        while practicing your instrument.
      </p>
  <p>Features:</p>
  <ul>
    <li>Select the tempo by changing the beats per minute, or by tapping it</li>
    <li>Select the time signature</li>
    <li>Play the metronome</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-metronome
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
