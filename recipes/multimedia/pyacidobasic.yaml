id: pyacidobasic
name: pyAcidoBasic
description: Interactive tool to simulate acido-basic titrations
longDescription: |
  <p>python-acidobasic allows you to compose a mixture of acid or base reactives, and to simulate their titration by one acid or base. pH and concentration curves are displaied instantly when the composition of all chemicals are defined. You can choose to display either concentrations or quantities of chemicals.</p>
  
