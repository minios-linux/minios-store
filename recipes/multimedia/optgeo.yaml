id: optgeo
name: OptGeo
description: Interactive tool to study and simulate optic assemblies
longDescription: |
  <p>optgeo is a program to plot the movement of rays through an optic equipment. Many pieces, like lenses, mirrors, curved mirrors can be assembled.</p>
  
