id: "synthv1"
name: synthv1
description: synthv1 is an old school polyphonic synthesizer
longDescription: |
  <p>synthv1 is an old-school all-digital 4-oscillator subtractive polyphonic synthesizer with stereo effects, especially suited to create strong bass sounds.</p>
  <p>This package provides the standalone app.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
