id: bespokesynth
name: BespokeSynth
description: A modular DAW for Linux
longDescription: |
  <p>Bespoke is a software modular synthesizer. It contains a bunch
      of modules, which you can connect together to create sounds.</p>
  <p>Bespoke is like a DAW* in some ways, but with less of a focus
      on a global timeline. Instead, it has a design more optimized for
      jamming and exploration.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - bespokesynth
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - midi
  - synth
  - vst
