id: "gtranscribe"
name: gTranscribe
description: A simple GTK+ tool focussed on easy transcription of spoken words
longDescription: |
  <p>gTranscribe is a simple GTK+ tool to transcribe audio files and other
        sources. The playback speed can be adjusted without changing the pitch
        of the voice. It supports spell checking and resuming at the last
        transcribed position.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gtranscribe
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - speech
  - transcription
