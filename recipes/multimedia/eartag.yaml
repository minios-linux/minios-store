id: "eartag"
name: Ear Tag
description: Edit audio file tags
longDescription: |
  <p>Ear Tag is a simple audio file tag editor. It is primarily geared towards making quick edits or bulk-editing tracks in albums/EPs. Unlike other tagging programs, Ear Tag does not require the user to set up a music library folder. It can:</p>
  <ul>
    <li>Edit tags of MP3, WAV, M4A, FLAC, OGG and WMA files</li>
    <li>Modify metadata of multiple files at once</li>
    <li>Rename files using information from present tags</li>
    <li>Identify files using AcoustID</li>
  </ul>
  <p>Network access is only used for the "Identify selected files" option.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - eartag
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - music
  - audio
  - tag
  - tagging
  - tagger
