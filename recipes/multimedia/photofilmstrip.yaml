id: "photofilmstrip"
name: PhotoFilmStrip
description: Create animated slideshows
longDescription: |
  <p>This creates movies out of your pictures in just three steps. First select your photos, customize the motion path and render the video. There are several output possibilities for VCD, SVCD, DVD up to FULL-HD and even 4k.</p>
  <p>The effect of the slideshow is known as &quot;Ken Burns&quot;. Comments of the pictures are generated into a subtitle file. Furthermore audio files can be specified to setup the background music for the slide show.</p>
  
