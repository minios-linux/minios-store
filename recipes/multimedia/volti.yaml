id: volti
name: Volti
description: Tray Audio Volume Control
longDescription: |
  <p>Volti is a lightweight GTK+ application for controlling audio volume from system tray/notification area.</p>
  <p>Features:  * no PulseAudio, GStreamer, Phonon etc. only ALSA is needed  * internal mixer application, either choosing any mixer app    is possible  * left click opens volume scale (slider)  * scroll wheel on tray icon changes volume, increment in    percents is configurable  * configurable middle click to toggle &apos;mute&apos; or &apos;show mixer&apos;  * nice tooltip with card and volume info  * support for multimedia keys  * support desktop notifications on keys events</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - volti
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
iconSources:
  - url: v/vo/volti.desktop/7A6FD8BC4CE6090513BF258283F80A50/icons/128x128/volti_multimedia-volume-control.png
    width: 128
    height: 128
enabled: true
order: 99
