id: "ebook-speaker"
name: eBook speaker
description: Speaking e-reader
longDescription: |
  <p>This package provides a command-line e-reader that reads out electronic text using speech synthesis. It has a simple user interface appropriate for Braille terminals.</p>
  <p>Currently the following formats are supported (some formats need additional packages as suggested by this package):  AportisDoc  ASCII mail text  ASCII text  Broadband eBooks (BBeB)  Composite Document File (Microsoft Office Word)  DAISY3 DTBook  EPUB ebook data  GIF image data  GutenPalm zTXT  GNU gettext message catalogue  HTML document  ISO-8859 text  JPEG image data  Microsoft Reader eBook Data  Microsoft Windows HtmlHelp Data  Microsoft Word 2007+  Mobipocket E-book  MS Windows HtmlHelp Data  Netpbm PPM data  OpenDocument Text  PDF document  PeanutPress PalmOS  PNG image data  POSIX shell script text  PostScript document  Rich Text Format  troff or preprocessor text (e.g. Linux man-pages)  UTF-8 Unicode mail text  UTF-8 Unicode text  WordPerfect  XML document text</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - ebook-speaker
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - documents
  - voice
  - audio
  - reading
  - listen
  - listening
  - braille
  - text
iconSources:
  - url: e/eb/ebook-speaker.desktop/27cb7a794b8018b4c09b4600bf0b1c22/icons/128x128/ebook-speaker_ebook-speaker.png
    width: 128
    height: 128
enabled: true
