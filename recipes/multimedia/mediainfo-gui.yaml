id: "mediainfo-gui"
name: MediaInfo
description: Convenient unified display of the most relevant technical and tag data for video and audio files
longDescription: |
  <p>MediaInfo is a convenient unified display of the most relevant technical and tag data for video and audio files.</p>
  <p>The MediaInfo data display includes :</p>
  <ul>
    <li>Container: format, profile, commercial name of the format, duration, overall bit rate, writing application and library,
  title, author, director, album, track number, date, duration...</li>
    <li>Video: format, codec id, aspect, frame rate, bit rate, color space, chroma subsampling, bit depth, scan type, scan
  order...</li>
    <li>Audio: format, codec id, sample rate, channels, bit depth, language, bit rate...</li>
    <li>Text: format, codec id, language of subtitle...</li>
    <li>Chapters: count of chapters, list of chapters...</li>
  </ul>
  <p>MediaInfo analyticals include :</p>
  <ul>
    <li>Container: MPEG-4, QuickTime, Matroska, AVI, MPEG-PS (including unprotected DVD), MPEG-TS (including unprotected
  Blu-ray), MXF, GXF, LXF, WMV, FLV, Real...</li>
    <li>Tags: Id3v1, Id3v2, Vorbis comments, APE tags...</li>
    <li>Video: MPEG-1/2 Video, H.263, MPEG-4 Visual (including DivX, XviD), H.264/AVC, Dirac...</li>
    <li>Audio: MPEG Audio (including MP3), AC3, DTS, AAC, Dolby E, AES3, FLAC...</li>
    <li>Subtitles: CEA-608, CEA-708, DTVCC, SCTE-20, SCTE-128, ATSC/53, CDP, DVB Subtitle, Teletext, SRT, SSA, ASS, SAMI...</li>
  </ul>
  
