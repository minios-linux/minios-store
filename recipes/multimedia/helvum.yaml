id: "helvum"
name: Helvum
description: Patchbay for PipeWire
longDescription: |
  <p>
              Helvum is a graphical patchbay for PipeWire.
              It allows creating and removing connections between applications and/or devices to reroute
              flow of audio, video and MIDI data to where it is needed.
          </p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - helvum
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
