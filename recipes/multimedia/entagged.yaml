id: "entagged"
name: Entagged
description: Tag Editor
longDescription: |
  <p>Entagged is an audio file tagger written in Java, using the freedb online database for the retrieval of the tags. It can be used to organize files into complex directory structures according to their tags, or to tag them from their filenames. Supports: APE, FLAC, MP3, MPC, OGG, WMA.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
