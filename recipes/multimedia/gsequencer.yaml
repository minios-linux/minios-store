id: "gsequencer"
name: GSequencer
description: Advanced Gtk+ Sequencer
longDescription: |
  <p>GSequencer provides you various tools to play, create, edit and mix your own music.
      It features a step sequencer, piano roll, automation and wave-form editor.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gsequencer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - audio
  - sequencer
  - notation
  - editor
  - midi
  - synth
  - mixing
  - effects
