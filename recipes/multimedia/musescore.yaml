id: "musescore"
name: MuseScore 2
description: "Create, play and print sheet music"
longDescription: |
  <p>MuseScore is a free WYSIWYG music score typesetter for Linux, licenced under GNU GPL. Features:  - WYSIWYG, notes are entered on a &quot;virtual note sheet&quot;  - Unlimited score length  - Unlimited number of staves per system  - Up to four independent voices per staff  - easy and fast note entry with mouse, keyboard or midi  - integrated sequencer and FluidSynth software synthesizer  - import and export of MusicXml and standard midifiles (SMF)  - platform independent code for Linux, Windows and Mac  - Automatic part extraction and transposition  - Chord symbols  - Swing and shuffle playback  - and much more...</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - musescore
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - music
  - notation
  - composition
  - composing
  - arranging
  - making
  - sheet music
  - music notation software
  - lead sheet
  - leadsheet
