id: gnome-mpv
name: GNOME MPV
description: GTK+ frontend for mpv
longDescription: |
  <p>GNOME MPV is a simple GTK+ frontend for mpv, which is a very powerful media
     player capable of playing virtually all video and audio formats. The design
     of GNOME MPV is based on GNOME HIG, though it is not dependent on any GNOME
     libraries. GNOME MPV also offers an option to disable client-side decorations
     (CSD) for better compatibility with non-GNOME systems.</p>
  <p>Features:</p>
  <ul>
    <li>Drag and drop playlist</li>
    <li>Loading external mpv configuration files</li>
    <li>MPRIS2 D-Bus interface</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-mpv
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
