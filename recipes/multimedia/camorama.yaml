id: camorama
name: Camorama Webcam Viewer
description: "View, alter and save images from a webcam"
longDescription: |
  <p>Camorama is a small utility to view and save images from a webcam or any other Video4Linux device. It can apply a number of image filters and make remote captures.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - camorama
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: camorama_camorama.png
    width: 64
    height: 64
enabled: true
order: 99
