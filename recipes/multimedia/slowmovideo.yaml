id: slowmovideo
name: slowmoUI
description: Slow Motion Video
longDescription: |
  <p>This does not simply make your videos play at 0.01 x speed. You can smoothly slow down and speed up your footage, optionally with motion blur.</p>
  <p>How does slow motion work? slowmoVideo tries to find out where pixels move in the video (this information is called Optical Flow), and then uses this information to calculate the additional frames.</p>
  <p>Videos in any format supported by ffmpeg can be loaded. Image sequences can also be loaded, so, if you did a timelapse with too few frames, slowmoVideo may help as well. slowmoVideo does not work with a constant slowdown factor but with curves that allow arbitrary time accelereation/deceleration/reversal. Motion blur can be added, as much as you want.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - slowmovideo
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
iconSources:
  - cached: slowmovideo_AppIcon.png
    width: 64
    height: 64
enabled: true
order: 99
