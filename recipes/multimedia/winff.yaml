id: "winff"
name: WinFF
description: GUI for ffmpeg or avconv
longDescription: |
  <p>WinFF is a graphical user interface for FFmpeg or avconv. It will convert almost any video file that FFmpeg or avconv will convert. WinFF does multiple files in multiple formats at one time. You can, for example, convert mpeg&apos;s, flv&apos;s, and mov&apos;s into avi&apos;s (or DVD/VCD format or MPEG or 3gp etc.) all at once.</p>
  <p>WinFF provides a variety of preset conversion settings for common formats and devices. These presets are intended to hit the &quot;sweet spot&quot; for each individual codec. They have been written with a tip of the balance to quality.</p>
  <p>For most presets to work, it is necessary to have the unstripped version of the libavcodec package, which can be obtained by installing libavcodec-extra as suggested by the WinFF suite. It might be necessary to enable additional repositories to find that package.</p>
  
