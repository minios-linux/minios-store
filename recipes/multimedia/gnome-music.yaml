id: "gnome-music"
name: GNOME Music
description: Play and organize your music collection
longDescription: |
  <p>An easy way to play your music. Automatically discover music on your computer, the local network and internet services.</p>
  <p>Find tracks in your local collection, get music from DLNA servers or try something new with the Jamendo and Magnatune services.</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-music
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - music
  - player
