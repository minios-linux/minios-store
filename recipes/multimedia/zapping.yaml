id: zapping
name: Zapping TV Viewer
description: Lets you watch TV in a window
longDescription: |
  <p>It is based on plugins. This will make it easy to add functionality to the program, without making it hard to maintain, such as saving video as AVI/MPEG, viewing mirrored TV (scanning from right to left) or whatever you can imagine (and program).</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - zapping
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
tags:
  - tv
  - television
  - viewer
  - video
iconSources:
  - cached: zapping_gnome-television.png
    width: 64
    height: 64
enabled: true
order: 99
