id: gnome-video-trimmer
name: Video Trimmer
description: Trim videos quickly
longDescription: |
  <p>
  			Video Trimmer cuts out a fragment of a video given the start and end timestamps. The video is never re-encoded, so the process is very fast and does not reduce the video quality.
  		</p>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-video-trimmer
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - cut
  - movie
  - film
  - clip
