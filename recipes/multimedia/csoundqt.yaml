id: "csoundqt"
name: CsoundQt
description: "CsoundQt is a frontend for Csound featuring a highlighting editor with autocomplete, interactive widgets and integrated help."
longDescription: |
  <p>CsoundQT is a simple cross platform editor and front-end for Csound with syntax highlighting, interactive help and automatic launching of Csound.</p>
  
