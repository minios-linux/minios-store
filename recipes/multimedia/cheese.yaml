id: "cheese"
name: Cheese
description: "Take photos and videos with your webcam, with fun graphical effects"
longDescription: |
  <p>Cheese uses your webcam to take photos and videos, applies fancy special effects and lets you share the fun with others.</p>
  <p>Take multiple photos in quick succession with burst mode. Use the countdown to give yourself time to strike a pose, and wait for the flash!</p>
  <p>Under the hood, Cheese uses GStreamer to apply fancy effects to photos and videos. With Cheese it is easy to take photos of you, your friends, pets or whatever you want and share them with others.</p>
  
