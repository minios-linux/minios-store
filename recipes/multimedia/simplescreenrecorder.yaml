id: "simplescreenrecorder"
name: SimpleScreenRecorder
description: A feature-rich screen recorder that supports X11 and OpenGL
longDescription: |
  <p>SimpleScreenRecorder is a feature-rich screen recorder that supports X11 and OpenGL. It has a Qt-based graphical user interface. It can record the entire screen or part of it, or record OpenGL applications directly. The recording can be paused and resumed at any time. Many different file formats and codecs are supported.</p>
  <p>Key features:</p>
  <ul>
    <li>Synchronizes audio and video properly.</li>
    <li>Reduces the video frame rate if your computer is too slow.</li>
    <li>Fully multithreaded: small delays in any of the components will never block the other components, resulting is smoother
  video and better performance on computers with multiple processors.</li>
    <li>Can also do live streaming (experimental).</li>
  </ul>
  
categoryId: multimedia
icon: Video
method: apt
level: "auto"
compression: zstd
packages:
  - simplescreenrecorder
