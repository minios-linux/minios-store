id: "kwalletmanager"
name: KWalletManager
description: KDE Wallet Management Tool
longDescription: |
  <p>The KDE Wallet system provides a secure way to store passwords and other secret information, allowing the user to remember only a single KDE Wallet password instead of numerous different passwords and credentials.</p>
  <p>KWallet Manager is a utility for viewing and editing information stored in the KDE Wallet.</p>
  <p>This package is part of the KDE SC utilities module.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - kwalletmanager
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
