id: "firewall-config"
name: Firewall
description: Firewall Configuration
longDescription: |
  <p>Firewall Configuration provides a graphical tool for administering firewall.</p>
  <p>Allows to inspect and set:</p>
  <ul>
    <li>Runtime and permanent firewall configuration</li>
    <li>Predefined zones (levels of trust for network connections)</li>
    <li>Predefined services (port/protocol, netfilter helper module)</li>
    <li>Port forwarding, masquerading, ICMP blocking</li>
    <li>Complex firewall rules a.k.a. Rich Language</li>
    <li>Iptables rules a.k.a. Direct Interface</li>
  </ul>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - firewall-config
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - firewall
  - network
  - security
  - iptables
  - netfilter
