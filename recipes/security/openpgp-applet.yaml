id: openpgp-applet
name: OpenPGP Applet
description: "Encrypt, Decrypt, Sign text from and to the clipboard"
longDescription: |
  <p>OpenPGP Applet is a graphical frontend on top of GnuPG.</p>
  <p>It allows encryption and decryption of the clipboard&apos;s content either with public key cryptography, or with a symmetric cipher using a passphrase. Creating and verifying clear text signatures is also supported.</p>
  <p>Note: OpenPGP Applet does not handle passphrase input. Since it also does not offer terminal interaction unless explicitly run from there, it relies in practice on GnuPG agent to be running and configured to use a passphrase entry dialog, such as pinentry-gnome3.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - openpgp-applet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - pgp
  - gnupg
  - gpg
  - encryption
  - decryption
  - privacy
  - sign
  - key
iconSources:
  - cached: openpgp-applet_OpenPGP_Applet.png
    width: 64
    height: 64
enabled: true
order: 99
