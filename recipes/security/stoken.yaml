id: "stoken"
name: Software Token
description: RSA SecurID-compatible software token
longDescription: |
  <p>stoken is a software token which generates one-time passwords compatible with RSA SecurID 128-bit (AES) tokens.  SecurID tokens are commonly used to authenticate end users to protected network resources and VPNs, as OTPs provide greater resistance to many attacks associated with static passwords.</p>
  <p>stoken aims to provide a Linux-friendly, free software alternative to the proprietary RSA SecurID Software Authenticators.</p>
  <p>This package contains standalone command-line and GTK+ GUI programs that allow for importing token seeds, generating tokencodes, and various utility/testing functions.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - stoken
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - rsa
  - securid
  - authenticator
iconSources:
  - cached: stoken_stoken-gui.png
    width: 64
    height: 64
enabled: true
order: 99
