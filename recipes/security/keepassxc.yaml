id: "keepassxc"
name: KeePassXC
description: Community-driven port of the Windows application “KeePass Password Safe”
longDescription: |
  <p>KeePassXC is an application for people with extremely high demands on secure
              personal data management. It has a light interface, is cross-platform and
              published under the terms of the GNU General Public License.</p>
  
categoryId: security
icon: Lock
method: apt
level: "auto"
compression: zstd
packages:
  - keepassxc
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
