id: "nmapsi4"
name: NmapSI4 - User mode
description: Is a Qt4 interface for nmap scanner
longDescription: |
  <p>NmapSI4 is a complete Qt-based Gui with the design goal to provide a complete nmap interface for users, in order to manage all options of this power security net scanner.</p>
  
