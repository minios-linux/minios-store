id: passwordsafe
name: Password Safe
description: Manage Passwords
longDescription: |
  <p>Password Safe allows you to safely and easily create a secured and encrypted user name/password list. With Password Safe all you have to do is create and remember a single &quot;Master Password&quot; of your choice in order to unlock and access your entire user name/password list.</p>
  <p>This is the GNU/Linux version of the popular PasswordSafe password manager, originally designed by the renowned security technologist Bruce Schneier and open sourced in 2002.</p>
  <p>Compatible with 1.x, 2.x and 3.x versions of the database format.</p>
  <p>Note: This is a BETA release for Linux, therefore some functionality may not yet be implemented.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - passwordsafe
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - password
  - management
  - manager
  - database
  - safe
  - encryption
  - secure
  - storage
iconSources:
  - cached: passwordsafe_pwsafe.png
    width: 64
    height: 64
enabled: true
order: 99
