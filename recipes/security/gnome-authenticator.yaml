id: "gnome-authenticator"
name: Authenticator
description: A Two-Factor Authentication application
longDescription: |
  <p>Simple application that generates a two-factor authentication code, created for GNOME.</p>
  <p>Features:</p>
  <ul>
    <li>QR code scanner</li>
    <li>Beautiful UI</li>
    <li>Huge database of more than 560 supported services</li>
    <li>Keep your PIN tokens secure by locking the application with a password</li>
    <li>Automatically fetch an image for services using their favicon</li>
    <li>The possibility to add new services</li>
    <li>Dark theme and night light</li>
  </ul>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-authenticator
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gnome
  - gtk
  - verification
  - 2fa
  - authentication
  - twofactor
