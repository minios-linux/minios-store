id: "seahorse"
name: Seahorse
description: Manage your passwords and encryption keys
longDescription: |
  <p>Seahorse is a GNOME application for managing encryption keys.
        It also integrates with nautilus, gedit and other places for encryption operations.</p>
  <p>With seahorse you can create and manage PGP keys, create and manage SSH keys,
        publish and retrieve keys from key servers, cache your passphrase so you
        don’t have to keep typing it and backup your keys and keyring.</p>
  
categoryId: security
icon: Lock
method: apt
level: "auto"
compression: zstd
packages:
  - seahorse
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - keyring
  - encryption
  - security
  - sign
  - ssh
