id: cardpeek
name: Cardpeek
description: Tool to read the contents of smart cards
longDescription: |
  <p>The goal of cardpeek is to allow smartcard owners to be better informed about what type of personal information is stored in these devices. The tool currently reads the contents of :</p>
  <p> * EMV cards, including NFC ones  * Navigo public transport cards (partially supports MOBIB as well)  * The French health card &quot;Vitale 2&quot;  * Electronic/Biometric passports in BAC security mode</p>
  <p>It can also read the following cards with limited interpretation of data:  * Some Mifare cards (such as the Thalys card)  * Moneo, the French electronic purse  * GSM SIM cards</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - cardpeek
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - smartcard
