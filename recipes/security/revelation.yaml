id: "revelation"
name: Revelation
description: Organize and secure your passwords
longDescription: |
  <p>Revelation is a password manager for the GNOME 3 desktop. It organizes accounts in a tree structure, and stores them as AES-encrypted XML.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - revelation
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
