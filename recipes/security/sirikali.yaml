id: "sirikali"
name: SiriKali
description: Manage user encrypted directories
longDescription: |
  <p>Sirikali provides a Qt/C++ GUI front end to cryfs,gocryptfs,securefs and encfs, allowing the user to create, mount, and unmount encrypted volumes.</p>
  <p>It works well together with cloud services like Dropbox, iCloud, OneDrive and others.</p>
  
categoryId: security
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - sirikali
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
