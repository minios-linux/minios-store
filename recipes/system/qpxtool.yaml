id: qpxtool
name: QPxTool
description: CD/DVD media quality checker
longDescription: |
  <p>QPxTool gives you access to all available Quality Checks (Q-Checks) on written and blank media, that are available for your drive. This will help you to find the right media and the optimized writing speed for your hardware, which will increase the chance for a long data lifetime.</p>
  <p>QPxTool depends on the used drive, not all drives are able to read the Q-Checks and not all of them are supported by QPxTool. Currently, most newer drives of LiteOn, NEC, Pioneer and Plextor are supported.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - qpxtool
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - cd/dvd
  - quality
  - test
iconSources:
  - cached: qpxtool_qpxtool.png
    width: 64
    height: 64
enabled: true
order: 99
