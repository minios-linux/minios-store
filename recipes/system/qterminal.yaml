id: "qterminal"
name: QTerminal
description: A lightweight multiplatform terminal emulator.
longDescription: |
  <p>QTerminal is a lightweight multiplatform terminal emulator.</p>
  <p>Its main features are:</p>
  <ul>
    <li>Multiple tabs</li>
    <li>Layout terminals side-by-side</li>
    <li>Dropdown mode</li>
    <li>Text search</li>
    <li>Configurable uster interface</li>
    <li>Integration of system clipboard</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - qterminal
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
