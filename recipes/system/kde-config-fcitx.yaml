id: kde-config-fcitx
name: Keyboard layout viewer
description: View keyboard layout
longDescription: |
  <p>This is a configuration module for System Settings for configuring the Free Chinese Input Toy of X.</p>
  <p>It is designed to have similar functionalities to fcitx-config-gtk, with better KDE integration.</p>
  
categoryId: system
icon: Wrench
method: apt
