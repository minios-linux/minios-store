id: "nvidia-settings"
name: NVIDIA X Server Settings
description: Configure NVIDIA X Server Settings
longDescription: |
  <p>The nvidia-settings utility is a tool for configuring the NVIDIA Linux graphics driver.  It operates by communicating with the NVIDIA X driver, querying and updating state as appropriate.  This communication is done with the NV-CONTROL X extension.</p>
  <p>Values such as brightness and gamma, XVideo attributes, temperature, and OpenGL settings can be queried and configured via nvidia-settings.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - nvidia-settings
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: nvidia-settings_nvidia-settings.png
    width: 64
    height: 64
enabled: true
order: 99
