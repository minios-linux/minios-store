id: "gwaei"
name: gWaei
description: Enter a Japanese or English word to easily get translations
longDescription: |
  <p>gWaei is an easy to use and yet powerful full-featured dictionary program for Japanese to English translation. It organizes results by relevance, supports regex searches, tabs, spell checking, kanji handwriting recognition and an accompanying console version for searches through the terminal.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gwaei
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
