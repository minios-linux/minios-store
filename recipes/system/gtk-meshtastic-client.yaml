id: gtk-meshtastic-client
name: Meshtastic Client
description: Graphically control meshtastic devices
longDescription: |
  <p>This is a GUI client to control a meshtastic device over Serial, Bluetooth,
   or TCP/IP. It runs on top of the meshtastic Python API</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gtk-meshtastic-client
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gtk
