id: "passes-gtk"
name: Passes
description: Import and use your digital passes
longDescription: |
  <p>Passes is a tool that allows you to import and use your digital passes, such as boarding passes, coupons, loyalty cards, event tickets, etc.</p>
  <p>Current features:</p>
  <ul>
    <li>Adaptive user interface.</li>
    <li>Import espass and pkpass files.</li>
    <li>Display Aztec, CODE128, PDF417 and QR codes.</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - passes-gtk
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
