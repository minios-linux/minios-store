id: "synapse"
name: Synapse
description: Search everything you do.
longDescription: |
  <p>Synapse is a graphical launcher enabling you to start applications and also to quickly find and access relevant documents and files (by making use of the Zeitgeist engine).</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - synapse
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
