id: pterm
name: PuTTY Terminal Emulator
description: Start a PuTTY terminal session
longDescription: |
  <p>This is an X terminal emulator based on the popular Windows SSH client, PuTTY. It supports xterm escape sequences, plus some Linux console sequences for colour palette configuration and some DECterm sequences for title bar control, and with an appropriate font it supports the UTF-8 encoding of Unicode. It also has some nifty features like rectangular selection and NetHack keypad mode.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - pterm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - terminal
  - session
