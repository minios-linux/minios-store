id: kdiskmark
name: KDiskMark
description: A disk drive benchmark tool
longDescription: |
  <p>This is an HDD and SSD benchmark tool with a very friendly graphical user interface. KDiskMark with its presets and powerful GUI calls Flexible I/O Tester and handles the output to provide an easy to view and interpret comprehensive benchmark result.</p>
  
