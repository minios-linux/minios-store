id: "tilp2"
name: TILP2
description: Texas Instruments handheld(s) to computer communication program
longDescription: |
  <p>TILP2 is a communication program between Texas Instruments 
  			handhelds and computers. It is able to use any supported type
  			of link cable (Gray/Black/Silver/Direct Link) with any TI
  			graphing calculator.</p>
  <p>With TiLP, you can transfer files from your PC to your Texas
  			Instruments graphing calculator, and vice-versa. You can also
  			make a screen dump, send/receive data, backup/restore contents,
  			install FLASH applications, or upgrade the OS.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - tilp2
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
