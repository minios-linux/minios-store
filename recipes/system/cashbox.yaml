description: Memorise cost and calculate price of articles
longDescription: |
  <p>
        Cashbox memorises the cost of articles and calculates the total price and
        change. It is intended for small clubs on a celebration, where members
        are not experienced in memorizing prices and doing mental arithmetic.
      </p>
  
