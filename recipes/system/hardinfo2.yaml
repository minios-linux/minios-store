id: hardinfo2
name: Hardinfo2
description: System Information and Benchmark
longDescription: |
  <p>Hardinfo2 offers System Information and Benchmark for Linux Systems. It is able to obtain information from both hardware and basic software. It can benchmark your system and compare to other machines online.</p>
  <p>You can find info like: cpu speed, gpu and graphics speed, benchmarks of internal network speed, Linux hw drivers and modules loaded. sysinfo like which development tools are installed, memory dmi and spd information, distro / os informations, hwinfo about your components like pcie and usb.</p>
  <p>And it is all Free and Open Source Software (FOSS) so we can change and add to the program together. See below links for source code, that we all keep safe and secure together.</p>
  
categoryId: system
icon: Cpu
method: apt
level: "auto"
compression: zstd
packages:
  - hardinfo2
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - linux
  - kernel
  - system
  - hardware
  - cpu
  - processor
  - capabilities
  - frequency
  - memory
  - ram
