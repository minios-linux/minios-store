id: gadmin-openvpn-client
name: GADMIN-OPENVPN-Client
description: OpenVPN Client administration
longDescription: |
  <p>gadmin-openvpn-client is a GTK+-based administration tool for the OpenVPN client. It allows one to manage multiple configuration profiles, easily (de)activate connections and view client-related logs.</p>
  
