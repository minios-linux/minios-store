id: "kgpg"
name: KGpg
description: Encryption Tool
longDescription: |
  <p>KGpg is a simple interface for GnuPG, a powerful encryption utility.
        It can help you set up and manage your keys, import and export keys, view key signatures, trust status and expiry
  dates.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kgpg
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
