id: budgie-window-shuffler
name: Budgie Shuffler Control
description: Graphical and keyboard friendly window arranger
longDescription: |
  <p>
        This is an application created primarily for the budgie-desktop to provide flexible methods to move and arrange
  application windows though a graphical control or a series of keyboard shortcuts. The application itself can be used on most X11 based desktops.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - budgie-window-shuffler
distributions:
  include:
    - name: jammy
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - tiling
  - window
