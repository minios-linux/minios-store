id: "plasma-welcome"
name: Welcome Center
description: Friendly onboarding wizard for Plasma
longDescription: |
  <p>Welcome Center is the perfect introduction to KDE Plasma! It can help you learn how to connect to the internet, install apps, customize the system, and more!</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - plasma-welcome
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
tags:
  - welcome
  - wizard
  - onboarding
  - contribute
  - get involved
