id: gnome-books
name: Books
description: An e-book manager application for GNOME
longDescription: |
  <p>A simple application to access and organize your e-books on
        GNOME. It is meant to be a simple and elegant replacement for using a
        file manager to deal with e-books.</p>
  <p>It lets you:</p>
  <ul>
    <li>View recent e-books</li>
    <li>Search through e-books</li>
    <li>View e-books (PDF and comics) fullscreen</li>
    <li>Print e-books</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-books
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - books
  - comics
  - epub
  - pdf
