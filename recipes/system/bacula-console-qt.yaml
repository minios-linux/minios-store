id: bacula-console-qt
name: Bacula Administration Tool
description: Bacula Director Console
longDescription: |
  <p>Bacula is a set of programs to manage backup, recovery, and verification of data across a network of computers of different kinds.</p>
  <p>The management console allows the administrator or user to communicate with the Bacula Director.</p>
  <p>This package provides the most advanced GUI to Bacula: the Bacula Administration Tool (BAT) console.</p>
  <p>This GUI interface has been designed to ease restore operations as much as possible as compared to the basic text console.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - bacula-console-qt
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - bacula
  - client
  - adminstration
iconSources:
