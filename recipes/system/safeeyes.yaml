id: "safeeyes"
name: Safe Eyes
description: Protect your eyes from eye strain
longDescription: |
  <p>Safe Eyes is a simple tool to remind you to take periodic breaks for your eyes. This is essential for anyone spending more time on the computer to avoid eye strain and other physical problems.</p>
  <p>Features:  - Short breaks with eye exercises  - Long breaks to change physical position and to warm up  - Strict break for those who are addicted to computer  - Do not disturb when working with full-screen applications  - Notifications before every break  - Optional audible alert at the end of break  - Option to lock screen after long breaks  - Smart pause and resume based on system idle time  - Multi-monitor support  - Plugins to utilize Safe Eyes  - Elegant and customizable design</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - safeeyes
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
