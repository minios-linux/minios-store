id: "gnome-software"
name: GNOME Software
description: Application manager for GNOME
longDescription: |
  <p>Software allows you to find and install new applications and system
        extensions and remove existing installed applications.</p>
  <p>GNOME Software showcases featured and popular applications with useful
        descriptions and multiple screenshots per application.
        Applications can be found either through browsing the list of categories
        or by searching.
        It also allows you to update your system using an offline update.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-software
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - updates
  - upgrade
  - sources
  - repositories
  - preferences
  - install
  - uninstall
  - program
  - software
  - app
