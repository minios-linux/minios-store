id: "muon"
name: Muon Package Manager
description: "Search, install and remove software packages"
longDescription: |
  <p>Manage applications and libraries installed on your system to the package level. Search, install and remove packages and inspect their versions and their dependences.</p>
  <p>Note: this does not include applications distributed through Snap or Flatpack. You may prefer Plasma-Discover, if what you are looking for is a Software Center.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - muon
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
screenshotSources:
  - url: org/kde/muon/51dbaf75e1f4d7c3c3198d5d164560dd/screenshots/image-1_orig.png
    thumbnailUrl: org/kde/muon/51dbaf75e1f4d7c3c3198d5d164560dd/screenshots/image-1_624x351.png
    width: 1600
    height: 900
iconSources:
  - url: org/kde/muon/51dbaf75e1f4d7c3c3198d5d164560dd/icons/128x128/muon_muon.png
    width: 128
    height: 128
homepage: "https://www.kde.org"
enabled: true
order: 99
