id: "solaar"
name: Solaar
description: Manage Logitech Unifying peripherals
longDescription: |
  <p>Solaar is a Linux device manager for Logitech&apos;s Unifying
      Receiver peripherals. It is able to pair/unpair devices to the
      receiver, and for most devices read battery status.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - solaar
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - logitech
  - unifying
  - receiver
  - mouse
  - keyboard
