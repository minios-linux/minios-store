id: spectral
name: Spectral
description: IM client for the Matrix protocol
longDescription: |
  <p>
        Spectral is a glossy, cross-platform client for Matrix, the decentralized communication protocol for instant messaging.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - spectral
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
