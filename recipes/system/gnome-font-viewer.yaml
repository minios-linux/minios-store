id: "gnome-font-viewer"
name: GNOME Fonts
description: View fonts on your system
longDescription: |
  <p>GNOME Fonts shows you the fonts installed on your computer for your use as
        thumbnails.
        Selecting any thumbnails shows the full view of how the font would look under
        various sizes.</p>
  <p>GNOME Fonts also supports installing new font files downloaded in the .ttf
        and other formats.
        Fonts may be installed only for your use or made available to all users on the computer.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-font-viewer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
