id: satellite-gtk
name: Satellite
description: Display data from navigation satellites
longDescription: |
  <p>Satellite is an adaptive GTK / libhandy application which displays global navigation satellite system (GNSS: GPS et al.) data obtained from ModemManager API.</p>
  <p>It can also be used to record gpx tracks.</p>
  
categoryId: system
icon: Code
method: apt
level: "auto"
compression: zstd
packages:
  - satellite-gtk
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
