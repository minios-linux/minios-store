id: "baobab"
name: Disk Usage Analyzer
description: Check folder sizes and available disk space
longDescription: |
  <p>A simple application to keep your disk usage and available space under control.</p>
  <p>Disk Usage Analyzer can scan specific folders, storage devices and online accounts.
        It provides both a tree and a graphical representation showing the size of each folder,
        making it easy to identify where disk space is wasted.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - baobab
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - storage
  - space
  - cleanup
