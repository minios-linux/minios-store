id: aqemu
name: AQEMU
description: Virtual machine manager
longDescription: |
  <p>aqemu is a Qt5 graphical interface used to manage QEMU and KVM virtual machines. It has a user-friendly interface and allows one to set up the majority of QEMU and KVM options.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - aqemu
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - qt,qemu,front-end,emulator
iconSources:
  - cached: aqemu_aqemu.png
    width: 64
    height: 64
enabled: true
order: 99
