id: "cherrytree"
name: CherryTree
description: Hierarchical Note Taking
longDescription: |
  <p>
     A hierarchical note taking application, featuring rich text and syntax highlighting, storing data in a single xml or
  sqlite file.
     Cherrytree is not just about having a place to write notes and to-do items and keeping them organized, it's also a
  place you can store links, pictures, tables, even entire documents. It can be your one program for all the miscellaneous information you have and want to keep. All those little bits of information you have scattered around your hard drive can be conveniently placed into a Cherrytree document where you can easily find it.
    </p>
  <p>The Main Features:</p>
  <ul>
    <li>Rich Text supporting Images, Tables, Code Boxes, Hyperlinks and Anchors, Spell Check, Lists</li>
    <li>Syntax Highlighting supporting many programming languages</li>
    <li>Password Protection, Powerful Find and Replace utilities, TOC generator</li>
    <li>Print, Save as PDF, Export to HTML, Export to Plain Text</li>
    <li>Import from Several other Note Taking Applications</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - cherrytree
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
