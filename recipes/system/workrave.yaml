id: "workrave"
name: Workrave
description: Assists in the prevention and recovery of Repetitive Strain Injury (RSI)
longDescription: |
  <p>Workrave is a program that assists in the recovery and prevention of Repetitive Strain Injury (RSI). The program frequently alerts you to take micro-pauses, rest breaks and restricts you to your daily limit.</p>
  <p>It includes a system tray applet that works with GNOME and KDE and has network capabilities to monitor your activity even if switching back and forth between different computers is part of your job.</p>
  <p>Workrave offers many more configuration options than other similar tools.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - workrave
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
