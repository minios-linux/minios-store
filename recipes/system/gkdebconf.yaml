id: gkdebconf
name: GkDebconf
description: Helper to reconfigure packages
longDescription: |
  <p>This is a program that helps one using the &quot;dpkg-reconfigure&quot; tool. It is basically a graphical frontend. It makes life easier showing a simple menu of packages which can be reconfigured with Debconf and the Debconf frontends that can be used for the reconfiguration.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gkdebconf
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - debconf
  - reconfiguration
iconSources:
  - cached: gkdebconf_gkdebconf-icon.png
    width: 64
    height: 64
enabled: true
order: 99
