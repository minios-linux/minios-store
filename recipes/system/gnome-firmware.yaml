id: "gnome-firmware"
name: Firmware
description: Install firmware on devices
longDescription: |
  <p>
        Update, reinstall and downgrade firmware on devices supported by fwupd.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-firmware
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - firmware
screenshotSources:
