id: far2l-wx
name: far2l
description: Linux port of FAR v2
longDescription: |
  <p>
        This is a clone of FAR manager for Windows, similar, but more powerful than Norton Commander/Midnight Commander.
      </p>
  <p>
        Plug-ins that are currently working:
      </p>
  <ul>
    <li>align</li>
    <li>autowrap</li>
    <li>calc</li>
    <li>colorer</li>
    <li>compare</li>
    <li>drawline</li>
    <li>editcase</li>
    <li>editorcomp</li>
    <li>filecase</li>
    <li>incsrch</li>
    <li>inside</li>
    <li>multiarc</li>
    <li>NetRocks (SFTP/SCP/FTP/FTPS/SMB/NFS/WebDAV)</li>
    <li>python</li>
    <li>SimpleIndent</li>
    <li>tmppanel</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - far2l-wx
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
