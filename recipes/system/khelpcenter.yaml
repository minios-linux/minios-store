id: "khelpcenter"
name: KHelpCenter
description: Help Center
longDescription: |
  <p>Documentation viewer</p>
  <p>Features:</p>
  <ul>
    <li>Show documentation from various sources (applications from KDE community, man pages, etc)</li>
    <li>Search through the available documentation</li>
  </ul>
  
categoryId: system
icon: Wrench
