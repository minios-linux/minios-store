id: "far2l"
name: far2l (Terminal)
description: File and archive manager
longDescription: |
  <p>This is a clone of FAR manager for Windows, similar, but more powerful than Norton Commander/Midnight Commander.</p>
  <p>Plug-ins that are currently working:  - NetRocks (SFTP/SCP/FTP/FTPS/SMB/NFS/WebDAV)  - colorer  - multiarc  - tmppanel  - align  - autowrap  - drawline  - editcase  - SimpleIndent</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - far2l
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: f/fa/far2l-tty.desktop/a4e6a4cd4ac52afc018bfec994b992d4/icons/128x128/far2l_far2l.png
    width: 128
    height: 128
enabled: true
order: 99
