id: faumachine
name: FAUmachine
description: run the virtual machine FAUmachine
longDescription: |
  <p>FAUmachine is a virtual machine that can simulate PC hardware like QEMU. Its main focus is to simulate the real hardware as close as possible.</p>
  <p>FAUmachine comes with the ability to inject faults to different hardware simulators, e.g. to inject intermittent or transient faults to the simulated disk or the simulated memory.</p>
  <p>FAUmachine also comes with an experiment controller, with which automated tests, like installing an operating system from an iso image, can be run.</p>
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - faumachine
distributions:
  include:
    - name: buster
      architectures: [amd64]
