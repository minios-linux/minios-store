id: "clipit"
name: ClipIt
description: Clipboard Manager
longDescription: |
  <p>Clipboard manager with features such as:  * Save history of your last copied items  * Search through the history  * Global hotkeys for most used functions  * Execute actions with clipboard items  * Exclude specific items from history</p>
  <p>ClipIt was forked from Parcellite and adds many bugfixes and features to the project. For a full list of changes see either the ChangeLog in the package or http://clipit.rspwn.com/changelog/</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - clipit
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
