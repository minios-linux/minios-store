id: appstream
name: AppStream CLI
description: An utility to work with AppStream metadata
longDescription: |
  <p>AppStream is a cross-distribution specification to provide metadata about software components.</p>
  <p>This tool allows for reading, writing, validating and transformation of AppStream XML or YAML metadata.
        It also gives access to the system metadata pool, for example to query for software that provides a
        specific MIME-type, and installing it by its software component identifier.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - appstream
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
homepage: "https://www.freedesktop.org/wiki/Distributions/AppStream/"
enabled: true
order: 99
