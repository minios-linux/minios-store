id: gourmand
name: Gourmand
description: "Organize recipes, create shopping lists, calculate nutritional information, and more."
longDescription: |
  <p>Gourmand is a recipe-organizer that allows you to collect, search, organize, and browse your recipes. Gourmand can also generate shopping lists and calculate nutritional information.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gourmand
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
