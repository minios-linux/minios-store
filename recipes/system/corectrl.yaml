id: "corectrl"
name: CoreCtrl
description: A friendly hardware control
longDescription: |
  <p>CoreCtrl is a Free and Open Source GNU/Linux application that allows you
         to control with ease your computer hardware using application profiles.
         It aims to be flexible, comfortable and accessible to regular users.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - corectrl
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - core
  - control
  - system
  - hardware
