id: "gnome-maps"
name: GNOME Maps
description: Find places around the world
longDescription: |
  <p>Maps gives you quick access to maps all across the world. It allows you
        to quickly find the place you’re looking for by searching for a city or
        street, or locate a place to meet a friend.</p>
  <p>Maps uses the collaborative OpenStreetMap database, made by hundreds of
        thousands of people across the globe.</p>
  <p>You can even search for specific types of locations, such as “Pubs near
        Main Street, Boston” or “Hotels near Alexanderplatz, Berlin”.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-maps
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - maps
