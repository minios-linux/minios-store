id: "xca"
name: XCA
description: A graphical user interface for handling and issuing X.509 compliant Certificates
longDescription: |
  <p>XCA creates and manages Certificate authorities and helps the user to create and manage keys, certificates, certificate sign requests, certificate revocation lists etc.</p>
  <p>All data is saved in an encrypted, portable database, and can be exported in various standard formats. XCA is also available for MacOS X and Windows systems.</p>
  <p>For a good workflow, certificate templates can be defined to make the creation of new certificates an easy task.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xca
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
