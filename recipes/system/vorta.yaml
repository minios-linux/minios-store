id: "vorta"
name: Vorta
description: Backup client
longDescription: |
  <p>
        Vorta is a backup client for macOS and Linux desktops.
        It integrates the mighty BorgBackup with your desktop environment
        to protect your data from disk failure, ransomware and theft.
      </p>
  <p>
        Why is this great?
      </p>
  <ul>
    <li>Encrypted, deduplicated and compressed backups using Borg as backend.</li>
    <li>No vendor lock-in – back up to local drives, your own server or BorgBase, a hosting service for Borg backups.</li>
    <li>Open source – free to use, modify, improve and audit.</li>
    <li>Flexible profiles to group source folders, backup destinations and schedules.</li>
    <li>One place to view all point-in-time archives and restore individual files.</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - vorta
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - borg
