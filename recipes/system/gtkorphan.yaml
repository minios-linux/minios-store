id: gtkorphan
name: Remove orphaned packages
description: A graphical tool to find and remove orphaned libraries
longDescription: |
  <p>GtkOrphan is a graphical tool which scans your Debian system, looking for orphaned libraries. It implements a GUI front-end to deborphan, but adds the package removal capability. A detailed documentation on the program can be found at: http://www.marzocca.net/linux/gtkorphan.html.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gtkorphan
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: gtkorphan_gtkorphan.png
    width: 64
    height: 64
enabled: true
order: 99
