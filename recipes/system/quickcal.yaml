id: quickcal
name: Quickcal
description: Fast and Easy to use Calculator with support for Filing
longDescription: |
  <p>Quickcal accepts quick pasting of a large set of numbers, separated with 
        newlines or spaces or tabs and performs arithmetic / statistical calculations
        based on the button or keyboard shortcut pressed.</p>
  <p>As in other calculators, basic math can be performed too, with the +,-,*,/,%,^
        operators, in between numbers. Setting the scale allows for more decimals to
        be displayed. Also, about 65 statistical calculations can be performed by
        choosing an option from the more stats list box.</p>
  <p>Filing and viewing support for history and tallying purpose, at the end of the
        day, helpful for shopkeepers and others too.</p>
  <p>Features:</p>
  <ul>
    <li>Accepts Pasting of a Large Set of Numbers for Calculations</li>
    <li>Keyboard Shortcuts for Buttons accelerate it further</li>
    <li>No Need for typing Plus Signs for Summing Operations</li>
    <li>Filing and Tallying possible at the End of Day or Shift</li>
  </ul>
  
