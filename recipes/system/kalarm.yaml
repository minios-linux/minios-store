id: "kalarm"
name: KAlarm
description: Personal Alarm Scheduler
longDescription: |
  <p>KAlarm is a personal alarm message, command and email scheduler</p>
  <p>Features:</p>
  <ul>
    <li>Display alarms using your own text message, the text generated by a command, or a text or image file.</li>
    <li>Audible alarm using a sound file</li>
    <li>Recurring alarm on an hours/minutes, daily, weekly, monthly or annual basis, or set it to trigger every time you
  log in.</li>
    <li>Display alarms color and font customization</li>
    <li>Support for multiple alarm calendars, which for example enables you to share alarms between a laptop and desktop
  computer.</li> </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kalarm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
