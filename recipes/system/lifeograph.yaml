id: "lifeograph"
name: Lifeograph
description: Keep a private journal of your life
longDescription: |
  <p>Lifeograph is an off-line and private journal and note taking application for one&apos;s self evaluation of his/her own life.</p>
  
categoryId: system
icon: Image
method: apt
level: "auto"
compression: zstd
packages:
  - lifeograph
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - journal
  - note
  - to-do
  - tag
  - statistics
