id: "gnome-usage"
name: GNOME Usage
description: A nice way to view information about use of system resources
longDescription: |
  <p>A simple GNOME 3 application to monitor and analyze system resources such
          as processing, memory, and storage.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-usage
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - monitor
  - system
  - process
  - cpu
  - memory
  - network
  - history
  - usage
  - performance
  - task
