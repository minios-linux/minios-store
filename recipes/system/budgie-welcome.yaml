id: "budgie-welcome"
name: Budgie Themes
description: "Give the desktop a makeover with new themes, icons and fonts"
longDescription: |
  <p>A welcome screen for Ubuntu Budgie that provides links to helpful resources and utilities. For new user accounts and a live-session the welcome application displays information about Ubuntu, budgie-desktop together with presenting options to tailor the look and feel of the user&apos;s desktop.</p>
  <p>This installs a helper script for the user to install the SNAP version of budgie-welcome to complete the installation of Ubuntu 18.04</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - budgie-welcome
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - desktop
  - preferences
iconSources:
  - url: b/bu/budgie-applets.desktop/9F43E1D4300F773A28D31343884511E7/icons/128x128/budgie-welcome_distributor-logo-ubuntu-budgie.png
    width: 128
    height: 128
enabled: true
order: 99
