id: debian-reference-common
name: Debian Reference
description: Debian Reference Guide
longDescription: |
  <p>This Debian Reference is intended to provide a broad overview of the Debian system as a post-installation user&apos;s guide. It covers many aspects of system administration through shell-command examples for non-developers.</p>
  <p>This provides menu functionality and other common files.</p>
  
