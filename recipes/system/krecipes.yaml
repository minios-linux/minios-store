id: krecipes
name: Krecipes
description: The KDE Cooking Book
longDescription: |
  <p>Krecipes is a KDE application designed to manage recipes. It can help you to do your shopping list, search through your recipes to find what you can do with available ingredients and a diet helper. It can also import or export recipes from files in various format (eg RecipeML or Meal-Master) or from databases.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
