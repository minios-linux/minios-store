id: xfce4-settings
name: Accessibility
description: Improve keyboard and mouse accessibility
longDescription: |
  <p>xfce4-settings is the Xfce settings manager front-end. It comes with several different components for configuring application-independent settings inside xfconf. It contains multiple tools:  - xfce4-settings-manager (which replaces the old mcs settings manager),    which executes the various (provided) settings dialogs  - xfce4-settings-editor, a tool for editing ALL settings within xfconf, the    graphical counterpart of xfconf-query.  - xfsettingsd, a daemon for exporting XSettings to applications, and    providing special features like keyboard shortcuts, AccessX notification    and update of keyboard and mouse-pointer data.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xfce4-settings
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
iconSources:
  - url: x/xf/xfce4-accessibility-settings.desktop/29946836444E208801F0ED73B6B5D02B/icons/128x128/xfce4-settings_preferences-desktop-accessibility.png
    width: 128
    height: 128
enabled: true
order: 99
