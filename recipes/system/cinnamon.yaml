longDescription: |
  <p>Cinnamon is a desktop environment which provides advanced innovative features and a traditional user experience.</p>
  <p>The desktop layout is similar to GNOME 2.  The underlying technology is forked from gnome-shell.  The emphasis is put on making users feel at home and providing them with an easy to use and comfortable desktop experience.</p>
  
