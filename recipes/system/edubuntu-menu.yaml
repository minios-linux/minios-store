id: edubuntu-menu
name: Edubuntu Menu Administration
description: Hide or Show Icons for Non-Admin Users
longDescription: |
  <p>Application Folders for Edubuntu. This breaks up Edubuntu&apos;s GNOME application overview into organized folders based on education subject for ease of learning in a classroom setting. Contains utilities for resetting to defaults and hiding icons from non-admin users.</p>
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - edubuntu-menu
distributions:
  include:
    - name: noble
      architectures: [amd64]
tags:
  - edubuntu
  - application
  - overview
  - grid
  - icons
