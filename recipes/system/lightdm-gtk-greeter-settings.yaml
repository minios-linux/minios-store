id: "lightdm-gtk-greeter-settings"
name: LightDM GTK+ Greeter settings
description: Configure LightDM GTK+ Greeter
longDescription: |
  <p>A simple configuration utility for the LightDM GTK+ Greeter. All configuration options available in the greeter are exposed and easily manipulated using this tool.</p>
  
