id: ntfs-config
name: NTFS Configuration Tool
description: Enable/disable write support for NTFS with a simple click.
longDescription: |
  <p>This program allow you to easily configure all of your NTFS devices to allow write support via a friendly gui. For that use, it will configure them to use the open source ntfs-3g driver. You&apos;ll also be able to easily disable this feature.</p>
  <p>It just so happens that this program is a newer and improved version, but very few people know about it. It&apos;s better to install the disk-manager.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - ntfs-config
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: ntfs-config_ntfs-config.png
    width: 128
    height: 128
enabled: true
order: 99
