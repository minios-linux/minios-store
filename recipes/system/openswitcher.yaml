id: "openswitcher"
name: Switcher control
description: Control application for Blackmagic Design ATEM video switchers
longDescription: |
  <p>
        Switcher is a re-implementation of the Switcher Control application
        from Blackmagic Design for controlling the ATEM video mixers/switchers
        like the popular Atem Mini.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - openswitcher
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - atem
  - blackmagic design
  - bmd
  - openswitcher
  - openatem
