id: "gnome-clocks"
name: GNOME Clocks
description: "Clocks for world times, plus alarms, stopwatch and a timer"
longDescription: |
  <p>A simple and elegant clock application.
        It includes world clocks, alarms, a stopwatch and a timer.</p>
  <p>Goals:</p>
  <ul>
    <li>Show the time in different cities around the world</li>
    <li>Set alarms to wake you up</li>
    <li>Measure elapsed time with an accurate stopwatch</li>
    <li>Set timers to properly cook your food</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-clocks
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - time
  - timer
  - alarm
  - world clock
  - stopwatch
  - time zone
