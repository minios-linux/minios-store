id: "gucharmap"
name: Character Map
description: Insert special characters into documents
longDescription: |
  <p>GNOME Character Map is a Unicode character map program, part of GNOME desktop. This program allows characters to be displayed by unicode block or script type. It includes brief descriptions of related characters and occasionally meanings of the character in question.</p>
  <p>Gucharmap can also be used to input or enter characters (by copy and paste). The search functionality allows the use of several search methods, including by unicode name or code point of the character.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gucharmap
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
