id: nautilus-scripts-manager
name: Nautilus scripts manager
description: Enable or disable Nautilus scripts
longDescription: |
  <p>nautilus-scripts-manager is a small and easy to use application which allows any user to activate, deactivate or just see Nautilus scripts installed in the system.</p>
  <p>Nautilus scripts are just ordinary scripts which, once activated, can be ran directly from the right-click menu in the popular GNOME files manager.</p>
  <p>This program can be used through its intuitive graphical interface or with a set of command line options. In particular, it can transparently replace the command line utility nautilus-script-manager (notice the missing &quot;s&quot;).</p>
  <p>Once installed, it will appear among the user settings utilities (usually in the &quot;Preferences&quot; menu).</p>
  
categoryId: system
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - nautilus-scripts-manager
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - nautilus
  - file manager
  - script
