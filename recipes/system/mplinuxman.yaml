id: mplinuxman
name: Mplinuxman
description: Manage your MPMan portable mp3 player
longDescription: |
  <p>Mplinuxman is a file manager program for the Mpman F60/F50 USB portable MP3 player, for Linux. It lets you send/receive files to your MP3 player using a graphical user interface (Gtk2) and features playlists, ID3 tags on the player and more.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - mplinuxman
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: mplinuxman_mplinuxman.png
    width: 64
    height: 64
enabled: true
order: 99
