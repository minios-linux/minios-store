id: "gnome-system-monitor"
name: GNOME System Monitor
description: View and manage system resources
longDescription: |
  <p>System Monitor is a process viewer and system monitor with
        an attractive, easy-to-use interface.</p>
  <p>System Monitor can help you find out what applications are using the processor
        or the memory of your computer, can manage the running applications, force
        stop processes not responding, and change the state or priority of existing 
        processes.</p>
  <p>The resource graphs feature shows you a quick overview of what is going on with your
        computer displaying recent network, memory and processor usage.</p>
  
categoryId: system
icon: Gauge
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-system-monitor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - monitor
  - system
  - process
  - cpu
  - memory
  - network
  - history
  - usage
