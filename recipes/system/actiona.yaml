id: actiona
name: Actiona
description: Automate tasks
longDescription: |
  <p>Actiona is an application that allows you to execute many actions on your computer such as emulating mouse clicks, key presses, showing message boxes, editing text files, etc. Tasks can be created using a simple editor or using the EcmaScript (JavaScript) programming language for more customization. Actiona is cross-platform.</p>
  
categoryId: system
icon: Wrench
