id: "gsmartcontrol"
name: GSmartControl
description: Hard Disk and SSD Health Inspection
longDescription: |
  <p>GSmartControl is a graphical user interface for smartctl, which is a tool for
  			querying and controlling SMART (Self-Monitoring, Analysis, and Reporting
  			Technology) data in hard disk and solid-state drives. It allows you to inspect
  			the drive&apos;s SMART data to determine its health, as well as run various tests
  			on it.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gsmartcontrol
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
