id: "network-manager-gnome"
name: NetworkManager
description: NetworkManager connection editor
longDescription: |
  <p>NetworkManager is a system service for managing and configuring your network connections and devices.</p>
  <p>The nm-connection-editor program works with NetworkManager to create and edit existing connection profiles for NetworkManager.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - network-manager-gnome
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
