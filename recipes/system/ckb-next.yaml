id: "ckb-next"
name: ckb-next
description: Corsair keyboard driver user interface
longDescription: |
  <p>ckb-next is an open-source driver for Corsair keyboards and mice. It aims to bring the features of Corsair&apos;s proprietary CUE software to the Linux and Mac operating systems.</p>
  
