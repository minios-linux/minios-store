id: eviacam
name: Enable Viacam
description: Webcam based mouse that moves the pointer as you move your head.
longDescription: |
  <p>Enable Viacam (aka eViacam) is a mouse replacement program that moves the pointer tracking the user&apos;s head movements. It works on a standard computer equipped with a &quot;webcam&quot;. No additional hardware is required. Based on the award winning Facial Mouse.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - eviacam
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - accessibility
  - head mouse
  - a11y
  - webcam
  - facial mouse
  - mouse
