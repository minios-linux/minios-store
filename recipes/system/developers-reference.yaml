id: developers-reference
name: Developers Reference
description: guidelines and information for Debian developers
longDescription: |
  <p>This package contains the Debian Developer&apos;s Reference, a set of guidelines and best practices which has been established by and for the community of Debian developers and maintainers. If you are not maintaining Debian packages, you probably do not need this package.</p>
  <p>Table of Contents:</p>
  <p>   * 1. Scope of This Document    * 2. Applying to Become a Member    * 3. Debian Developer&apos;s Duties    * 4. Resources for Debian Members    * 5. Managing Packages    * 6. Best Packaging Practices    * 7. Beyond Packaging    * 8. Internationalization and Translations    * 1. Overview of Debian Maintainer Tools</p>
  <p>This package contains the English version of the Developer&apos;s Reference.  The French, German, Italy, Russian and Japanese translations are available in developers-reference-fr, developers-reference-de, developers-reference-it, developers-reference-ru and developers-reference-ja.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - developers-reference
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - developer
  - maintainer
  - packager
  - debian
  - package
  - documentation
  - manual
  - help
  - guide
iconSources:
  - cached: developers-reference_developers-reference.png
    width: 64
    height: 64
enabled: true
order: 99
