id: air-quality-sensor
name: Air Quality Sensor
description: user space driver for AppliedSensor's Indoor Air Monitor
longDescription: |
  <p>air-quality-sensor is a commandline utility to read sensor data
        from usb keys using AppliedSensor&apos;s Indoor Air Monitor to give you
        an indication about the air quality around the sensor.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - air-quality-sensor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
homepage: "https://github.com/bwildenhain/air-quality-sensor"
enabled: true
order: 99
