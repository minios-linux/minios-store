id: "kfind"
name: KFind
description: Find Files/Folders
longDescription: |
  <p>KFind can be used as a standalone search tool, launched by KRunner or from your menu. It is also integrated into Konqueror
        as &quot;Find File&quot; in the &quot;Tools&quot; menu. It allows you to find files by name, type or content.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kfind
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
