id: "nitrogen"
name: Nitrogen
description: Background browser and setter for X windows
longDescription: |
  <p>Nitrogen is a program that allows you to set the desktop background. Its
        browser mode allows you to choose and apply a desktop background, and the
        recall mode lets you apply the saved configuration from the command line.</p>
  <p>It features Multihead and Xinerama awareness, inotify monitoring of browse
        directory, lazy loading of thumbnails to conserve memory, and an
        &apos;automatic&apos; set mode which determines the best mode to set an image based
        on its size.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - nitrogen
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
