id: granule
name: Granule
description: Flashcards Program
longDescription: |
  <p>Granule is a flashcard program that implements Leitner cardfile methodology for learning new words. It features both short-term and long-term memory training capabilities with scheduling.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
