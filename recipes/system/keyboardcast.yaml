id: keyboardcast
name: Keyboardcast
description: Send keys to multiple windows simultaneously
longDescription: |
  <p>With keyboardcast you can send keystrokes to any number of windows you select simultaneously. It also offers an option to start gnome-terminal processes (for instance to login to remote hosts)</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - keyboardcast
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
