id: nvtop
name: nvtop
description: "GPU process monitor for AMD, Intel and NVIDIA"
longDescription: |
  <p>Nvtop stands for Neat Videocard TOP, a (h)top like task monitor for AMD, Intel and NVIDIA GPUs. It can handle multiple GPUs and print information about them in a htop familiar way.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - nvtop
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
