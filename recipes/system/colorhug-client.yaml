id: "colorhug-client"
name: ColorHug Backlight Utility
description: Sample the ambient light level to control the backlight
longDescription: |
  <p>The ColorHug backlight utility uses the ColorHug device to alter the backlight level to compensate for the changing ambient light level.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - colorhug-client
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - display
  - backlight
  - ambient
  - colorhug
