id: kmenuedit
name: Menu Edit
description: Edit how applications are presented in app launchers
longDescription: |
  <p>KDE Menu Edit lets you edit how your apps are presented in application launchers, such as Plasma's Application Launcher widget.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
