  - kmenuedit
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: kmenuedit_kmenuedit.png
    width: 64
    height: 64
homepage: "https://kde.org/plasma-desktop"
enabled: true
order: 99
