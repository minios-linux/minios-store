id: resapplet
name: Resolution Switcher
description: Change your screen resolution
longDescription: |
  <p>It uses XRANDR on-the-fly as well as GNOME Resolution Preferences. Handy for laptops when using data projectors which only run at 1024x768.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - resapplet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: resapplet_resapplet.png
    width: 128
    height: 128
enabled: true
order: 99
