id: xfce4-panel-profiles
name: Xfce Panel Profiles
description: Application to manage different panel layouts in Xfce
longDescription: |
  <p>
        Multitude of panel layouts can be created using Xfce panel.
        This tool enables managing different layouts with little effort.
        Xfce4-panel-profiles makes it possible to backup, restore, import and export panel layouts.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xfce4-panel-profiles
distributions:
  include:
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - configuration
  - user
screenshotSources:
