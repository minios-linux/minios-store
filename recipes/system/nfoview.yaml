id: "nfoview"
name: NFO Viewer
description: Viewer for NFO files
longDescription: |
  <p>NFO Viewer is a simple viewer for NFO files, which are &quot;ASCII&quot;
      art in the CP437 codepage. The advantages of using NFO Viewer
      instead of a text editor are preset font and encoding settings,
      automatic window size and clickable hyperlinks.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - nfoview
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
