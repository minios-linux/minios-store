id: dhcpcd-qt
name: Network Configurator
description: Configure and monitor your network connections
longDescription: |
  <p>dhcpcd-qt sits in the notification area and notifies you of changes to your IPv4 network configuration from dhcpcd and wpa_supplicant.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - dhcpcd-qt
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
