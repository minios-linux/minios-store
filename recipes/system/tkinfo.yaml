id: "tkinfo"
name: TKInfo
description: Info File Broswer
longDescription: |
  <p>TKInfo is a very fast lightweight viewer for GNU info files, requiring no configuration. It is particularly effective for local browsing of large and/or interconnected sets of info files.</p>
  <p>TkInfo can be used stand alone, or embedded within an application to provide integrated, on-line help.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - tkinfo
distributions:
