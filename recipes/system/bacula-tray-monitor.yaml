id: "bacula-tray-monitor"
name: Bacula Monitor
description: Notification Tray Monitor
longDescription: |
  <p>Bacula is a set of programs to manage backup, recovery and verification of data across a network of computers of different kinds.</p>
  <p>This package provides a graphical tray monitor for the Bacula backup system.</p>
  <p>The tray monitor allows the monitoring of the bacula daemons.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - bacula-tray-monitor
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - bacula
  - client
  - adminstration
iconSources:
  - url: b/ba/bacula-tray-monitor.desktop/de860ed1daac8c9ef8a4309a41dd2bed/icons/128x128/bacula-tray-monitor_bacula-tray-monitor.png
    width: 128
    height: 128
enabled: true
order: 99
