id: "chocolate-doom"
name: Chocolate Setup
description: Setup tool for Chocolate
longDescription: |
  <p>Chocolate Doom aims to accurately reproduce the original DOS version of Doom and other games based on the Doom engine in a form that can be run on modern computers. Unlike most modern Doom engines, Chocolate Doom is not derived from the Boom source port and does not inherit its features (or bugs).</p>
  <p>This package contains:  * Chocolate Doom, a port of Id Software&apos;s &quot;Doom&quot; (1993)  * Chocolate Heretic, a port of Raven Software&apos;s &quot;Heretic&quot; (1994)  * Chocolate Hexen, a port of Raven Software&apos;s &quot;Hexen&quot; (1995)  * Chocolate Strife, a recreation of Rogue Entertainment&apos;s &quot;Strife&quot; (1996)</p>
  <p>These games are designed to behave as similar to the original DOS version as is possible.</p>
  <p>Chocolate Doom supports all flavors of Doom, including The Ultimate Doom, Doom 2 and Final Doom as well as Chex(R) Quest, HACX and FreeDM.</p>
  <p>All Chocolate game engines require game data to play. For Chocolate Doom, free game data is available in the freedm package. Commercial game data for all four engines can be packaged using &quot;game-data-packager&quot;.</p>
  
categoryId: system
