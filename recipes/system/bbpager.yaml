id: bbpager
name: bbpager
description: Pager for the blackbox and fluxbox window managers
longDescription: |
  <p>
        A pager tool for the Blackbox window manager or one of its derivatives. It supports the usual Blackbox styles, moving
  windows between desktops, and optional placement in the Blackbox sl&gt;
      </p>
  
