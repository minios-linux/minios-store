id: "convertall"
name: ConvertAll
description: Convert between various units
longDescription: |
  <p>With ConvertAll, you can convert any unit in the large database to any other compatible unit. If you want to convert from inches per decade, that&apos;s fine. Or from meter-pounds. Or from cubic nautical miles. The units don&apos;t have to make sense to anyone else.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - convertall
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
