id: "yakuake"
name: Yakuake
description: Drop-down Terminal
longDescription: |
  <p>Yakuake is a drop-down terminal emulator based on KDE Konsole technology.</p>
  <p>Features:</p>
  <ul>
    <li>Smoothly rolls down from the top of your screen</li>
    <li>Tabbed interface</li>
    <li>Configurable dimensions and animation speed</li>
    <li>Skinnable</li>
    <li>Sophisticated D-Bus interface</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - yakuake
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
