id: calamares-settings-debian
name: Install Debian
description: Calamares — Installer for Debian Live
longDescription: |
  <p>Calamares is a generic installer framework for Linux distributions. By default, it contains a set of boilerplate wording and images. This package provides the latest Debian artwork as well as scripts that supports EFI installations.</p>
  <p>It also serves as an example for how derivatives can create their own calamares-settings packages.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - calamares-settings-debian
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - calamares
  - system
  - install
  - debian
  - installer
iconSources:
  - cached: calamares-settings-debian_install-debian.png
    width: 64
    height: 64
enabled: true
order: 99
