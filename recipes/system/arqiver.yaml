id: arqiver
name: Arqiver
description: A Qt front-end for libarchive
longDescription: |
  <p>Arqiver can extract, create and edit archives that are supported by its back-ends. It can open archives by drag-and-drop. With 7z, it also supports password protection.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - arqiver
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
