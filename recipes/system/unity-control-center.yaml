id: unity-control-center
name: Details
description: System Information
longDescription: |
  <p>This package contains configuration applets for the GNOME desktop, allowing to set accessibility configuration, desktop fonts, keyboard and mouse properties, sound setup, desktop theme and background, user interface properties, screen resolution, and other GNOME parameters.</p>
  <p>It also contains a front end to these applets, which can also be accessed with the GNOME panel or the Nautilus file manager.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - unity-control-center
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - device
  - system
  - information
  - memory
  - processor
  - version
  - default
  - application
  - preferred
  - cd
iconSources:
