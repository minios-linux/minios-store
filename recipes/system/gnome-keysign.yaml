id: "gnome-keysign"
name: Keysign
description: OpenPGP Keysigning helper
longDescription: |
  <p>GNOME-Keysign allows signing OpenPGP keys comfortably and securely
        via the local network or Bluetooth.</p>
  <p>It can scan another key&apos;s barcode and transfer the key securely,
        allowing for casual two-party key signing sessions.
        It follows best practises by sending the encrypted signatures
        to the UIDs of a key using the Email client the user configured
        to use.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-keysign
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - python
  - gpg
  - gnupg
  - key
  - openpgp
