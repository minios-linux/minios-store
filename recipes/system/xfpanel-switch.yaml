id: xfpanel-switch
name: Xfpanel Switch
description: Application to manage different panel layouts in Xfce
longDescription: |
  <p>Multitude of panel layouts can be created using Xfce panel. This tool enables managing different layouts with little effort. Xfpanel-switch makes it possible to backup, restore, import and export panel layouts.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xfpanel-switch
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
tags:
  - configuration
  - user
