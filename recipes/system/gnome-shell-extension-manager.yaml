id: "gnome-shell-extension-manager"
name: Extension Manager
description: "Browse, install, and manage GNOME Shell Extensions."
longDescription: |
  <p>A utility for browsing and installing GNOME Shell Extensions.</p>
  <p>Features:</p>
  <ul>
    <li>Browse extensions.gnome.org right inside the app</li>
    <li>Manage the extensions you already have installed</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-shell-extension-manager
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - extensions
  - shell
