id: "ark"
name: Ark
description: Archiving Tool
longDescription: |
  <p>Ark is a graphical file compression/decompression utility with support for multiple formats,
        including tar, gzip, bzip2, rar and zip, as well as CD-ROM images.
        Ark can be used to browse, extract, create, and modify archives.</p>
  <p>Features:</p>
  <ul>
    <li>Several formats supported: gzip, bzip2, zip, rar, 7z and more</li>
    <li>Preview file contents without extracting files</li>
  </ul>
  
categoryId: system
icon: Camera
method: apt
level: "auto"
compression: zstd
packages:
  - ark
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
