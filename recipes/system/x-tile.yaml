id: x-tile
name: x-tile
description: Tile selected windows in different ways
longDescription: |
  <p>
        X-tile is an application that allows you to select a number of windows and tile them in different ways. Works on
  any X desktop.
      </p>
  <p>
        Main features include:  <em> Several tiling geometries  </em> Undo tiling  <em> Invert tiling order  </em> Optional
  system tray docking and menu  <em> Filter to exclude windows  </em> Filter to include windows by default  * Command line interface
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - x-tile
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - tile,tiling,sort,organize,windows
