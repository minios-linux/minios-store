id: "kde-spectacle"
name: Spectacle
description: Screenshot Capture Utility
longDescription: |
  <p>Spectacle is a simple application for capturing desktop screenshots. It can capture images of the entire desktop, a single monitor, the currently active window, the window currently under the mouse, or a rectangular region of the screen. The images can then be printed, sent to other applications for manipulation, or quickly be saved as-is.</p>
  <p>Features:</p>
  <ul>
    <li>Capture Entire Desktop</li>
    <li>Capture Current Monitor</li>
    <li>Capture Active Window</li>
    <li>Capture Rectangular Region</li>
    <li>Keyboard shortcuts for taking screenshots</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kde-spectacle
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
