id: "gnome-recipes"
name: Recipes
description: GNOME loves to cook
longDescription: |
  <p>Recipes is an easy-to-use application that will help you to discover what to cook
         today, tomorrow, the rest of the week and for your special occasions.</p>
  <p>Recipes comes with a collection of recipes that have been collected by GNOME contributors
         from all over the world. It also lets you store your own recipes and share them with your
         friends.</p>
  <p>The major features of Recipes include:</p>
  <ul>
    <li>Add and edit your own recipes</li>
    <li>Share recipes with your friends</li>
    <li>Export and print shopping lists</li>
    <li>Adjust quantities based on the number of servings</li>
    <li>Mark recipes to cook later or add them to your favorites</li>
    <li>Add notes to recipes</li>
    <li>Hands-free cooking instruction mode</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-recipes
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
