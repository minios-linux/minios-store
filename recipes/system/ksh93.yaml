id: ksh93
name: AT&T Korn Shell (ksh93)
description: Korn Shell
longDescription: |
  <p>Ksh is a UNIX command interpreter (shell) that is intended for both interactive and shell script use. Its command language is a superset of the sh(1) shell language.</p>
  <p>The 1993 version adds a number of new, mostly scripting related, features over the 1988 version that is typically distributed with commercial UNIX variants. For example, it has lexical scoping, compound variables, associative arrays, named references and floating point math.</p>
  <p>The shcomp tool can be used to compile ksh scripts into a binary format.</p>
categoryId: system
icon: Terminal
method: apt
level: "auto"
compression: zstd
packages:
  - ksh93
distributions:
