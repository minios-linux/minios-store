id: "xzoom"
name: Screen Magnifier
description: "Magnify part of display, with real-time updates."
longDescription: |
  <p>Like xmag, xzoom magnifies a section of the X display. Xzoom is different because it will continuously update the magnified area as the display changes. It is fast enough to enlarge small animations, for example.</p>
  <p>It can also mirror or rotate a part of the screen.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xzoom
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
