id: "owncloud-client"
name: ownCloud desktop sync client
description: ownCloud desktop synchronization client
longDescription: |
  <p>The ownCloudSync system lets you always have your latest files wherever you are. Just specify one or more folders on the local machine to and a server to synchronize to. You can configure more computers to synchronize to the same server and any change to the files on one computer will silently and reliably flow across to every other.</p>
  <p>owncloud-client provides the graphical client specialising in synchronizing with cloud storage provided by ownCloud.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - owncloud-client
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - owncloud
  - syncing
  - file
  - sharing
iconSources:
  - url: o/ow/owncloud.desktop/17477c8126435ea946dddfaa85218ee7/icons/128x128/owncloud-client_owncloud.png
    width: 128
    height: 128
enabled: true
order: 99
