id: twclock
name: twclock
description: World Clock and CW ID for Ham Radio Operators
longDescription: |
  <p>It also has an ID timer to generate a CW ID via your soundcard and pulseaudio.  Connect the output of your soundcard to the audio-in pin of your rig&apos;s accessory jack to have it transmitted.</p>
  <p>This program is a clock designed for ham radio operators, anyone who needs the time of day someplace else in the world, or anyone tired of the same old look of their clock.  It can display the current time and date in hundreds of cities around the world.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - twclock
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - clock
  - alarm
  - ham
  - radio
