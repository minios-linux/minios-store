id: "gnome-color-manager"
name: GNOME Color Manager
description: Inspect and compare installed color profiles
longDescription: |
  <p>GNOME Color Profile Viewer shows installed color profiles on your system
        and allows you to calibrate displays, printers and cameras using a
        wizard.</p>
  <p>This functionality is typically used by GNOME Control Center from the color
        panel although can be used on its own.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-color-manager
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - color
  - icc
