id: "psensor"
name: Psensor
description: Psensor is a graphical temperature monitor for Linux
longDescription: |
  <p>Psensor is a GTK+ application for monitoring hardware sensors, including temperatures and fan speeds.</p>
  <p>It displays a curve for each sensor, alerts user using Desktop Notification and Application Indicator when a temperature is too high.</p>
  <p>It can monitor:  * the temperature of the motherboard and CPU sensors (using lm-sensors).  * the temperature of the NVidia GPUs (using XNVCtrl).  * the temperature of the Hard Disk Drives (using hddtemp or atasmart lib).  * the rotation speed of the fans (using lm-sensors).  * the sensors of a remote computer (using psensor-server).</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - psensor
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - temperature
  - fan
  - monitoring
  - indicator
