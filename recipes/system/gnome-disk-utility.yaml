id: "gnome-disk-utility"
name: GNOME Disks
description: Disk management utility for GNOME
longDescription: |
  <p>Disks provides an easy way to inspect, format, partition, and configure disks
        and block devices.</p>
  <p>Using Disks, you can view SMART data, manage devices, benchmark physical
        disks, and image USB sticks.</p>
  
categoryId: system
icon: HardDrive
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-disk-utility
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - disk
  - drive
  - volume
  - harddisk
  - hdd
  - disc
  - cdrom
  - dvd
  - partition
  - iso
