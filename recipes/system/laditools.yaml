id: laditools
name: LADI Log File Viewer
description: View or monitor LADI log files
longDescription: |
  <p>LADI Tools is a set of tools aiming to achieve the goals of the LADI project to improve desktop integration and user workflow of Linux audio system based on JACK and ladish. Those tools take advantage of the D-Bus interfaces recently added to JACK and ladish to ease the configuration and use of those two great programs.</p>
  <p>The following tools are included:  * g15ladi             - a JACK monitor for g15 keyboards  * ladi-control-center - graphical configuration tool to setup JACK&apos;s                          configuration  * ladi-player         - convenient VLC-style application to control                          JACK and manage studios  * ladi-system-log     - JACK, ladish and a2jmidid log viewer  * ladi-system-tray    - system indicator that allows users to start,                          stop and monitor JACK, as well as start some                          JACK related applications</p>
  <p>This package includes basic set of tools to control and monitor the LADI system, that is JACK and ladish in a D-Bus environment.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - laditools
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
tags:
  - audio
  - jack
  - log viewer
  - ladish
  - a2jmidid
