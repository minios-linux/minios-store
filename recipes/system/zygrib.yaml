id: zygrib
name: zyGrib GRIB file viewer
description: Meterological file viewer
longDescription: |
  <p>This application, written with the Qt toolkit, enables:  * Visualisation of meteo data from files in GRIB Format 1  * Automatic GRIB data download  * Automatic Download from IAC (fleetcode) Data</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - zygrib
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: zygrib_zygrib.png
    width: 128
    height: 128
enabled: true
order: 99
