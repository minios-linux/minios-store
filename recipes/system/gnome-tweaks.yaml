id: "gnome-tweaks"
name: GNOME Tweaks
description: Tweak advanced GNOME 3 settings
longDescription: |
  <p>GNOME Tweaks allows adjusting advanced GNOME options.</p>
  <p>It can install and manage themes and extensions, change power settings,
      manage startup applications, and enable desktop icons among other settings.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-tweaks
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - settings
  - advanced
  - preferences
  - extensions
  - fonts
  - theme
  - xkb
  - keyboard
  - typing
