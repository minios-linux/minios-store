id: "kupfer"
name: Kupfer
description: Convenient command and access tool for applications and documents
longDescription: |
  <p>Kupfer is a summoner/launcher in the style of Quicksilver or GNOME Do. It can search and browse your files, launch desired applications and object you need in a quicker way.</p>
  <p>Kupfer is written in Python 3 and has a flexible architecture based on plugins to extend its features.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kupfer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - launcher
  - access
