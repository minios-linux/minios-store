id: "gpaste-2"
name: GPaste
description: Manage your clipboard history
longDescription: |
  <p>
        GPaste is a clipboard managing system allowing you to track and manage your clipboard history in a highly customizable
  way.
      </p>
  <p>
        GPaste provides you with a graphical tool allowing you to manage everything easily.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gpaste-2
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - clipboard
  - manager
  - settings
  - preferences
  - configuration
