id: mate-user-guide
name: Help
description: Get help with MATE
longDescription: |
  <p>The MATE Desktop Environment is the continuation of GNOME 2. It provides an intuitive and attractive desktop environment using traditional metaphors for Linux and other Unix-like operating systems.</p>
  <p>This package contains the user guide for MATE Desktop Environment and its main applications.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - mate-user-guide
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
tags:
  - documentation
  - information
  - manual
