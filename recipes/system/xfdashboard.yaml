id: "xfdashboard"
name: xfdashboard
description: Maybe a Gnome shell like dashboard for Xfce
longDescription: |
  <p>Xfdashboard provides a GNOME shell dashboard like interface for use with Xfce desktop.</p>
  <p>It can be configured to run to any keyboard shortcut and when executed provides an overview of applications currently open enabling the user to switch between different applications. The search feature works like Xfce&apos;s app finder which makes it convenient to search for and start applications.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xfdashboard
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - window management
  - application management
  - organize
  - search tool
  - search
