id: rxvt-unicode
name: Rxvt Color Unicode Terminal
description: Use the command line
longDescription: |
  <p>rxvt-unicode is a modern, Unicode-aware color xterm replacement that uses significantly less memory than a conventional xterm and many other Unicode supporting terminal emulators.</p>
  <p>It supports using multiple fonts at the same time, including Xft fonts, and client-server technology to reduce memory consumption when using multiple windows.</p>
  <p>This package is configured with 256-color support, and TERM set to &quot;rxvt-unicode-256color&quot;. Any other systems you log into must have this terminfo entry installed!</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - rxvt-unicode
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - run
iconSources:
