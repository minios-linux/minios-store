id: gworldclock
name: gworldclock
description: See the time in other timezones
longDescription: |
  <p>This program displays the time and date of specified time zones using a GTK+ interface. It also provides a &quot;rendezvous&quot; function allowing the zones to be synchronised to a time other than the current time. This can help you organise meetings across different timezones.</p>
  <p>The time zones may be entered by hand in TZ format or chosen from a list prepared from /usr/share/zoneinfo/zone.tab.  The zone list is kept in a format consistent with the shell script tzwatch.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gworldclock
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
