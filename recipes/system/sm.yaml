id: sm
name: Screen-Message
description: Displays a short text fullscreen
longDescription: |
  <p>Screen Message will display a given multi-line message as large as possible, fullscreen and black on white. You can specify the text either when launching sm, or edit it while the program is running.</p>
  <p>It is useful to send messages across a room, e.g. during an university lecture. For fast startup, it is recommended to bind it to a key in your Desktop Environment.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - sm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
iconSources:
  - cached: sm_sm.png
    width: 48
    height: 48
enabled: true
order: 99
