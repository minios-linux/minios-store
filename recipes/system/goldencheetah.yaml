id: goldencheetah
name: GoldenCheetah
description: Cycling Power Analysis Software.
longDescription: |
  <p>GoldenCheetah is a software package that:  * Provides a rich set of analysis tools, including a critical power graph,   BikeScore calculation, histogram analysis, a best interval finder, and   a pedal force versus pedal velocity chart, to name just a few.  * Downloads ride data directly from supported devices.  * Imports ride data downloaded with other programs, including   TrainingPeaks WKO+ and the manufacturers&apos; software for the Ergomo,   Garmin, Polar, PowerTap, and SRM devices.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - goldencheetah
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
