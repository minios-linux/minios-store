id: scap-workbench
name: SCAP Workbench
description: A GUI tool that serves as an SCAP scanner and provides tailoring functionality for SCAP content
longDescription: |
  <p>The main goal of this application is to lower the initial barrier of using SCAP.
              Therefore, the scope of very narrow - SCAP Workbench only scans a single machine and only with XCCDF/SDS (no
  direct OVAL evaluation).
              The assumption is that this is enough for users who want to scan a few machines and users with huge amount
  of machines to scan will just use scap-workbench to test or hand-tune their content before deploying it with more advanced (and harder to use) tools like spacewalk.</p> <p>Feature highlights:</p>
  <ul>
    <li>XCCDF 1.1 and 1.2 support</li>
    <li>Source Data Stream 1.2 support</li>
    <li>XCCDF 1.2 Tailoring file support</li>
    <li>Evaluation of local machine</li>
    <li>Evaluation of remote machine (using ssh)</li>
    <li>Limited tailoring support - selection and unselection</li>
    <li>Saving results as XCCDF 1.1 or 1.2 (depending on input) or ARF 1.1</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - scap-workbench
distributions:
