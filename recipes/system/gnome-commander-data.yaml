id: gnome-commander-data
name: Gnome Commander
description: Two-pane file manager
longDescription: |
  <p>GNOME Commander is a &quot;two-pane&quot; graphical file manager for the GNOME desktop environment. It features separate tabs for each pane, setting up custom device buttons, bookmark manager, fully integrated commandline, file quick search, an internal image viewer, a powerful batch renaming tool, and FTP and Samba access.</p>
  <p>GNOME Commander aims to advanced users who like to focus on precise file management, working in parallel through special applications, and running smart commands.</p>
  
