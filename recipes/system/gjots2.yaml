id: "gjots2"
name: Gjots2 Jotter
description: Store and organise your random notes
longDescription: |
  <p>gjots2 is a fairly simple jotter (outline processor) and notetaking application for your desktop.</p>
  <p>You can use gjots2 to organize your jottings into a tree structure, adding thoughts and miscellany as you go. You can get it to spit out HTML, XML, postscript, pdf, man, etc if you want (see the online manual for an example of the HTML conversion).</p>
  <p>Some people use it for notes, personal bits and pieces, recipes, DocBook XML documents and even PINs and passwords (encrypted with ccrypt(1), openssl(1) or gpg(1)).</p>
  <p>It&apos;s a bit like the KDE program kjots but it uses the GTK-2 library.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gjots2
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - notes
  - hierarchy
iconSources:
  - cached: gjots2_gjots2.png
    width: 64
    height: 64
enabled: true
order: 99
