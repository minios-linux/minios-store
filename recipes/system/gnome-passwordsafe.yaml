id: gnome-passwordsafe
name: Password Safe
description: Manage your passwords
longDescription: |
  <p>Password Safe is a password manager which makes use of the KeePass v.4 format. It integrates perfectly with the GNOME desktop and provides an easy and uncluttered interface for the management of password databases.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-passwordsafe
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
tags:
  - keepass
  - encrypt
  - secure
