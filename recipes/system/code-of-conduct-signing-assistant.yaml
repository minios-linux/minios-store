id: code-of-conduct-signing-assistant
name: Code of Conduct Signing Assistant
description: Sign the Code of Conduct easily.
longDescription: |
  <p>Code of Conduct Signing Assistant is an open source program that helps you sign the Ubuntu Code of Conduct easily!</p>
  <p>No more worries about PGP keys or decrypting mail: just follow the steps the Code of Conduct Signing Assistant guides you through and in the end you have signed the Ubuntu Code of Conduct!</p>
  
