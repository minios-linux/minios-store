    thumbnailUrl: org/kde/kdialog/d26366e0fe382e4ad5f74ba1ba978eb1/screenshots/image-1_224x138@1.png
    width: 334
    height: 207
iconSources:
  - url: org/kde/kdialog/d26366e0fe382e4ad5f74ba1ba978eb1/icons/128x128/kdialog_dialog-question.png
    width: 128
    height: 128
