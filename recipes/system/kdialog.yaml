id: "kdialog"
name: KDialog
description: Display dialog boxes from shell scripts
longDescription: |
  <p>
        kdialog allows you to display dialog boxes from shell scripts.
        The syntax is very much inspired from the "dialog" command
        (which shows text mode dialogs).
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kdialog
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
