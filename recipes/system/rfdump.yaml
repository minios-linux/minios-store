id: rfdump
name: RFDump
description: Tool to directly interoperate with an RFID reader
longDescription: |
  <p>RFDump is a tool to decode RFID tags and show their meta information: tag ID, tag type, manufacturer etc. The user data memory of a tag can be displayed and modified using either a hex or an ASCII editor. In addition, the integrated cookie feature demonstrates how easy it is for a company to abuse RFID technology to spy on their customers. RFDump works with the ACG multi-tag reader or similar card reader hardware.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - rfdump
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
