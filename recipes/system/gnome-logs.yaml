id: "gnome-logs"
name: GNOME Logs
description: View detailed event logs for the system
longDescription: |
  <p>Logs shows events from the systemd journal, and sorts them into
         categories, such as hardware and applications.</p>
  <p>Using Logs you can search your logs by typing a search term, and
         view detailed information about each event by clicking on it.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-logs
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - log
  - journal
  - debug
  - error
screenshotSources:
  - url: org/gnome/Logs/bcdaf1b6873fd9d47ff0b27dd500e230/screenshots/image-1_orig.png
    thumbnailUrl: org/gnome/Logs/bcdaf1b6873fd9d47ff0b27dd500e230/screenshots/image-1_624x444@1.png
    width: 944
    height: 672
iconSources:
  - url: org/gnome/Logs/bcdaf1b6873fd9d47ff0b27dd500e230/icons/128x128/gnome-logs_org.gnome.Logs.png
    width: 128
    height: 128
developer: The GNOME Project
homepage: "https://wiki.gnome.org/Apps/Logs"
enabled: true
order: 99
