id: flatseal
name: Flatseal
description: Manage Flatpak permissions
longDescription: |
  <p>
        Flatseal is a graphical utility to review and modify permissions from your Flatpak applications.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - flatseal
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - seal
  - sandbox
  - override
