id: protontricks
name: Protontricks
description: A simple wrapper that does winetricks things for Proton enabled games
longDescription: |
  <p>This is a wrapper script that allows you to easily run Winetricks commands for Steam Play/Proton games among other common Wine features,
         such as launching external Windows executables. This is often useful when a game requires closed-source runtime
  libraries or applications
         that are not included with Proton.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - protontricks
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
tags:
  - steam
  - proton
  - wine
  - winetricks
