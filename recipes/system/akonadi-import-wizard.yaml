id: "akonadi-import-wizard"
name: KMail Import Wizard
description: Launch the import wizard to migrate data from mailer as thunderbird/evolution etc.
longDescription: |
  <p>akonadi-import-wizard is an assistant to import PIM data from other applications into Akonadi for use in KDE PIM applications</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - akonadi-import-wizard
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: org/kde/akonadiimportwizard/b67820d36d2945887763588f394d9d7b/icons/128x128/akonadi-import-wizard_kontact-import-wizard.png
    width: 128
    height: 128
enabled: true
order: 99
