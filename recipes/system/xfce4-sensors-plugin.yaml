id: "xfce4-sensors-plugin"
name: Sensor Viewer
description: Show sensor values.
longDescription: |
  <p>The sensors plugin provides a handy way to monitor your hard disk, processor, fans, and other critical hardware right on your Xfce panel.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xfce4-sensors-plugin
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: x/xf/xfce4-sensors.desktop/e71273a3684fd43b6031fdee3b6b1b27/icons/128x128/xfce4-sensors-plugin_xfce-sensors.png
    width: 128
    height: 128
enabled: true
order: 99
