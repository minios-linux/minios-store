id: "keyman"
name: Keyman Keyboards
description: Configure keyboards for Keyman for Linux
longDescription: |
  <p>Originally created in 1993 to type Lao on Windows, Keyman is now a free and
  open source keyboarding platform which allows anyone to write a keyboard layout
  for their language. Keyman is available for many platforms, including Windows,
  macOS, iOS, Android, Linux and the web.</p>
  <p>Keyboard layouts are defined with a clear and easy to understand keyboard
  grammar. Keyman&apos;s contextual input model means keyboard layouts can be
  intelligent and make it simple to type even the most complex languages.
  Keyboard layouts are distributed through an open catalog to all major desktop
  and mobile platforms.</p>
  <p>Install, uninstall and view information about Keyman keyboard packages.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - keyman
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
