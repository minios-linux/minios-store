id: cinnamon-control-center
name: Graphics Tablet
description: Set button mappings and adjust stylus sensitivity for graphics tablets
longDescription: |
  <p>This package contains configuration applets for the Cinnamon desktop, allowing to set the date and time, regional settings, network configuration, screen resolution, and other Cinnamon parameters.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - cinnamon-control-center
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - tablet
  - wacom
  - stylus
  - eraser
  - mouse
iconSources:
