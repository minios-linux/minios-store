id: "endeavour"
name: Endeavour
description: Manage your tasks
longDescription: |
  <p>
        Endeavour is a task management application designed for simplicity. Save and order your todos.
        Manage multiple todo lists. And more
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - endeavour
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - task
  - productivity
  - todo
