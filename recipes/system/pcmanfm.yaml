id: "pcmanfm"
name: File Manager PCManFM
description: Browse the file system and manage the files
longDescription: |
  <p>PCMan File Manager is a GTK+ based file manager, featuring:</p>
  <p> * Extremely fast and lightweight  * Can be started in one second on normal machine  * Tabbed browsing (similar to Firefox)  * Drag &amp; Drop support  * Files can be dragged among tabs  * Load large directories in reasonable time  * File association support (Default application)  * Basic thumbnail support  * Bookmarks support  * Handles non-UTF-8 encoded filenames correctly  * Provide icon view and detailed list view  * Standard compliant (Follows FreeDesktop.org)  * Clean and user-friendly interface (GTK+ 2)  * Support GVFS for auto-mount handling on removable devices</p>
  
categoryId: system
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - pcmanfm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: p/pc/pcmanfm.desktop/701c9b087d47ffe2ce85e5713f4720ce/icons/128x128/pcmanfm_system-file-manager.png
    width: 128
    height: 128
enabled: true
order: 99
