id: "doublecmd-common"
name: Double Commander
description: Double Commander is a cross platform open source file manager with two panels side by side.
longDescription: |
  <p>Double Commander is a cross platform open source file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.</p>
  <p>Support for RAR archives can be enabled by installing the libunrar-dev package from non-free.</p>
  <p>This package contains common files.</p>
  
categoryId: system
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - doublecmd-common
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - folder
  - manager
  - explore
  - disk
  - filesystem
  - orthodox
  - copy
  - queue
  - queuing
  - operations
