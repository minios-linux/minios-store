id: "gfm"
name: Group File Manager
description: Texas Instruments handheld(s) file manipulation program
longDescription: |
  <p>The GFM is an application allowing for the manipulation of
  			single/group/tigroup files from Texas Instruments handhelds.
  			It can create a new file, open an existing file, save file,
  			rename variables, remove variables, create folders, group files
  			into a group/tigroup file, and ungroup a group/tigroup file
  			into single files.</p>
  <p>The GFM is intended to be used alongside TILP II, which can send
  			and receive files from/to the handhelds.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gfm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
