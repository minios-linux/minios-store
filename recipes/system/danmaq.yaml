id: "danmaq"
name: danmaQ
description: Show danmaku on screen
longDescription: |
  <p>DanmaQ is a desktop danmaku client. It is used to display danmaku strings.</p>
  <p>&quot;danmaku&quot;, originally a Japanese word, is a certain method of instant commenting over the Internet. It originated in Japan and became popular in East Asian cultural circle. In this case, People write comments and send them to a danmaku server. The server will push comments to danmaku clients connected to it, where comments are displayed on a real-time basis. Comment strings will fly over the screen with artistic effects.</p>
  <p>This package provides a danmaku client program implemented in Qt5.</p>
  
