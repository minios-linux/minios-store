id: gpaste
name: GPaste
description: Manage your clipboard history
longDescription: |
  <p>GPaste is a clipboard managing system allowing you to track and manage your clipboard history in a highly customizable way.</p>
  <p>GPaste provides you with a graphical tool allowing you to manage everything easily.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gpaste
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - clipboard
  - manager
  - settings
  - preferences
  - configuration
