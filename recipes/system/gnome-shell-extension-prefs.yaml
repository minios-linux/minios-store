id: "gnome-shell-extension-prefs"
name: Extensions
description: Manage your GNOME Extensions
longDescription: |
  <p>
        GNOME Extensions handles updating extensions, configuring extension preferences and removing or disabling unwanted
  extensions.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-shell-extension-prefs
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
