id: grsync
name: Grsync
description: Synchronize files and folders (a GTK GUI for rsync)
longDescription: |
  <p>grsync is a simple graphical interface using GTK2 for the rsync command line program. It currently supports only a limited set of the most important rsync features, but can be used effectively for local directory synchronization.</p>
  
categoryId: system
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - grsync
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: grsync_grsync.png
    width: 64
    height: 64
enabled: true
order: 99
