id: xwaylandvideobridge
name: Xwayland Video Bridge
description: Offer XDG Desktop Portals screencast streams to X11 apps
longDescription: |
  <p>Many X11 apps will be using X11 mechanisms to share the contents of other applications and displays. In recent years we have created XDG Desktop Portals as the mechanism to provide this functionality and it's what we expect apps to be using. This application will provide the streams available to the XDG Desktop Portals to your legacy X11 apps that have not adopted the new system.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - xwaylandvideobridge
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: org/kde/xwaylandvideobridge.desktop/51b5bf3cc5880c4cf791bb3852553293/icons/128x128/xwaylandvideobridge_xwaylandvideobridge.png
    width: 128
    height: 128
homepage: "https://invent.kde.org/system/xwaylandvideobridge"
enabled: true
order: 99
