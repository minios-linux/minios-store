id: "apper"
name: Apper
description: KDE application and package management tool
longDescription: |
  <p>Apper is a graphical management tool for packages and applications
        provided by a Linux distribution.</p>
  <p>It allows installing new software as well as keeping the system up to
        date by installing updates.</p>
  <p>Features:</p>
  <ul>
    <li>Distribution-agnostic management of software packages</li>
    <li>Application management for users unexperienced with packages</li>
    <li>Editor for software sources and PackageKit settings</li>
    <li>System software updates notifier and installer</li>
    <li>Close integration with the KDE Plasma desktop</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - apper
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
