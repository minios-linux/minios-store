id: gnome-todo
name: To Do
description: Task manager for GNOME
longDescription: |
  <p>GNOME To Do is a task management application designed to integrate with GNOME. It
        is extensible through plugins and supports custom task providers.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-todo
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - task
  - productivity
  - todo
