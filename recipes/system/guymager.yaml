id: guymager
name: Guymager
description: Fast forensic imager
longDescription: |
  <p>The forensic imager contained in this package, guymager, was designed to support different image file formats, to be most user-friendly and to run really fast. It has a high speed multi-threaded engine using parallel compression for best performance on multi-processor and hyper-threading machines.</p>
  
