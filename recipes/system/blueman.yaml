      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - url: b/bl/blueman-manager.desktop/cc7d31802f9bdcb479b45d43dc47c0af/icons/128x128/blueman_blueman.png
