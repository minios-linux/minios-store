id: alltray
name: AllTray
description: Dock any application to the notification area/system tray.
longDescription: |
  <p>With AllTray you can dock any application with no native tray icon (like Evolution, Thunderbird, Terminals) into the system tray. A high-light feature is that a click on the &quot;close&quot; button will minimize back to system tray. It works well with GNOME, KDE, Xfce 4*, Fluxbox* and WindowMaker*. (*) No drag &apos;n drop support. Enable with &quot;-nm&quot; option.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - alltray
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
iconSources:
  - cached: alltray_alltray.png
    width: 128
    height: 128
enabled: true
order: 99
