id: "gnome-multi-writer"
name: MultiWriter
description: Write an ISO file to multiple USB devices at once
longDescription: |
  <p>GNOME MultiWriter can be used to write an ISO file to multiple USB devices
        at once.
        Supported drive sizes are between 1GB and 32GB.</p>
  <p>MultiWriter may be useful for QA testing, to create a GNOME Live image
        for a code sprint or to create hundreds of LiveUSB drives for a trade
        show.</p>
  <p>Writing a more than 10 devices simultaneously can easy saturate the USB
        bus for most storage devices.
        There are two ways to write more devices in parallel:</p>
  <ul>
    <li>Use USB 3.0 hubs, even if the storage devices are USB 2.0</li>
    <li>Install another USB 2.0 PCIe root hub</li>
  </ul>
  <p>MultiWriter was originally written as part of the ColorHug project but
        was split off as an independent application in 2015.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-multi-writer
