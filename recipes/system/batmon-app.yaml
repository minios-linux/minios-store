id: batmon-app
name: Battery Monitor (batmon)
description: Monitor battery status
longDescription: |
  <p>Battery Monitor is a battery monitor for laptops. It displays the current status of the battery (charge/discharge and energy level) as well as some information about the general health of the cell.</p>
  
