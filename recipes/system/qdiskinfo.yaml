id: qdiskinfo
name: QDiskInfo
description: SMART data viewer
longDescription: |
  <p>QDiskInfo is a frontend for smartctl. It provides a user experience similar to CrystalDiskInfo. It shows the SMART (Self-Monitoring, Analysis, and Reporting Technology) data of modern hard disk drives.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - qdiskinfo
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - system
  - process
  - task
