id: jovie
name: Jovie
description: KDE Text To Speech Daemon
longDescription: |
  <p>Jovie KDE Text-to-Speech is a subsystem within the KDE desktop for conversion of text to audible speech.
        Jovie is currently under development and aims to become the standard subsystem for all KDE applications
        to provide speech output.</p>
  <p>User Features:</p>
  <ul>
    <li>Speak any text from the KDE clipboard.</li>
    <li>Speak any plain text file.</li>
    <li>Speak all or any portion of a text file from Kate,
          including instances where Kate is embedded in another KDE application.</li>
    <li>Speak all or any portion of an HTML page from Konqueror.</li>
    <li>Use as the speech backend for KMouth and KSayIt.</li>
    <li>Speak KDE notifications (KNotify).</li>
    <li>User-configurable filters for substituting misspoken words, choosing speech synthesizers,
          and transforming XHMTL/XML documents.</li>
  </ul>
  <p>Programmer Features:</p>
  <ul>
    <li>Priority system for screen reader outputs, warnings and messages, while still playing regular texts.</li>
    <li>Permit generation of speech from the command line (or via shell scripts) using the qdbus utility.</li>
    <li>Provide a lightweight and easily usable interface for applications to generate speech output.</li>
    <li>Applications need not be concerned about contention over the speech device.</li>
    <li>Asynchronous to prevent system blocking.</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - jovie
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
