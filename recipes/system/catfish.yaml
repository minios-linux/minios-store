id: "catfish"
name: Catfish
description: Versatile file searching tool
longDescription: |
  <p>Catfish is a small, fast, and powerful file search utility. Featuring a minimal interface with an emphasis on results, it helps users find the files they need without a file manager. With powerful filters such as modification date, file type, and file contents, users will no longer be dependent on the file manager or organization skills.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - catfish
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - files
  - find
  - locate
  - lookup
  - search
