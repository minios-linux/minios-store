id: "thunar"
name: File Manager
description: Configure the Thunar file manager
longDescription: |
  <p>Thunar is the file manager designed to be the default file manager for the Xfce desktop environment. It has been designed to be fast and easy to use.</p>
  <p>Also included is an Xfce panel plugin which can manage the desktop trash.</p>
  
categoryId: system
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - thunar
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
