id: gtkterm
name: Serial port terminal
description: Communicate with the serial port
longDescription: |
  <p>gtkterm is a simple GTK+ terminal used to communicate with the serial port.</p>
  <p>Its features :</p>
  <p> * Serial port terminal window  * Serial port setup (speed, parity, bits, stopbits, flow control)  * Using the termios API  * Possible to send a file (only RAW data, no protocol)  * End of line delay while sending a file  * Special character wait before next line while sending a file  * Possible to toggle control lines manually (DTR, CTS)  * Also reads the state of control lines (RTS, CD, DSR, RI)</p>
  <p> Author:   Julien Schmitt &lt;julien@jls-info.com&gt;</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gtkterm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
iconSources:
  - cached: gtkterm_gtkterm.png
    width: 64
    height: 64
enabled: true
order: 99
