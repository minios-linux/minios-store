id: "metadata-cleaner"
name: Metadata Cleaner
description: View and clean metadata in files
longDescription: |
  <p>Metadata within a file can tell a lot about you. Cameras record data about when a picture was taken and what camera was used. Office applications automatically add author and company information to documents and spreadsheets. Maybe you don't want to disclose those informations.</p>
  <p>This tool allows you to view metadata in your files and to get rid of them, as much as possible.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - metadata-cleaner
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - metadata
  - remover
  - cleaner
