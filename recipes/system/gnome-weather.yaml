id: "gnome-weather"
name: Weather
description: Show weather conditions and forecast
longDescription: |
  <p>A small application that allows you to monitor the current weather conditions for your city, or anywhere in the world.</p>
  <p>It provides access to detailed forecasts, up to 7 days, with hourly details for the current and next day, using various internet services.</p>
  <p>It also optionally integrates with the GNOME Shell, allowing you see the current conditions of the most recently searched cities by just typing its name in the Activities Overview.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-weather
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
