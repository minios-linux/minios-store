id: "gnome-power-manager"
name: GNOME Power Statistics
description: Observe power management
longDescription: |
  <p>Power Statistics can show historical and current battery information and
        programs waking up that use power.</p>
  <p>You probably only need to install this application if you are having
        problems with your laptop battery, or are trying to work out what programs
        are using significant amounts of power.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-power-manager
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - battery
  - consumption
  - charge
screenshotSources:
