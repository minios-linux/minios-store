id: "paprefs"
name: PulseAudio Preferences
description: View and modify the configuration of the local sound server
longDescription: |
  <p>PulseAudio, previously known as Polypaudio, is a sound server for POSIX and WIN32 systems. It is a drop in replacement for the ESD sound server with much better latency, mixing/re-sampling quality and overall architecture.</p>
  <p>PulseAudio Preferences (paprefs) is a simple GTK+ based configuration dialog for the PulseAudio sound server.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - paprefs
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: paprefs_preferences-desktop.png
    width: 64
    height: 64
enabled: true
order: 99
