id: mate-session-manager
name: Startup Applications
description: Choose what applications to start when you log in
longDescription: |
  <p>This package contains a session that can be started from a display manager such as MDM. It will load all necessary applications for a full-featured user session.</p>
  <p>The session manager also features the ability to save a running session and restore it later.</p>
  <p>This version is configured to start the MATE desktop, based on the MATE panel.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - mate-session-manager
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - mate
  - session
  - properties
  - applications
  - login
  - start
iconSources:
  - url: m/ma/mate-session-properties.desktop/9149F4E58C51E15AA06271E1C8630B6C/icons/128x128/mate-session-manager_mate-session-properties.png
    width: 128
    height: 128
enabled: true
order: 99
