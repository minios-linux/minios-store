id: btop
name: btop++
description: "Resource monitor that shows usage and stats for processor, memory, disks, network and processes"
longDescription: |
  <p>btop is a modern and colorful command line resource monitor that shows usage and stats for processor, memory, disks, network and processes. btop features:  - Easy to use, with a game inspired menu system.  - Full mouse support, all buttons with a highlighted key is clickable  and mouse scroll works in process list and menu boxes.  - Fast and responsive UI with UP, DOWN keys process selection.  - Function for showing detailed stats for selected process.  - Ability to filter processes.  - Easy switching between sorting options.  - Tree view of processes.  - Send any signal to selected process.  - UI menu for changing all config file options.  - Auto scaling graph for network usage.  - Shows IO activity and speeds for disks  - Battery meter  - Selectable symbols for the graphs  - Custom presets  - And more...  btop is written in C++ and is continuation of bashtop and bpytop.</p>
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - btop
distributions:
  include:
    - name: noble
      architectures: [amd64]
tags:
  - system
  - process
  - task
