id: "bijiben"
name: Bijiben
description: Quickly jot notes
longDescription: |
  <p>A quick and easy way to make freeform notes or jot down simple lists. Store as many notes as you like and share them by email.</p>
  <p>You can store your notes locally on your computer or sync with online services like ownCloud.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - bijiben
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - notes
  - reminder
  - notebook
  - sticky notes
