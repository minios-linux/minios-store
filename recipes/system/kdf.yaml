id: "kdf"
name: KDiskFree
description: Displays information about hard disks and other storage devices
longDescription: |
  <p>KDiskFree displays information about hard disks and other storage devices, including the amount of free space available. It can also mount and unmount storage devices and view them in the file manager.</p>
  <p>KwikDisk is an icon for the system tray that provides convenient access to the features of KDiskFree.</p>
  <p>This package is part of the KDE Applications utilities module.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - kdf
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
