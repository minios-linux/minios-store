id: "nuntius"
name: Nuntius
description: Deliver notifications from your phone or tablet to your computer over Bluetooth
longDescription: |
  <p>Nuntius delivers notifications from your phone or tablet to your computer over Bluetooth.</p>
  <p>To use Nuntius you will need to install a companion tool on your phone or tablet and pair it via Bluetooth.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - nuntius
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - notifications
