id: "alacritty"
name: Alacritty
description: "A fast, cross-platform, OpenGL terminal emulator"
longDescription: |
  <p>Alacritty is a modern terminal emulator that comes with sensible defaults, but allows for extensive configuration. By integrating with other applications, rather than reimplementing their functionality, it manages to provide a flexible set of features with high performance.</p>
  
categoryId: system
icon: Terminal
method: apt
level: "auto"
compression: zstd
packages:
  - alacritty
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
