id: mate-screensaver
name: Screensaver
description: Set your screensaver preferences
longDescription: |
  <p>mate-screensaver is a screen saver and locker that aims to have simple, sane and secure defaults, and be well integrated with the MATE desktop.</p>
  <p>It is designed to support, among other things:</p>
  <p> * the ability to lock down configuration settings  * translation into other languages  * user switching</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - mate-screensaver
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
tags:
  - mate
  - screensaver
  - preferences
iconSources:
  - url: m/ma/mate-screensaver-preferences.desktop/20BAF14C3A1CDD6F9987989164420EF1/icons/128x128/mate-screensaver_preferences-desktop-screensaver.png
    width: 128
    height: 128
enabled: true
order: 99
