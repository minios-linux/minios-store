id: luckybackup
name: luckyBackup (super user)
description: Backup & sync your data with the power of rsync
longDescription: |
  <p>luckyBackup is an application that backs-up and/or synchronizes any directories with the power of rsync. Its main features are: backup, safety, synchronization, exclude/only include options, allows custom rsync options, remote connections, restore and dry-run operations, scheduling, profiles and command line mode.</p>
  <p>It is simple to use, fast (transfers over only changes made and not all data), safe (keeps your data safe by checking all declared directories before proceeding in any data manipulation ), reliable and fully customizable.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - luckybackup
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - rsync
  - backup
  - restore
  - data
  - synchronization
  - safety
iconSources:
  - cached: luckybackup_luckybackup.png
    width: 64
    height: 64
enabled: true
order: 99
