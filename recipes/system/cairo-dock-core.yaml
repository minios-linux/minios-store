id: "cairo-dock-core"
name: Cairo-Dock (Fallback Mode)
description: A light and eye-candy dock and desklets for your desktop.
longDescription: |
  <p>Cairo-dock has a family-likeness with OS X dock, but with more options. It uses cairo to render nice graphics, and Glitz to use hardware acceleration. It&apos;s fully configurable and can be a taskbar too. You can easily plug applets into it.</p>
  <p>This package provides Cairo-dock-core application.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - cairo-dock-core
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: cairo-dock-core_cairo-dock.png
    width: 64
    height: 64
enabled: true
order: 99
