id: icedtea-netx
name: IcedTea Web Control Panel
description: Configure IcedTea Web (javaws)
longDescription: |
  <p>NetX provides a drop-in replacement for javaws (Java Web Start). Since upstream NetX is dead, the IcedTea Web project is hosting a fork of the original code. However, as icedtea-web has evolved to complex set of tools, extensions and tests, it has now only a few lines of code shared with the original implementation.</p>
  <p>IcedTea&apos;s NetX currently supports verification of signed jars, trusted certificate storing, system certificate store checking, and provides the services specified by the JNLP API.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - icedtea-netx
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
