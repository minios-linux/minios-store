id: lomiri-tfamanager-app
name: 2FA Manager
description: Small Two Factor Authenticator manager app for Ubuntu Touch
longDescription: |
  <p>This app is a core app for Ubuntu Touch&apos;s shell Lomiri. Ubuntu Touch is a mobile OS developed by the UBports Foundation. Lomiri is its operating environment optimized for touch based human-machine interaction, but also supports convergence (i.e. switching between tablet/phone and desktop mode).</p>
  <p>This package provides a 2FA Manager App for Lomiri.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - lomiri-tfamanager-app
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - 2fa
  - multi-factor authentication
  - two factor authenticator
  - security
  - passwords
iconSources:
  - cached: lomiri-tfamanager-app_logo.png
    width: 64
    height: 64
enabled: true
order: 99
