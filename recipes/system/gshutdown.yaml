id: gshutdown
name: GShutdown
description: An advanced shutdown utility which allows you to schedule the shutdown or the restart of your computer
longDescription: |
  <p>GShutdown is a utility which allows you to schedule the shutdown or restart of your computer. With it you can simply and quickly choose the turn off time at either a specific time or after a countdown.</p>
  <p>The graphical user interface uses Gtk+2.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gshutdown
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: gshutdown_gshutdown.png
    width: 64
    height: 64
enabled: true
order: 99
