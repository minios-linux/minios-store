id: gnome-documents
name: Documents
description: A document manager application for GNOME
longDescription: |
  <p>A simple application to access, organize and share your documents on
        GNOME. It is meant to be a simple and elegant replacement for using a
        file manager to deal with documents. Seamless cloud integration is
        offered through GNOME Online Accounts.</p>
  <p>It lets you:</p>
  <ul>
    <li>View recent local and online documents</li>
    <li>Access your Google, ownCloud or OneDrive content</li>
    <li>Search through documents</li>
    <li>See new documents shared by friends</li>
    <li>View documents fullscreen</li>
    <li>Print documents</li>
    <li>Select favorites</li>
    <li>Allow opening full featured editor for non-trivial changes</li>
  </ul>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-documents
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
