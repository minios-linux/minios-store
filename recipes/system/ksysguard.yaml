    thumbnailUrl: org/kde/ksysguard/9BECB0FF53F35ADFC14B60FE1B025664/screenshots/image-1_624x490.png
    width: 808
    height: 635
iconSources:
  - url: org/kde/ksysguard/9BECB0FF53F35ADFC14B60FE1B025664/icons/128x128/ksysguard_utilities-system-monitor.png
    width: 128
    height: 128
homepage: "https://www.kde.org/applications/system/ksysguard"
enabled: true
order: 99
