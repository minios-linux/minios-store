id: ksysguard
name: KSysGuard
description: Monitor running processes and system performance
longDescription: |
  <p>System Guard allows you to monitor information and statistics about your system.</p>
  <p>In addition to monitoring the local system, it can connect to remote systems running the System Guard Daemon.</p>
  
categoryId: system
icon: Gauge
method: apt
level: "auto"
compression: zstd
packages:
  - ksysguard
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
screenshotSources:
