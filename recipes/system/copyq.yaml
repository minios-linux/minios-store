id: "copyq"
name: CopyQ
description: Advanced clipboard manager
longDescription: |
  <p>CopyQ is advanced clipboard manager with editing and scripting features.</p>
  <p>CopyQ monitors system clipboard and saves its content in customized tabs.
              Saved clipboard can be later copied and pasted directly into any application.</p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - copyq
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - clipboard
  - clipboard-manager
  - clipboard-history
  - notes
  - copy-and-paste
