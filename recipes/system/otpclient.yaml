id: "otpclient"
name: OTPClient
description: GTK+ application for managing TOTP and HOTP tokens with built-in encryption.
longDescription: |
  <p>
        Easy to use GTK application for securely managing TOTP and HOTP tokens.
  The content is encrypted on the disk using AES256-GCM and the master password is derived using PBKDF2 with 100k iterations and SHA512 as hash algorithm.
  It's also possible to import/export backups from/to andOTP and import backups from Authenticator+.
      </p>
  
categoryId: system
icon: Wrench
method: apt
level: "auto"
compression: zstd
packages:
  - otpclient
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - otp
  - totp
  - hotp
