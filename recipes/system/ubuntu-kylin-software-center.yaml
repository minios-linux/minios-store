id: "ubuntu-kylin-software-center"
name: Ubuntu Kylin Software Center
description: Ubuntu Kylin software-center
longDescription: |
  <p>Ubuntu Kylin Software Center is a newly built software center client for Ubuntu Kylin. The aim is to improve localization experience. The applications and related data come from both Ubuntu and Ubuntu Kylin repositories.</p>
  <p>Features:  * Categorized and selected applications for users  * Newly designed user interface  * Work with Ubuntu software center and hold special packages from    Ubuntu Kylin archive</p>
  
