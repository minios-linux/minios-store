id: "qimgv"
name: qimgv
description: Qt image viewer
longDescription: |
  <p>Qimgv is an image viewer written in Qt5. It is fast, configurable and easy to use. It also provides optional video support.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - qimgv
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
