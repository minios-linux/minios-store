id: "deepin-image-viewer"
name: Deepin Image Viewer
description: Deepin Image Viewer
longDescription: |
  <p>Deepin Image Viewer is an image viewer and manager elaborately produced by Deepin Technology. It is fashion and smooth, supports multiple image formats, user can view any kind of image. The image management in Deepin Image Viewer, allows user to rank images in Timeline by date, add image to &quot;My favorites&quot; or different albums. All images can be arranged in perfect order by Deepin Image Viewer.</p>
  <p>This package is part of DDE (Deepin Desktop Environment).</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - deepin-image-viewer
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
