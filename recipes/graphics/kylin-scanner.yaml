id: kylin-scanner
name: Kylin Scanner
description: "A program to work with scanner. Can be used as a scanning, OCR, email tools."
longDescription: |
  <p>Kylin-scanner can scan according to the resolution, size and color mode of the scanning device. And it provides post-processing features for scanned images, such as clipping, rotation, one-click beautification, intelligent correction and text recognition, etc.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - kylin-scanner
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - scannerfrontend
iconSources:
