id: "simple-image-reducer"
name: Simple Image Reducer
description: Reduce and rotate images in three-four clicks.
longDescription: |
  <p>Simple Image Reducer is an GTK application to easily reduce and rotate images. It can be useful for processing digital photos before sending by email or uploading on the Web. Image files can be supplied to the application from the file manager using the context menu &quot;Open with...&quot;, or dragging files to the main window.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - simple-image-reducer
