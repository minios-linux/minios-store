id: photoprint
name: PhotoPrint
description: Color managed printing of multiple photos on single page
longDescription: |
  <p>PhotoPrint is a utility offering special features for printing digital photographs and other images.  It can print multiple images on a single page, create posters split over several pages, arrange images into a sort of carousel when printing on CDs, adding fading or decorative borders to images, etc.  It also supports use of ICC colour profiles and sending 16-bit data to the printer.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - photoprint
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: photoprint_fotoprint.png
    width: 64
    height: 64
enabled: true
order: 99
