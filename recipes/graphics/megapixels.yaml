id: "megapixels"
name: Megapixels
description: A gnome camera application for phones
longDescription: |
  <p>
  			Megapixels is a camera application designed for phones and tablets. It
  			implements the v4l2 and media-request apis so set up camera pipelines on
  			ARM hardware and uses the raw data modes of the sensors to get the best
  			quality pictures.
  		</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - megapixels
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - camera
