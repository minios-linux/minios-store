id: "gnome-photos"
name: Photos
description: "Access, organize and share your photos on GNOME"
longDescription: |
  <p>Access, organize and share your photos on GNOME. A simple and elegant
        replacement for using a file manager to deal with photos. Enhance, crop
        and edit in a snap. Seamless cloud integration is offered through GNOME
        Online Accounts.</p>
  <p>You can:</p>
  <ul>
    <li>Automatically find all your pictures</li>
    <li>View recent local and online photos</li>
    <li>Access your Facebook or Flickr pictures</li>
    <li>View photos on TVs, laptops or other DLNA renderers on your local
            network</li>
    <li>Set pictures as your desktop background</li>
    <li>Print photos</li>
    <li>Select favorites</li>
    <li>Easily edit your pictures in the app, or send to a full featured editor for more advanced changes</li>
  </ul>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-photos
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
