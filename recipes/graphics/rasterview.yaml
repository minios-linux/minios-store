id: "rasterview"
name: RasterView
description: CUPS Raster Viewer
longDescription: |
  <p>RasterView is a CUPS, PWG, and Apple raster file viewing application. It basically allows you to look at the raster data produced by any of the standard CUPS RIP filters (cgpdftoraster, imagetoraster, pdftoraster, and pstoraster) and is normally used to either test those filters or look at the data that is being sent to your raster printer driver.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - rasterview
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - viewer
  - pwg
  - raster
iconSources:
  - url: r/ra/rasterview.desktop/ce6cd18fc5cbd46dd48571844c274866/icons/128x128/rasterview_rasterview.png
    width: 128
    height: 128
enabled: true
order: 99
