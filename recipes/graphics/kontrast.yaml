    thumbnailUrl: org/kde/kontrast/90f353e54e9260b279a45ef4085f07cf/screenshots/image-1_624x525@1.png
    width: 1029
    height: 866
iconSources:
  - url: org/kde/kontrast/90f353e54e9260b279a45ef4085f07cf/icons/128x128/kontrast_org.kde.kontrast.png
    width: 128
    height: 128
developer: Carl Schwan
homepage: "https://kde.org/applications/en/kontrast"
enabled: true
