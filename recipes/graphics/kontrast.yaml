id: "kontrast"
name: Kontrast
description: A Color Contrast Checker
longDescription: |
  <p>Kontrast is a color contrast checker and tells you if your color combinations are distinct enough to be readable and accessible.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - kontrast
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
screenshotSources:
