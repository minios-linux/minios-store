id: "gromit-mpx"
name: Gromit-MPX
description: "GRaphics Over MIscellaneous Things, a multi pointer annotation tool"
longDescription: |
  <p>Gromit-MPX enables you to make annotations on your screen using multiple pointing devices at once.</p>
  <p>This is especially useful when making presentations, to highlight things or point out things of interest.</p>
  <p>Gromit-MPX is XInput-Aware, so if you have a graphic tablet you can draw lines with different strength, color, erase things, etc.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - gromit-mpx
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - presentation
  - overlay
  - markup
  - pointer
