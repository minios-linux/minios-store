id: "ristretto"
name: Ristretto
description: Fast and lightweight image viewer
longDescription: |
  <p>Ristretto is an image viewer for the Xfce desktop environment.</p>
  <p>The Ristretto Image Viewer is an application that can be used to view and scroll through images, run a slideshow of images, open images with other applications like an image-editor or configure an image as the desktop wallpaper.</p>
  
categoryId: graphics
icon: Image
method: apt
level: "auto"
compression: zstd
packages:
  - ristretto
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
