id: "mypaint"
name: MyPaint
description: Painting program for digital artists
longDescription: |
  <p>MyPaint is a fast and easy open-source graphics application for digital painters.
        It lets you focus on the art instead of the program.
        You work on your canvas with minimum distractions, bringing up the interface
        only when you need it.</p>
  <p>MyPaint&apos;s brush engine is fast and almost infinitely configurable to simulate
        many natural media brushes or experimental ‘unrealistic’ ones.
        It ships with a variety of pre-made brushes by prominent artists so you don&apos;t
        have to configure your own if you don&apos;t want to.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - mypaint
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
