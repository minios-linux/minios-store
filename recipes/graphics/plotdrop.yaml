id: plotdrop
name: PlotDrop
description: Create graphs and data visualizations
longDescription: |
  <p>Plotdrop is a simple application for creating quick graphs from
        2D datasets using the GNUPlot backend.
        To use plotdrop, you simply drag and drop a data file from your file browser,
        configure the options and generate your graph.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - plotdrop
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
