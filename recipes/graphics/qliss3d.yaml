id: qliss3d
name: Qliss3D
description: demonstration tool for Lissajous physiques
longDescription: |
  <p>Qliss3d is a tool that generates various Lissajous figures. It is possible to rotate the figures and zoom into them. Also changing the frequency and replay of the sinus sounds by the same frequency rate are implemented.</p>
  <p>In mathematics, a Lissajous curve (Lissajous figure or Bowditch curve) is the graph of the system of parametric equations which describes complex harmonic motion. This family of curves was investigated by Nathaniel Bowditch in 1815, and later in more detail by Jules Antoine Lissajous. Lissajous curves can be traced mechanically by means of a harmonograph.</p>
  
