id: "valentina"
name: Valentina
description: Creating pattern of clothes
longDescription: |
  <p>Valentina is a pattern drafting software tool for small-batch and custom-sized clothing manufacturing.</p>
  <p>Valentina allows designers to create and model patterns of clothing, using either standard sizing tables or an individual’s set of measurements. It blends new technologies with traditional methods to create a unique pattern making tool.</p>
  <p>The &quot;tape&quot; executable is provided as &quot;valentina-tape&quot;.</p>
  
