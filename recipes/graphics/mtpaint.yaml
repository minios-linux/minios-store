id: mtpaint
name: mtPaint graphic editor
description: painting program to create pixel art and manipulate digital photos
longDescription: |
  <p>mtPaint is a free, open source graphic editing program which uses the GTK+ toolkit. It is geared towards creating indexed palette images and pixel art.</p>
  <p>Due to its efficient design it can run on older PC hardware (e.g. a 200MHz CPU and 32MB of RAM). It can edit indexed palette or 24 bit RGB images and offers basic painting and palette manipulation tools.</p>
  <p>It is aimed to be simple and easy to use. it also can handle JPEG, GIF, TIFF, BMP, XPM, and XBM files.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - mtpaint
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
