id: "gwenview"
name: Gwenview
description: Image Viewer
longDescription: |
  <p>Gwenview is a fast and easy to use image viewer by KDE, ideal for browsing and displaying a collection of images.</p>
  <p>Features:</p>
  <ul>
    <li>Supports simple image manipulations: rotate, mirror, flip, and resize</li>
    <li>Supports basic file management actions such as copy, move, delete, and others</li>
    <li>Functions both as a standalone application and an embedded viewer in the Konqueror web browser</li>
    <li>Can be extended using KIPI plugins.</li>
  </ul>
  
categoryId: graphics
icon: Image
method: apt
level: "auto"
compression: zstd
packages:
  - gwenview
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
