id: "mcomix"
name: MComix
description: Comic and general purpose image viewer
longDescription: |
  <p>MComix is a user-friendly, customizable image viewer. It is specifically
  	  designed to handle comic books (both Western comics and manga) and supports
  	  a variety of container formats (including CBR, CBZ, CB7, CBT, LHA and PDF).</p>
  <p>MComix is a fork of the Comix project, and aims to add bug fixes and
  	  stability improvements after Comix development came to a halt in
  	  late 2009.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - mcomix
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
