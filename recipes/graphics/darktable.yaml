id: "darktable"
name: darktable
description: Organize and develop images from digital cameras
longDescription: |
  <p>darktable manages your digital negatives in a database and lets you view them through a lighttable. It also enables you to develop raw images and enhance them in a darkroom.</p>
  <p>Other modes besides lighttable and darkroom are a map for geotagging, tethering, print and a slideshow.</p>
  <p>darktable supports most modern camera&apos;s raw formats, and does all of its processing at very high precision.</p>
  
categoryId: graphics
icon: Camera
method: apt
level: "auto"
compression: zstd
packages:
  - darktable
distributions:
  include:
    - name: bionic
      architectures: [amd64]
