id: "skanpage"
name: Skanpage
description: "Simple, multi-page scanning application"
longDescription: |
  <p>Skanpage is a simple scanning application designed for multi-page scanning and saving of documents and images.</p>
  <p>Features:</p>
  <ul>
    <li>Scanning from flatbed and ADF scanners</li>
    <li>Configurable options for scanning device</li>
    <li>Reordering, rotation and deletion of scanned pages</li>
    <li>Saving to multi-page PDF documents and image files</li>
  </ul>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - skanpage
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
