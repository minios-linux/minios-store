id: "mandelbulber2"
name: Mandelbulber v2
description: Visit 3D Fractal World
longDescription: |
  <p>Mandelbulber2 is a ray-tracing application for drawing three-dimensional fractals, like Mandelbulb, Mandelbox, Julia, trigonometric, hypercomplex or IFS fractals. It is highly customizable and features complex shading algorithms (among the others there are shadows, depth of field, ambient occlusion).</p>
  <p>Mandelbulber2 is also able to produce animations and has a simple built-in 3D navigator for exploring the fractals.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - mandelbulber2
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
