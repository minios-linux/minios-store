id: "gpscorrelate-gui"
name: GPSCorrelate
description: Add coordinates to jpeg images using gpx files
longDescription: |
  <p>gpscorrelate fills EXIF (Exchangeable Image File Format) fields of digital photos related to GPS (Global Positioning System) information (e.g.: GPSLatitude, GPSLongitude, GPSAltitude, ...). The act of filling those fields is referred to as &quot;correlation&quot;.</p>
  <p>Inputs of the correlation process are a set of JPEG images and GPS data encoded in GPX (GPS Exchange Format) format.</p>
  <p>If GPS data are available at the precise moment the photo was taken (with a 1-second granularity) the GPS data are stored unmodified in EXIF fields. If they are not linear interpolation of GPS data available at moments before and after the photo was taken can be used.</p>
  <p>Both a command line tool (package gpscorrelate) and a GTK+ graphical user interface for it (package gpscorrelate-gui) are provided.</p>
  <p>This package contains the GTK+ graphical user interface.</p>
  
