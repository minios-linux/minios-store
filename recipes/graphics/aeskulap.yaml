id: aeskulap
name: Aeskulap Viewer
description: Medical image viewer and DICOM network client
longDescription: |
  <p>Aeskulap is able to load a series of special images stored in the DICOM format for review. Additionally it is able to query and fetch DICOM images from archive nodes (also called PACS) over the network.  Aeskulap tries to achieve a full open source replacement for  commercially available DICOM viewers.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - aeskulap
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
