id: preview-app
name: Preview
description: Image viewer
longDescription: |
  <p>Preview is an application that can be used to display images. It is designed to be easy to use and will support all GNUstep features (images design support, pasteboard/services, printing and layout...). It tries to follow the NeXTSTEP spirit.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - preview.app
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - picture
  - graphics
  - image
iconSources:
  - cached: preview.app_Preview.png
    width: 64
    height: 64
enabled: true
order: 99
