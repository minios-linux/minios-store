id: lios
name: Tesseract-Trainer
description: Train tesseract-ocr
longDescription: |
  <p>Lios provides a graphical interface on top of the Cuneiform and Tesseract OCR backends to make OCR processing easier for impaired users, with full autorotation, brightness optimization, rectangle selection, audio feedback, etc.</p>
  
