id: "drawing"
name: Drawing
description: A drawing application for the GNOME desktop
longDescription: |
  <p>"Drawing" is a basic image editor, supporting PNG, JPEG and BMP file types.</p>
  <p>
        It allows you to draw or edit pictures with tools such as pencil, line or
        arc (with various options), selection (cut/copy/paste/drag/…), shapes
        (rectangle, circle, polygon, …), text insertion, resizing, cropping,
        rotating, …
      </p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - drawing
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - paint
  - sketch
  - pencil
