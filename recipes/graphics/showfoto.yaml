id: "showfoto"
name: Showfoto
description: Image Editor
longDescription: |
  <p>Showfoto is a fast Image Editor with powerful image editing tools. You can use it to view your photographs and improve them.
        Showfoto is the standalone image editor of the digiKam project.</p>
  
categoryId: graphics
icon: Palette
