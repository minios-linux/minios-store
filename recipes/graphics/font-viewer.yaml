id: "font-viewer"
name: Font Viewer
description: A font viewer application for Gtk+ Desktop Environments
longDescription: |
  <p>
              Font Viewer allows previewing font files prior to installation.
              It features several ways to preview font files along with a
              character map and displays font properties and license details.
          </p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - font-viewer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - graphics
  - viewer
  - gnome
  - gtk
  - publishing
