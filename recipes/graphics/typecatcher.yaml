id: "typecatcher"
name: TypeCatcher
description: Download Google webfonts for off-line use
longDescription: |
  <p>TypeCatcher allows you to search, browse, and download Google webfonts for off-line use. You can preview fonts with adjustable size and text.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - typecatcher
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - fonts
  - viewer
iconSources:
  - url: t/ty/typecatcher.desktop/bf4794f41e894ef2877f6823f3a5b735/icons/128x128/typecatcher_typecatcher.png
    width: 128
    height: 128
enabled: true
order: 99
