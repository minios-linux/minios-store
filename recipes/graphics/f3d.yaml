id: "f3d"
name: F3D
description: A fast and minimalist 3D viewer
longDescription: |
  <p>
              A VTK-based 3D viewer following the KISS principle, so it is minimalist,
              efficient, has no GUI, has simple interaction mechanisms and is fully
              controllable using arguments in the command line.
          </p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - f3d
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - vtk
  - animations
  - fbx
  - step
  - stl
  - dcm
  - ex2
  - gml
  - obj
  - 3ds
