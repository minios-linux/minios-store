id: qvge
name: Qt Visual Graph Editor
description: View and manipulate small till middle-sized graphs
longDescription: |
  <p>This is a multiplatform graph editor written in C++/Qt. Its main goal is to make possible visually edit two-dimensional graphs in a simple and intuitive way.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - qvge
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: qvge_qvge.png
    width: 64
    height: 64
enabled: true
order: 99
