id: sailcut
name: Sailcut CAD
description: Sail Design Application
longDescription: |
  <p>
        Sailcut CAD is a sail design and plotting software which allows you to design and visualise your own sails and compute
  the accurate development of all panels in flat sheets.  You can export the sails you create to DXF, plaintext or Carlson plotter files.
      </p>
  <p>
        Sailcut CAD's user interface is available in English, French, Dutch, German, Italian, Norwegian, Portuguese, Danish
  and Russian.
      </p>
  
