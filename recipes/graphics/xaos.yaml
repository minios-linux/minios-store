id: "xaos"
name: Xaos - Fractal Zoomer
description: Fractal Generator
longDescription: |
  <p>XaoS allows you to zoom and pan around a fractal in real time. It can display the animated fractals in graphical or even plain text mode.</p>
  <p>It displays the Mandelbrot set or many other fractals and allows you to zoom smoothly into the fractal. Various coloring modes are provided for both the points inside and outside the selected set. In addition, switching between Mandelbrot and Julia fractal types is provided.</p>
  <p>Other features include autopilot mode, palette changing, image saving, fractal inversion, filters, and a built in fractal tutorial.</p>
  
categoryId: graphics
icon: Palette
