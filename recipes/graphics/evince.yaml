id: "evince"
name: Evince
description: Document viewer for popular document formats
longDescription: |
  <p>A document viewer for the GNOME desktop. You can view, search or annotate documents in many different formats.</p>
  <p>Evince supports documents in: PDF, PS, EPS, XPS, DjVu, TIFF, DVI (with SyncTeX), and Comic Books archives (CBR, CBT, CBZ, CB7).</p>
  
categoryId: graphics
icon: BookOpen
method: apt
level: "auto"
compression: zstd
packages:
  - evince
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - pdf
  - ps
  - postscript
  - dvi
  - xps
  - djvu
  - tiff
  - document
  - presentation
  - viewer
