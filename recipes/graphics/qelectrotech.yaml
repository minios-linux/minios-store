id: "qelectrotech"
name: QElectroTech
description: Edit electrical diagrams.
longDescription: |
  <p>QElectroTech is a Qt5 application written in C++ . This program is helps you to design electric schematics. It includes both a schematic editor and a symbol editor. It uses XML files to store the produced contents.</p>
  
