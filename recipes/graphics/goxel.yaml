id: "goxel"
name: Goxel
description: 3D voxel editor
longDescription: |
  <p>Goxel is a 3D program that lets you create voxel volumes. It supports 24 bits RGB colors, unlimited scene size and undo buffers. Layers, procedural generation and Marching Cube rendering. Exports to obj, pyl, magica voxel, png, qubicle, povray, and more</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - goxel
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
