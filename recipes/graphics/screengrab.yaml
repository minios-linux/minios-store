id: "screengrab"
name: ScreenGrab
description: Screenhot Tool in Qt
longDescription: |
  <p>
        Powerful screen capture utility in Qt.
        Capture screen, window or area.
        Features:
      </p>
  <ul>
    <li>Delay</li>
    <li>Edit directly in other applications</li>
    <li>Automatic saving; insert date+time in filename</li>
    <li>Fit to edges by right click</li>
    <li>Custom shortcuts</li>
  </ul>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - screengrab
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
