id: "photoflare"
name: PhotoFlare
description: A simple but featureful image editor.
longDescription: |
  <p>PhotoFlare is an effort to bring quick, simple but powerful image editing to the masses. PhotoFlare is inspired by the image editor PhotoFiltre which is available only on another OS. PhotoFlare is designed for beginner users with the aim to give them a tool easy to learn and use.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - photoflare
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - photo
  - image
  - picture
  - photography
  - paint
  - graphics
  - editor
