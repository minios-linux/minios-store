id: tupi
name: "Tupi: 2D Magic"
description: 2D Animation Toolkit
longDescription: |
  <p>Tupi: 2D Magic is a design and authoring tool for digital artists interested in 2D Animation, offering an interface experience focused on 8-100 years old kids. It&apos;s source code is based on the KTooN project.</p>
  <p>Some of its main features are: basic illustration tools (shapes, fill, text), gradient tools, onion skin, brushes editor, pencil with smoothness support, basic object library (for svg files and raster images) and many others.</p>
  <p>Using its modules of Animation and Reproduction you can export 2D projects to several formats as OGG, MPEG, AVI, MOV and SWF. Additionally, the option of exporting Image arrays as output is available.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - tupi
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
