id: "sweethome3d-textures-editor"
name: Sweet Home 3D Textures Library Editor
description: Create your own SweetHome3D textures libraries
longDescription: |
  <p>Sweet Home 3D is an interior design Java application for quickly choosing and placing furniture on a house 2D plan drawn by the end-user, with a 3D preview.</p>
  <p>This package contains textures library editor for creating your own textures libraries.</p>
  
