id: "stegosuite"
name: Stegosuite
description: Steganography tool to hide information in image files
longDescription: |
  <p>​      Stegosuite is a graphical steganography tool to easily hide information in image files. It allows the embedding of text messages and multiple files of any type. In addition, the embedded data is encrypted using AES. Currently supported file types are BMP, GIF, JPG and PNG.
  ​</p>
  
categoryId: graphics
icon: Palette
