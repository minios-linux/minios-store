id: "ngraph-gtk"
name: Ngraph
description: create scientific 2-dimensional graphs
longDescription: |
  <p>Ngraph is the program to create scientific 2-dimensional graphs for researchers and engineers. This program can create advanced graphs which can&apos;t be created by spreadsheets. Graphs can be exported to postscript.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - ngraph-gtk
distributions:
