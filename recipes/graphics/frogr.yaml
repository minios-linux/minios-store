id: "frogr"
name: frogr
description: A flickr uploader for GNOME
longDescription: |
  <p>frogr allows users to manage their accounts on the Flickr photo hosting
        service with a simple and direct interface.</p>
  <p>It supports all the basic Flickr features, including uploading
        pictures, adding descriptions, setting tags and managing sets
        and groups pools.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - frogr
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - flickr
  - image
  - picture
  - photo
  - video
  - uploader
