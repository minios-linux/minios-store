id: "synfigstudio"
name: Synfig Studio
description: Create and edit 2D animations and compositions
longDescription: |
  <p>synfig is a vector based 2D animation package. It is designed to be capable of producing feature-film quality animation. It eliminates the need for tweening, preventing the need to hand-draw each frame.</p>
  <p>This package contains the graphical user interface for synfig.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - synfigstudio
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - 2d
  - vector
  - animation
  - cartoon
  - anime
  - fx
  - draw
  - flash
  - toonboom
  - moho
