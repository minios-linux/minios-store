id: "leocad"
name: LeoCAD
description: Create virtual LEGO models
longDescription: |
  <p>LeoCAD is a CAD program that can be used to create virtual models with bricks similar to those found in many toys.</p>
  <p>It has an easy to use interface and currently features over 2000 different pieces created by the LDraw community when installed with the ldraw-parts package.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - leocad
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - cad
  - lego
  - ldraw
screenshotSources:
