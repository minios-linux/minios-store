id: color-picker
name: color-picker
description: Powerful screen color picker based on Qt
longDescription: |
  <p>Colour picker and colour editor for web designers and digital  artists, With Color Picker,
        	identifying the colours, saving and  editing is a quick and simple job.</p>
  <p>Color Picker features include:</p>
  <p>* Five formats of colour codes: HTML, HexRGBA, RGB, HSB/HSV, CMYK and their variations.
            Conversion of HTML, HEX and RGB colour codes into the corresponding colours.</p>
  <p>* Colour picker for easy handling and greater precision.</p>
  <p>* Colour list for saving and reusing the picked colour samples for each picked colour.</p>
  <p>* Color preview widget</p>
  <p>* Progressive color pattern generator</p>
  <p>* Support Switching three themes - System theme, Flat Light theme and Dark theme.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - color-picker
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
