id: "simple-scan"
name: Simple Scan
description: Scan Documents
longDescription: |
  <p>A really easy way to scan both documents and photos.
        You can crop out the bad parts of a photo and rotate it if it is the wrong way round.
        You can print your scans, export them to pdf, or save them in a range of image formats.</p>
  <p>Simple Scan uses the SANE framework to support most existing scanners.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - simple-scan
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - scan
  - scanner
  - flatbed
  - adf
