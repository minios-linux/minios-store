id: antimony
name: Antimony
description: Computer-aided design CAD tool
longDescription: |
  <p>Antimony is a computer-aided design (CAD) tool from a parallel universe in which CAD software evolved from Lisp machines rather than drafting tables.</p>
  <p>Antimony provides the Python3 Fab that is a set of software tools for personal fabrication, intended for use with machines common to fab labs. For info about Fab visit kokompe.cba.mit.edu/.</p>
  
