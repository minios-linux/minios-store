id: "nomacs"
name: nomacs
description: View and edit images
longDescription: |
  <p>Nomacs is a fast image viewer with additional image editing functionality.
        When viewing images, it features fast thumbnail previews, a zoomable grid
        display of thumbnails, a chromeless view, and display of metadata and
        image details with a histogram.
        It also has the ability to edit images, including cropping, resizing,
        rotating and color correction.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - nomacs
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
