id: "fontforge"
name: FontForge
description: An outline font editor
longDescription: |
  <p>FontForge is a font editor. Use it to create, edit and convert fonts in OpenType, TrueType, UFO, CID-keyed, Multiple Master, and many other formats.</p>
  <p>This package also provides these programs and utilities:  fontimage - produce a font thumbnail image;  fontlint  - checks the font for certain common errors;  sfddiff   - compare two font files.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - fontforge
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - font
  - fonts
  - editor
  - ttf
  - otf
  - typeface
