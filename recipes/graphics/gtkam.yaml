id: gtkam
name: Gtkam Digital Camera Browser
description: Browse and download images from an attached digital camera
longDescription: |
  <p>GTKam is a graphical application based on GTK+ that allows you to transfer pictures and movies from a digital camera.</p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - gtkam
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: gtkam_gtkam-camera.png
    width: 64
    height: 64
enabled: true
order: 99
