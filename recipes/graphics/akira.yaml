id: "akira"
name: Akira
description: The Linux Design Tool
longDescription: |
  <p>
        A modern UX Design Application for UI and UX Designers
      </p>
  <p>
        ⚠ WARNING! Akira is still under development and not ready for production. Missing features, random bugs, and black
  holes opening in your kitchen are to be expected.</p> <p>
        Akira is a native Linux Design application built in Vala and Gtk. Akira focuses on offering a modern and fast approach
  to UI and UX Design, mainly targeting web and graphic designers. The main goal is to offer a valid and professional solution for designers who want to use Linux as their main OS.
      </p>
  <p>
        Features Include:
      </p>
  <ul>
    <li>Fully vector canvas for infinite resizing without quality loss</li>
    <li>Smart option panel that shows the editable features of a selected item</li>
    <li>Layers panel with easy Drag and Drop and smart ordering</li>
    <li>Create Artboards to better organize your design iterations and views</li>
    <li>Control the size and quality of exported images</li>
    <li>Customizable icon set</li>
    <li>And so much more…</li>
  </ul>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - akira
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
