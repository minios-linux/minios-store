id: graide
name: Graide
description: GRAphite Integrated Development Environment
longDescription: |
  <p>Graide is an IDE including a debugger that helps people develop Graphite GDL descriptions for smart fonts and compile them into fonts.</p>
  <p>Graphite is a &quot;smart font&quot; system developed specifically to handle the complexities of lesser-known languages of the world.</p>
  
