id: qosmic
name: qosmic
description: Creating & rendering of fractal flame images
longDescription: |
  <p>
        Graphical interface for creating, editing, and rendering  flam3 IFS fractal flame images, which can be saved as png files. 
      </p>
  
categoryId: graphics
icon: Palette
method: apt
level: "auto"
compression: zstd
packages:
  - qosmic
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - gui qt5 fractals
