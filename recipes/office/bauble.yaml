id: bauble
name: Bauble
description: An application for managing botanical collections
longDescription: |
  <p>Bauble is a software application to help you manage a collection of botanical specimens. It is intended to be used by botanic gardens, herbaria, arboreta, etc. to manage their collection information. It is a open, free, cross-platform alternative to BG-Base and similar software.</p>
  
