id: "kbibtex"
name: KBibTeX
description: KDE-based editor for bibliographic files
longDescription: |
  <p>An application to manage bibliography databases in the BibTeX format. KBibTeX can be used as a standalone program, but can also be embedded into other KDE applications (e.g. as bibliography editor into Kile).</p>
  <p>KBibTeX can query online resources (e.g. Google scholar) via customizable search URLs. It is also able to import complete datasets from NCBI Pubmed. It also supports tagging references with keywords and manages references to local files.</p>
  <p>BibTeX files can be exported into HTML, XML, PDF, PS and RTF format using a number of citation styles.</p>
  
