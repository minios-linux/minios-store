id: jverein
name: JVerein
description: Administration of an Association
longDescription: |
  <p>JVerein is an open source association administration with a connection to the homebanking software Hibiscus, which is also under open source license. The implementation is done with Java. The procedure thus guaranteed on many platforms. Jameica is used as the GUI framework.</p>
  
