id: stardict-gtk
name: StarDict
description: Lookup words in dictionaries
longDescription: |
  <p>StarDict is a Cross-Platform and international dictionary written in Gtk.</p>
  <p>It has powerful features, such as "Glob-style pattern matching," "Scan selected word," "Fuzzy query" and "Full-text search".</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - stardict-gtk
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - dictionary
