id: fracatux
name: Fracatux
description: Manipulation de fractions sous formes de barres
longDescription: |
  <p>Fracatux is part of the project Primtux (https://primtux.fr), which aims to provide simple and effective programs for teaching in primary schools.</p>
  <p>Fracatux is a free/libre program to display fractions as bars, and to perform various operations with them. It permits, among other things, to make evident equalities of fractions, addition of fractions with the same denominator, and correspondences between fractional, decimal and scientific representations. A scale line (decimal or fractional) allows one to compare those fractions from ordinal point of view.</p>
  
categoryId: office
