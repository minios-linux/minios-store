id: "gnome-dictionary"
name: GNOME Dictionary
description: Check word definitions and spellings in an online dictionary
longDescription: |
  <p>GNOME Dictionary is a simple dictionary application that looks up
        definitions of words online.
        Though it looks up English definitions by default, you can easily switch to
        Spanish or add other online dictionaries using the DICT protocol to suit your
        needs.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-dictionary
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - word
  - synonym
  - definition
  - spelling
screenshotSources:
