id: "kgeography"
name: KGeography
description: A Geography Learning Program
longDescription: |
  <p>KGeography is an aid for learning about world geography.  You can use it to explore a map, show information about regions and features, and play quiz games to test your geography knowledge.</p>
  <p>This package is part of the KDE education module.</p>
  
categoryId: office
icon: Image
method: apt
level: "auto"
compression: zstd
packages:
  - kgeography
