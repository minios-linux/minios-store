id: "foliate"
name: Foliate
description: A simple and modern eBook viewer
longDescription: |
  <p>Foliate is a simple and modern GTK eBook viewer.</p>
  <p>Features include:</p>
  <ul>
    <li>Two-page view and scrolled view</li>
    <li>Customize font and line-spacing</li>
    <li>Light, sepia, dark, and invert mode</li>
    <li>Reading progress slider with chapter marks</li>
    <li>Bookmarks and annotations</li>
    <li>Find in book</li>
    <li>Quick dictionary lookup</li>
  </ul>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - foliate
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ebook
  - book
  - epub
  - viewer
  - reader
