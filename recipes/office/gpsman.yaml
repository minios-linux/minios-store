id: gpsman
name: gpsman
description: GPS data graphical manager
longDescription: |
  <p>GPS Manager (GPSMan) is a graphical manager of GPS data that
      makes possible the preparation, inspection and edition of GPS data
      in a friendly environment. GPSMan supports communication and
      real-time logging with both Garmin and Lowrance receivers and
      accepts real-time logging information in NMEA 0183 from any GPS
      receiver.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - gpsman
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
