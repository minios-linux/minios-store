id: freediams
name: FreeDiams
description: Pharmaceutical drugs prescriptor assistant
longDescription: |
  <p>The FreeMedForms project provides a set of medical applications to help health professionals in their day-to-day practice. It is developed by an international community of medical doctors and computer specialists.</p>
  <p>FreeDiams is a pharmaceutical drug prescription assistant which can be used to create complex prescriptions and to handle drug interactions.</p>
  
