id: "xcas"
name: Xcas
description: The swiss knife for mathematics
longDescription: |
  <p>Giac is a computer algebra system, following the development of the CAS for HP calculators. It has fast implementation of algorithms for polynomial operations, and compatibility mode with Maple or Mupad CAS as well as TI calculators.</p>
  <p>This package contains the user-facing giac programs: xcas, icas, and pgiac; as well as the cas_help program for providing user-oriented help.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - xcas
