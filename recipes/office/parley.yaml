id: "parley"
name: Parley
description: Vocabulary Trainer
longDescription: |
  <p>Parley is a vocabulary trainer. It helps you to memorize your vocabulary, for example when you are trying to learn a foreign language. It supports many language specific features, but can be used for other learning tasks as well. It uses the spaced repetition learning method, which makes learning optimal. Vocabulary collections can be downloaded by &quot;Get Hot New Stuff&quot; or created with the built-in editor.</p>
  <p>Training Modes:</p>
  <ul>
    <li>Flash Cards</li>
    <li>Mixed Letters (order the letters of a word)</li>
    <li>Multiple Choice</li>
    <li>Written</li>
    <li>Language specific trainings: article, comparison forms, conjugations, synonymes/antonyms/paraphrases</li>
  </ul>
  
