id: "xnec2c"
name: Xnec2c
description: Numerical Electromagnetics Code software
longDescription: |
  <p>The original nec2c is a non-interactive command-line application that reads standard NEC2 input files and produces an output file with data requested by &quot;commands&quot; in the input file.</p>
  <p>In contrast xnec2c is a GUI interactive application that (in its current form) reads NEC2 input files but presents output data in graphical form, e.g. as wire frame drawings of the radiation pattern or near E/H field, graphs of maximum gain, input impedance, vswr etc against frequency and simple rendering of the antenna structure, including color code representation of currents or charge densities. These results are only calculated and drawn on user demand via menu items or buttons, e.g. xnec2c is interactive and does not execute NEC2 &quot;commands&quot; in batch style as the original does.</p>
  
