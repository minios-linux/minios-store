id: qutemol
name: QuteMol
description: interactive visualization of macromolecules
longDescription: |
  <p>QuteMol is an interactive, high quality molecular visualization system. It exploits the current GPU capabilities through OpenGL shaders to offer an array of innovative visual effects. QuteMol visualization techniques are aimed at improving clarity and an easier understanding of the 3D shape and structure of large molecules or complex proteins.</p>
  <p>Qutemol uses advanced OpenGL techniques and might not work correctly with all video cards and drivers.</p>
  <p>Features QuteMol offers include:</p>
  <p> * Real time ambient occlusion  * Depth aware silhouette enhancement  * Ball-and-stick, space-filling and liquorice visualization modes  * High resolution antialiased snapshots for creating publication    quality renderings  * Automatic generation of animated gifs of rotating molecules for    web page animations  * Interactive rendering of macromolecules (&gt;100k atoms)</p>
  <p>QuteMol reads PDB files as input.</p>
  
