id: "lybniz"
name: Lybniz
description: Plot graphs and functions
longDescription: |
  <p>Lybniz is a simple desktop graph plotter. It can currently plot three functions and allows you to navigate the plot. Functions are entered in Python or C-like notation.</p>
  
