id: "pysiogame"
name: pySioGame
description: A little set of educational apps for kids
longDescription: |
  <p>pySioGame is a set of educational activities and games for children aged between 3 and 10. The activities are grid based and can be played all in a single window. pySioGame includes maths, reading, writing, painting, and memory activities.</p>
  
