id: wmcalc
name: wmcalc
description: Calculator dockapp for Window Maker
longDescription: |
  <p>Wmcalc is a small calculator meant for the WindowMaker dock or Afterstep Wharf. It is a simple calculator with basic functions and memory slots, and can launch any external application for more complex calculations.</p>
  
