id: "kontact"
name: Kontact
description: An integrated solution to your personal information management
longDescription: |
  <p>Kontact is the integrated solution to your personal information management (PIM) needs.
        It combines well-known KDE applications like KMail, KOrganizer and KAddressBook into a single interface to provide
  easy access to mail,
        scheduling, address book and other PIM functionality.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - kontact
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
