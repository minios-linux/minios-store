id: "gcu-bin"
name: GChemTable
description: A Mendeleiev table of the chemical elements
longDescription: |
  <p>The GNOME Chemistry Utils provide C++ classes and Gtk+-2 widgets related to chemistry. They will be used in future versions of both gcrystal and gchempaint.</p>
  <p>This package provides 4 applications:</p>
  <p> * a molecular structures viewer (GChem3D)  * a molar mass calculator (GChemCalc)  * a periodic table of the elements (GChemTable)  * a spectra viewer (GSpectrum)</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - gcu-bin
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
