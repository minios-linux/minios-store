id: "klatexformula"
name: KLatexFormula
description: Generate images from LaTeX equations
longDescription: |
  <p>With klatexformula, just enter a formula and click &quot;Evaluate&quot; to get an image of a LaTeX formula. You can drag&amp;drop, copy or save the resulting image directly from the GUI, which makes klatexformula a very convenient tool for presentations. Klatexformula also provides also tools for equation prototyping in LaTeX and a user-library of used equations.</p>
  
categoryId: office
icon: FileText
