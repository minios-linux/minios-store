id: openuniverse
name: OpenUniverse Space Simulator
description: Explore the solar system in this accurate simulation
longDescription: |
  <p>OpenUniverse (OU for short) is a fun, fast and free OpenGL space simulator. It currently focuses on the Solar System and lets you visit all of its planets, most major moons and a vast collection of smaller bodies in colorful, glorious and realtime 3D. If you&apos;ve ever had a chance to visit Mercury or asteroid Geographos, here you&apos;ll find them looking exactly the same way, following exactly the same path as when you&apos;ve left them.</p>
  <p>Notice that OpenUniverse is not actively being maintained anymore and that users are recommended to use Celestia instead.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - openuniverse
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: openuniverse_openuniverse.png
    width: 64
    height: 64
enabled: true
order: 99
