id: pympress
name: pympress
description: A simple yet powerful PDF reader designed for dual-screen presentations
longDescription: |
  <p>Pympress is a little PDF reader written in Python using Poppler for PDF rendering and GTK+ for the GUI.</p>
  <p>It is designed to be a dual-screen reader used for presentations and public talks, with two displays: the *Content window* for a projector, and the *Presenter window* for your laptop.</p>
  <p>It comes with many great features:   - supports embedded videos   - text annotations displayed in the presenter window   - natively supports beamer&apos;s *notes on second screen*!</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - pympress
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
