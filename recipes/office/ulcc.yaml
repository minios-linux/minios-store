id: "ulcc"
name: ulcc
description: Teaching children by pictures
longDescription: |
  <p>
        ulcc is an educational tool/game targeted at children. It is designed to aid in learning words through visual samples.
  As a side function it can also help to familiarize one with a mouse.
      </p>
  <p>
        This program is useful for elementary schools.
      </p>
  
