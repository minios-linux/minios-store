id: klevernotes
name: KleverNotes
description: Take and manage your notes
longDescription: |
  <p>KleverNotes is a note taking and management application for your mobile and desktop devices. It uses markdown and allow you to preview your content.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - klevernotes
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - markdown
  - kirigami
  - qt
