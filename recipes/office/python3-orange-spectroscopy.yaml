id: python3-orange-spectroscopy
name: Orange Spectroscopy/Quasar
description: "Explore, analyze, and visualize your spectroscopy data"
longDescription: |
  <p>Orange add-on for spectral data analysis. Provides spectra and hyperspectra plotting, interpolation, preprocessing (cutting, smoothing, normalization), and integration. Supports common spectral file formats.</p>
  <p>Features -------- ### Load and process data  * Load the spectroscopy data  * Preprocess and interpolate spectra  * Integrate spectra  * Average spectra  * Performs Fast Fourier Transform</p>
  <p>### Visualisation  * Visually explore series of spectra  * Plots 2D map of hyperspectra</p>
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - python3-orange-spectroscopy
distributions:
  include:
    - name: noble
      architectures: [amd64]
tags:
  - machine learning
  - scientific visualization
  - statistical analysis
  - spectroscopy
