id: gperiodic
name: GPeriodic
description: A program for looking up data of elements from the periodic table
longDescription: |
  <p>GPeriodic is a small X/GTK+-based program which allows you to browse through a periodic table of chemical elements, and view somewhat detailed information on each of the elements. 118 elements are currently listed.</p>
  
