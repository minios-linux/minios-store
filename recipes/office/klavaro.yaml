id: "klavaro"
name: Klavaro
description: A touch typing tutor
longDescription: |
  <p>Klavaro is a very flexible touch typing tutor, supporting customizable keyboard layouts. You can edit and save new or unknown keyboard layouts, as the basic course was designed to not depend on specific ones. Also, there are some charts about the learning process, and for advanced users an online ranking scheme, comparing your typing proficiency with others.</p>
  <p>Its interface is very simple, without artifacts to distract the user, and some may find this boring, but we think keyboard memorization requires a high level of concentration, and must be done by touch, not visually.</p>
  
