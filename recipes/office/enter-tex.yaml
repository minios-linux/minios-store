id: enter-tex
name: Enter TeX
description: TeX/LaTeX editor
longDescription: |
  <p>
        Enter TeX is a TeX/LaTeX text editor. The application was previously named
        LaTeXila and then GNOME LaTeX. Its development started in 2009.
      </p>
  <p>
        Enter TeX permits to focus on the content and the structure of the
        document.
      </p>
  <p>
        To help the writing of the LaTeX markup, auto-completion is available as
        well as menus and toolbars with the principal commands. New documents are
        created from templates. There are buttons to compile, convert and view a
        document in one click. And projects containing several .tex files are
        managed easily.
      </p>
  <p>
        A side panel contains three components: the document structure to easily
        navigate in it; lists of symbols to insert them in a document; and a file
        browser.
      </p>
  <p>
        Enter TeX has also other features like the spell-checking, or jumping to
        the associated position between the .tex file and the PDF.
      </p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - enter-tex
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - text
  - tex
  - latex
  - editor
  - documents
