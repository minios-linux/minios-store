id: "avogadro"
name: Avogadro
description: Molecular Graphics and Modelling System
longDescription: |
  <p>Avogadro is a molecular graphics and modelling system targeted at molecules and biomolecules.  It can visualize properties like molecular orbitals or electrostatic potentials and features an intuitive molecular builder.</p>
  <p>Features include:  * Molecular modeller with automatic force-field based geometry optimization  * Molecular Mechanics including constraints and conformer searches  * Visualization of molecular orbitals and general isosurfaces  * Visualization of vibrations and plotting of vibrational spectra  * Support for crystallographic unit cells  * Input generation for the Gaussian, GAMESS and MOLPRO quantum chemistry    packages  * Flexible plugin architecture and Python scripting</p>
  <p>File formats Avogadro can read include PDB, XYZ, CML, CIF, Molden, as well as Gaussian, GAMESS and MOLPRO output.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - avogadro
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
