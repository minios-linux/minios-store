id: "homebank"
name: HomeBank
description: "Free, easy, personal accounting for everyone"
longDescription: |
  <p>HomeBank is a fast, simple and easy to use program to manage your personal accounting. It has a lot of features such as easy analysis with  graphical charts (statistics, budget, overdrawn, car cost), useful reports (&quot;Where your money goes&quot;, &quot;Trend Time Report&quot; ), multi-accounts  support, budget management, reminder, import from  OFX/QFX-CSV files, visual status of operations. It is based on GTK2.</p>
  
