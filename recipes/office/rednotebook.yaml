id: "rednotebook"
name: RedNotebook
description: Graphical diary and journal
longDescription: |
  <p>Modern desktop diary and personal journaling tool. It lets you format,
      tag and search your entries. You can also add pictures, links and
      customisable templates, spell check your notes, and export to plain
      text, HTML, LaTeX or PDF.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - rednotebook
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - journal
  - diary
  - notes
  - notebook
