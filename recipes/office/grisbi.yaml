id: "grisbi"
name: Grisbi
description: Personnal finances manager
longDescription: |
  <p>Grisbi is a personal accounting program. Grisbi can handle multiple accounts, currencies and users. It helps you manage your money using third party, expenditure and receipt categories, as well as budgetary lines, financial years, and other information that makes it adapted for both personal and associative accounting.</p>
  <p>Grisbi can import accounts from QIF, OFX and Gnucash files. It can print reports using LaTeX or export them via HTML.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - grisbi
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
