id: "ltrsift"
name: LTRsift
description: A graphical tool for postprocessing and classification of LTR retrotransposons.
longDescription: |
  <p>LTRsift is a graphical desktop tool for semi-automatic postprocessing of de novo predicted LTR retrotransposon annotations, such as the ones generated by LTRharvest and LTRdigest. Its user-friendly interface displays LTR retrotransposon candidates, their putative families and their internal structure in a hierarchical fashion, allowing the user to &quot;sift&quot; through the sometimes large results of de novo prediction software. It also offers customizable filtering and classification functionality.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - ltrsift
