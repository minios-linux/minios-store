id: "gcrystal"
name: GCrystal
description: Edit and display crystalline structures
longDescription: |
  <p>GNOME Crystal is a light model visualizer for crystal-structures. It is based on the GNOME Chemistry Utils and should display models of all sorts of crystal microscopic structures using OpenGL.</p>
  
