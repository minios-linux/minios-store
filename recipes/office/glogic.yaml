id: "glogic"
name: gLogic
description: Logic circuit simulator
longDescription: |
  <p>gLogic is an educational graphical logic circuit simulator developed with Python and GTK+. This program simulates logic circuits containing basic components (e.g. NOT, AND, OR) and many advanced components like flip-flop.</p>
  
