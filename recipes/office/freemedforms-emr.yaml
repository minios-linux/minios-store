id: freemedforms-emr
name: FreeMedForms EMR
description: Open source Electronic Medical Record manager
longDescription: |
  <p>The FreeMedForms project provides a set of medical applications to help health professionals in their day-to-day practice. It is developed by an international community of medical doctors and computer specialists.</p>
  <p>The main objective of FreeMedForms electronic medical records is to manage the EMR based on your medical practice or the practice of clinical research groups.</p>
  
categoryId: office
