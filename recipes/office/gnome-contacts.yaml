id: "gnome-contacts"
name: Contacts
description: A contacts manager for GNOME
longDescription: |
  <p>Contacts keeps and organize your contacts information. You can create,
        edit, delete and link together pieces of information about your contacts.
        Contacts aggregates the details from all your sources providing a
        centralized place for managing your contacts.</p>
  <p>Contacts will also integrate with online address books and automatically
        link contacts from different online sources.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-contacts
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - friends
  - address book
