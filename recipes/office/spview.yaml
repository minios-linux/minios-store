id: "spview"
name: Spview
description: Spectrum Viewer
longDescription: |
  <p>SPVIEW is a multiplatform Java application that allows graphical assignment of high-resolution molecular spectra. It is possible to load, display and manipulate experimental and simulated spectra (XY ASCII format) as well as stick spectra in various formats (including HITRAN format).</p>
  
