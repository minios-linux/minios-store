id: "gtg"
name: Getting Things GNOME!
description: Personal tasks and TODO-list items organizer for the GNOME desktop environment.
longDescription: |
  <p>Getting Things GNOME! is an organizer for the GNOME desktop environment. GTG focuses on usability and ease of use. Its main objective is to provide a simple and yet flexible organization tool for life and work.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - gtg
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - organizer
  - task
  - activity
  - plan
  - time
