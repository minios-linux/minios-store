id: wxbanker
name: wxBanker Finance Manager
description: A lightweight personal finance manager
longDescription: |
  <p>wxBanker allows you to easily keep track of balances in accounts. Use wxBanker to add, edit, and remove transactions and accounts, make transfers, search transactions, and view a graph of balances over time. An integrated calculator also makes calculations quick and easy.</p>
  
