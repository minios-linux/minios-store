id: "calligrastage"
name: Calligra Stage
description: Presentation
longDescription: |
  <p>Calligra Stage is an easy to use yet still flexible presentation application.
        You can easily create presentations containing a rich variety of elements, from graphics to text, from charts to
  images. Calligra Stage is extensible through a plugin system,
        so it is easy to add new effects, new content elements or even new ways of managing your presentation. Because of
  the integration with Calligra, all the power and flexibility
        of the Calligra content elements are available to Stage.</p>
  <p>Features:</p>
  <ul>
    <li>Multiple master slides</li>
    <li>Easily switch between slides during a presentation</li>
    <li>Add notes for your slide</li>
    <li>Supports most ODF file transitions</li>
  </ul>
  
