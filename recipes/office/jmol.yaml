id: jmol
name: Jmol
description: Java molecular viewer for three-dimensional chemical structures
longDescription: |
  <p>
        Jmol is a Java molecular viewer for three-dimensional chemical structures. Features include reading a variety of
  file types and output from quantum chemistry programs, and animation of multi-frame files and computed normal modes from quantum programs.  It includes with features for chemicals, crystals, materials and biomolecules.  Jmol might be useful for students, educators, and researchers in chemistry and biochemistry.
      </p>
  <p>
        File formats read by Jmol include PDB, XYZ, CIF, CML, MDL Molfile, Gaussian, GAMESS, MOPAC, ABINIT, ACES-II, Dalton
  and VASP.
      </p>
  
