id: "xiphos"
name: Xiphos
description: Bible Study Guide
longDescription: |
  <p>Xiphos is a program for high-grade Bible study using the modules and
     underlying engine support of The Sword Project.</p>
  <ul>
    <li>Fully integrated, tabbed interface with Bible+commentary+dictionary</li>
    <li>User content support: hierarchical bookmarks, personal verse annotations, journals, prayer lists</li>
    <li>Sword modules provide the widest language coverage of any Bible software anywhere: 400+ Bibles in 150+ languages,
  with major support for original languages (a dozen each in Hebrew and Greek) plus major support in e.g. English, Russian, German, Portuguese, and French</li>
    <li>Interface translated into 26 languages</li>
    <li>Power search capability; footnotes and xrefs; detached windows; text-to-speech support</li>
    <li>Strong&apos;s and morphology support, including pseudo-interlinear display</li>
    <li>BibleSync shared multicast navigation in personal or speaker/audience modes</li>
    <li>Supports Linux and Windows including active support in IRC and mailing lists</li>
  </ul>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - xiphos
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
