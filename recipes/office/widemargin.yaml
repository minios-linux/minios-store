id: widemargin
name: Wide Margin
description: Simple Bible Application
longDescription: |
  <p>Wide Margin is a bible reading and study application. It has a focus on speed and simplicity. Features include, as you type searching and passage navigation, familiar browser based interface, full navigation history and a built in reading planner which will have you read the old testament once and the new testament twice every year.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
