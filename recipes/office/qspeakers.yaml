id: "qspeakers"
name: QSpeakers
description: Simulate an optimizes common loudspeaker enclosures
longDescription: |
  <p>QSpeakers is a simple graphical program that simulates common acoustical enclosures behaviour to help designing loudspeaker systems, based on the loudspeaker driver&apos;s Thiele / Small parameters and the chosen enclosure type.</p>
  <p>This software is mostly useful for do-it-yourself loudspeaker enthusiasts, acoustics teaching, and to a lesser extent, for loudspeaker engineering.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - qspeakers
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
