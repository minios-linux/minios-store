id: "engauge-digitizer"
name: Engauge Digitizer
description: interactively convert a bitmap graph or map into numbers
longDescription: |
  <p>The Engauge Digitizer tool assists in interactively extracting numbers
  			from images of graphs. Conceptually, it is thus the opposite of a
  			graphing tool that converts data points to graphs. It provides assistance
  			in enhancing the image quality and matching the data points. Engauge
  			Digitizer is used by individuals such as grad students and researchers as
  			well as engineers and employees in large government and commercial
  			organizations for processing single files but also managing databases of
  			thousands of image files.</p>
  <p>Features of Engauge Digitizer include:</p>
  <ul>
    <li>Automatic grid line removal</li>
    <li>Automatic point and axis matching</li>
    <li>Automatic curve tracing</li>
    <li>Image processing for separating important details from background information</li>
    <li>A wizard providing an interactive tutorial to explain the basic steps</li>
    <li>Multiple coordinate systems in the same image can be digitized in advanced mode</li>
    <li>Cubic spline interpolation between points gives more accurate curves with fewer points</li>
    <li>Handling of cartesian, polar, linear and logarithmic graphs</li>
    <li>Support for drag-and-drop and copy-and-paste</li>
    <li>Context-sensitive help, user manual and tutorials explaining every feature</li>
    <li>Preview windows to give immediate feedback while modifying settings</li>
    <li>Automated line and point extraction to rapidly digitize data</li>
  </ul>
  
