id: "spim"
name: xSPIM
description: Graphical MIPS32 Assembly language emulator
longDescription: |
  <p>Emulates a MIPS R2000/R3000 processor in software. Useful for students who are taught MIPS R2000/R3000 assembly.</p>
  <p>SPIM S20 is a software simulator that runs assembly language programs for the MIPS R2000/R3000 RISC computers.  SPIM can read and immediately run files containing assembly language statements.  SPIM is a self-contained system for running these programs and contains a debugger and interface to the operating system.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - spim
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
