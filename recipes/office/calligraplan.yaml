    thumbnailUrl: org/kde/calligraplan.desktop/cb8d79152690530068d4e0021fccd804/screenshots/image-1_624x428.png
    width: 956
    height: 656
iconSources:
  - url: org/kde/calligraplan.desktop/cb8d79152690530068d4e0021fccd804/icons/128x128/calligraplan_calligraplan.png
    width: 128
    height: 128
homepage: "https://www.calligra.org/plan/"
