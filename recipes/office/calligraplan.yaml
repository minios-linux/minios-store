id: "calligraplan"
name: Plan WorkPackage Handler
description: Work Package handler for the Plan project planning tool
longDescription: |
  <p>Plan is a project management application, allowing for the planning and scheduling of projects. It was formerly known as KPlato.</p>
  <p>This package is part of the Calligra Suite.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - calligraplan
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
screenshotSources:
