id: gbirthday
name: GBirthday
description: Birthday reminder for E-Mail contacts
longDescription: |
  <p>GBirthday is an applet to help you remember your friends&apos; and contacts&apos; birthdays.  It uses the notifcation area for alerts.  Data can be stored in a number of address book formats, flat file CSV and MySQL database.</p>
  
