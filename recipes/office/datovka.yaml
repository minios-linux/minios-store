id: datovka
name: Datovka
description: A free graphical user interface for Datove schranky
longDescription: |
  <p>Datovka is a multiplatform desktop application to access Datove schranky.</p>
  <p>Datovka allows receiving, sending, and checking integrity of messages,
  			exporting proofs of delivery or full messages, exporting complete
  			coresspondence for a defined period, etc..</p>
  <p>The user interface is very similar to common e-mail clients.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - datovka
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
