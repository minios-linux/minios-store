id: shelxle
name: ShelXle
description: A Qt GUI for SHELX
longDescription: |
  <p>ShelXle combines an editor with syntax highlighting for the SHELXL-associated .ins (input) and .res (output) files with an interactive graphical display for visualization of a three-dimensional structure including the electron density (Fo) and difference density (Fo-Fc) maps.</p>
  <p>http://dx.doi.org/10.1107/S0021889811043202</p>
  
