id: hdfview
name: hdfview
description: HDF4/5 Data Browser
longDescription: |
  <p>HDF is a versatile data model that can represent very complex data objects and a wide variety of metadata. It is a completely portable file format with no limit on the number or size of data objects in the collection.</p>
  <p>This package provides a HDF4/HDF5 viewer.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - hdfview
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
