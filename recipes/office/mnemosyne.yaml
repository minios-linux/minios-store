id: mnemosyne
name: Mnemosyne
description: A flash card program to make your review process more efficient
longDescription: |
  <p>The Mnemosyne software resembles a traditional flash-card program to help you memorise question/answer pairs, but with an important twist: it uses a sophisticated algorithm to schedule the best time for an item to come up for review. Difficult items that you tend to forget quickly will be scheduled more often, while Mnemosyne won&apos;t waste your time on things you remember well.</p>
  
