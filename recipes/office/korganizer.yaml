id: "korganizer"
name: KOrganizer
description: KOrganizer is a calendar and scheduling application
longDescription: |
  <p>KOrganizer is the calendar and scheduling component of the Kontact suite.
        You can write journal entries, schedule appointments, events, and to-dos.</p>
  <p>Features:</p>
  <ul>
    <li>Support for multiple calendars and todo lists</li>
    <li>Storage model</li>
    <li>Undo and Redo</li>
    <li>Todo integration with agenda view</li>
    <li>Attachments for events and todos</li>
    <li>Quick todo and event entries</li>
    <li>Plugin for Jewish calendar dates</li>
    <li>Print support</li>
  </ul>
  
categoryId: office
icon: FileText
