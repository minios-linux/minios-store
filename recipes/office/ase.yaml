id: "ase"
name: ASE GUI
description: Atomic Simulation Environment GUI
longDescription: |
  <p>ASE is an Atomic Simulation Environment written in the Python programming language with the aim of setting up, stearing, and analyzing atomic simulations.  ASE is part of CAMPOS, the CAMP Open Source project.</p>
  <p>ASE contains Python interfaces to several different electronic structure codes including Abinit, Asap, Dacapo, Elk, GPAW and SIESTA.</p>
  <p>This package provides the executable scripts.</p>
  
