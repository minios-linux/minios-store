id: python3-navarp
name: Navigation for ARPES
description: NavARP provides a navigation tool for Angle Resolved Photoemission spectroscopy data.
longDescription: |
  <p>NavARP provides a navigation tool for Angle Resolved Photoemission spectroscopy data.  NavARP is a companion app during ARPES data acquitision (as in beamtime) and set of dedicated libraries helping to get high quality figures for publication.</p>
  <p>This package installs the navarp utility for Python 3.</p>
  
