id: dlume
name: Dlume
description: Simple and easy to use addressbook
longDescription: |
  <p>Dlume is a simple, gtk2-based addressbook. You can easily add, edit and delete records to/from an XML-format database. The Quick-search feature allows you find required entry in comfortable way. Export to CSV and HTML formats is also available. Interface design was borrowed and improved from Paddress &lt;https://paddress.sourceforge.net&gt;.</p>
  
categoryId: office
