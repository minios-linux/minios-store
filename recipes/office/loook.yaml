id: loook
name: Loook
description: Search strings in ODF documents
longDescription: |
  <p>You can look for strings in all ODF text documents, spreadsheets, presentations, drawings and forms.  E.g. from OpenOffice.org, Libreoffice, Apache OpenOffice and other programs, creating ODF files.</p>
  <p>Loook has a convenient graphical user interface.</p>
  
