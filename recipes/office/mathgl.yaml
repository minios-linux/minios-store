id: mathgl
name: mgllab
description: Data handling and plotting tool
longDescription: |
  <p>A free cross-platform library of fast C++ routines for plotting data in up to 3 dimensions. It can export plots to bitmaps and vector EPS, SVG, IDTF files. There are simple window interfaces based on GLUT, FLTK and/or Qt. MathGL can also be used in the console. There are interfaces to a set of languages, such as, C, Fortran, Pascal, Forth, Python, Octave.</p>
  <p>This package contains MathGL utilities and examples.</p>
  
categoryId: office
