id: "crow-translate"
name: Crow Translate
description: A simple and lightweight translator
longDescription: |
  <p>
        Crow Translate is a simple and lightweight translator written in C++ / Qt
        that allows you to translate and speak text using Google, Yandex, Bing,
        LibreTranslate and Lingva translate API.
      </p>
  <p>Features:</p>
  <ul>
    <li>Translate and speak text from screen or selection</li>
    <li>Support 125 different languages</li>
    <li>Low memory consumption (~20MB)</li>
    <li>Highly customizable shortcuts</li>
    <li>Command-line interface with rich options</li>
    <li>D-Bus API</li>
    <li>Available for Linux and Windows</li>
  </ul>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - crow-translate
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - google
  - yandex
  - text-to-speech
