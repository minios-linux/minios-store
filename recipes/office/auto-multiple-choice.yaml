id: "auto-multiple-choice"
name: Auto Multiple Choice
description: Multiple choice papers management
longDescription: |
  <p>
        Auto Multiple Choice is a piece of software that can help you
        creating and managing multiple choice questionnaires (MCQ), with
        automated marking from the papers' scans (using Optical Mark
        Recognition).
      </p>
  <p>
        Questions and answers can be randomly shuffled, so that each
        answer sheet is unique. Using this feature, it is more difficult
        for students to copy on their neighbour's sheets…
      </p>
  <p>
        Answers sheets are formatted with LaTeX, allowing mathematical
        formulas and many other potential uses, but you can also write
        your questions using a simple plain text syntax.
      </p>
  
categoryId: office
icon: FileText
