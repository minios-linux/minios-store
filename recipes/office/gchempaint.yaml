id: "gchempaint"
name: GChemPaint
description: Edit chemical 2D structures
longDescription: |
  <p>GChemPaint is an editor for 2D chemical structures with a multiple document interface. Drawn molecules can be searched at NIST Webbook and PubChem.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
