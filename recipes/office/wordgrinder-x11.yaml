id: wordgrinder-x11
name: WordGrinder
description: Word processor for processing words
longDescription: |
  <p>WordGrinder is a simple, Unicode-aware word processor. It supports basic paragraph styles, character styles, just enough screen markup to be useful, and is driven via an easy to use menu interface.</p>
  <p>This version runs on X.</p>
  
