id: "wmforecast"
name: wmforecast
description: A weather dockapp for Window Maker using the Yahoo Weather API
longDescription: |
  <p>wmforecast is a weather dockapp for Window Maker. It displays the current temperature and an icon representing the current conditions.  A balloon tooltip displays forecast information.  The weather information comes from the Yahoo Weather API.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - wmforecast
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - weather
  - dockapp
  - window maker
