id: agenda-app
name: SimpleAgenda
description: Simple agenda and calendar application for GNUstep
longDescription: |
  <p>SimpleAgenda is a an application to manage your calendars.  It handles both local and remote (webcal) calendars.  Calendars can be shared with other programs like Evolution, Dates, IceApe Calendar and others.  The following features are available:</p>
  <p> * Multiple agendas.  * Handle both events and tasks.  * Support for local and remote (ftp, http) iCalendar agendas.  * Monthly calendar, day view, summary and tasks view.  * Create, resize and move appointments easily.  * Export individual elements as files and to the pasteboard.  * Import .ics files.  * Simple text search.  * Alarms with multiple backends.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - agenda.app
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - calendar
iconSources:
  - cached: agenda.app_app-icon.png
    width: 64
    height: 64
enabled: true
order: 99
