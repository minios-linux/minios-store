id: gretl-common
name: gretl
description: Econometrics package
longDescription: |
  <p>The GNU Regression, Econometric and Time-Series Library (gretl) is a software package for econometric analysis.  The package comprises a shared library, a command-line client program, and a graphical client built using GTK+.</p>
  <p>This package provides scripts (included in the gretl sources) which are used by the main gretl program.</p>
  
