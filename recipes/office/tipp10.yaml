id: "tipp10"
name: Tipp10
description: Touch Typing Tutor
longDescription: |
  <p>Tipp10 is a free touch typing tutor.
      The ingenious thing about the software is its intelligence feature.
      Characters that are mistyped are repeated more frequently.
      Touch typing has never been so easy to learn.</p>
  
