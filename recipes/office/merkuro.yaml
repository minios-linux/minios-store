id: "merkuro"
name: Merkuro
description: "Manage your tasks, events and contacts with speed and ease"
longDescription: |
  <p>Merkuro is a calendar and contact application that allows you to manage your tasks, events and contacts. Merkuro supports both local calendars as well as a multitude of online calendars: Nextcloud, Google® Calendar, Outlook®, Caldav, and many more.</p>
  <p>Merkuro was built with the idea to be usable on desktop, on mobile and everything in between.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - merkuro
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - kalendar, merkuro, events
