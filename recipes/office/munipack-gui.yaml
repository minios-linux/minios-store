id: "munipack-gui"
name: Munipack
description: A general astronomical image processing software
longDescription: |
  <p>Munipack is a general astronomical photometry software package. Currently implements functions for standard photometry processing (photometry reductions - dark, flat), aperture  photometry, astrometry and photometry calibration, accessing Virtual observatory, etc.</p>
  <p>This package provides &quot;xmunipack&quot; command which offers graphical user interface for Munipack.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - munipack-gui
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - image
  - photometry
  - astrometry
