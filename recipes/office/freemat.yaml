id: freemat
name: FreeMat
description: A free environment for rapid engineering and scientific prototyping and data processing
longDescription: |
  <p>FreeMat is a free environment for rapid engineering and scientific prototyping and data processing. It is similar to commercial systems such as MATLAB from Mathworks, and IDL from Research Systems, but is Open Source. FreeMat is available under the GPL license.</p>
  
