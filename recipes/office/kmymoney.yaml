id: "kmymoney"
name: KMyMoney
description: Personal Finance Manager
longDescription: |
  <p>KMyMoney is a personal finance manager by KDE. It comes with a large set of features while being easy to use for the non-technical user.</p>
  <p>It supports different account types, categorisation of expenses and incomes, reconciliation of bank accounts and import/export to the “QIF” file format.
        Direct download using the OFX and HBCI formats is also possible via plugins.
        Online banking support (statement download) is also provided for the OFX and HBCI protocols.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - kmymoney
distributions:
