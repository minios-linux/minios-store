id: calligra
name: Calligra
description: All-in-one office solution
longDescription: |
  <p>
        Calligra is an office and graphics suite. It contains applications for word processing, spreadsheets, presentation
  and vector graphics.
      </p>
  <p>
        Words is an intuitive word processor and desktop publisher application.
        With it, you can create informative and attractive documents with pleasure and ease.
      </p>
  <p>
        Calligra Sheets is a fully-featured calculation and spreadsheet tool.
        Use it to quickly create and calculate various business-related spreadsheets, such as income and expenditure, employee
  working hours, etc.
      </p>
  <p>
        Calligra Stage is an easy to use yet still flexible presentation application.
        You can easily create presentations containing a rich variety of elements, from graphics to text, from charts to
  images. Calligra Stage is extensible through a plugin system,
        so it is easy to add new effects, new content elements or even new ways of managing your presentation. Because of
  the integration with Calligra, all the power and flexibility
        of the Calligra content elements are available to Stage.
      </p>
  <p>
        Karbon is a vector drawing application with a user interface that is easy to use, highly customizable and extensible.
        That makes Karbon a great application for users starting to explore the world of vector graphics as well as for
  artists
        wanting to create breathtaking vector art.
      </p>
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - calligra
distributions:
  include:
    - name: trixie
      architectures: [amd64]
