id: "opencpn"
name: OpenCPN
description: Open source chart plotter / navigator
longDescription: |
  <p>Chart Plotter and Navigational software program for use underway or as a planning tool. Developed by a team of active sailors using real world conditions for program testing and refinement. By default supports raster and vector formats like BSB and S63. Support for many other formats are available in plugins. Other plugins provides support for e. g., AIS, radar and weather maps. Application has language support in 20+ languages.</p>
  <p>This package contains programs, libraries and some support files.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - opencpn
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
