id: "sagemath-jupyter"
name: SageMath
description: Computer Algebra System (Jupyter Notebook)
longDescription: |
  <p>SageMath is a free open-source mathematics software system licensed under the GPL. It builds on top of many existing open-source packages: NumPy, SciPy, matplotlib, Sympy, Maxima, GAP, FLINT, R and many more. Access their combined power through a common, Python-based language or directly via interfaces or wrappers.</p>
  <p>Mission: Creating a viable free open source alternative to Magma, Maple, Mathematica and Matlab.</p>
  <p>This package contains the Jupyter kernel of SageMath.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - sagemath-jupyter
distributions:
  include:
