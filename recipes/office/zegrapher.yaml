id: "zegrapher"
name: ZeGrapher
description: Fast and intuitive math graphing software
longDescription: |
  <p>ZeGrapher is an ergonomic, intuitive and fast software for plotting
          mathematical objects (functions, sequences, parametric equations)
          and experimental data on the plane (with polynomial fitting, CSV
          import/export).</p>
  <p>Here is what Zegrapher v3.0 can offer you:
          Visualize up to six functions simultaneously. All the usual functions can be called: they&apos;re all written on a virtual keyboard. 
                  On a given function, others can be called, so it is possible to associate or compose functions.Numerical sequence plotting, they can be defined by a recurrent relation or explicitly.Parametric equation plotting. The curves can be animated, with adjustable smoothness (frame rate) and speed (ms per step).Experimental data plot and polynomial fit (regression). Data can be imported/exported from a CSV file.
              Parametric plot for functions, sequences and parametric equations: the parameter symbol to use is &quot;k&quot;.
              Plot tangents: they can be moved and resized simply with the mouse.
              Plot derivatives and antiderviatives.
              Print the graph, with the following options :
              Choose the size and the position of the graph on the sheet.Print in color or gray-scale.Export on a PDF file.
              Export to all common image formats (png, jpeg, tiff, gif...).
              Display a table of values with different options.
              Navigate on the graph :
              Select a curve to display the coordinates of its points.Zoom/unzoom on each axis separately or together, with the mouse on a point, or on a rectangular region.Move the graph.
              Customize the presentation :
              Change all the colors: axes, background, functions...Chose the program&apos;s and graph&apos;s fontAdjust the plotting precision. Note that it will also affect rendering speed.Show/hide a grid.Activate/deactivate curves&apos; smoothing.Plot the graph on an orthonormal basis.</p>
  
