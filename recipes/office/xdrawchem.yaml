id: xdrawchem
name: xdrawchem
description: Chemical structures and reactions editor
longDescription: |
  <p>Xdrawchem is a 2D editor for chemical structures and reactions.  It mirrors the abilities of the commercial ChemDraw suite and has file compatibility with it as well as other chemical formats through OpenBabel.</p>
  <p>This packaged version comes from a fork available at https://gitlab.com/yamanq/xdrawchem, as the previous version was no longer actively maintained. More information about it in the copyright file.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - xdrawchem
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: xdrawchem_xdrawchem.png
    width: 64
    height: 64
enabled: true
order: 99
