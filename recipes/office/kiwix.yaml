id: "kiwix"
name: Kiwix
description: View offline content
longDescription: |
  <p>
        Kiwix is an offline reader - meaning that it allows you to check text or video that is normally only available on
  the internet.
      </p>
  <p>
        We turn various online educational contents (such as Wikipedia, for example) into ZIM files, and these can be opened
  by Kiwix even if you have no connectivity whatsoever.
      </p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - kiwix
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - zim
