id: sugar-calculate-activity
name: Calculate
description: "This is the place to get the answer to a quick problem, but that is not the limit! You can also explore Algebra, Trigonometry, Boolean and more!"
longDescription: |
  <p>Sugar Learning Platform promotes collaborative learning through Sugar Activities that encourage critical thinking, the heart of a quality education. Designed from the ground up especially for children, Sugar offers an alternative to traditional &quot;office-desktop&quot; software.</p>
  <p>Learner applications in Sugar are called Activities. They are software packages that automatically save your work - producing specific instances of the Activity that can be resumed at a later time. Many Activities support learner collaboration, where multiple learners may be invited to join a collective Activity session.</p>
  <p>The Calculate Activity is an infix-notation graphing calculator. Type an expression or select components from the toolbars, and press Return to evaluate it.</p>
  
