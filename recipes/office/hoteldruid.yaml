id: "hoteldruid"
name: HotelDruid
description: Property management system for hotels
longDescription: |
  <p>HotelDruid is designed to make hotel rooms, bed and breakfast apartments,
     or any other kind of daily rental easy to manage from a web browser.</p>
  <p>Main features:</p>
  <ul>
    <li>automatic assignment of reservations to rooms by user-defined rules</li>
    <li>creation of public web pages displaying room availability, etc.</li>
    <li>saving, printing, and emailing of documents and invoices</li>
    <li>electronic point of sale</li>
    <li>management of groups and privileges for multi-user operation</li>
    <li>generation of statistical reports</li>
  </ul>
  <p>It uses an SQLite database by default but can be configured for use
     with MySQL or PostgreSQL.</p>
  
