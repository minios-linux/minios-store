id: snek
name: Snek Development Environment
description: Edit and test Snek programs for Arduino
longDescription: |
  <p>Snek is a small python-like language designed for embedded computers. It can run on systems as small as an Arduino Duemilanove board, which is an ATmega 328 processor with 32kB of flash and 2kB of ram. This package includes binaries and installation tools for many targets along with the snekde integrated development environment.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
