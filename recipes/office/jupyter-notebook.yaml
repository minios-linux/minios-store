id: jupyter-notebook
name: Jupyter Notebook
description: Run Jupyter Notebook
longDescription: |
  <p>The Jupyter Notebook is a web application that allows you to create and share documents that contain live code, equations, visualizations, and explanatory text. The Notebook has support for multiple programming languages, sharing, and interactive widgets.</p>
  <p>This package provides the jupyter subcommands &quot;notebook&quot;, &quot;nbextension&quot;, &quot;serverextension&quot; and &quot;bundlerextension&quot;.</p>
  
