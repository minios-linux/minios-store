id: "marble"
name: Marble
description: Virtual Globe
longDescription: |
  <p>Marble is a virtual globe and world atlas — your swiss army knife for maps.</p>
  <p>Explore the neighborhood with Marble&apos;s rich set of city and street level maps. Search for addresses and places of interest. Marble takes care of querying various search backends and presents their results in a unified view. Calculate pedestrian, bike and motorcar routes with ease — online and offline, with an arbitrary number of via points.</p>
  <p>Start exploring the world. View clouds and sun shadow, follow satellites and space stations and display their orbits, all updated in real-time. Travel back in time and learn about historic views of our planet using maps from past centuries. Earth is not enough? Marble also offers maps of the moon and other planets.</p>
  
