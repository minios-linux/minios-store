id: monteverdi
name: Monteverdi
description: Remote sensing image processing application based on OrfeoToolbox
longDescription: |
  <p>ORFEO Toolbox (OTB) is distributed as an open source library of image processing algorithms. OTB is based on the medical image processing library ITK and offers particular functionalities for remote sensing image processing in general and for high spatial resolution images in particular.</p>
  <p>This package contains the monteverdi and mapla graphical applications.</p>
  
