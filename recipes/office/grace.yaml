id: "grace"
name: Grace
description: An XY plotting tool
longDescription: |
  <p>Grace is a point-and-click tool that allows the user to draw X-Y plots. This is the program formerly known as Xmgr.</p>
  <p>A few of its features are: User defined scaling, tick marks, labels, symbols, line styles, colors, polynomial regression, splines, running averages, DFT/FFT, cross/auto-correlation, batch mode for unattended plotting, and hardcopy support for PostScript, FrameMaker and several image formats.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - grace
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
