id: "zathura"
name: Zathura
description: A minimalistic document viewer
longDescription: |
  <p>Zathura is a highly customizable and functional document viewer. It
        provides a minimalistic and space saving interface as well as an easy
        usage that mainly focuses on keyboard interaction. Zathura makes it
        possible to completely view and navigate through documents without using a
        mouse.</p>
  <p>Zathura can be extended to support multiple document formats using
        plugins. Other features include:
        SyncTeX forward and backward synchronization support.Stöd för SyncTeX-framåt- och -bakåtsynkronisering.SyncTeX vooruit-
  en achteruitsynchronisatie.Unterstützung für SyncTeX-Synchronisation.Podpora pro dopředné a zpětné seřízení SyncTeX.Quickmarks and bookmarks.Snabbmärken och bokmärken.Verwijzingen en bladwijzers.Markierungen und Lesezeichen.Rychlé značky a záložky.Automatic document reloading.Läs automatisk om dokument.Automatische documentherlading.Automatisches Neuladen von Dokumenten.Automatické znovunahrání dokumentu.</p>
  
