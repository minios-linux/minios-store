id: "setzer"
name: Setzer
description: Simple yet full-featured LaTeX editor
longDescription: |
  <p>Setzer lets you Write LaTeX documents with an easy to use yet full-featured editor.</p>
  <p>Features include:</p>
  <ul>
    <li>Buttons and shortcuts for many LaTeX elements and special characters</li>
    <li>Comfortable document creation wizard</li>
    <li>Dark mode</li>
    <li>Helpful error messages in the build log</li>
    <li>Looks great on the Gnome desktop</li>
    <li>Good screen to content ratio</li>
    <li>Arguably the best .pdf viewer of any LaTeX editor</li>
  </ul>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - setzer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - latex
  - bibtex
  - editor
