id: pytrainer
name: pytrainer
description: The Free Sport Training Center
longDescription: |
  <p>Pytrainer is a desktop application for logging and graphing sporting activities such as running or cycling sessions. Data can be imported from GPS devices, files or input manually. Currently pytrainer supports GPX, TCX and FIT files.</p>
  
