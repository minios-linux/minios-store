id: "kalgebramobile"
name: KAlgebra Mobile
description: Pocket Math Expression Solver and Plotter
longDescription: |
  <p>KAlgebra is a algebraic graphing calculator with support for 3D graphing and MathML markup language. This is the version for small touch based interfaces</p>
  <p>This package is part of the KDE education module.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - kalgebramobile
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
