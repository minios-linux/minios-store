id: "kaddressbook"
name: KAddressBook
description: An address book manager
longDescription: |
  <p>KAddressBook stores all the personal details of your family, friends and other contacts.</p>
  <p>Features:</p>
  <ul>
    <li>Imports and exports to nearly every address book standard</li>
    <li>Reads .vcf format files, and can import and export vCards and csv format files</li>
    <li>Can use multiple LDAP servers</li>
    <li>Configurable filters and powerful search capabilities</li>
    <li>Integrates with other Kontact components, e.g. exporting Birthday reminders to KOrganizer</li>
    <li>Capable of groupware integration</li>
    <li>Powered by Akonadi</li>
  </ul>
  
categoryId: office
icon: FileText
