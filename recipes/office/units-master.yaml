id: units-master
name: Units-master
description: A powerful units converter for science and engineering
longDescription: |
  <p>Units-master is a graphic application with three features:  - check the syntax of a physical quantity, like &quot;25 m/s&quot;, or &quot;1.2 µA&quot;  - perform conversions, like &quot;1.2 µA&quot; to &quot;1.2e-3 mA&quot;  - render physical quantities to plain LaTeX, PNG, SVG.</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
packages:
  - units-master
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
