id: "survex-aven"
name: Aven Cave Surveying Tool
description: Visualise cave surveys
longDescription: |
  <p>An advanced cave survey data viewer for Survex, written using the wxWidgets library, and using OpenGL for rendering.  Aven allows searching for stations, highlighting categories of stations such entrances or fixed points, measuring the distance between stations, showing passage walls, showing the terrain above the cave, and supports presentations (pre-recorded fly-throughs).</p>
  
