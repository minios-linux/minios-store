id: "hdate-applet"
name: Hdate
description: Hebrew desktop calendar
longDescription: |
  <p>A GNOME desktop applet providing an Hebrew calendar that gives the user easy access to the Jewish calendar (including Hebrew date, parasha, sunset and sunrise times, holydays and moon phase).</p>
  
categoryId: office
icon: FileText
method: apt
level: "auto"
compression: zstd
