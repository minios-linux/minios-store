  - hdate-applet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - url: g/gh/ghcal.desktop/D00321B382CD58662FD84949FB387575/icons/128x128/hdate-applet_gnome-calendar.png
    width: 128
    height: 128
