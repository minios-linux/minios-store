id: "josm"
name: JOSM
description: Java OpenStreetMap Editor
longDescription: |
  <p>JOSM is an extensible off-line editor for ​OpenStreetMap (OSM) written in ​Java.</p>
  <p>It supports loading stand-alone GPX tracks and GPX track data from the OSM database as well as loading and 
      editing existing nodes, ways, metadata tags and relations from the OSM database.</p>
  
