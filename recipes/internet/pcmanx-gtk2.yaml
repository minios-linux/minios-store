id: pcmanx-gtk2
name: PCManX BBS Client
description: PCManX BBS Client
longDescription: |
  <p>PCManX is a newly developed GPL&apos;d version of PCMan, a full-featured famous BBS client. It aimed to be an easy-to-use yet full-featured telnet client facilitating BBS browsing with the ability to process double-byte characters. Some handy functions like tabbed-browsing, auto-login and a built-in ANSI editor enabling colored text editing are also provided.</p>
  <p>This version is developed with pure gtk2 and xft, thus has much low dependency.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - pcmanx-gtk2
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
iconSources:
