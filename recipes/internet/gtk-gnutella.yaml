id: gtk-gnutella
name: gtk-gnutella
description: Access the Gnutella and G2 network via this servent
longDescription: |
  <p>gtk-gnutella allows you to join the Gnutella and G2 network, search, share
     and download files.</p>
  <p>After joining the network, type-in words in the search area and it will 
     create a search for files shared on the network matching that name.
     You can then click on an entry and attempt to download it.</p>
  <p>It is compatible with all other Gnutella servents from other vendors: 
     it will join the same network and exchange with others seamlessly.</p>
  <p>Highlights:</p>
  <ul>
    <li>TLS support for Gnutella and HTTP connections</li>
    <li>UPnP and NAT-PMP support to automatically enable port forwarding</li>
    <li>Distributed Hash Table (DHT) to find alternate locations and 
         push-proxies</li>
    <li>Powerful filtering engine</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gtk-gnutella
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
