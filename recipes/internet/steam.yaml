longDescription: |
  <p>Steam (http://www.steampowered.com) is a software content delivery system developed by Valve software (http://www.valvesoftware.com).  There is some free software available, but for the most part the content delivered is non-free.</p>
  <p>This package comes with a fairly substantial non-free license agreement that must be accepted before installing the software.  If you have any opposition to non-free work, please select &quot;I DECLINE&quot; during the package installation dialogs.   There are also additional agreements in various parts of the application that differ from the original agreement.  In other words, pay attention and read carefully if you&apos;re worried about your rights.</p>
  
