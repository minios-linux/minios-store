id: "gnunet-gtk"
name: GNUnet Secured P2P
description: Share files using GNU's anonymous and censorship-resistant network
longDescription: |
  <p>GNUnet is a framework for secure peer-to-peer networking that does not use any centralized or otherwise trusted services. Its high-level goal is to provide a strong free software foundation for a global network that provides security and in particular respects privacy.</p>
  <p>GNUnet started with an idea for anonymous censorship-resistant file-sharing, but has grown to incorporate other applications as well as many generic building blocks for secure networking applications. In particular, GNUnet now includes the GNU Name System, a privacy-preserving, decentralized public key infrastructure.</p>
  <p>This package contains the graphical client, using the GTK+ toolkit. In order use GNUnet, you also need gnunet either on your server or on your local machine.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gnunet-gtk
