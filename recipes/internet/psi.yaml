id: "psi"
name: Psi
description: Communicate over the XMPP network
longDescription: |
  <p>Psi is a free instant messaging application designed for the Jabber (XMPP) IM network (including Google Talk). It has full Unicode support, and supports many important XMPP features like file transfer, group chat, encryption etc.</p>
  
