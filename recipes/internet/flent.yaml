id: "flent"
name: Flent
description: The FLExible Network Tester
longDescription: |
  <p>The FLExible Network Tester: Python wrapper to run multiple simultaneous netperf/iperf/ping instances and aggregate the results.</p>
  <p>Tests are specified as config files (which are really Python), and various parsers for tool output are supplied. At the moment, parsers for netperf in -D mode, iperf in csv mode and ping/ping6 in -D mode are supplied, as well as a generic parser for commands that just outputs a single number.</p>
  <p>Several commands can be run in parallel and, provided they output timestamped values, (which netperf ping and iperf do, the latter with a small patch, available in the misc/ directory), the test data points can be aligned with each other in time, interpolating differences between the actual measurement points. This makes it possible to graph (e.g.) ping times before, during and after a link is loaded.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
