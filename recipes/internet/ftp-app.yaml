id: ftp-app
name: FTP
description: FTP client for GNUstep
longDescription: |
  <p>This is a file transfer application (RFC 765) featuring a compact and easy interface. As most applications in GAP it tries to work on both GNUstep and MacOS X and retain the utmost possible similarity among the two version to ease working in both environments.</p>
  <p>FTP supports different port arbitration modes: &quot;default&quot;, standard &quot;PORT&quot; (also known as active) and standard &quot;PASV&quot; (also known as passive).</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - ftp.app
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ftp
  - transfer
iconSources:
  - cached: ftp.app_FTP_icon_osx_128x128x32.png
    width: 64
    height: 64
enabled: true
order: 99
