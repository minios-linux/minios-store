id: "qtscrob"
name: QTScrobbler
description: QTScrobbler is tool for submitting .scrobbler.log from portable players to Last.fm
longDescription: |
  <p>qtscrob is a GUI tool which reads playback information from iPods, MTP (aka Plays for Sure) or Rockbox (open source audio player firmware) devices and submits them to an audioscrobbler service, such as &quot;last.fm&quot; or &quot;libre.fm&quot;.</p>
  <p>This is the graphical version of the tool. For a CLI version, see the &apos;scrobbler&apos; package.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - qtscrob
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - scrobbler
  - last.fm
