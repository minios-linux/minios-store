id: "uget"
name: uGet
description: Download multiple URLs and apply it to one of setting/queue.
longDescription: |
  <p>Uget (formerly urlgfe) is a simple, lightweight and easy-to-use download manager. It provides the following features:  * Resume downloads.  * Queue downloads.  * Classify downloads in categories.  * Mozilla Firefox integration (through Flashgot plugin).  * Clipboard monitoring.  * Import downloads import from HTML files.  * Batch download.</p>
  <p>It also can be launched from the command line.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - uget
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - filetransfer
  - download files
  - download manager
iconSources:
  - url: u/ug/uget-gtk.desktop/5dd5fb67e85e070fd81a2e5b7626fc1a/icons/128x128/uget_uget-icon.png
    width: 128
    height: 128
enabled: true
order: 99
