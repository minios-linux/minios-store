id: gnubiff
name: Gnubiff
description: Gnubiff is a mail notification program.
longDescription: |
  <p>gnubiff checks for mail within a file, a qmail or MH style dir, or an IMAP4 or POP3 or APOP server.  It can display headers (number, sender, subject, and date) when new mail has arrived.</p>
  <p>While gnubiff is implemented as a GNOME panel applet, it also runs as an independent icon on the desktop in other environments.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gnubiff
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: gnubiff_gnubiff.png
    width: 64
    height: 64
enabled: true
order: 99
