id: "tuba"
name: Tuba
description: Browse the Fediverse
longDescription: |
  <p>
        Explore the federated social web with Tuba for GNOME. Stay connected to your favorite communities, family and friends
  with support for popular Fediverse platforms like Mastodon, GoToSocial, Akkoma &amp; more!
      </p>
  <p>
        The Fediverse is a decentralized social network that consists of multiple interconnected platforms and communities,
  allowing users to communicate and share content across different networks and servers. It promotes user privacy and data ownership, and offers an alternative to centralized social media platforms.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - tuba
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - toot
  - mastodon
  - fediverse
  - gotosocial
  - pleroma
  - akkoma
