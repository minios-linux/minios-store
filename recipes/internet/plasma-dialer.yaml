id: "plasma-dialer"
name: Phone
description: Send and receive phone calls
longDescription: |
  <p>The Phone app lets you easily send and receive phone calls from your smartphone.</p>
  <p>Features:</p>
  <ul>
    <li>See your call history and easily call the same number again</li>
    <li>Manage your contacts that have a phone number set</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - plasma-dialer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
tags:
  - telephone
  - call
  - phone
  - dial
  - dialer
  - pstn
