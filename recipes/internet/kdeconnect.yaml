id: "kdeconnect"
name: KDE Connect Indicator
description: Display information about your devices
longDescription: |
  <p>Tool to integrate the KDE Plasma Workspace with your smartphones and similar devices. It adds a set of plasmoid, plugins and services to the KDE Plasma Workspace. At the  moment it only supports Android based devices.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - kdeconnect
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
