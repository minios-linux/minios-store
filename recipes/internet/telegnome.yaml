id: telegnome
name: TeleGNOME
description: Viewer for Teletext pages
longDescription: |
  <p>TeleGNOME is a program to display teletext pages over the internet,
        based on image feeds from a variety of broadcasters.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - telegnome
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: telegnome_telegnome.png
    width: 64
    height: 64
homepage: "http://telegnome.sourceforge.net/"
enabled: true
order: 99
