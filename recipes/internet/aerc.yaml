id: "aerc"
name: aerc
description: Launches the aerc email client
longDescription: |
  <p>Some of its more interesting features include:  - Editing emails in an embedded terminal tmux-style, allowing you to check on    incoming emails and reference other threads while you compose your replies  - Render HTML emails with an interactive terminal web browser, highlight    patches with diffs, and browse with an embedded less session  - Vim-style keybindings and ex-command system, allowing for powerful    automation at a single keystroke  - First-class support for working with git &amp; email  - Open a new tab with a terminal emulator and a shell running for easy access    to nearby git repos for parallel work  - Support for multiple accounts, with support for IMAP, Maildir, SMTP, and    sendmail transfer protocols  - Asynchronous IMAP support ensures the UI never gets locked up by a flaky    network, as mutt often does  - Efficient network usage - aerc only downloads the information which is    necessary to present the UI, making for a snappy and bandwidth-efficient    experience 100% free and open source software!</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - aerc
distributions:
  include:
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
