id: meteo-qt
name: Meteo-qt
description: A Qt system tray application for weather information
longDescription: |
  <p>meteo-qt is an application to display weather information in desktop panels, desktop notifications and it&apos;s own window.</p>
  <p>Weather data is taken from OpenWeatherMap (http://openweathermap.org/). The application is based on Python 3 and Qt 5.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - meteo-qt
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: meteo-qt_weather-few-clouds.png
    width: 64
    height: 64
enabled: true
order: 99
