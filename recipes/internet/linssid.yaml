id: "linssid"
name: LinSSID
description: Find local wireless attach points
longDescription: |
  <p>LinSSID is a graphical program that displays locally receivable 802.11 wireless attach points and ad hoc networks.</p>
  <p>A table is displayed with various parameters such as MAC address, channel, and signal strength. Graphs are also displayed with signal strength by channel and signal strength over time.</p>
  <p>LinSSID is graphically and functionally similar to inSSIDer (for Microsoft Windows) and Wifi Analyzer (for Android).</p>
  <p>LinSSID can be used to measure the local performance or to search for an interference free channel to be set in a wireless router (access point or AP). The wireless established link won&apos;t be affected by these operations because LinSSID needn&apos;t set the monitor mode in network interface.</p>
  <p>Some features:</p>
  <p>  - Table of locally receivable attach points with many columns of different     information and sortable and movable columns.   - Adjustable speed, real-time update.   - Graphs of signal strength by channel and over time.   - AP bandwidth displayed.   - Works on both 2.4 GHz and 5 GHz channels.</p>
  
categoryId: internet
