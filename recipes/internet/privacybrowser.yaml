id: "privacybrowser"
name: Privacy Browser
description: A web browser that respects your privacy
longDescription: |
  <p>
              Privacy Browser is a web browser based on Qt WebEngine with a focus on privacy and security.
              Features like JavaScript and cookies are disabled by default but are easy to automatically enable on-the-fly
  or by domain.
          </p>
  
