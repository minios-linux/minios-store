id: "dianara"
name: Dianara
description: A social networking client for the Pump.io network
longDescription: |
  <p>Dianara is a Pump.io client, a desktop application to manage a user&apos;s
     account on the Pump.io distributed social network.</p>
  <p>It allows all the usual things, like creating new posts, commenting on other
     people&apos;s posts, sharing them, following people, editing your profile, etc.
     It can also do many things that the web interface can&apos;t, such as:</p>
  <ul>
    <li>Editing posts and comments</li>
    <li>Adding titles to regular notes</li>
    <li>Uploading audio and video</li>
    <li>Following people, from any server, with a click on their avatar</li>
    <li>Changing the e-mail address associated with your account</li>
  </ul>
  
