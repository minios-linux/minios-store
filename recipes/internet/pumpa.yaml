id: "pumpa"
name: Pumpa
description: pump.io social networking
longDescription: |
  <p>Pumpa is a simple Qt-based desktop client for identi.ca and other pump.io-based distributed social network services.  Pumpa offers several improvements over using the web interface, such as better notifications and the ability to @reply particular users.</p>
  
