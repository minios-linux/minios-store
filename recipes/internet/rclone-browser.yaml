id: "rclone-browser"
name: Rclone Browser
description: Simple cross-platform GUI for rclone
longDescription: |
  <p>This is a GUI for rclone, which is a program to sync files and directories between the local file system and a variety of commercial cloud storage providers.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - rclone-browser
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: r/rc/rclone-browser.desktop/0d7d70a6f534d9ff275a772054109c8c/icons/128x128/rclone-browser_rclone-browser.png
    width: 128
    height: 128
enabled: true
order: 99
