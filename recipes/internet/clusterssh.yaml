id: clusterssh
name: ClusterSSH
description: Control multiple ssh or rsh sessions from a single input window
longDescription: |
  <p>ClusterSSH (cssh, crsh, ctel) allows you to control multiple ssh, rsh or telnet sessions from a single input window.  You can also configure clusters of machines for easy invocation and interact with individual terminal windows during a session.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - clusterssh
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ssh
  - cluster
iconSources:
  - cached: clusterssh_clusterssh.png
    width: 64
    height: 64
enabled: true
order: 99
