id: twpsk
name: twpsk
description: PSK31 for Linux with a openMotif GUI
longDescription: |
  <p>Twpsk uses a soundcard to receive and transmit PSK31, an extremely narrow band HF-mode. PSK31 is a mode for keyboard QSO&apos;s. It offers narrow signal width and gives excellent results with low power and minimal antenna systems.</p>
  
