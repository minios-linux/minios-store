id: putty
name: PuTTY SSH Client
description: Connect to an SSH server with PuTTY
longDescription: |
  <p>This is the Unix port of the popular Windows SSH client, PuTTY. It supports flexible terminal setup, mid-session reconfiguration using Ctrl-rightclick, multiple X11 authentication protocols, and various other interesting things not provided by ssh in an xterm.</p>
  <p>Pageant is an SSH authentication agent, and a tool for communicating with an already-running agent.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - putty
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ssh
  - connect
iconSources:
  - url: p/pu/putty.desktop/46f210445a40c28f4d6528a885b40094/icons/128x128/putty_putty.png
    width: 128
    height: 128
enabled: true
order: 99
