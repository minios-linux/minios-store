id: webhttrack
name: Browse Mirrored Websites
description: Browse Websites Mirrored by WebHTTrack
longDescription: |
  <p>WebHTTrack is an offline browser utility, allowing you to download a World Wide website from the Internet to a local directory, building recursively all directories, getting html, images, and other files from the server to your computer, using a step-by-step web interface.</p>
  <p>WebHTTrack arranges the original site&apos;s relative link-structure. Simply open a page of the &quot;mirrored&quot; website in your browser, and you can browse the site from link to link, as if you were viewing it online. HTTrack can also update an existing mirrored site, and resume interrupted downloads. WebHTTrack is fully configurable, and has an integrated help system.</p>
  <p> Snapshots: http://www.httrack.com/page/21/</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - webhttrack
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
