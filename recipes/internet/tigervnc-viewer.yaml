id: "tigervnc-viewer"
name: TigerVNC Viewer
description: Connect to a remote VNC desktop
longDescription: |
  <p>VNC stands for Virtual Network Computing. It is, in essence, a remote display system which allows you to view a computing `desktop&apos; environment not only on the machine where it is running, but from anywhere on the Internet and from a wide variety of machine architectures.</p>
  <p>This package provides a VNC client for X. With this you can connect to a VNC server and display its content. There are VNC servers available for other operating systems.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - tigervnc-viewer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - remote desktop
  - vnc
