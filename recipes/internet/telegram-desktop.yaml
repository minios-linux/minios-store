id: telegram-desktop
name: Telegram Desktop
description: Official desktop version of Telegram messaging app
longDescription: |
  <p>Telegram is a messaging app with a focus on speed and security, it is super-fast, simple and free. You can use Telegram on all your devices at the same time — your messages sync seamlessly across any number of your phones, tablets or computers.</p>
  
