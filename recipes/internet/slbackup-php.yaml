id: "slbackup-php"
name: slbackup-php
description: Webpage for configuring slbackup
longDescription: |
  <p>Slbackup-php provides the necessary functions to maintain a slbackup repository.</p>
  <p>Features:  - scheduling of slbackup execution;  - editing of the configuration file;  - verifying SSH keys and successful backups;  - restoring from backups;  - removing old backups from the repository.</p>
  
