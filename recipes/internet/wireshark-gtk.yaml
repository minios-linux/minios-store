id: wireshark-gtk
name: Wireshark (GTK+)
description: Network traffic analyzer
longDescription: |
  <p>Wireshark is a network &quot;sniffer&quot; - a tool that captures and analyzes packets off the wire. Wireshark can decode too many protocols to list here.</p>
  <p>This package provides the GTK+ version of Wireshark.</p>
  
categoryId: internet
icon: Shield
method: apt
level: "auto"
compression: zstd
packages:
  - wireshark-gtk
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
