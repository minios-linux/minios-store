id: "qweborf"
name: qweborf
description: Shares files using the HTTP protocol
longDescription: |
  <p>Qweborf provides an easy to use graphical interface to share local files using the HTTP protocol. It can enable writing on the server, webdav, authentication and sending directories as tar.gz. It can try to work across NAT.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
