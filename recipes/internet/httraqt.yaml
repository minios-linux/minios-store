id: httraqt
name: HTTraQt
description: Web copier
longDescription: |
  <p>Program is intended for loading of Internet pages and/or their contents, equipped with flexible system of settings. HTTraQt - graphical user interface (GUI) for HTTrack library, developed in C++ and based on multiplatform Qt library.</p>
  
