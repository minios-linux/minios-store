id: lxi-tools
name: LXI-Tools
description: LXI-Tools is a collection of open source tools for managing network connected LXI compatible test instruments.
longDescription: |
  <p>
        Features include automatic discovery of test instruments, sending SCPI
        commands, grabbing screenshots from supported instruments, benchmarking
        SCPI message performance, and powerful scripting for automation. Both a
        commandline tool and a GUI tool are available.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - lxi-tools
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
