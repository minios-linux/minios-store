id: feedreader
name: FeedReader
description: RSS client for various webservices
longDescription: |
  <p>FeedReader is a program designed to complement an already existing web-based RSS reader account.</p>
  <p>Currently supported services:</p>
  <ul>
    <li>Tiny Tiny RSS</li>
    <li>Feedly</li>
    <li>Nextcloud/ownCloud</li>
    <li>Inoreader</li>
  </ul>
  <p>It combines all the advantages of web based services like syncing across all your devices with everything you expect from
        a modern desktop program: Desktop notifications, fast search and filtering, tagging, sharing to &quot;read-it-later&quot;
  services
        like Pocket and Instapaper, handy keyboard shortcuts and a database that keeps all your old articles as long as
  you
        like.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - feedreader
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - rss
  - feeds
  - reader
  - news
