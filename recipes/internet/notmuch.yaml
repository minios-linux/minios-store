id: "notmuch"
name: Notmuch (emacs interface)
description: Emacs based email client
longDescription: |
  <p>Notmuch is a system for indexing, searching, reading, and tagging large collections of email messages in maildir or mh format. It uses the Xapian library to provide fast, full-text search with a very convenient search syntax.</p>
  <p>This package contains the notmuch command-line interface</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - notmuch
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - mail
  - e-mail
  - email
iconSources:
  - url: n/no/notmuch-emacs-mua.desktop/b169fea8c746b6597120232c9d28e0e2/icons/128x128/notmuch_emblem-mail.png
    width: 128
    height: 128
enabled: true
order: 99
