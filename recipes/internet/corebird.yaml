id: corebird
name: Corebird
description: Twitter Client
longDescription: |
  <p>Corebird is a native GTK+ twitter client that provides vital features such as Direct Messages (DMs), tweet notifications, conversation views.</p>
  <p>Additional features include local viewing of videos, multiple inline images, Lists, Filters, multiple accounts, etc.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - corebird
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
tags:
  - twitter
