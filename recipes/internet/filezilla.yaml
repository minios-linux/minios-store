id: "filezilla"
name: FileZilla
description: "Download and upload files via FTP, FTPS and SFTP"
longDescription: |
  <p>FileZilla is a full-featured FTP client with an easy-to-use GUI.</p>
  <p>It is written in C++ and uses the wxWidgets library.</p>
  <p>FileZilla includes the following features:   * Supports FTP, FTP over SSL/TLS (FTPS) and SSH File Transfer Protocol (SFTP)   * IPv6 support   * Available in more than 40 languages   * Supports resume and transfer of large files &gt;4GB   * Easy to use Site Manager and transfer queue   * Bookmarks   * Drag &amp; drop support   * Speed limits   * Filename filters   * Directory comparison   * Network configuration wizard   * Remote file editing   * Keep-alive   * HTTP/1.1, SOCKS5 and FTP Proxy support   * Logging to file   * Synchronized directory browsing   * Remote file search   * Tabbed interface to connect to multiple servers</p>
  
categoryId: internet
icon: Download
method: apt
level: "auto"
compression: zstd
packages:
  - filezilla
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64]
