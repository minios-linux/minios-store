id: "revolt"
name: Revolt
description: "Better integration of Riot, a Matrix client, with desktop environments"
longDescription: |
  <p>Revolt is a small application which wraps Riot to provide better integration
  			with desktop environments in general, and GNOME in particular:</p>
  <ul>
    <li>Having Riot as a “standalone” application instead of it living in a browser tab</li>
    <li>Persistent notifications (for desktop environments supporting them, i.e. GNOME)</li>
    <li>Notifications are automatically prevented when the Revolt window is focused</li>
    <li>Status icon for desktop environment which have a tray bar applet (XFCE, Budgie, likely many others)</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - revolt
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
