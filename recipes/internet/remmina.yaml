id: "remmina"
name: Remmina
description: Remote Desktop Client
longDescription: |
  <p>Remmina is a remote desktop client written in GTK+, aiming to be useful
        for system administrators and travellers, who need to work with lots of
        remote computers in front of either large monitors or tiny netbooks.</p>
  <p>Remmina supports multiple network protocols in an integrated and
        consistent user interface. The protocols currently supported are:
        RDP (Remote Desktop Protocol), VNC (Virtual Network Computing),
        NX (NoMachine NX / FreeNX), XDMCP (X Display Manager Control Protocol) and
        SSH (Secure Shell / Open SSH).</p>
  <p>External plugins are also supported to add new protocols and features.</p>
  
categoryId: internet
icon: Monitor
method: apt
level: "auto"
compression: zstd
packages:
  - remmina
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
