id: saldo
name: Saldo
description: Check your bank accounts
longDescription: |
  <p>
        An easy way to access your online banking information. Show your balance and transaction based on FinTS online banking
  information.
      </p>
  <p>
        Note: This is a frontend for python-fints. Report non working bank access at python-fints github page.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - saldo
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - network
  - online
  - banking
