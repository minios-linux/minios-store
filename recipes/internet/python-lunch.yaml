id: python-lunch
name: Lunch
description: Distributed Process Launcher
longDescription: |
  <p>Lunch is a simple distributed process launcher and manager for GNU/Linux.</p>
  <p>With Lunch, one can launch software processes on several different computers and make sure they keep running. This software was created to suit the needs of new media artists for live performances and interactive installations. It respawns the software that crash and provides a mean to manage dependencies between running processes.</p>
  <p>This package provides the lunch library for Python. as well as the command-line lunch utility which can be invoked with a GTK+ user interface.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - python-lunch
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
