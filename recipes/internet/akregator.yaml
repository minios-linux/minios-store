id: "akregator"
name: Akregator
description: A news feed reader
longDescription: |
  <p>Akregator is a news feed reader for the KDE desktop. It enables you to follow news sites, blogs and other RSS/Atom-enabled websites without the need to manually
        check for updates using a web browser. Akregator is designed to be both easy to use and to be powerful enough to
  read hundreds of news sources conveniently.
        It comes with Konqueror integration for adding news feeds and with an internal browser for easy news reading.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - akregator
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
