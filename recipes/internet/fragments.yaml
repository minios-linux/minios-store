id: fragments
name: Fragments
description: Manage torrents
longDescription: |
  <p>
        An easy to use BitTorrent client. Fragments can be used to transfer files via the BitTorrent peer-to-peer file-sharing
  protocol, such as videos, music or installation images for Linux distributions.
      </p>
  <ul>
    <li>Overview of all torrents grouped by status</li>
    <li>Schedule the order of downloads with a queue</li>
    <li>Automatic detection of torrent or magnet links from the clipboard</li>
    <li>Manage and access individual files of a torrent</li>
    <li>Connect to remote Fragments or Transmission sessions</li>
  </ul>
  <p>
        Fragments uses the Transmission BitTorrent project under the hood.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - fragments
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - bittorrent
  - torrent
  - magnet
  - download
  - p2p
