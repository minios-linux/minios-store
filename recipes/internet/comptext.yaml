id: comptext
name: comptext
description: Amateur Radio Communications
longDescription: |
  <p>Comptext is used to compare two text streams.  It&apos;s comparison function uses a linear-programming technique. It computes total number of errors, the character error rate (CER) and the bit error rate (BER).</p>
  
