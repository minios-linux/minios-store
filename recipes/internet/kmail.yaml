id: "kmail"
name: KTnef
description: A viewer/extractor for TNEF files
longDescription: |
  <p>KMail supports multiple accounts, mail filtering and email encryption. The program let you configure your workflow and it has good integration into KDE (Plasma Desktop) but is also useable with other Desktop Envionments.</p>
  
