id: kopete
name: Kopete
description: Instant Messenger
longDescription: |
  <p>Kopete is an instant messaging and chat application with support for a wide variety of services, such as AIM, Yahoo, ICQ, MSN, and Jabber.  Advanced features and additional protocols are available as plugins.</p>
  <p>This package is part of the KDE networking module.</p>
  
