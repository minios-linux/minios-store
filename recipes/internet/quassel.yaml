id: "quassel"
name: Quassel IRC
description: Distributed IRC client with central core component
longDescription: |
  <p>Quassel is a modern, cross-platform, distributed IRC client, meaning that one or more clients can attach to and detach from the central core. It&apos;s much like the popular combination of screen and a text-based IRC client such as WeeChat or irssi, but graphical.</p>
  <p>This package provides the monolithic client. It contains both core and client and can be used like a traditional IRC client, without requiring an external core.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - quassel
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
