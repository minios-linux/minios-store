id: "nicotine"
name: Nicotine-Plus
description: SoulSeek filesharing client
longDescription: |
  <p>Nicotine is a client for SoulSeek, a light and efficient file sharing system, written in Python and using the GTK2 toolkit, based on the PySoulSeek project.</p>
  <p>It features uploading, downloading, searching and chatting, with strict bandwidth control, and tries to look like PySoulSeek.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - nicotine
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
