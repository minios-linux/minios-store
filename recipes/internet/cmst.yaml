id: "cmst"
name: cmst
description: A Qt based GUI front end for the connman connection manager with systemtray icon
longDescription: |
  <p>Qt GUI for Connman with system tray icon. The program provides graphical user interface to control the connman daemon.
        The connman daemon must be started as you normally would, this program just interfaces with that daemon.
        You can see what technologies and services connman has found, and for wifi services an agent is registered to assist
  in
        obtaining the information from you necessary to logon the wifi service.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - cmst
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
