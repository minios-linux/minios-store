id: gnome-gmail
name: GNOME GMail
description: Integrate GMail with your desktop
longDescription: |
  <p>GNOME GMail integrates the GMail web interface into the GNOME environment. Once installed, GMail becomes a choice as the default Mail Reader in the GNOME Preferred Applications administration application. When selected, a GMail web page will be used whenever an email service is requested.</p>
  <p>File attachments are supported, as well as the setting of Subject, Cc, Bcc, etc.</p>
  <p>Logout, or launch GNOME GMail, to complete the configuration.</p>
  <p>To demonstrate, select &quot;Send To...&quot; on a file in the File Browser.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-gmail
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
tags:
