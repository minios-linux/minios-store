id: cawbird
name: Cawbird
description: Twitter Client
longDescription: |
  <p>
     Cawbird is a native GTK+ twitter client that provides vital features such as Direct Messages (DMs), tweet notifications,
  conversation views.
    </p>
  <p>
     Additional features include local viewing of videos, multiple inline images, Lists, Filters, multiple accounts, etc.
    </p>
