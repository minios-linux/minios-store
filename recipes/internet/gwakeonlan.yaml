id: "gwakeonlan"
name: gWakeOnLan
description: A GTK+ utility to awake turned off machine using the Wake On LAN feature.
longDescription: |
  <p>gWakeOnLan is a GTK+ utility to awake turned off computers through the Wake on LAN feature. Both local and internet modes are supported.</p>
  <p>The machines to turn on need to be shut off with the Wake on LAN magic packet enabled.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gwakeonlan
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
