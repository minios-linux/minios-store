id: netsurf-gtk
name: NetSurf Web Browser
description: Browse the World Wide Web
longDescription: |
  <p>NetSurf is a multi-platform lightweight web browser. It aims to provide comprehensive rendering of HTML 5 with CSS 2 in a small resource footprint without compromising performance.</p>
  <p>This version uses the GTK+ toolkit.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - netsurf-gtk
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: netsurf-gtk_netsurf.png
    width: 64
    height: 64
enabled: true
order: 99
