id: "qutebrowser"
name: qutebrowser
description: A keyboard-driven web browser
longDescription: |
  <p>qutebrowser is a keyboard-focused browser with a minimal GUI.
  			It was inspired by other browsers/addons like dwb and Vimperator/Pentadactyl,
  			and is based on Python and PyQt5.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - qutebrowser
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - browser
