id: "jdim"
name: JDim 2ch browser
description: JDim is a 2ch browser based on gtkmm.
longDescription: |
  <p>JDim (JD improved) offers a comfortable browsing experience on 2ch-style bulletin board systems. Its features include:</p>
  <p> - automated login,  - message viewing/posting,  - image viewing,  - mouse gestures,  - ignore lists,  - &quot;play-by-play&quot; mode.</p>
  <p>It can also significantly reduce the load on servers by bypassing CGI programs and directly retrieving thread data files to your local hard drives.</p>
  <p>&quot;2ch-style&quot; web forum sites have their origins in 2channel, which was a very popular Internet forum in Japan. Such sites are often available only in the Japanese language.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - jdim
distributions:
  include:
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
