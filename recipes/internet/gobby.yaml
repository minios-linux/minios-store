id: "gobby"
name: Gobby
description: Edit text files collaboratively
longDescription: |
  <p>Gobby is an editor which allows one to edit text documents and source files collaboratively over a network. All users could work on the file simultaneously without the need to lock it. The parts the various users write are highlighted in different colours and it supports syntax highlighting of various programming and markup languages.</p>
  <p>Gobby is portable to both Windows and Unix-like platforms and makes use of the Gtk+ toolkit. A dedicated server is available in the infinoted package.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gobby
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
