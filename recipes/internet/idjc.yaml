id: "idjc"
name: Internet DJ Console
description: Be a DJ on the Internet
longDescription: |
  <p>A powerful yet easy to use source-client for people interested in streaming
      live radio shows over the Internet using Shoutcast or Icecast servers.</p>
  <p>Up to 9 simultaneous streams. 12 mono or 6 stereo general purpose audio inputs.
      3 media players. An effects rack. The audio routing flexibility of Jack Audio Connection Kit.
      IRC announcements. Ampache music database support.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
