id: "liferea"
name: Liferea
description: RSS feed reader
longDescription: |
  <p>Liferea is an abbreviation for Linux Feed Reader. It is a news aggregator for online news feeds. It supports a number of different feed formats including RSS/RDF, CDF and Atom. There are many other news readers available, but these others are not available for Linux or require many extra libraries to be installed. Liferea tries to fill this gap by creating a fast, easy to use, easy to install news aggregator for GTK/GNOME.</p>
  <p>Distinguishing features:</p>
  <ul>
    <li>Read articles when offline</li>
    <li>Synchronizes with TheOldReader</li>
    <li>Synchronizes with TinyTinyRSS</li>
    <li>Synchronizes with InoReader</li>
    <li>Synchronizes with Reedah</li>
    <li>Permanently save headlines in news bins</li>
    <li>Match items using search folders</li>
    <li>Play Podcasts</li>
  </ul>
  
categoryId: internet
icon: Globe
