id: selektor
name: SelekTOR
description: Tor Exit Node Selection and Proxying
longDescription: |
  <p>SelekTOR is a GUI frontend for the network Tor client. Used for security and anonymization purposes or to bypass some firewall. Simplifies the process of selecting Tor exit nodes and manages selective URL pattern based on routing via system proxying.</p>
  
