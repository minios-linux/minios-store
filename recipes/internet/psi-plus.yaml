id: "psi-plus"
name: Psi+
description: Communicate over the XMPP network
longDescription: |
  <p>This package contains basic version of Psi+. Use it if you prefer old fashioned plain text chats from era of IRC heyday.</p>
  <p>Psi IM is a capable XMPP client aimed at experienced users. There are keybindings for just about everything, Unicode is supported throughout, contacts are cached offline. Security is also a major consideration, and Psi IM provides it for both client-to-server (TLS) and client-to-client (GnuPG, OTR, OMEMO).</p>
  <p>Psi+ is a development branch of Psi IM. Project purposes are: implementation of new features, writing of patches and plugins for transferring them to Psi IM.</p>
  <p>Full list of features you may found at: http://psi-plus.com/wiki/en:features</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - psi-plus
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
