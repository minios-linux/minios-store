id: "quaternion"
name: Quaternion
description: Qt5-based client for Matrix networks
longDescription: |
  <p>Quaternion is a cross-platform desktop IM client for the Matrix protocol.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - quaternion
