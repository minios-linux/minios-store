id: "wpagui"
name: wpa_gui
description: Graphical user interface for wpa_supplicant
longDescription: |
  <p>wpagui provides a Qt interface for choosing which configured network to connect to. It also provides a method for browsing 802.11 SSID scan results, an event history log of messages generated by wpa_supplicant, and a method to add or edit wpa_supplicant networks.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - wpagui
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: w/wp/wpa_gui.desktop/33cbe73bdae25b35ee5cf232f7c5258c/icons/128x128/wpagui_wpa_gui.png
    width: 128
    height: 128
enabled: true
order: 99
