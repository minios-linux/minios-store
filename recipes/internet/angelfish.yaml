id: "angelfish"
name: Angelfish Web Browser
description: Webbrowser for mobile devices
longDescription: |
  <p>Angelfish is a modern mobile webbrowser</p>
  <p>It supports typical browser features, such as</p>
  <ul>
    <li>bookmarks</li>
    <li>history</li>
    <li>tabs</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - angelfish
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
