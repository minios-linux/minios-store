id: sync-ui
name: Sync
description: Up to date
longDescription: |
  <p>SyncEvolution synchronizes contact, calendar and task items via SyncML and CalDAV/CardDAV with other servers or devices. It uses the Evolution Data Server to sync PIM data in Evolution, but a plain file storage is also supported. Data exchange can happen via HTTP(S) and Bluetooth. Full, one-way and incremental synchronization of items are supported. SyncEvolution can act as a SyncML/DAV client and SyncML server.</p>
  <p>This package provides a GTK+ graphical user interface.</p>
  
categoryId: internet
icon: FolderOpen
method: apt
level: "auto"
compression: zstd
packages:
  - sync-ui
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
