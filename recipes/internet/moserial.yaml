id: "moserial"
name: moserial Terminal
description: Serial terminal
longDescription: |
  <p>Moserial is a serial terminal used for interacting with serial consoles and embedded devices. It supports the view of incoming and outgoing data in both ASCII and hexadecimal formats with the option to log this data. It also supports sending and receiving of x, y, and z-modem files, and has profiles to easily switch between configurations for different devices you are communicating with.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - moserial
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
