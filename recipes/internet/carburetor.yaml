id: "carburetor"
name: Carburetor
description: The Onion Routing app
longDescription: |
  <p>
        A graphical settings app for tractor which is a package uses Python stem library to provide a connection through
  the onion proxy and sets up proxy in user session, so you don't have to mess up with TOR on your system anymore.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - carburetor
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - tor
  - tractor
  - carburetor
