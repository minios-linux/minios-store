id: unity-mail
name: Unity Mail
description: Mail notifications and counter for Unity/MATE/Xfce/LXDE/etc.
longDescription: |
  <p>Unity Mail is an application that integrates your mail into the Unity, MATE, Xfce, LXDE and other environments.</p>
  <p>It displays notifications about incoming mail, shows the number of unread messages and displays subjects in the Messaging Menu.</p>
  <p>The Launcher item also has a quicklist that provides quick access to your mail folders (configured for GMail by default). It also allows you to quickly compose a new message.</p>
  <p>Unity Mail starts automatically, all you have to do is to enter your accounts settings in a configuration dialog.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - unity-mail
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
iconSources:
  - cached: unity-mail_unity-mail.png
    width: 128
    height: 128
enabled: true
order: 99
