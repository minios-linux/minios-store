id: "gnome-shell-extension-gsconnect"
name: GSConnect
description: KDE Connect implementation for GNOME
longDescription: |
  <p>
        GSConnect is a complete implementation of KDE Connect especially for GNOME Shell with Nautilus, Chrome and Firefox
  integration. The KDE Connect team has applications for Linux, BSD, Android, Sailfish, iOS, macOS and Windows.
      </p>
  <p>
        With GSConnect you can securely connect to mobile devices and other desktops to:
      </p>
  <ul>
    <li>Share files, links and text</li>
    <li>Send and receive messages</li>
    <li>Sync clipboard content</li>
    <li>Sync contacts</li>
    <li>Sync notifications</li>
    <li>Control media players</li>
    <li>Control system volume</li>
    <li>Execute predefined commands</li>
    <li>And more…</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-shell-extension-gsconnect
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
