id: "dialect"
name: Dialect
description: Translate between languages
longDescription: |
  <p>
        A translation app for GNOME.
      </p>
  <p>
        Features:
      </p>
  <ul>
    <li>Translation based on Google Translate</li>
    <li>Translation based on the LibreTranslate API, allowing you to use any public instance</li>
    <li>Translation based on Lingva Translate API</li>
    <li>Text to speech</li>
    <li>Translation history</li>
    <li>Automatic language detection</li>
    <li>Clipboard buttons</li>
  </ul>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - dialect
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - translate
  - translation
