id: "eiskaltdcpp-gtk"
name: EiskaltDC++ Gtk
description: Share files over the DC++ network
longDescription: |
  <p>This package installs only EiskaltDC++ with GUI based on Gtk (based on FreeDC++ and LinuxDC++ projects).</p>
  <p>EiskaltDC++ is a cross-platform program that uses the Direct Connect and ADC protocols. It is compatible with DC++, FlylinkDC++, LinuxDC++ and other DC clients. EiskaltDC++ also interoperates with all common DC hub software.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - eiskaltdcpp-gtk
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
