id: "transmission-remote-gtk"
name: Transmission Remote
description: Remotely manage the Transmission BitTorrent client
longDescription: |
  <p>Transmission Remote Gtk allows you to remotely manage the Transmission BitTorrent client using its RPC interface.
      It is a full featured client, allowing adding, starting, stopping, removing, verifying, and reannouncing torrents.
      It also exposes settings for both individual torrents (peer limits, file priorities, tracker settings, etc.) and Transmission
  as a whole (global limits, download directory, connectivity preferences, etc.)
      It can also act as a .torrent handler, opening when torrents are downloaded through a web browser.</p>
  
