id: tootle
name: Tootle
description: Lightning fast client for Mastodon
longDescription: |
  <p>
        Tootle is a GTK client for the world's largest, decentralized, microblogging platform, Mastodon. With the user experience
  in mind, it provides a clean, native interface that allows you to integrate Mastodon's social experience seamlessly with your desktop environment.
      </p>
  <p>
        Mastodon is a free and open source microblogging platform similar to Twitter, but with user privacy and decentralization
  in mind. It is one of many protocols that interacts with the Fediverse of protocols like Pleroma, GNU Social, and others. The power of federated microblogging that Mastodon brings and the agility of Tootle creates a fantastic duo for all of your social media needs.
      </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - tootle
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
  - toot
  - mastodon
  - social
  - network
  - post
