id: "easyssh"
name: EasySSH
description: SSH Connection Manager
longDescription: |
  <p>A complete, efficient and easy-to-use manager. Create and edit connections, groups, customize the terminal, with multiple instances of the same connection.
  </p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
