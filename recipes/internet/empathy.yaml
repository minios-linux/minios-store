id: empathy
name: Empathy
description: "Chat on Google Talk, Facebook, MSN and many other chat services"
longDescription: |
  <p>Instant messaging program supporting text, voice, video, file transfers and inter-application communication over many different protocols, including: AIM, Windows Live (MSN), Google Talk (Jabber/XMPP), Yahoo!, Salut, Gadu-Gadu, Groupwise and ICQ.</p>
  <p>This package contains the Empathy IM application and account manager.</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - empathy
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
tags:
