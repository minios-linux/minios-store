id: torchat
name: TorChat
description: Decentralized instant messenger built on top of the Tor Network
longDescription: |
  <p>TorChat is a peer to peer instant messenger with a completely decentralized design, built on top of Tor&apos;s location hidden services, providing strong anonymity while being very easy to use</p>
  <p>Top most relevant feature TorChat claims, above from text messaging and file sending, rest on the difficulty someone would experiment trying to find out where you are communicating from</p>
  <p>In the condition someone might be observing you and sniff your internet traffic connection, the person will find highly difficult to find out:  - Where your contacts are located  - To whom you are sending or receiving from  - What you send or receive, as everything is end-to-end encrypted</p>
  
categoryId: internet
icon: Globe
method: apt
level: "auto"
compression: zstd
packages:
  - torchat
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
iconSources:
  - cached: torchat_torchat.png
    width: 64
    height: 64
enabled: true
order: 99
