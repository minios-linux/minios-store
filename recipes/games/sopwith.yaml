id: sopwith
name: Sopwith
description: WW1 Dogfighting Game
longDescription: |
  <p>This is an updated version of the 1980&apos;s game developed by David L. Clark of BMB Compuscience Canada.  It has been adapted to run under *nix using the SDL toolkit. Poor graphics, stupid AI, and horrible sound await you. The gameplay is simple, addictive, and fun. A `side-scroller&apos;, you pilot your biplane across a static field, destroying enemy encampments and planes.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - sopwith
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
