id: "unknown-horizons"
name: Unknown Horizons
description: A 2D real time strategy simulation with an emphasis on economy and city building
longDescription: |
  <p>Unknown Horizons is a 2D realtime strategy simulation with an emphasis on economy and city building. Expand your small settlement to a strong and wealthy colony, collect taxes and supply your inhabitants with valuable goods. Increase your power with a well balanced economy and with strategic trade and diplomacy.</p>
  
