id: morris
name: Morris
description: Nine Men's Morris Game
longDescription: |
  <p>Morris is an implementation of the board game &quot;Nine Men&apos;s Morris&quot;. Sometimes simply called Mills, Morris, Merrills, or Mühle in German. This implementation supports not only the standard game, but also several rule-variants and different boards. The game supports a strong computer player which learns from past games played.</p>
  
