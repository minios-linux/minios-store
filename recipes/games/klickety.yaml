id: "klickety"
name: KSame
description: 'KSame is a game mode of the game Klickety, which is an adaptation of the "clickomania" game'
longDescription: |
  <p>
        KSame is a simple, yet challenging color matching game modeled after once famous game of SameGame. The idea behind
  KSame is to completely clear the game board filled with the multicolored marbles.
      </p>
  
