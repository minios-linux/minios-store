id: xqf
name: XQF Game Server Browser
description: Locate and connect to game servers
longDescription: |
  <p>XQF is a GTK+ frontend for Qstat, a tool for querying first-person action game servers like Quake, Unreal Tournament, etc. It displays information about the servers and allows configuring and launching some of the games from it.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - xqf
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - cached: xqf_xqf.png
    width: 64
    height: 64
enabled: true
order: 99
