id: sudoku
name: Sudoku
description: console based sudoku game
longDescription: |
  <p>This sudoku puzzle generator/solver features:  * character based (curses) interface;  * cross-platform (Minix, Unix, Windows) with full source code (ANSI C);  * generates hints upon request;  * classification of board difficulty (very easy, easy, medium, hard or    fiendish);  * generation of new boards;  * easy entry of boards published in newspapers, Internet, ...;  * multiple output formats (text, csv, HTML, PostScript).</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - sudoku
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
