id: "hitori"
name: GNOME Hitori
description: Play the Hitori puzzle game
longDescription: |
  <p>Hitori is a logic game similar to the popular game of Sudoku.</p>
  <p>You play the game against the clock, aiming to eliminate all the duplicate
        numbers in each row and column in the fastest time.
        Multiple sizes of game board are supported, and you can place markers on
        cells to help work out the solution.
        If you get stuck, the game can give you a hint.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - hitori
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - puzzle
  - game
  - logic
  - grid
