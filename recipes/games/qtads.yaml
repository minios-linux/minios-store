id: "qtads"
name: QTads
description: Multimedia interpreter for TADS games
longDescription: |
  <p>QTads is a cross-platform, multimedia interpreter for TADS games. It is fully compatible
          with HTML TADS (aka "Multimedia TADS.") Both TADS versions in use today (v2 and v3) are
          supported.</p>
  <p>Most TADS games are free and can be downloaded from places like the Interactive Fiction
          Database (https://ifdb.tads.org) and the Interactive Fiction Archive
          (https://ifarchive.org).</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - qtads
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
