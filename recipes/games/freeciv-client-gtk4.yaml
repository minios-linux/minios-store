id: freeciv-client-gtk4
name: Freeciv gtk4 client
description: Gtk4 based client for the Freeciv game
longDescription: |
  <p>
              Freeciv is a Free and Open Source empire-building strategy game inspired by the history of human civilization.
  The game commences in prehistory and your
              mission is to lead your tribe from the Stone Age to the Space Age...
          </p>
  <p>
              This client for connecting to network games, or to launch local single-player games, is based on gtk4 widget
  set.
          </p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - freeciv-client-gtk4
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - strategy
  - simulation
  - civilization
  - tiles
  - history
  - mankind
  - multiplayer
