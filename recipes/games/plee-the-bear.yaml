id: "plee-the-bear"
name: Plee the Bear
description: "Catch your son, he ate all the honey then ran away"
longDescription: |
  <p>Plee the Bear will be a 2D platform game like those found on consoles in the beginning of the 90&apos;s. The basis of the scenario fit in few lines:</p>
  <p>4 PM or so, Plee wakes up, tired. He has dreamed again about that awesome period when he went across the entire world together with his belle. He puts his leg in the honey pot... empty! Moreover every single honey pot in the house is empty. &quot;One more trick of that kid&quot;, he thinks. &quot;I&apos;m going to give him such a wallop of which he sure will remember&quot;.</p>
  <p>Following honey drops on the ground, Plee reaches the edge of the forest. Beginning of the game.</p>
  <p>The current version is a demo.</p>
  
