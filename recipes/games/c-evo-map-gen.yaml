id: c-evo-map-gen
name: C-evo MapGen
description: External Map Generator for C-evo
longDescription: |
  <p>
        CevoMapGen is a map file generator for Cevo that facilitates harsher terrain and climate.
      </p>
  <p>
        It gives greater control than the internal map generator within the game,
        and allows much faster generation of novel or extreme worlds than using the map editor.
      </p>
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - c-evo-map-gen
distributions:
  include:
    - name: trixie
      architectures: [amd64]
tags:
  - random
  - map
  - cevo
  - c-evo
