id: sandboxgamemaker
name: Platinum Arts Sandbox Gamemaker
description: Create 3D games and worlds
longDescription: |
  <p>Platinum Arts Sandbox is an open source, easy-to-use, standalone 3D game maker and 3D game design program. It is currently based on the Cube 2 engine used in schools around the world that allows kids and adults to create their own video games, worlds, levels, adventures, and quests, even cooperatively. The goal is to make it accessible to kids but also powerful enough for full game projects.</p>
  <p>This package contains the client and server binaries.</p>
  
categoryId: games
