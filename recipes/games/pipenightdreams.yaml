id: pipenightdreams
name: Pipenightdreams
description: Single player game with pipes
longDescription: |
  <p>If you know the old arcade-game &quot;Pipe Dreams&quot;, you&apos;ll instantly recognize this. The goal is to connect different pipe segments to let the water flow from the inlet and through as many pipes as possible, until it finally reaches the outlet. This requires an even combination of speed, skill and foresight.</p>
  
