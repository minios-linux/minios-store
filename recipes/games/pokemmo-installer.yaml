id: pokemmo-installer
name: PokeMMO Installer
description: Installer and Launcher for the PokeMMO emulator
longDescription: |
  <p>This program downloads and installs the PokeMMO client to a user&apos;s home directory and provides a launcher script for a convientient starting of the emulator.</p>
  <p>PokeMMO client is an emulator of several popular console games with additional features and multiplayer capabilities.</p>
  <p>This launcher assists with the download, installation, and maintenance of the game client.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - pokemmo-installer
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - game
  - adventure
  - multiplayer
  - online
  - emulator
  - monster
  - battle
iconSources:
  - cached: pokemmo-installer_pokemmo-installer.png
    width: 64
    height: 64
enabled: true
order: 99
