id: "enigma"
name: Enigma
description: Uncover pairs of stones while navigating obstacles using a marble
longDescription: |
  <p>Enigma is a puzzle game similar to Oxyd on the Atari ST or Rock&apos;n&apos;Roll on the Amiga and good old Marble Madness. It also has Sokoban levels, and some interesting twists on the original sokoban concept.</p>
  <p>In Enigma, your objective is to locate and uncover matching pairs of Oxyd stones. Simple as it sounds, this task is made more difficult by the fact that Oxyd stones tend to be hidden, inaccessible or protected by unexpected traps. Overcoming these obstacles often requires a lot of dexterity and wit (and can be quite addictive).</p>
  <p>This package contains the game engine.</p>
  
