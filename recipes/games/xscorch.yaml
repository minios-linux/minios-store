id: xscorch
name: Xscorch
description: Clone of Scorched Earth
longDescription: |
  <p>Xscorch is a clone of the classic DOS game, &quot;Scorched Earth&quot;. The basic goal is to annihilate enemy tanks using overpowered guns :).  Basically, you buy weapons, you target the enemy by adjusting the angle of your turret and firing power, and you hope to destroy their tank before they destroy yours.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - xscorch
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
iconSources:
  - cached: xscorch_xscorch.png
    width: 64
    height: 64
enabled: true
order: 99
