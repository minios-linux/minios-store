id: "gtkatlantic"
name: GtkAtlantic
description: Connect to a Monopd server
longDescription: |
  <p>GtkAtlantic is a game, like Monopoly™. This is a network client that works with the monopd server. You will either have to install monopd or connect to an existing internet server to play the game.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gtkatlantic
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - monopoly
  - board
  - game
  - money
  - network
  - multiplayer
  - client
  - server
