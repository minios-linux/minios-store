id: dsda-doom
name: DSDA-Doom
description: enhanced clone of the classic first-person shooter Doom
longDescription: |
  <p>This is a fork of prboom+ with many new features, including:</p>
  <p> * Heretic, Hexen, MBF21, and Doom-in-Hexen support  * In-game console and scripting  * Full controller support  * Palette-based lightmode for opengl  * Debugging features for testing  * Strict mode for speedrunning  * Various quality of life improvements  * Advanced tools for TASing  * Rewind</p>
  <p>DSDA-Doom requires game data to run. Free game data is available in the freedoom package. Commercial game data can be packaged using game-data-packager. DSDA-Doom supports all flavors of Doom, including The Ultimate Doom, Doom 2 and Final Doom as well as Chex(R) Quest, HacX, Freedoom: Phase 1 and Phase 2 and FreeDM.</p>
  <p>Additionally, DSDA-Doom supports Heretic and Hexen.</p>
  
