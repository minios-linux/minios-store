id: xsnow
name: xsnow
description: "Snow, Santa and birds on your desktop"
longDescription: |
  <p>Xsnow is a X Window application that will snow on the desktop background. Santa and his reindeer will complete your festive-season feeling. Xsnow runs in GNOME, KDE, FVWM and desktops that are derived from those.</p>
  
