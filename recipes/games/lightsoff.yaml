id: "lightsoff"
name: Lights Off
description: Turn off all the lights
longDescription: |
  <p>Lights Off is a collection of light switch puzzles. Clicking on a light
        toggles it either on or off, but also toggles all the surrounding lights,
        too. Your objective is simple: turn off all the lights!</p>
  <p>Players who delight in turning off lights will enjoy the huge number of
       levels.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
