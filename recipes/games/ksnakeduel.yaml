id: "ksnakeduel"
name: KSnakeDuel
description: Tron-like Game
longDescription: |
  <p>KSnakeDuel is a simple Tron-Clone. You can play KSnakeDuel against the computer or a friend.
        The aim of the game is to live longer than your opponent. To do that, avoid running into a
        wall, your own tail and that of your opponent.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - ksnakeduel
