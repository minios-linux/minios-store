id: residualvm
name: ResidualVM
description: Interpreter for several 3D games
longDescription: |
  <p>ResidualVM is a cross-platform 3D game interpreter which allows you to play LucasArts&apos; Lua-based 3D adventures (provided you already have their data files):</p>
  <p> * Grim Fandango  * Myst III  * Escape from Monkey Island (not working yet)</p>
  <p>ResidualVM utilizes OpenGL for 3D graphics hardware acceleration. A software renderer is also included for machines without hardware OpenGL.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - residualvm
distributions:
  include:
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
