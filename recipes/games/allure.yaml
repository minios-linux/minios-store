id: allure
name: Allure of the Stars
description: Explore an abandoned spaceship with a party of adventurers
longDescription: |
  <p>Allure of the Stars is a near-future Sci-Fi roguelike and tactical squad game.</p>
  <p>Not a single picture in this game. You have to imagine everything yourself, like with a book (a grown-up book, without pictures). Once you learn to imagine things, though, you can keep exploring and mastering the world and making up stories for a long time.</p>
  <p>The game is written in Haskell using the free software LambdaHack engine. Please see the changelog file for recent improvements and the issue tracker for short-term plans. Long term goals are high replayability and auto-balancing through procedural content generation and persistent content modification based on player behaviour. Contributions are welcome.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - allure
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - game
  - strategy
  - tactics
  - roguelike
  - scifi
iconSources:
