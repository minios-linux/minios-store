id: 7kaa
name: Seven Kingdoms
description: "Seven Kingdoms: Ancient Adversaries"
longDescription: |
  <p>Seven Kingdoms, designed by Trevor Chan, brings a unique blend of Real-Time Strategy with the addition of trade, diplomacy, and espionage.</p>
  <p>The game enables players to compete against up to six other kingdoms allowing players to conquer opponents by defeating them in war (with troops or machines), capturing their buildings with spies, or offering opponents money for their kingdom.</p>
  <p>In 2009, Enlight Software released the game under the GPL license. 7kfans project is updating the game and provides a community for fans. A free Seven Kingdoms will help continue the legacy.</p>
  
