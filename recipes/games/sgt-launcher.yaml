id: "sgt-launcher"
name: SGT Puzzles Collection
description: Launcher for Simon Tatham's Portable Puzzle Collection
longDescription: |
  <p>SGT Puzzles Collection is a simple-to-use launcher for Simon Tatham&apos;s Portable Puzzle Collection.</p>
  <p>The collection is presented as a related but diverse set of logic games. Each game is displayed in the launcher window with simplified controls.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - sgt-launcher
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
tags:
  - games
  - puzzles
