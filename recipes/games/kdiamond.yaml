id: "kdiamond"
name: KDiamond
description: Logic game
longDescription: |
  <p>KDiamond is a three-in-a-row game like Bejeweled. It features unlimited fun with randomly generated games and five difficulty levels with varying number of diamond colors and board sizes.</p>
  <p>This package is part of the KDE games module.</p>
  
