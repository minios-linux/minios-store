id: "fltk1-3-games"
name: FLTK Checkers
description: Checkers Game
longDescription: |
  <p>This package contains the example games that accompany FLTK. Specifically, it contains the following two programs:  - flblocks:   clear groups of adjacent blocks before they fill the screen;  - flcheckers: classic board game, also known as draughts;  - flsudoku:   Sudoku puzzle (place numbers in a grid).</p>
  <p>The Fast Light Toolkit (FLTK) is a cross-platform graphical user interface toolkit originally based on libForms.</p>
  
categoryId: games
