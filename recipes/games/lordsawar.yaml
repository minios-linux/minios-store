id: "lordsawar"
name: LordsAWar! Scenario Editor
description: Scenario Editor for LordsAWar!
longDescription: |
  <p>A 2d turn-based strategy game where up to 8 players strive for control of as many cities as possible. Produce new armies in cities to conquer nearby cities. Using the income from those cities, make more armies to take more cities. Send a hero to a temple to get a quest, or maybe search a nearby ruin instead. Game should run well on modest hardware.</p>
  <p>Play with others or against the computer.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - lordsawar
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - maps
  - tiles
  - scenarios
  - editor
  - warlords
iconSources:
  - cached: lordsawar_lordsawar.png
    width: 64
    height: 64
enabled: true
order: 99
