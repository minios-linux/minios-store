id: "supertransball2"
name: Super Transball 2
description: Thrust type of game
longDescription: |
  <p>Super Transball 2 is a game which was inspired by ZARA THRUSTA for the Amiga 500. In each level the goal is to find the SPHERE, to capture it and to carry it to the upper part of the level. The main challenge is the gravity that attracts your ship which makes it inevitable to control the ship&apos;s thrust. Many other obstacles like cannons, tanks, doors or lasers will also try to make your journey difficult and don&apos;t be wasteful with your thrusters and weapons or you will run out of fuel in no time.</p>
  
