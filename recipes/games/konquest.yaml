id: "konquest"
name: Konquest
description: Galactic Strategy Game
longDescription: |
  <p>Konquest is a version of Gnu-Lactic Konquest. Players conquer other planets
        by sending ships to them. The goal is to build an interstellar empire and ultimately
        conquer all other player&apos;s planets.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
