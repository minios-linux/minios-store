id: "bovo"
name: Bovo
description: '"Five in a row" board game'
longDescription: |
  <p>Bovo is a Gomoku (from Japanese 五目並べ - lit. &quot;five points&quot;) like game for two players, where the opponents
        alternate in placing their respective pictogram on the game board. (Also known as: Connect Five, Five in a row,
  X and O,
        Naughts and Crosses)</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - bovo
