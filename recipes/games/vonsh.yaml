id: vonsh
name: Vonsh
description: SDL-based snake-like game
longDescription: |
  <p>Player has to pick up foodstuffs appearing randomly on the board, and avoid colliding with obstacles and the line itself. With each picked up food item, line grows in length, new obstacles appear, and difficulty explodes ;). Game is based on libSDL.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
