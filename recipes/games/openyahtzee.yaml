id: openyahtzee
name: Open Yahtzee
description: The classic dice game Yahtzee
longDescription: |
  <p>Open Yahtzee is a version of the classic dice game Yahtzee. Also known as Knubbel or Pasch.</p>
  <p>Open Yahtzee is built to be a full-featured Yahtzee implementation, with a user-friendly interface including animated dice rolls.</p>
  <p>For other implementations see the gtali game in the gnome-games package.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - openyahtzee
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
