id: numptyphysics
name: NumptyPhysics
description: A crayon-drawing based physics puzzle game
longDescription: |
  <p>Numpty Physics is a drawing puzzle game in the spirit (and style?) of Crayon Physics using the same excellent Box2D engine. It melds cute schoolbook-style graphics with a kind of realistic physics engine.</p>
  <p>It includes a built-in editor so that you may build (and submit) your own levels.</p>
  
