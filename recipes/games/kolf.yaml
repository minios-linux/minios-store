id: "kolf"
name: Kolf
description: Miniature Golf
longDescription: |
  <p>Kolf is a miniature golf game. The game is played from an overhead view, with a
        hort bar representing the golf club. Kolf features many different types of objects,
        such water hazards, slopes, sand traps, and black holes (warps), among others.</p>
  <p>Features:</p>
  <ul>
    <li>Single and Multi-player (up to ten players) modes</li>
    <li>High scores table</li>
    <li>Dynamic courses</li>
    <li>Third-party courses</li>
    <li>Course editor</li>
  </ul>
  
