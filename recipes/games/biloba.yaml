id: biloba
name: Biloba
description: Up to four player network capable turn based strategy board game
longDescription: |
  <p>Biloba is an abstract strategy board game for 1 to 4 players. At each turn the player moves pawns on an octagonal shaped board (but squared cells) trying to remove opponent&apos;s pawns from it.</p>
  <p>Biloba includes an AI opponent for single player mode, and supports local or network play for 2 or more (up to 4) players.</p>
  
