id: "mame"
name: MAME™ Arcade Emulator
description: Play vintage arcade games using the MAME™ emulator
longDescription: |
  <p>MAME is a hardware emulator: it faithfully reproduces the behavior of many arcade machines (it is not a simulation). This program is not a game but can directly, through ROM images, run the complete system of these old arcade machines. These ROMs are subject to copyright and it is in most of the cases illegal to use them if you do not own the arcade machine.</p>
  <p>This package provides the MAME binary and configuration files.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - mame
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - game
  - emulator
  - arcade
