id: "kgoldrunner"
name: KGoldrunner
description: "Hunt Gold, Dodge Enemies and Solve Puzzles"
longDescription: |
  <p>KGoldrunner is an action game where the hero runs through a maze, climbs stairs, dig holes and
        dodges enemies in order to collect all the gold nuggets and escape to the next level.
        Your enemies are also after the gold. Worse still, they are after you!.</p>
  <p>Features:</p>
  <ul>
    <li>Themeable</li>
    <li>Hundreds of levels</li>
    <li>Level-editor</li>
    <li>Two modes for the enemies: classical and KGoldrunner-mode, in KGoldrunner-mode they are
            more intelligent, in the classical mode it is easier to fool them</li>
    <li>Very very difficult levels</li>
    <li>Keyboard or mouse control</li>
    <li>Savable games</li>
  </ul>
  
