id: palapeli-data
name: Palapeli
description: Jigsaw puzzle game
longDescription: |
  <p>Palapeli is a single-player jigsaw puzzle game.
     Unlike other games in that genre, you are not limited to aligning pieces on imaginary grids.
     The pieces are freely moveable.
     Also, Palapeli features real persistency, i.e. everything you do is saved on your disk immediately.</p>
  <p>Features:</p>
  <ul>
    <li>Create and play puzzles ranging from 4 to 10,000 pieces</li>
    <li>Piece-holders for helping solve large puzzles</li>
  </ul>
  
