id: "goverlay"
name: GOverlay
description: Graphical UI to help manage Vulkan / OpenGL overlays
longDescription: |
  <p>GOverlay can configure Vulkan / OpenGL overlays with a preview. Currently supported are MangoHud, vkBasalt and ReplaySorcery.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - goverlay
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - mangohud
  - vkbasalt
  - replaysorcery
