id: "kiriki"
name: Kiriki
description: Yahtzee-like Dice Game
longDescription: |
  <p>Kiriki is an addictive and fun dice game, designed to be played by as many as six players.
        Participants have to collect points by rolling five dice for up to three times per single turn.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - kiriki
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
