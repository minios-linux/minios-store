id: "pushover"
name: Pushover
description: Rearrange dominoes on different platforms to start a chain reaction
longDescription: |
  <p>Pushover is a fun puzzle game where you have to rearrange dominoes on different platforms to start a chain reaction that makes all dominoes topple over. There are many strange types of dominoes, such as the Ascender which will rise to the ceiling when pushed, or the Exploder which will blast a hole into the platform.</p>
  <p>This is a faithful reimplementation of the same-named game originally published by Ocean in 1992.</p>
  
