id: "laby"
name: Laby
description: Learn how to program with ants and spider webs
longDescription: |
  <p>Laby is a small program to learn how to program with ants and spider webs. You have to move an ant out of a labyrinth, avoid spider webs, move rocks, etc.</p>
  <p>Using Laby, you can learn OCaml, C, C++, Java, Prolog, Ruby, Pascal, JavaScript, Python, Lua, Vala and Scheme. Other bindings can easily be added to support new programming languages.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - laby
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
