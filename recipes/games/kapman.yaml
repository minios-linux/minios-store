id: "kapman"
name: Kapman
description: Pac-Man Clone
longDescription: |
  <p>Kapman is a clone of the well known game Pac-Man.</p>
  <p>You must run through the maze to eat all pills without being captured by a ghost.
        By eating an energizer, Kapman gets the ability to eat ghosts for a few seconds.
        When a stage is cleared of pills and energizer the player is taken to the next stage with slightly
        increased game speed.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - kapman
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
