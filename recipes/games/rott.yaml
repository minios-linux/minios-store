id: "rott"
name: Rise of the Triad
description: "A high quality, fast scrolling first-person perspective 3D action game"
longDescription: |
  <p>Rise of the Triad is a high quality, fast scrolling first-person perspective 3D action game. It includes a lot of destructive enemies, an arsenal of weapons from simple pistols to missile launchers, life-preserving armor, traps and ambushes galore.</p>
  <p>WARNING: Rise of the Triad features wanton and gratuitous violence.</p>
  <p>This package contains no data files: use `game-data-packager&apos; to generate a suitable data package from the publicly available &quot;Rise of the Triad: The HUNT Begins&quot; shareware episode.</p>
  
