id: "kblocks"
name: KBlocks
description: Falling Blocks Game
longDescription: |
  <p>KBlocks is the classic falling blocks game. The idea is to stack the falling blocks to create horizontal
        lines without any gaps. When a line is completed it is removed, and more space is available in the play area.
        When there is not enough space for blocks to fall, the game is over.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - kblocks
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
