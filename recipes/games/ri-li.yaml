id: "ri-li"
name: Ri-li
description: a toy simulator game
longDescription: |
  <p>Ri-li is a game in which you drive a wooden toy steam locomotive across many levels and collect all the coaches to win.</p>
  <p>It features:  * a colorful animated wooden steam locomotive;  * 50 game levels;  * 3 beautiful tunes and many sound effects;  * 14 languages (Arabic, Breton, Chinese, English, Esperanto, French,     German, Italian, Japanese, Portuguese, Russian, Slovak, Spanish, and     Swedish).</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - ri-li
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
