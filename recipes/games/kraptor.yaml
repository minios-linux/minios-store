description: classic shoot 'em up scroller game
longDescription: |
  <p>Kraptor is a classic shoot &apos;em up scroller game, where you must fight against tons of bad dudes. The game offers high speed action, with massive destruction and lots of fun. Kraptor features a powerful engine for 2D shooter scroller games.</p>
  <p>After years of oppression, the slaved people of the world have raised against their masters. You, a mercenary pilot, have been contacted by the popular rebellion to fight against the forces of oppression. In the morning you jump into your cockpit and start up the engines. It&apos;s time to get airborne and start the attack. Get ready to defeat the scum hired by the masters. Fighting for freedom is the only way, you&apos;re on a mission, don&apos;t defraud us...</p>
  
