id: "kspaceduel"
name: KSpaceDuel
description: Space Arcade Game
longDescription: |
  <p>In KSpaceDuel each of two possible players control a satellite spaceship orbiting the sun.
        As the game progresses players have to eliminate the opponent&apos;s spacecraft with bullets or mines.</p>
  
categoryId: games
icon: Gamepad2
