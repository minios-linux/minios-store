id: "lskat"
name: LSkat
description: Card Game
longDescription: |
  <p>Lieutenant Skat (from German &quot;Offiziersskat&quot;) is a fun and engaging card game for two players,
        where the second player is either live opponent, or a built in artificial intelligence.</p>
  
