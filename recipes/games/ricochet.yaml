id: "ricochet"
name: Ricochet
description: '"Networked Multi-player Ricochet Robots"'
longDescription: |
  <p>Ricochet Robots is a multi-player board game which involves each user simultaneously solving a geometric challenge. This implementation is a networked version of the game with both client and server programs written in nickle using the nichrome toolkit.</p>
  
