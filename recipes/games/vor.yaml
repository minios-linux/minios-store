id: vor
name: VoR
description: A quick action game
longDescription: |
  <p>VoR is a simple, fast-paced action game that will challenge your reflexes. It has excellent gameplay, great physics, good graphics, and a retro/synthoid thumpy beat to help put you in the mood for old-school 2D gaming.</p>
  
