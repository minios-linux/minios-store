id: "corsix-th"
name: CorsixTH
description: A Theme Hospital Clone
longDescription: |
  <p>Theme Hospital was a simulation computer game developed by Bullfrog Productions and published by Electronic Arts in 1997, in which the player designs and operates a hospital.</p>
  <p>The game currently requires the original graphics and tries to mimic the original as closely as possible. Therefore you will need a copy of the original game for this package to be useful.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - corsix-th
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64]
tags:
