id: "passage"
name: Passage
description: game about the passage through life
longDescription: |
  <p>Passage is a short, autobiographical pixelated art game by Jason Rohrer. It can be explored in approximately 5 minutes. Passage is meant to be memento mori game. If you enjoy the game, you may want to try the followup, &quot;Gravitation&quot;. If you do not, please read the game creators statement on the website and the experiences of other people linked from the website.</p>
  
