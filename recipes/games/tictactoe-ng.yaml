id: tictactoe-ng
name: Tic Tac Toe
description: "Simple, fun tic tac toe game for GNOME"
longDescription: |
  <p>Tic Tac Toe (naughts &amp; crosses) is a simple two player game where the object is to place your shapes on the game board so that you get three in a row either horizontally, vertically, or across one of the diagonals while trying to block your opponent from doing the same.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - tictactoe-ng
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
