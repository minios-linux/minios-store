id: atanks
name: Atomic Tanks
description: Destroy your opponents' tanks.
longDescription: |
  <p>Atomic tanks is a multi-player game in which you attempt to destroy other tanks while trying to protect your own. You earn money for destroying other tanks; with this money you can buy upgrades and better weapons for your tank.</p>
  <p>This game is similar Scorched Earth or the Worms series of games.</p>
  
categoryId: games
icon: Gamepad2
