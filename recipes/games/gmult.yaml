id: "gmult"
name: Multiplication Puzzle
description: Figure out which letters are which numbers
longDescription: |
  <p>Multiplication Puzzle is a simple GTK+ 2 game that emulates the multiplication game found in Emacs.  Basically, a multiplication problem is shown with all digits replaced by letters.  Your job is to guess which letter represents which number.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gmult
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
