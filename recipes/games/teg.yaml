id: teg
name: T.E.G. client
description: Tenes Empanadas Graciela client
longDescription: |
  <p>Tenes Empanadas Graciela is a clone of Plan Tactico y Estrategico de la Guerra, based on Risk.</p>
  <p>Teg is a multiplayer game (it can be played across the internet) and it comes with a server, a GNOME client and a robot. It has support for IPv6, too.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - teg
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - risk
  - armies
  - multiplayer
iconSources:
  - cached: teg_teg_icono.png
    width: 64
    height: 64
enabled: true
order: 99
