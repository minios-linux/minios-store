id: "quake"
name: "Quake 1 Ep5: Dimensions of the Past"
description: "Episode 5, released to mark the 20th anniversary of the classic first person shooter"
longDescription: |
  <p>Quake is a classic first-person shooter game by id Software, released in 1996. This package contains a launcher script and menu entry to play Quake with any suitable engine.</p>
  <p>To make this package useful, you will need to create and install the non-distributable quake-registered or quake-shareware package, by using the game-data-packager package.</p>
  <p>Creating quake-registered requires data files from a Quake installation or CD-ROM.</p>
  <p>Creating quake-shareware requires the shareware version of Quake.</p>
  <p>game-data-packager (&gt;= 45) can also produce packages for the official Episode 5, Dimensions of the Past (developed by MachineGames to mark Quake&apos;s 20th anniversary), and for the official mission packs Scourge of Armagon (developed by Hipnotic Software) and Dissolution of Eternity (developed by Rogue Entertainment). Additional menu entries should appear automatically if those expansions are installed.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - quake
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - first person shooter
  - fps
  - 3d
  - deathmatch
  - machinegames
  - machine games
  - episode 5
