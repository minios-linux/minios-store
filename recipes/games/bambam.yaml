id: bambam
name: BamBam
description: Keyboard mashing and doodling game for babies
longDescription: |
  <p>Bambam is a simple baby keyboard masher application that locks the keyboard and mouse and instead displays bright colors, pictures, and sounds.</p>
  <p>Note: type &quot;quit&quot; to stop the game.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - bambam
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - baby
  - child
  - game
  - mashing
  - doodling
iconSources:
