id: "kjumpingcube"
name: KJumpingCube
description: Territory Capture Game
longDescription: |
  <p>KJumpingcube is a simple tactical game for one or two players, played on a grid of numbered squares.  Each turn, players compete for control of the board by capturing or adding to one square.</p>
  <p>This package is part of the KDE games module.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
