id: "pychess"
name: PyChess
description: "PyChess is a fully featured, nice looking, easy to use chess client for the Gnome desktop"
longDescription: |
  <p>The goal of pychess, is to provide a fully featured, nice looking, easy to use chess client for the gnome-desktop.</p>
  <p>The client should be usable both to those totally new to chess, and those who want to use a computer to further enchance their play.</p>
  <p>Features include:  Tabbed interface  pgn+epd read/write support  Hints and spymode  xboard/cecp engine support  Builtin Python based engine  Openingbook using sqlite  Clean interface and dialogs  Builtin move validator  Legal move highlighting  Supports drag&apos;n&apos;drop.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - pychess
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
