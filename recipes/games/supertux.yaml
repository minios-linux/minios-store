id: "supertux"
name: SuperTux
description: A jump-and-run game starring Tux the Penguin
longDescription: |
  <p>Run and jump through multiple worlds, fight off enemies by
        jumping on them, bumping them from below or tossing objects at
        them, grabbing power-ups and other stuff on the way.</p>
  <p>In addition to the Story Mode, there is a large amount of
        community contributed levels available as add-ons or in the
        forums. Everyone can contribute such content by using the
        integrated level editor.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - supertux
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
