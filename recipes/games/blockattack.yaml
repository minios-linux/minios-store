id: "blockattack"
name: Block Attack - Rise of the Blocks
description: Switch blocks so they match
longDescription: |
  <p>Block Attack is a puzzle/blockfall game inspired by Nintendo&apos;s Tetris Attack for the Super Nintendo. The game is pretty action packed for a puzzle game :-)</p>
  <p>Features:  * Based on the classic &quot;Tetris Attack&quot; for the SNES  * 5 single player modes: Endless, Time Trial, Puzzle Mode, Stage Clear and  Vs. Mode  * 2 two player options: Time Trial and Vs. Mode  * Puzzle mode has 20+ puzzles  * Players can use a custom key setup  * Handicap in multiplayer  * Highscores are saved  * Joypad support  * Music and sound effects  * Animations  * Select puzzle file from a list in the game</p>
  <p>System requirements:  * Screen resolution: 1024x768 (cannot be changed, but it can run in a window)  * Keyboard  * Mouse (optional)  * Processor: Decent (tested on 733 MHz)  * Memory: at least 64 MB</p>
  
