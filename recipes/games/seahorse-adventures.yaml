id: seahorse-adventures
name: Seahorse Adventures
description: Help Barbie the seahorse float on bubbles to the moon
longDescription: |
  <p>Barbie Seahorse Adventures is a retro style platform arcade game in the spirit of Mario 3. You are Barbie the seahorse who travels through the jungle, up to the volcano until you float on bubbles to the moon. On the way to your final destination you will encounter various enemies, servants of the evil overlord who has stolen the galaxy crystal. Avoid getting hit and defeat them with your bubbles!</p>
  
