id: "xgalagaplusplus"
name: xgalaga++
description: "classic single screen vertical shooter, inspired by xgalaga"
longDescription: |
  <p>XGalaga++ is a classic vertical scrolling shoot&apos;em up. It requires no X Window extension and its window is freely resizable. It is inspired by XGalaga, but rewritten from scratch, except for the graphics.</p>
  
