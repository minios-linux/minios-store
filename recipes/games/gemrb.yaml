id: "gemrb"
name: GemRB
description: a portable opensource implementation of Bioware's Infinity Engine
longDescription: |
  <p>GemRB (Game Engine Made with preRendered Background) is a new implementation of the original Infinity Engine (the one of Baldur&apos;s Gate, Icewind Dale, Planescape: Torment, ...) to Linux/Unix, MacOS X and Windows with some enhancements.</p>
  <p>It means that you either need some of the original game&apos;s data somewhere on your harddisk, or you can try to use the data from the Dragonlance Total Conversion project.</p>
  <p>The original game data has to be installed on a windows partition and mounted to your Linux/Unix filesystem, installed on windows and then copied to your filesystem, installed with WINE or extracted manually from the CDs using the tool `unshield&apos;.</p>
  <p>Supported games: Baldur&apos;s Gate and Icewind Dale series, Planescape:Torment.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gemrb
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
