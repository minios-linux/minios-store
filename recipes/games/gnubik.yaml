id: gnubik
name: Gnubik
description: A 3D magic cube puzzle
longDescription: |
  <p>GNUbik is an interactive, graphical, single player puzzle. This free program renders an image of a cube, like that invented by Erno Rubik. You have to manipulate the cube using the mouse. When each face shows only one colour, the game is solved.</p>
  <p>It uses Gtk+ and/or X11 and Mesa / OpenGL.</p>
  
