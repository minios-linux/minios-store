id: "freeciv-server"
name: Freeciv server
description: Server component for the Freeciv game
longDescription: |
  <p>Freeciv is a Free and Open Source empire-building strategy game inspired by the history of human civilization. The game commences in prehistory and your
              mission is to lead your tribe from the Stone Age to the Space Age...</p>
  <p>Server hosts multiplayer games. For single-player games client can launch server for itself automatically.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - freeciv-server
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - strategy
  - simulation
  - civilization
  - tiles
  - history
  - mankind
  - multiplayer
