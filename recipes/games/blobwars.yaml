id: blobwars
name: "Blob Wars : Metal Blob Solid"
description: Mission and Objective based 2D Platform Game
longDescription: |
  <p>Blob Wars: Metal Blob Solid is a 2D platform game. It is the first in the Blob Wars series.</p>
  <p>Since their world was invaded by an alien race, the Blobs have faced a lifetime of war. But now they have a chance to win the war once and for all.</p>
  <p>In Blob Wars: Metal Blob Solid, you take on the role of a fearless Blob agent, Bob. Bob&apos;s mission is to infiltrate the various enemy bases around the Blobs&apos; homeworld and rescue as many MIAs as possible. But standing in his way are many vicious aliens, other Blobs who have been assimilated and the evil alien leader, Galdov.</p>
  
categoryId: games
