id: dustracing2d
name: Dust Racing 2D Level Editor
description: 2D racing game level editor
longDescription: |
  <p>Dust Racing (Dustrac) is a tile-based, cross-platform 2D racing game.</p>
  <p>Dust Racing comes with a level editor for easy level creation.</p>
  <p>Features:  * 1-2 human players against 11 challenging computer players  * 3 difficulty settings: Easy, Medium, Senna  * Split-screen two player game (vertical or horizontal)  * Game modes: Race, Time Trial, Duel  * 2D graphics with some 3D objects  * Smooth game play and physics  * Multiple race tracks  * Finishing in TOP-6 will unlock the next race track  * Star ratings based on the best positions on each race track  * Easy to create new race tracks with the level editor  * Engine and collision sounds  * Pit stops  * Runs windowed or fullscreen</p>
  
