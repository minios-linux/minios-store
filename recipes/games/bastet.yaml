id: bastet
name: Bastard Tetris
description: Go mad with this Tetris clone
longDescription: |
  <p>Bastet (&quot;bastard Tetris&quot;) is a free clone of Tetris which tries to compute how useful blocks are and gives you the worst possible brick. Playing bastet can be a painful experience, especially if you usually make &quot;canyons&quot; and wait for the long I-shaped block.</p>
  
