id: "kblackbox"
name: KBlackbox
description: Blackbox Logic Game
longDescription: |
  <p>KBlackbox is a game of hide and seek played on a grid of boxes where the computer has hidden several balls.
        The position of the hidden balls can be deduced by shooting beams into the box.</p>
  
