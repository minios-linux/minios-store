id: gigalomania
name: Gigalomania
description: 2D Real Time Strategy god game
longDescription: |
  <p>Gigalomania is an open source 2D Real Time Strategy god game. The gameplay consists of researching and developing new technology with which to conquer your enemies, from rocks and sticks to nuclear weapons and spaceships. You can advance through ten different ages, from the stone age to the future. There are 28 different maps to play through.</p>
  <p>This package contains the main program.</p>
  
