id: "kollision"
name: Kollision
description: Casual ball game
longDescription: |
  <p>Kollision is a casual game where you need to throw your ball and avoid the
        others balls on the table as long as possible.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
