id: koules
name: koules
description: "Push your enemies away, but stay away from obstacles"
longDescription: |
  <p>Koules is a fast action arcade-style game. This version is compiled for X11. It has cool 256 color graphics, a multiplayer mode for up to 5 players, full sound and, of course, network support. Koules is an original idea. The first version of Koules was developed from scratch by Jan Hubicka in July 1995.</p>
  <p>It supports multiplayer deathmatch and cooperative play.</p>
  
categoryId: games
