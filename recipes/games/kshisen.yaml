id: "kshisen"
name: KShisen
description: Shisen-Sho Mahjongg-like Tile Game
longDescription: |
  <p>KShisen is a solitaire-like game played using the standard set of Mahjong tiles. Unlike Mahjong however, KShisen has only one layer of scrambled tiles.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
