id: pingus
name: Pingus
description: Guide a horde of penguins through various obstacles
longDescription: |
  <p>Pingus is a free clone of the popular Lemmings game.</p>
  <p>Your goal is to guide a horde of penguins through a world full of obstacles and penguin traps to safety. Although penguins (unlike lemmings) are rather smart, they sometimes lack the necessary overview and now rely on you to save them.</p>
  <p>This package contains the main program.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - pingus
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - lemmings
  - obstacles
  - traps
  - penguins
iconSources:
  - cached: pingus_pingus-icon.png
    width: 64
    height: 64
enabled: true
order: 99
