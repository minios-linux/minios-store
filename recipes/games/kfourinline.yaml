id: "kfourinline"
name: KFourInLine
description: Classic turn based game
longDescription: |
  <p>KFourInLine is a game where two players take turns dropping pieces into a grid, the winner being the first to place four pieces in a line.</p>
  <p>This package is part of the KDE games module.</p>
  
