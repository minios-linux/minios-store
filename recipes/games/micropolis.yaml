id: "micropolis"
name: Micropolis
description: A real-time city management simulator
longDescription: |
  <p>This game simulates building and managing a whole city. The goal of the game is to build and design a city. The player can mark land as being zoned as commercial, industrial, or residential, add buildings, change the tax rate, build a power grid, build transportation systems and many other actions, in order to enhance the city.</p>
  <p>Micropolis is the GPL-licensed version of SimCity.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
