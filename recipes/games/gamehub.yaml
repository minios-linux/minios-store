id: "gamehub"
name: GameHub
description: All your games in one place
longDescription: |
  <p>Manage your Steam, GOG and Humble Bundle games in one place.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gamehub
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
tags:
  - game
  - hub
  - steam
  - gog
  - humble
  - humblebundle
