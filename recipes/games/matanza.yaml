id: "matanza"
name: Matanza
description: Space ascii war game
longDescription: |
  <p>Matanza is a multiplayer game.  In it, every player controls a ship cruising in space, aiming to destroy the other players (and, eventually, ships controlled by the computer).</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - matanza
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - ascii
  - text
  - terminal
  - war
  - space
  - universe
  - fighting
iconSources:
  - cached: matanza_matanza.png
    width: 64
    height: 64
enabled: true
