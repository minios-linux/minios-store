id: "openclonk"
name: OpenClonk
description: "An action-packed game of strategy, tactics, and skill."
longDescription: |
  <p>OpenClonk is a free multiplayer action game where you control clonks, small but witty and nimble humanoid beings. The game is mainly about mining, settling and fast-paced melees. OpenClonk is also not just a game but also a versatile 2D game engine that offers countless possibilities to make own mods.</p>
  <p>This package contains the OpenClonk engine.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - openclonk
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
