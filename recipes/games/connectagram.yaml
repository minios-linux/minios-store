id: "connectagram"
name: Connectagram
description: Unscramble words placed in patterns
longDescription: |
  <p>The board consists of several scrambled words that are joined together. You can choose the length of the words, the amount of words, and the pattern that the words are arranged in. The game provides a hint option for times when you are stuck.</p>
  
