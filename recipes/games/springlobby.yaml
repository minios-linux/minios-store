id: "springlobby"
name: Springlobby
description: Play online RTS games with the Spring engine
longDescription: |
  <p>Springlobby is a windowed client that allows you to download and play
      a wide variety of games using the Spring engine, a popular RTS game engine.
      Using this program, you can connect to one of dozens of free 24x7
      battleroom servers on the internet that are accessible from our master server.</p>
  <p>You&apos;ll need to download the spring RTS engine and supply lobby with
      its installation path.
      After that, springlobby will let you create an account and you&apos;re set to go!</p>
  <p>Popular games that use the spring engine are:</p>
  <ul>
    <li>Balanced Annihilation</li>
    <li>Tech Annihilation</li>
    <li>Zero-K</li>
    <li>Evolution RTS</li>
    <li>Spring:1944</li>
    <li>NOTA</li>
    <li>XTA</li>
    <li>Lots more developed regularly!</li>
  </ul>
  <p>The springlobby home page can be found at https://springlobby.info/ or you can visit our project page
         on github at https://github.com/springlobby/springlobby/.</p>
  <p>You can find out more about the spring engine and its games at https://springrts.com/.</p>
  
categoryId: games
icon: Gamepad2
