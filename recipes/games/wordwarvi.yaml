id: wordwarvi
name: Word War vi
description: Side-scrolling shoot'em up arcade game
longDescription: |
  <p>Word War vi is your basic side-scrolling shoot &apos;em up &apos;80s style arcade game. You pilot your &quot;vi&quot;per craft through core memory, rescuing lost .swp files, avoiding OS defenses, and wiping out those memory hogging emacs processes.</p>
  <p>Includes support for joysticks with force-feedback.</p>
  
