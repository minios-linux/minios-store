id: "bloboats"
name: Bloboats
description: An arcade-like boat racing game
longDescription: |
  <p>Bloboats is an arcade-like boat racing game in the hybrid spirit of Mario-like platform jumpers and elasto mania / xmoto.</p>
  <p>The objective of Bloboats is to reach MS Enterprise as fast as possible to save it from the hands of the terrible Tentacle Monsters of an Unknown Master and in the same time beat your friend and laugh at his or her puny time.</p>
  <p>The journey starts from a place called Tutorial, somewhere in the United States, and somehow the player ends up in the famous HV-Arena of Helsinki. During the trip a number of MS Enterprises are saved, luckily, from the hands of the terrible Tentacle Monsters of an Unknown Master, who actually is your dad. Or then ain&apos;t. :-)</p>
  
