id: "ceferino"
name: Ceferino
description: Save the cows!
longDescription: |
  <p>A game similar to &apos;Super Pang&apos;. You are attacked by little green balls which are bouncing around and which you have to destroy with your knife. Your knife however is limited to being thrown upwards, thus you have to get under the balls to destroy them. Even worse, if you destroy a large ball, it doesn&apos;t just vanish, but breaks apart into two smaller balls. Levels consist of little platforms connected by ladders, so you can go up and down or find cover if needed.</p>
  
