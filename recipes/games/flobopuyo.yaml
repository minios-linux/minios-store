id: flobopuyo
name: FloboPuyo
description: A tetris-like game
longDescription: |
  <p>The goal of FloboPuyo is to make groups of four or more Puyos (coloured bubbles) to make them explode and send bad ghost Puyos to your opponent. You win the game if your opponent reaches the top of the board. You can play against computer or another human.</p>
  
