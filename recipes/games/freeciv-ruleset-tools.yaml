id: "freeciv-ruleset-tools"
name: Freeciv ruleset editor
description: Ruleset editor for the Freeciv game
longDescription: |
  <p>
              Freeciv is a Free and Open Source empire-building strategy game inspired by the history of human civilization.
  The game commences in prehistory and your
              mission is to lead your tribe from the Stone Age to the Space Age...
          </p>
  <p>
              Freeciv Ruleset Editor can be used to create your own game rules, or the change existing ones
          </p>
  
