id: mudlet
name: Mudlet
description: Play online text-based games (MUDs)
longDescription: |
  <p>A completely redesigned MUD (Multi User Dungeon) client that is easy to use and customise.  Both power users and plain gamers alike will feel at home with Mudlet, without having to waste too much timer figuring out how to do something.</p>
  <p>Mudlet is designed to be very fast and efficient right from the start. Its scripting engine is designed to handle thousands of lines under one second. The scripting framework uses Lua - a small, fast and efficient scripting language.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - mudlet
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
iconSources:
  - cached: mudlet_mudlet.png
    width: 64
    height: 64
enabled: true
order: 99
