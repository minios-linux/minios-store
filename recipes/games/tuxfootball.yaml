id: "tuxfootball"
name: Tux Football
description: "A fun arcade-style 2D football game, very reminsicent of Sensible Soccer and Kick Off"
longDescription: |
  <p>It&apos;s bringing old style gameplay from DOS times back to the desktop with up to date graphics! Its gameplay is similar to old classics such as Amco&apos;s Kick Off and Sensible Software&apos;s Sensible Soccer.</p>
  <p>The gameplay is designed to be quick, responsive and fun. You are always in control of the player closest to the ball. The ball is controlled via two different kick buttons - one for pass, and one for shoot. Aftertouch can be applied to shots by quickly pressing and holding the direction you want the ball to bend towards. Pushing in the opposite direction to what you kicked the ball makes it raise into the air, pushing in the same direction as the ball makes it dip towards the ground.</p>
  
