id: "ksudoku"
name: KSudoku
description: Complete a numeric puzzle with the numbers from one to nine
longDescription: |
  <p>KSudoku is a free version of the popular logic game Sudoku developed by the KDE community.
        The game is to fill a nine by nine grid with the numbers from one to nine filling
        the rows, columns and three by three squares without repeating a value on them.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - ksudoku
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
