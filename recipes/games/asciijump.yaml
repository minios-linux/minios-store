id: "asciijump"
name: asciijump
description: A clone of the dsj game
longDescription: |
  <p>This is a very funny multiplayer game, you can play with friends or against the computer. There are two modes of playing: World Cup and Training. You will be able to select from a few hills, for example czumulungma and finland.</p>
  
categoryId: games
icon: Gamepad2
