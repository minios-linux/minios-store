id: "gnome-sudoku"
name: GNOME Sudoku
description: Test your logic skills in this number grid puzzle
longDescription: |
  <p>Play the popular Japanese logic game. GNOME Sudoku is a must-install for
        Sudoku lovers, with a simple, unobtrusive interface that makes playing
        Sudoku fun for players of any skill level.</p>
  <p>Each game is assigned a difficulty similar to those given by newspapers
        and websites, so your game will be as easy or as difficult as you want it
        to be.</p>
  <p>If you like to play on paper, you can print games out. You can choose how
        many games you want to print per page and what difficulty of games you
        want to print: as a result, GNOME Sudoku can act a renewable Sudoku book
        for you.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gnome-sudoku
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
