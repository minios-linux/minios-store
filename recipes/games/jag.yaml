id: jag
name: JAG
description: arcade-puzzle 2D game in which you have to break all the target pieces
longDescription: |
  <p>Puzzle game where the goal is to break all the target pieces in each level and do this before the time runs out.</p>
  <p>Move game pieces using mouse into matches of 3 or more in a straight line horizontally or vertically.</p>
  
