distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - circuit
  - combination
  - components
  - connect
  - game
  - logic
  - puzzle
