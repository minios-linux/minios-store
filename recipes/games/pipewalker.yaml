id: "pipewalker"
name: Pipewalker
description: A puzzle game to combine components into a single circuit.
longDescription: |
  <p>
        This is a puzzle game in which you need to combine the components into a single circuit: connect all computers to
  a network server, bring water to the taps, etc.
      </p>
  
