id: pokerth
name: PokerTH
description: Texas hold'em game
longDescription: |
  <p>pokerth is a free implementation of the Texas hold&apos;em poker game which is mostly played in casinos and has a growing popularity worldwide. Texas hold&apos;em is easy to learn but needs a good strategy to win and a lot of luck. This package helps you when practicing or just playing for fun.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - pokerth
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
