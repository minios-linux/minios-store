id: zaz
name: Zaz
description: Zaz ain't Z***
longDescription: |
  <p>Zaz is an arcade action puzzle game where the goal is to get rid of all incoming balls by rearranging their order and making triplets. It currently includes 12 different levels. The game&apos;s name is recursive and stands for &quot;Zaz ain&apos;t Z&quot;.</p>
  <p>A 3D accelerator is needed for decent gameplay.</p>
  
