id: krank
name: Krank
description: a little casual game
longDescription: |
  <p>krank is a game of dexterity, being somewhere between Breakout and billiard, where the aim of each level is to shove floating stones towards compatible static stones. You control a short chain of stones with your mouse to achieve that.</p>
  
