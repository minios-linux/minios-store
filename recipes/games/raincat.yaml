id: "raincat"
name: Raincat
description: 2D puzzle game featuring a fuzzy little cat
longDescription: |
  <p>Raincat is a 2d puzzle game similar to the Incredible Machine and Lemmings series. Your goal is simple: guide the cat safe and dry to the end of each level. Just mind the rain, puddles, and loose fire hydrants in your path!</p>
  
