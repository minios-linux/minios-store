id: "drascula-italian"
name: "Drascula: The Vampire Strikes Back (Italiano)"
description: classic 2D point and click adventure game
longDescription: |
  <p>Drascula: The Vampire Strikes Back is a classic humorous 2D point and click adventure game, first released by Alcachofa Soft S.L. in 1996.</p>
  <p>In Drascula you play the role of John Hacker, a British estate agent, that gets to meet a gorgeous blond girl who is kidnapped by the notorious vampire Count Drascula and embark on a fun yet dangerous quest to rescue her.</p>
  <p>Unfortunately Hacker is not aware of Drascula&apos;s real ambitions:</p>
  <p>DOMINATING the World and demonstrating that he is even more evil than his brother Vlad.</p>
  <p>This is the Italian version of Drascula: The Vampire Strikes Back. It features subtitles in Italian and requires the English drascula package.</p>
  <p>Please install the drascula-music package to enjoy the background music of the game. There are furthermore additional language packages available with subtitles in Spanish, German and French.</p>
  <p>Note that this package only contains game-data. The game engine is provided by ScummVM.</p>
  
