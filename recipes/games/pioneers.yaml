id: "pioneers"
name: Pioneers
description: Play a game of Pioneers
longDescription: |
  <p>Pioneers is a computer implementation of the Settlers of Catan board game. It can be played over the internet.</p>
  <p>The game includes a server, a client, a computer player, an editor and (in a separate package) a metaserver (for locating running servers).</p>
  
