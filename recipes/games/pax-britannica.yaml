id: pax-britannica
name: Pax Britannica
description: Multi-player real-time strategy game
longDescription: |
  <p>Pax Britannica is a one-button real-time strategy game by No Fun Games. Up to four players battle it out underwater, struggling to be the last one standing!</p>
  <p>Each player uses one button to spawn ships that fight automatically using the latest in artificial aquatelligence technology. Gamepads are also supported.  The player who keeps their factory ship alive wins!</p>
  <p>This package contains the game binary.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - pax-britannica
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
