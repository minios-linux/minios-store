id: chromium-bsu
name: Chromium B.S.U.
description: Scrolling space shooter
longDescription: |
  <p>Chromium is a top down fast paced high action scrolling space shooter.</p>
  <p>In this game you are the captain of the cargo ship Chromium B.S.U. and are responsible for delivering supplies to the troops on the front line. Your ship has a small fleet of robotic fighters which you control from the relative safety of the Chromium vessel.</p>
  
