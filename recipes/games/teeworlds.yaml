description: An online multi-player platform 2D shooter
longDescription: |
  <p>This package contains the client binary for Teeworlds.</p>
  <p>The game features cartoon-themed graphics and physics, and relies heavily on classic shooter weaponry and gameplay. The controls are heavily inspired by the FPS genre of computer games.</p>
  
