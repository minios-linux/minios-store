id: "freegish"
name: FreeGish
description: A physics based arcade game
longDescription: |
  <p>Freegish is a 2D platform game, where the player maneuvers character of a ball of tar. Character may become sticky, slick, heavy and can jump.</p>
  <p>The game contains only first seven levels of the single player campaign and few multiplayer levels for mini games like sumo or football.</p>
  <p>Freegish is based on open sourced code of the famous game called Gish with added free art assets.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - freegish
