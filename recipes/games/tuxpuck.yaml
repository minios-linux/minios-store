id: tuxpuck
name: TuxPuck
description: Play Shufflepuck with Tux
longDescription: |
  <p>TuxPuck is an air hockey game and clone of the Amiga/Atari ST game Shufflepuck Café. The player moves a bat around a table and tries to knock the puck past the opponent&apos;s defense. After either party has reached 15 points, the match is over.</p>
  
