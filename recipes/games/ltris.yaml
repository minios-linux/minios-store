id: ltris
name: LTris2
description: A tetris clone with nice graphics.
longDescription: |
  <p>LTris is a very polished tetris clone, which offers three types of games. The classic mode, a figures mode, where different figures appear every level, and a multiplayer mode. LTris is highly configurable through its menu system.</p>
  
