id: "rocksndiamonds"
name: Rocks'n'Diamonds
description: "A Boulder Dash, Emerald Mine, Supaplex, Sokoban etcetera inspired arcade game"
longDescription: |
  <p>This package provides the game engine for Rocks&apos;n&apos;Diamonds, an arcade game in the tradition of &quot;Boulder Dash&quot;, &quot;Emerald Mine&quot;, &quot;Supaplex&quot;, &quot;Sokoban&quot;, etcetera. Game levels emulating all of these can be downloaded from ArtSoft.org.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - rocksndiamonds
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
