id: "cube2-data"
name: "Cube2:Demo"
description: Playable demo for the Cube2 engine
longDescription: |
  <p>This demo provides textures, models, maps and sounds to demonstrate the
        capabilities of the Cube2 engine.</p>
  <p>You are able to join a bot match and play against computer controlled
        opponents of various skill levels.</p>
  <p>The integrated in-game editor is a good starting point to build upon this
        content and for creating your own mod or even a standalone game.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - cube2-data
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64, i386]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - action
  - shooter
  - 3d
  - fps
  - first-person
  - fast-paced
  - editor
  - maps
  - client
  - single-player
