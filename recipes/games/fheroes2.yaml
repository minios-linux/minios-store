id: fheroes2
name: fheroes2
description: Free remake of Heroes of Might and Magic II game engine
longDescription: |
  <p>Heroes of Might and Magic II is a classic fantasy turn-based strategy/role-playing game which takes place in the land of Enroth, a place of magic. There are a multitude of creature types, from griffins to rocs, golems to pikemen, unicorns to hydras, and four different dragons. Each castle type has six different creatures, from the weak to the strong. There are six castle types, each corresponding to a hero class: Knight, Sorceress, Wizard (Good side), Barbarian, Necromancer and Warlock (Evil side). There are also six different types of neutral creatures you can recruit in special structures scattered about the maps.</p>
  <p>Original game files are needed to play this game.</p>
  
