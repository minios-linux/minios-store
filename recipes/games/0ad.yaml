id: "0ad"
name: 0 A.D.
description: Real-Time Strategy Game of Ancient Warfare
longDescription: |
  <p>0 A.D. is a real-time strategy (RTS) game of ancient warfare.
        It&apos;s a historically-based war/economy game that allows players to relive
        or rewrite the history of thirteen ancient civilizations, each depicted
        at their peak of economic growth and military prowess.</p>
  <p>The thirteen factions are: Three of the Hellenic States (Athens, Sparta and
        Macedonia), two of the kingdoms of Alexander the Great&apos;s successors
        (Seleucids and Ptolemaic Egyptians), two Celtic tribes (Britons and
        Gauls), the Romans, the Persians, the Iberians, the Carthaginians, the
        Mauryas and the Kushites.
        Each civilization is complete with substantially unique artwork,
        technologies and civilization bonuses.</p>
  
