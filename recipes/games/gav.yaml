id: gav
name: GAV
description: Arcade Volleyball game
longDescription: |
  <p>GAV stands for GPL Arcade Volleyball, and is an SDL remake of the old DOS game Arcade Volleyball. It includes multiplayer, networking, and themeable graphics support.</p>
  <p>More information, as well as additional themes, can be found at &lt;http://gav.sourceforge.net&gt;.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gav
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - volleyball
  - arcade
  - dos
  - multiplayer
  - themes
iconSources:
