id: pynagram
name: Pynagram
description: Unjumble letters
longDescription: |
  <p>Pynagram is a simple word game in which the player is presented with seven letters in a random order. Every word that is &quot;solved&quot; from the jumbled letters earns the player points. If the player solves one or more seven letter words, the score is carried over into the next game.</p>
  <p>Pynagram was inspired from Anagramarama.</p>
  
categoryId: games
