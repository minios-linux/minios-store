  - pcsx2
distributions:
  include:
    - name: bionic
      architectures: [i386]
    - name: bookworm
      architectures: [i386]
    - name: bullseye
      architectures: [i386]
    - name: buster
      architectures: [i386]
    - name: focal
      architectures: [i386]
    - name: trixie
      architectures: [i386]
