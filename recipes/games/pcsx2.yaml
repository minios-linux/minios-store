id: pcsx2
name: PCSX2
description: Sony PlayStation 2 emulator
longDescription: |
  <p>PCSX2 is a PlayStation 2 emulator for Windows and Linux.</p>
  <p>WARNING: It requires a CPU with SSE2 instructions. If your CPU does not support this instruction set, it does not have enough horsepower to run this emulator.</p>
  <p>This package includes the main binary, plug-ins and localization files.</p>
  
categoryId: games
icon: Gamepad2
