id: abe
name: Abe's Amazing Adventure
description: Side-scrolling game
longDescription: |
  <p>A scrolling, platform-jumping, key-collecting, ancient pyramid exploring game, vaguely in the style of similar games for the Commodore+4. The game is intended to show young people all the cool games they missed.</p>
  
categoryId: games
icon: Gamepad2
