id: "flightgear"
name: FlightGear
description: "Practice flight training (airplanes, helicopters...)"
longDescription: |
  <p>FlightGear Flight Simulator (often shortened to FlightGear or FGFS) is a sophisticated free, completely open-source flight simulator framework, created by volunteers.</p>
  <p>This package contains the runtime binaries.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
