id: btanks
name: Battle Tanks
description: fast 2D tank arcade game with multiplayer and split-screen modes
longDescription: |
  <p>Battle Tanks is a funny battle on your desk, where you can choose one of three vehicles and eliminate your enemy using the whole arsenal of weapons. It has original cartoon-like graphics and cool music, is fun and dynamic and has death-match and cooperative network modes.</p>
  
