id: auralquiz
name: Auralquiz
description: A simple music quiz game for GNU/Linux
longDescription: |
  <p>auralquiz is a music quiz game that scans a users selected folder of music and creates a quiz using the tags from the audio files.  A sample of a random song is played and the player must answer a question about the sample from either multiple choice buttons or for hardcore difficulty, type in the correct answer. Up to 8 players can play in a turn based mode with scoring based on points, with more points given by answering the question faster.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - auralquiz
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
