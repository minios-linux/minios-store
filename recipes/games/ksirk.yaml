id: "ksirk"
name: KSirk
description: World Domination Strategy Game
longDescription: |
  <p>KsirK is a computerized version of the well known strategic board game Risk.
        The goal of the game is simply to conquer the world by attacking your neighbors with your armies.</p>
  <p>Features:</p>
  <ul>
    <li>Support for 1-6 human or computer (AI) players</li>
    <li>Multi-player gaming over a network</li>
    <li>You can easily create new skins with SVG graphics and the skin editor</li>
    <li>Hot New Stuff support. You can easily download and install new skins</li>
  </ul>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - ksirk
