id: prboom-plus
name: PrBoom+
description: enhanced clone of the classic first-person shooter Doom
longDescription: |
  <p>PrBoom+ is an enhanced source port of the classic 3D first-person shooter game Doom, first released by id Software in 1993. It uses the Simple Direct Media layer (SDL) library and features an optional OpenGL renderer. It is based on PrBoom, MBF and LxDoom, which in turn are based on TeamTNT&apos;s Boom, a freely available port of Doom for DOS.</p>
  <p>In addition to PrBoom&apos;s features, PrBoom+ offers uncapped framerate, variable gamespeed, re-record, walkcam, chasecam, full mouselook, FOV, and other features without loss of compatibility with the original Doom.</p>
  <p>PrBoom+ requires game data to run. Free game data is available in the freedoom package. Commercial game data can be packaged using game-data-packager. PrBoom+ supports all flavors of Doom, including The Ultimate Doom, Doom 2 and Final Doom as well as Chex(R) Quest, HACX, FreeDoom and FreeDM.</p>
  
