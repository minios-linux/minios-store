id: gmastermind-app
name: GMastermind
description: GNUstep implementation of the Mastermind game
longDescription: |
  <p>Drag-and-drop colors from the palette or from the board itself.  The object is to determine the hidden combination of four colors.  The game may be played in two modes: with replacement, which means that colors may repeat, and without replacement, which means that colors are unique.  The user selects a choice of four colors and &quot;commits&quot; them.  The program replies with an evaluation -- a black peg for a color that is placed correctly, and a white peg for a color that is in the wrong position.  The user may make a total of eight queries.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - gmastermind.app
distributions:
  include:
    - name: trixie
      architectures: [amd64, i386]
tags:
  - board
  - game
iconSources:
