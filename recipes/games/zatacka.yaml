id: zatacka
name: Zatacka X
description: "A modern, free remake of the classic Achtung, die Kurve!"
longDescription: |
  <p>This is an arcade multiplayer game for 2 - 6 players on one keyboard, clone of Achtung die Kurve classical dos game. You handle your line and you must sidetrack lines of other players and of course walls. When some player dies, survival gets one point. When only one player is left alive, the round is finished. Each game has eleven rounds.</p>
  
