  include:
    - name: bionic
      architectures: [amd64]
    - name: bookworm
      architectures: [amd64]
    - name: buster
      architectures: [amd64]
    - name: focal
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
