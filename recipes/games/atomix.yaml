id: "atomix"
name: Atomix
description: A puzzle game about atoms and molecules
longDescription: |
  <p>Atomix is an educational game designed for GNOME in which one has to build molecules, ranging from simple inorganic ones to some extremely complex organic ones, out of separate atoms.</p>
  <p>The first levels can be rather easy, but added complexity always comes with the next level, so that several minutes (or much longer than that) can be spent on each single level.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - atomix
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gnome
  - game
  - logic
  - puzzle
  - atoms
  - molecules
  - sokoban
