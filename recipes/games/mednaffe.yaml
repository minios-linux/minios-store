id: "mednaffe"
name: Mednaffe
description: A front-end (GUI) for mednafen emulator
longDescription: |
  <p>Mednaffe is a graphical front-end for the Mednafen multi-system emulator. It allows all of Mednafen&apos;s options to be configured, and provides simple game-management features.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - mednaffe
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
iconSources:
  - url: m/me/mednaffe.desktop/de2eae9d480225256c20620c64f20347/icons/128x128/mednaffe_mednaffe.png
    width: 128
    height: 128
enabled: true
order: 99
