id: "four-in-a-row"
name: Four-in-a-row
description: Make lines of the same color to win
longDescription: |
  <p>A family classic, the objective of Four-in-a-row is to build a line of four
        of your marbles while trying to stop your opponent (human or computer) from
        building a line of his or her own. A line can be horizontal, vertical or
        diagonal. The first player to connect four in a row is the winner!</p>
  <p>Four-in-a-row features multiple difficulty levels. If you&apos;re having trouble,
        you can always ask for a hint.</p>
  
