id: "picmi"
name: Picmi
description: Puzzle game based on number logic
longDescription: |
  <p>The goal is to reveal the hidden pattern in the board by coloring or
        leaving blank the cells in a grid according to numbers given at the side
        of the grid.
        This is a single player game.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - picmi
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
