id: "retroarch"
name: RetroArch
description: "Frontend for emulators, game engines and media players"
longDescription: |
  <p>RetroArch is an open source, multi-platform frontend for the libretro API. It can be used as a modular multi emulator system, game engine, media player and 3D technical demonstration. These features are available through libretro cores.</p>
  <p>It provides three built-in GUI: RGUI, XMB and GLUI.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - retroarch
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - multi
  - engine
  - emulator
  - xmb
