id: "gravitation"
name: Gravitation
description: "game about mania, melancholia, and the creative process"
longDescription: |
  <p>Gravitation is a short, autobiographical pixelated art game by Jason Rohrer. It is a followup to his previous game, &quot;Passage&quot;. It can be explored in approximately 8 minutes. If in doubt, please keep playing. If you still don&apos;t understand the game, please read the game creators statement on the website and the experiences of other people linked from the website.</p>
  
