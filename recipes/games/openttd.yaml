id: "openttd"
name: OpenTTD
description: A clone of Transport Tycoon Deluxe
longDescription: |
  <p>OpenTTD is a reimplementation of the Microprose game &quot;Transport Tycoon Deluxe&quot; with lots of new features and enhancements.</p>
  <p>OpenTTD is playable with the free graphics files from the openttd-opengfx package and optional sound files from the openttd-opensfx package (which is in non-free). Alternatively, OpenTTD can use the graphics files from the original Transport Tycoon Deluxe game (See README.Debian on how to set this up).</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - openttd
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - game
  - simulation
  - transport
  - tycoon
  - deluxe
  - economics
  - multiplayer
  - money
  - train
  - ship
iconSources:
  - url: o/op/openttd.desktop/c5524c2ec3557a8090b30dd7cc435c53/icons/128x128/openttd_openttd.png
    width: 128
    height: 128
enabled: true
order: 99
