id: "five-or-more"
name: Five or More
description: Remove colored balls from the board by forming lines
longDescription: |
  <p>Five or More is the GNOME port of a once-popular computer game. Align five or
        more objects of the same color into a line to cause them to disappear and
        score points. Earn many more points by lining up as many objects as possible
        before clearing them.</p>
  <p>More objects appear after every turn. Play for as long as possible, until the
        board is completely full!</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - five-or-more
distributions:
  include:
