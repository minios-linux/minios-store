id: "doomsday"
name: Doomsday Engine
description: "Enhanced source port of Doom, Heretic, and Hexen"
longDescription: |
  <p>
              The Doomsday Engine is a portable version of the classic first person
              shooters DOOM, Heretic, and Hexen. It lets you enjoy the original games
              using modern technology, including high-resolution OpenGL graphics, 3D
              models, and dynamic lighting effects.
          </p>
  <p>
              Data files from the original games are not included; you must acquire
              a copy of the original games from id Software and/or Raven Software.
              You may also use free alternatives such as https://freedoom.github.io/.
          </p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - doomsday
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
