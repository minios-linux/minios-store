id: "rlvm"
name: rlvm
description: RealLive Emulator
longDescription: |
  <p>rlvm is a Free Software reimplementation of VisualArt&apos;s KK&apos;s RealLive interpreter. RealLive is a game engine used to write visual novels, used in the games Kanon, Air, CLANNAD, Planetarian, Tomoyo After and Little Busters, among many others.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - rlvm
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
