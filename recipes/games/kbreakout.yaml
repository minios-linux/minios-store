id: "kbreakout"
name: KBreakOut
description: Classic arcade game
longDescription: |
  <p>kbreakout is a game similar to the classics breakout and xboing, featuring a number of added graphical enhancements and effects.  You control a paddle at the bottom of the playing-field, and must destroy bricks at the top by bouncing balls against them.</p>
  <p>This package is part of the KDE games module.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - kbreakout
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64]
