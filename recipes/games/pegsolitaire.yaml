id: "pegsolitaire"
name: Peg Solitaire
description: Play an educational puzzle game similar to Hi-Q
longDescription: |
  <p>Peg Solitaire is a board game for one player involving movement of pegs on
        a board with holes. The game fills the entire board with pegs except for
        the central hole. The objective is, making valid moves, to empty the entire
        board except for a solitary peg in the central hole.</p>
  
