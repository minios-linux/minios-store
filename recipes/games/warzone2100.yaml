id: "warzone2100"
name: Warzone 2100
description: Postnuclear realtime strategy
longDescription: |
  <p>In Warzone 2100 you command the forces of “The Project” in a battle to rebuild the world after mankind has almost been destroyed by nuclear missiles.</p>
  <p>The game offers campaign, tutorial, multi-player and single-player skirmish modes.</p>
  <p>An extensive tech tree with over 400 different technologies, combined with the unit design system, allows for a wide variety of possible units and tactics.</p>
  <p>Warzone 2100 was created by Pumpkin Studios, published by Eidos Interactive and is currently developed by the Warzone 2100 Project.</p>
  <p>The campaign video sequences are not yet distributed here, please see the Warzone 2100 website for details on downloading and installing them.</p>
  
