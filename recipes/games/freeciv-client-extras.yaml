id: "freeciv-client-extras"
name: Freeciv gtk+-3 modpack installer
description: Gtk+-3 based modpack installer for the Freeciv game
longDescription: |
  <p>Freeciv is a Free and Open Source empire-building strategy game inspired by the history of human civilization. The game commences in prehistory and your
              mission is to lead your tribe from the Stone Age to the Space Age...</p>
  <p>Freeciv modpack utility can be used to automatically download and install custom rulesets, tilesets, soundsets, and maps for freeciv to use.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - freeciv-client-extras
distributions:
  include:
    - name: bionic
      architectures: [amd64, i386]
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: buster
      architectures: [amd64, i386]
    - name: focal
      architectures: [amd64]
    - name: jammy
      architectures: [amd64]
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - strategy
  - simulation
  - civilization
  - tiles
  - history
  - mankind
  - multiplayer
  - download
  - installer
screenshotSources:
