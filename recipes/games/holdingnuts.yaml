id: holdingnuts
name: HoldingNuts
description: An open source poker client and server
longDescription: |
  <p>HoldingNuts is an open source multi-platform poker client and server. You can play the popular Texas Hold&apos;em variant with people all over the world, meet your friends, run your own games and even setup your own poker network.</p>
  <p>This package provides the client.</p>
  
