id: "fbzx"
name: FBZX
description: ZX Spectrum emulator
longDescription: |
  <p>FBZX is a Sinclair ZX Spectrum emulator. Its main features are:
     emulates acurately the Original spectrum (both issue 2 and issue 3), the classic 128K, the Amstrad Plus 2, the Amstrad
  Plus 2A and the Spanish 128K. This include screen, keyboard and sound (both speaker and AY-3-8912 chip).Screen emulation is extremely acurate, so it can emulate border efects and even atribute efects.Supports Z80 snapshots, both loading and saving, and loading .SNA snapshots.Supports TAP (both read and write) and TZX (only read) tape files, supporting normal speed loading and fast speed loading.Emulates joysticks: kempston, cursor and sinclair.Emulates the Interface I and Microdrive.Emulates the ULAPlus.Based in a new, fully free, Z80 emulator (Z80Free).</p>
  
