id: "lutris"
name: Lutris
description: Play all your games by Lutris
longDescription: |
  <p>Lutris is an Open Source gaming platform. It installs and launches games so you can start playing without the hassle of setting up your games. Get your games from GOG, Steam, Battle.net, Origin, Uplay and many other sources running on any Linux powered gaming machine.</p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - lutris
distributions:
  include:
    - name: bookworm
      architectures: [amd64, i386]
    - name: bullseye
      architectures: [amd64, i386]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - gaming
  - wine
  - emulator
