id: frozen-bubble
name: Frozen-Bubble
description: Pop out the bubbles!
longDescription: |
  <p>Frozen-Bubble is a clone of the popular &quot;Puzzle Bobble&quot; game, in which you attempt to shoot bubbles into groups of the same color to cause them to pop.</p>
  <p>Players compete as penguins and must use the arrow keys to aim a colored bubble at groups of bubbles. The objective is to clear all the bubbles off the screen before a bubble passes below a line at the bottom.</p>
  <p>It features 100 single-player levels, a two-player mode, music and striking graphics. A level editor is also included to allow players to create and play their own levels.</p>
  
