id: "amoebax"
name: Amoebax
description: Defeat your opponent by filling up their grid up with garbage.
longDescription: |
  <p>Due an awful mutation, some amoeba&apos;s species have started to multiply until they take the world if you can&apos;t stop them. Fortunately the mutation made then too unstable and lining up four or more will make them disappear.</p>
  <p>Follow Kim or Tom through 6 levels in their quest to prevent the cute multiplying amoebas to take the world and become the new Amoeba Master. Watch out for the cute but amoeba&apos;s controlled creatures that will try to put and end to your quest.</p>
  <p>Amoebax is designed with levels for everyone, from children to adults. With the training mode everybody will quickly become a master and the tournament mode will let you have a good time with your friends. There is also catchy music, funny sound effects, and beautiful screens that sure appeal to everyone in the family.</p>
  
