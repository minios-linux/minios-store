description: A 2D platform game with a persistent world
longDescription: |
  <p>The Legend of Edgar is a platform game where the hero must explore a vast world, find items, solve puzzles, defeat powerful enemies, complete mini-quests in order to save his father who has been kidnapped.</p>
  <p>Includes support for joystick or joypad and configurable keyboard support.</p>
  
