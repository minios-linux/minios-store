id: "angband-data"
name: Angband
description: "Angband is a free, single-player dungeon exploration game."
longDescription: |
  <p>
        A roguelike game where you explore a very deep 
        dungeon, kill monsters, try to equip yourself with 
        the best weapons and armor you can find, and finally 
        face Morgoth - "The Dark Enemy".
      </p>
  
categoryId: games
icon: Gamepad2
method: apt
level: "auto"
compression: zstd
packages:
  - angband-data
distributions:
  include:
    - name: noble
      architectures: [amd64]
    - name: trixie
      architectures: [amd64, i386]
tags:
  - roguelike
  - permadeath
  - dnd
  - moria
