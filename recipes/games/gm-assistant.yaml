id: gm-assistant
name: GM-Assistant
description: Assistant for the Game Master during tabletop role-playing games
longDescription: |
  <p>GM-Assistant is designed to be the perfect assistant for the Game Master during tabletop role-playing games.</p>
  <p>GM-Assistant enables to build structured scenarii with history and character table before the game, and to take notes, play music or sound effects, and display pictures during the game. It also includes a dice simulator and a combat manager.</p>
  
