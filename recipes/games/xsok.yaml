id: "xsok"
name: Xsokoban
description: Sokoban game for X11
longDescription: |
  <p>xsok is a single player strategic game, a superset of the well-known Sokoban game.</p>
  <p>The target of Sokoban is to push all the objects into the score area of each level using the mouse or the arrow keys. For the other level subsets, there are different kinds of objects, and special effect squares.</p>
  
