id: "3dchess"
name: 3D Chess
description: 3D chess for X11
longDescription: |
  <p>There are three boards, stacked vertically; 96 pieces of which most are the traditional chess pieces with just a couple of additions; 26 possible directions in which to move. Provides a challenging enough game to all but the most highly skilled players.</p>
  
